# -------------------------------------------------------------------------------
# SonarCloud Project Configuration
#
# Author: Alex Freidah
#
# Project identity + issue suppressions for the (mostly Cinc/Ruby) munchbox repo.
# cookstyle is the source of truth for Ruby style here, so SonarCloud rules that
# fight cookstyle or flag intentional patterns are ignored below rather than
# "fixed" into something cookstyle then rejects.
#
# NOTE: this repo is analyzed by SonarCloud Automatic Analysis (no CI scanner).
# Automatic Analysis only partially honors this file; if the suppressions below
# do not take effect, either add a CI sonar-scan job (as in the g3 /
# s3-orchestrator / nomad-temporal-jobs repos) or mirror them in the SonarCloud
# UI (Administration -> Analysis Scope / Ignore Issues).
# -------------------------------------------------------------------------------

sonar.projectKey=afreidah_munchbox
sonar.organization=afreidah
sonar.sourceEncoding=UTF-8

# -------------------------------------------------------------------------------
# Ignored rules
# -------------------------------------------------------------------------------

sonar.issue.ignore.multicriteria=cookstyleraise,specglobrequire,lazygemrequire

# rubydre:S7815 ("raise a specific exception class instead of a string literal")
# conflicts with cookstyle Style/RedundantException (no explicit RuntimeError).
# A bare `raise "msg"` already raises RuntimeError and is the cookstyle-preferred
# form for these guard clauses, so keep them.
sonar.issue.ignore.multicriteria.cookstyleraise.ruleKey=rubydre:S7815
sonar.issue.ignore.multicriteria.cookstyleraise.resourceKey=infrastructure/cinc/**/*.rb

# rubydre:S7816 ("move require to the top") on spec_helper -- the flagged require
# is `Dir[...].each { |f| require f }`, a dynamic glob load that can't be hoisted.
sonar.issue.ignore.multicriteria.specglobrequire.ruleKey=rubydre:S7816
sonar.issue.ignore.multicriteria.specglobrequire.resourceKey=infrastructure/cinc/**/spec/spec_helper.rb

# rubydre:S7816 on vault_fetch -- `require 'vault'` is intentionally lazy so the
# third-party gem isn't loaded at cookbook compile time.
sonar.issue.ignore.multicriteria.lazygemrequire.ruleKey=rubydre:S7816
sonar.issue.ignore.multicriteria.lazygemrequire.resourceKey=infrastructure/cinc/cookbooks/munchbox_lib/libraries/vault_fetch.rb
