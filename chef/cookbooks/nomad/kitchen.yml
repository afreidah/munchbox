# ------------------------------------------------------------------------------
#  kitchen.yml — Test Kitchen configuration for nomad cookbook (Docker, 3-node)
#
#  Hacky-but-reliable test setup:
#    - Static Docker IPs on a user-defined bridge (172.28.0.0/16)
#    - retry_join by IP (no Docker DNS dependency)
#    - /etc/hosts pre-populated for convenience
#    - ca-certificates installed to avoid SSL EOF errors
# ------------------------------------------------------------------------------

# --------------------------------------------------------------------
# Kitchen (dokken) – Docker-based testing with systemd inside the container
# --------------------------------------------------------------------

driver:
  name: dokken
  privileged: true

provisioner:
  name: dokken

transport:
  name: dokken

verifier:
  name: inspec

platforms:
  - name: debian-12
    driver:
      image: dokken/debian-12
      pid_one_command: /usr/lib/systemd/systemd
      intermediate_instructions:
        - RUN apt-get update
        - RUN DEBIAN_FRONTEND=noninteractive apt-get install -y curl unzip jq ca-certificates sudo

suites:
  - name: default
    attributes:
      nomad:
        consul:
          enabled: false
          required: false
        cni:
          enabled: false
    run_list:
      - recipe[nomad::default]
