# ------------------------------------------------------------------------------
#  kitchen.yml — Test Kitchen configuration for Consul cookbook
#
#  Defines driver, transport, provisioner, verifier, platforms, and suites
#  for automated infrastructure testing.
# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
#  Driver Configuration
# ------------------------------------------------------------------------------
driver:
  name: docker                # Use Docker as the Test Kitchen driver
  chef_version: latest        # Use the latest Chef Infra Client version
  privileged: true            # Run containers in privileged mode
  username: root              # Use root user inside the container

# ------------------------------------------------------------------------------
#  Transport Configuration
# ------------------------------------------------------------------------------
transport:
  name: docker                # Use Docker transport for communication

# ------------------------------------------------------------------------------
#  Provisioner Configuration
# ------------------------------------------------------------------------------
provisioner:
  name: chef_zero             # Use chef_zero provisioner for local Chef runs
  chef_license: accept        # Accept Chef license for Chef Infra Client

# ------------------------------------------------------------------------------
#  Verifier Configuration
# ------------------------------------------------------------------------------
verifier:
  name: inspec                # Use InSpec for verification
  sudo: true                  # Run InSpec controls with sudo
  reporter:
    - cli                     # Output results to CLI
  chef_license: accept        # Accept Chef license for InSpec

# ------------------------------------------------------------------------------
#  Platforms
# ------------------------------------------------------------------------------
platforms:
  - name: ubuntu-22.04        # Example platform
    driver_config:
      image: ubuntu:22.04     # Docker image to use for this platform
      platform: ubuntu        # Platform type for the provisioner
      username: root          # Use root user inside the container
      privileged: true        # Run container in privileged mode
      run_command: /usr/lib/systemd/systemd

# ------------------------------------------------------------------------------
#  Suites
# ------------------------------------------------------------------------------
suites:
  - name: default
    run_list:
      - recipe[consul::install]   # Run the consul::install recipe
    attributes:
