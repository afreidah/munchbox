---
driver:
  name: vagrant

transport:
  name: ssh

provisioner:
  name: chef_zero
  always_update_cookbooks: true

verifier:
  name: inspec

platforms:
  - name: debian-12-arm64
    driver_config:
      box: generic/debian12-arm64
      box_url: https://vagrantcloud.com/generic/boxes/debian12-arm64
      provider: virtualbox # or "parallels" if you use Parallels Desktop

suites:
  - name: default
    run_list:
      - recipe[pi_bootstrap::default]
    attributes:

