# -------------------------------------------------------------------------------
# S3 Proxy Configuration
#
# Project: Munchbox / Author: Alex Freidah
#
# OCI Object Storage backend configuration for Phase 0 testing.
# -------------------------------------------------------------------------------

server:
  listen_addr: "0.0.0.0:9000"
  virtual_bucket: "unified"

auth:
  # Leave empty for local testing, set for production
  token: ""

telemetry:
  metrics:
    enabled: true
    path: "/metrics"
  tracing:
    enabled: true
    endpoint: "tempo.service.consul:4317"
    sample_rate: 1.0

backend:
  name: "oci"
  endpoint: "${S3_ENDPOINT}"
  region: "${S3_REGION}"
  bucket: "${S3_BUCKET}"
  access_key_id: "${S3_ACCESS_KEY_ID}"
  secret_access_key: "${S3_SECRET_ACCESS_KEY}"
  force_path_style: true
