# -------------------------------------------------------------------------------
# Munchbox Dashboard configuration for hugo-dash
#
# Project: Munchbox / Author: Alex Freidah
#
# Defines dashboard groups and tile metadata for internal service navigation.
# Icons referenced here must exist under assets/icons. The structure aligns with
# the hugo-dash template, which expects a top-level services list containing
# groups, each with items that define downstream service URLs.
# -------------------------------------------------------------------------------

title: Munchbox Cloud Dashboard
subtitle: Central access to Munchbox services
icon: munchbox

services:
  # -------------------------------------------------------------------------
  # Apps & Media
  # -------------------------------------------------------------------------
  - name: Apps & Media
    icon: fa-solid fa-film
    items:
      - name: Nextcloud
        subtitle: Files, calendar, contacts
        url: https://nextcloud.munchbox.cc
        tag: cloud
        icon: nextcloud.png

      - name: Vaultwarden
        subtitle: Password manager
        url: https://vaultwarden.munchbox.cc
        tag: security
        icon: vaultwarden.png

      - name: Home Assistant
        subtitle: Home automation
        url: https://homeassistant.munchbox.cc
        tag: automation
        icon: home-assistant.png

      - name: Immich
        subtitle: Photo Management
        url: https://photos.munchbox.cc
        tag: cloud
        icon: immich.png

      - name: Munch TV
        subtitle: TV/Movie Media server
        url: https://jellyfin.munchbox.cc
        tag: media
        icon: munchbox_pixels.png

      - name: Kavita
        subtitle: Book Reader
        url: https://kavita.munchbox.cc
        tag: media
        icon: kavita.png

      - name: Radarr
        subtitle: Movie management
        url: https://radarr.munchbox.cc
        tag: media
        icon: radarr.png

      - name: Sonarr
        subtitle: TV management
        url: https://sonarr.munchbox.cc
        tag: media
        icon: sonarr.png

      - name: Lidarr
        subtitle: Music management
        url: https://lidarr.munchbox.cc
        tag: media
        icon: lidarr.png

      - name: Readarr
        subtitle: Book management
        url: https://readarr.munchbox.cc
        tag: media
        icon: readarr.png

      - name: Prowlarr
        subtitle: Indexer management
        url: https://prowlarr.munchbox.cc
        tag: media
        icon: prowlarr.png

      - name: Deluge
        subtitle: Torrent client
        url: https://deluge.munchbox.cc
        tag: download
        icon: deluge.png

      - name: Ersatz
        subtitle: Backup media
        url: https://ersatz.munchbox.cc
        tag: media
        icon: ersatz.png

  # -------------------------------------------------------------------------
  # Infrastructure & Networking
  # -------------------------------------------------------------------------
  - name: Infrastructure & Networking
    icon: fa-solid fa-server
    items:
      - name: Nomad
        subtitle: Workload orchestration
        url: https://nomad.munchbox.cc
        tag: orchestration
        icon: nomad.png

      - name: Consul
        subtitle: Service discovery and mesh
        url: https://consul.munchbox.cc
        tag: infra
        icon: consul.png

      - name: Vault
        subtitle: Secrets management
        url: https://vault.munchbox.cc
        tag: security
        icon: vault.png

      - name: Proxmox
        subtitle: Virtualization cluster
        url: https://proxmox.munchbox.cc:8006
        tag: virtualization
        icon: proxmox.png

      - name: OAuth2 Proxy
        subtitle: SSO and identity provider
        url: https://auth.munchbox.cc
        tag: security
        icon: oauth2-proxy.png

      - name: Traefik
        subtitle: Reverse proxy and load balancer
        url: https://traefik.munchbox.cc
        tag: infra
        icon: traefik.png

      - name: HAProxy
        subtitle: Database failover proxy
        url: https://haproxy.munchbox.cc/stats
        tag: infra
        icon: haproxy.png

      - name: Pi-hole (green)
        subtitle: Primary DNS
        url: https://pihole-green.munchbox.cc/admin
        tag: dns
        icon: pi-hole.png

      - name: Pi-hole (logan)
        subtitle: Secondary DNS
        url: https://pihole-logan.munchbox.cc/admin
        tag: dns
        icon: pi-hole.png

  # -------------------------------------------------------------------------
  # Developer Tools
  # -------------------------------------------------------------------------
  - name: Developer Tools
    icon: fa-solid fa-code
    items:
      - name: Temporal
        subtitle: Workflow orchestration
        url: https://temporal.munchbox.cc
        tag: workflows
        icon: temporal-ui.png

      - name: Forgejo
        subtitle: Git repository hosting
        url: https://git.munchbox.cc
        tag: git
        icon: forgejo.png

      - name: Registry
        subtitle: Docker container registry
        url: https://registry-ui.munchbox.cc
        tag: containers
        icon: registry-ui.png

      - name: Aptly
        subtitle: Debian package repository
        url: https://apt.munchbox.cc/ui/
        tag: packages
        icon: aptly.png

  # -------------------------------------------------------------------------
  # Observability
  # -------------------------------------------------------------------------
  - name: Observability
    icon: fa-solid fa-chart-line
    items:
      - name: Grafana
        subtitle: Dashboards and visualization
        url: https://grafana.munchbox.cc
        tag: monitoring
        icon: grafana.png

      - name: Prometheus
        subtitle: Metrics collection
        url: https://prometheus.munchbox.cc
        tag: metrics
        icon: prometheus.png

      - name: Alertmanager
        subtitle: Alert routing
        url: https://alertmanager.munchbox.cc
        tag: alerts
        icon: alertmanager.png

      - name: Traefik Log Dashboard
        subtitle: Traefik Traffic Dashboard
        url: https://traefik-logs.munchbox.cc/dashboard
        tag: infra
        icon: traefik-log-dashboard.png

      - name: S3 Orchestrator
        subtitle: Unified S3 storage endpoint
        url: https://s3.munchbox.cc/ui/
        tag: storage
        icon: s3-orchestrator.png

      - name: OpenZFS
        subtitle: ZFS Pool Dashboard
        url: https://zfs.munchbox.cc
        tag: monitoring
        icon: openzfs.png

      - name: Trivy Scanner
        subtitle: Container vulnerability scans
        url: https://trivy-dashboard.munchbox.cc
        tag: security
        icon: trivy.png

      - name: Vault Cert Manager
        subtitle: Status and rotation of certs
        url: http://vault-cert-manager-aggregator.service.consul:9102
        tag: security
        icon: vault.png

      - name: Umami
        subtitle: Web analytics
        url: https://analytics.munchbox.cc
        tag: analytics
        icon: umami.png

  # -------------------------------------------------------------------------
  # Public Cloud Providers
  # -------------------------------------------------------------------------
  - name: Public Cloud Providers
    icon: fa-solid fa-cloud
    items:
      - name: Oracle Cloud
        subtitle: OCI console
        url: https://cloud.oracle.com
        tag: cloud
        icon: oracle.png

      - name: Cloudflare
        subtitle: CDN, DNS, and tunnels
        url: https://dash.cloudflare.com
        tag: cloud
        icon: cloudflare.png

      - name: Google Cloud
        subtitle: GCP console
        url: https://console.cloud.google.com
        tag: cloud
        icon: gcp.png

      - name: Backblaze B2
        subtitle: Object storage
        url: https://secure.backblaze.com/b2_buckets.htm
        tag: storage
        icon: backblaze.png

      - name: IDrive E2
        subtitle: Object storage
        url: https://app.idrivee2.com
