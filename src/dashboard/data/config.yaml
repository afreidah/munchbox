# -------------------------------------------------------------------------------
# Munchbox Dashboard configuration for hugo-dash
#
# Project: Munchbox / Author: Alex Freidah
#
# Defines dashboard groups and tile metadata for internal service navigation.
# Icons referenced here must exist under assets/icons. The structure aligns with
# the hugo-dash template, which expects a top-level services list containing
# groups, each with items that define downstream service URLs.
# -------------------------------------------------------------------------------

title: Munchbox Dashboard
subtitle: Central access to Munchbox services
icon: munchbox

services:
  # -------------------------------------------------------------------------
  # Cloud Apps
  # -------------------------------------------------------------------------
  - name: Cloud Apps
    icon: fa-solid fa-cloud
    items:
      - name: Nextcloud
        subtitle: Files, calendar, contacts
        url: https://nextcloud.munchbox.cc
        tag: cloud
        icon: nextcloud.png

      - name: Vaultwarden
        subtitle: Password manager
        url: https://vaultwarden.munchbox.cc
        tag: security
        icon: vaultwarden.svg

  # -------------------------------------------------------------------------
  # DNS
  # -------------------------------------------------------------------------
  - name: DNS
    icon: fa-solid fa-globe
    items:
      - name: Green
        subtitle: Pi-hole DNS server 1
        url: http://green.munchbox/admin
        tag: dns
        icon: pi-hole-unbound.svg

      - name: Logan
        subtitle: Pi-hole DNS server 2
        url: http://logan.munchbox/admin
        tag: dns
        icon: pi-hole-unbound.svg

  # -------------------------------------------------------------------------
  # Monitoring
  # -------------------------------------------------------------------------
  - name: Monitoring
    icon: fa-solid fa-chart-line
    items:
      - name: Grafana
        subtitle: Dashboards and visualization
        url: https://grafana.munchbox.cc
        tag: monitoring
        icon: grafana.png

      - name: Prometheus
        subtitle: Metrics collection
        url: https://prometheus.munchbox.cc
        tag: metrics
        icon: prometheus.png

      - name: Alertmanager
        subtitle: Alert routing
        url: https://alertmanager.munchbox.cc
        tag: alerts
        icon: alertmanager.png

  # -------------------------------------------------------------------------
  # Media
  # -------------------------------------------------------------------------
  - name: Media
    icon: fa-solid fa-film
    items:
      - name: Emby
        subtitle: Media server
        url: https://emby.munchbox.cc
        tag: media
        icon: emby.png

      - name: Sonarr
        subtitle: TV management
        url: https://sonarr.munchbox.cc
        tag: media
        icon: sonarr.svg

      - name: Radarr
        subtitle: Movie management
        url: https://radarr.munchbox.cc
        tag: media
        icon: radarr.svg

      - name: Lidarr
        subtitle: Music management
        url: https://lidarr.munchbox.cc
        tag: media
        icon: lidarr.svg

      - name: Prowlarr
        subtitle: Indexer management
        url: https://prowlarr.munchbox.cc
        tag: media
        icon: prowlarr.svg

      - name: Deluge
        subtitle: Torrent client
        url: https://deluge.munchbox.cc
        tag: download
        icon: deluge.png

      - name: Ersatz
        subtitle: Backup media
        url: https://ersatz.munchbox.cc
        tag: media
        icon: ersatz.png

  # -------------------------------------------------------------------------
  # Infrastructure
  # -------------------------------------------------------------------------
  - name: Infrastructure
    icon: fa-solid fa-server
    items:
      - name: Proxmox
        subtitle: Virtualization cluster
        url: https://proxmox.munchbox.cc
        tag: virtualization
        icon: proxmox.png

      - name: Nomad
        subtitle: Workload orchestration
        url: https://nomad.munchbox.cc
        tag: orchestration
        icon: nomad.png

      - name: Consul
        subtitle: Service discovery and mesh
        url: https://consul.munchbox.cc
        tag: infra
        icon: consul.png

      - name: Traefik
        subtitle: Reverse proxy and load balancer
        url: https://traefik.munchbox.cc
        tag: infra
        icon: traefik.png

      - name: Authentik
        subtitle: SSO and identity provider
        url: https://auth.munchbox.cc
        tag: security
        icon: authentik.png

      - name: Temporal
        subtitle: Workflow orchestration
        url: https://temporal.munchbox.cc
        tag: workflows
        icon: temporal-ui.png

      - name: Registry
        subtitle: Docker container registry
        url: https://registry-ui.munchbox.cc
        tag: containers
        icon: registry-ui.png

      - name: Cloudflare
        subtitle: CDN, DNS, and tunnels
        url: https://dash.cloudflare.com
        tag: external
        icon: cloudflare.svg

  # -------------------------------------------------------------------------
  # Public Sites
  # -------------------------------------------------------------------------
  - name: Public Sites
    icon: fa-solid fa-arrow-up-right-from-square
    items:
      - name: Resume
        subtitle: alexfreidah.com
        url: https://resume.alexfreidah.com
        tag: public
        icon: resume-site.png

      - name: k3s Status
        subtitle: Cluster health checker
        url: https://k3s-status.alexfreidah.com
        tag: public
        icon: k3s-health-checker.svg
