# -------------------------------------------------------------------------------
# Munchbox Dashboard configuration for hugo-dash
#
# Project: Munchbox / Author: Alex Freidah
#
# Defines dashboard groups and tile metadata for internal service navigation.
# Icons referenced here must exist under assets/icons. The structure aligns with
# the hugo-dash template, which expects a top-level services list containing
# groups, each with items that define downstream service URLs.
# -------------------------------------------------------------------------------

title: Munchbox Dashboard
subtitle: Central access to Munchbox services
icon: other-icon

services:
  # -------------------------------------------------------------------------
  # DNS
  # -------------------------------------------------------------------------
  - name: DNS
    icon: fa-solid fa-network-wired
    items:
      - name: green.munchbox.cc
        subtitle: PiHole/Unbound DNS server 1
        url: http://green.munchbox/admin/login
        tag: infra
        icon: pi-hole-unbound.svg

      - name: logan.munchbox.cc
        subtitle: PiHole/Unbound DNS server 2
        url: http://logan.munchbox/admin/login
        tag: infra
        icon: pi-hole-unbound.svg

      - name: Cloudflare
        subtitle: CDN
        url: https://cloudflare.com
        tag: cdn
        icon: cloudflare.svg

  # -------------------------------------------------------------------------
  # MONITORING
  # -------------------------------------------------------------------------

  - name: Monitoring/Alerting
    icon: fa-solid fa-chart-line
    items:
      - name: Grafana
        subtitle: Dashboards and metrics
        url: https://grafana.munchbox.cc
        tag: monitoring
        icon: grafana.png

      - name: Prometheus
        subtitle: Time series metrics
        url: https://prometheus.munchbox.cc
        tag: metrics
        icon: prometheus.png

      - name: Alertmanager
        subtitle: Alert routing and silences
        url: https://alertmanager.munchbox.cc
        tag: alerts
        icon: alertmanager.png

  # -------------------------------------------------------------------------
  # ORCHESTRATION/VIRTUALIZATION
  # -------------------------------------------------------------------------

  - name: Orchestration/Virtualization
    icon: fa-solid fa-network-wired
    items:
      - name: Proxmox
        subtitle: Virtualization cluster
        url: https://proxmox.munchbox.cc
        tag: virtualization
        icon: proxmox.png

      - name: Nomad
        subtitle: Cluster orchestration
        url: https://nomad.munchbox.cc
        tag: orchestration
        icon: nomad.png

      - name: Consul
        subtitle: Service mesh and key value store
        url: https://consul.munchbox.cc
        tag: infra
        icon: consul.png

      - name: Temporal UI
        subtitle: Workflow orchestration
        url: https://temporal.munchbox.cc
        tag: workflows
        icon: temporal-ui.png

      - name: HashiCorp Waypoint
        subtitle: Application deployment workflows
        url: https://waypoint.munchbox.cc
        tag: deploy
        icon: waypoint.png

      - name: Registry
        subtitle: Local Docker Registry
        url: https://registry-ui.munchbox.cc
        tag: deploy
        icon: registry-ui.png

  # -------------------------------------------------------------------------
  # MEDIA AND TORRENTING
  # -------------------------------------------------------------------------

  - name: Media and Downloads
    icon: fa-solid fa-film
    items:
      - name: Emby
        subtitle: Media server
        url: https://emby.munchbox.cc
        tag: media
        icon: emby.png

      - name: Deluge
        subtitle: Torrent client
        url: https://deluge.munchbox.cc
        tag: download
        icon: deluge.png

      - name: Sonarr
        subtitle: TV bittorent/usenet
        url: https://sonarr.munchbox.cc
        tag: media
        icon: sonarr.svg

      - name: Radarr
        subtitle: Movie bittorent/usenet
        url: https://radarr.munchbox.cc
        tag: media
        icon: radarr.svg

      - name: Lidarr
        subtitle: Music bittorent/usenet
        url: https://lidarr.munchbox.cc
        tag: media
        icon: lidarr.svg

      - name: Prowlarr
        subtitle: Index Manager bittorent/usenet
        url: https://prowlarr.munchbox.cc
        tag: media
        icon: prowlarr.svg

      - name: Ersatz
        subtitle: Alternate or backup media
        url: https://ersatz.munchbox.cc
        tag: media
        icon: ersatz.png

  # -------------------------------------------------------------------------
  # DEV
  # -------------------------------------------------------------------------

  # -------------------------------------------------------------------------
  # WEB
  # -------------------------------------------------------------------------

  - name: Web
    icon: fa-solid fa-globe
    items:
      - name: Resume Site
        subtitle: Personal resume
        url: https://resume.alexfreidah.com
        tag: personal
        icon: resume-site.png

      - name: k3s Health Checker
        subtitle: k3s cluster status
        url: https://k3s-status.alexfreidah.com
        tag: web
        icon: k3s-health-checker.svg

