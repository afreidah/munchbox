# -------------------------------------------------------------------------------
# harper-ls (https://writewithharper.com) workspace config.
#
# Disables Harper's linters across the repo. Most of the source is
# infrastructure code (chef cookbooks, terraform, ansible, nomad/consul
# HCL) where Harper's spelling/grammar rules fire constantly on
# legitimate identifiers like `cinc`, `gpg`, `https`, `packagecloud`,
# `apt`, etc.
#
# Re-enable individual linters here if/when prose linting becomes
# valuable on a subset of files.
# -------------------------------------------------------------------------------

[linters]
spell_check                  = false
spelled_numbers              = false
sentence_capitalization      = false
matcher                      = false
multiple_sequential_pronouns = false
long_sentences               = false
linking_verbs                = false
avoid_curses                 = false
terminating_conjunctions     = false
ellipsis_length              = false
dot_initialisms              = false
an_a                         = false
repeated_words               = false
no_oxford_comma              = false
use_genitive                 = false
wrong_quotes                 = false
boring_words                 = false
compound_nouns               = false
adjective_of_a               = false
that_which                   = false
plural_conjugate             = false
pique_interest               = false
correct_number_suffix        = false
lets_confusion               = false
nobody                       = false
oxymorons                    = false
piece_of_arch                = false
similar_to_the_same          = false
the_how_why                  = false
unclosed_quotes              = false