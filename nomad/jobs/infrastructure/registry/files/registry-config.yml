version: 0.1
log:
  level: info
# Note: OTEL tracing configured via env vars (Registry 3.0 ignores YAML otel config)
storage:
  filesystem:
    rootdirectory: /var/lib/registry
  delete:
    enabled: true
http:
  addr: :5000
  draintimeout: 10m
  readtimeout: 10m
  writetimeout: 10m
  idletimeout: 10m
  headers:
    X-Content-Type-Options: [nosniff]
    Access-Control-Allow-Origin: ['https://registry-ui.munchbox.cc']
    Access-Control-Allow-Methods: ['HEAD', 'GET', 'OPTIONS', 'DELETE']
    Access-Control-Allow-Headers: ['Authorization', 'Accept', 'Cache-Control']
    Access-Control-Expose-Headers: ['Docker-Content-Digest']
    Access-Control-Allow-Credentials: ['true']
