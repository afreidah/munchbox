# ---------------------------------------------------------------------------
# Grafana Datasources — Prometheus + Loki + Tempo via Consul DNS
#
# Services are reached via Consul DNS with host address mode:
#   - prometheus.service.consul:9090
#   - loki.service.consul:3100
#   - tempo.service.consul:3200
# ---------------------------------------------------------------------------
apiVersion: 1
datasources:
  # -------------------------------------------------------------------------
  # Prometheus (Metrics)
  # -------------------------------------------------------------------------
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus.service.consul:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 30s

  # -------------------------------------------------------------------------
  # Loki (Logs)
  # -------------------------------------------------------------------------
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki.service.consul:3100
    editable: false
    jsonData:
      httpHeaderName1: X-Scope-OrgID
      maxLines: 1000
      derivedFields:
        - name: TraceID
          matcherRegex: '"traceId":"([a-f0-9]+)"'
          url: '$${__value.raw}'
          datasourceUid: tempo
          urlDisplayLabel: View Trace
    secureJsonData:
      httpHeaderValue1: fake

  # -------------------------------------------------------------------------
  # Tempo (Traces)
  # -------------------------------------------------------------------------
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo.service.consul:3200
    editable: false
    jsonData:
      tracesToLogs:
        datasourceUid: loki
        filterByTraceID: true
        mapTagNamesEnabled: true
        mappedTags:
          - key: service.name
            value: job_name
      tracesToMetrics:
        datasourceUid: prometheus
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: loki
