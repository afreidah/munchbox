# ---------------------------------------------------------------------------
# Grafana Datasources — Prometheus + Loki via Consul DNS
#
# Both services are reached via Consul DNS with host address mode:
#   - prometheus.service.consul:9090
#   - loki.service.consul:3100
# ---------------------------------------------------------------------------
apiVersion: 1
datasources:
  # -------------------------------------------------------------------------
  # Prometheus (Metrics)
  # -------------------------------------------------------------------------
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus.service.consul:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 30s
      
  # -------------------------------------------------------------------------
  # Loki (Logs)
  # -------------------------------------------------------------------------
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki.service.consul:3100
    editable: false
    jsonData:
      maxLines: 1000
