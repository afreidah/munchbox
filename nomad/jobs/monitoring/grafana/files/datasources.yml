# ------------------------------------------------------------------------------
# Grafana Datasources — Provisioned (authoritative)
# ------------------------------------------------------------------------------

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090  # ← Connect upstream
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    access: proxy
    url: http://localhost:3100  # ← Connect upstream
    editable: false
