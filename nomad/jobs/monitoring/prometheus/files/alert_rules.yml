# Prometheus Alert Rules
# These rules are evaluated by Prometheus and fire alerts to Alertmanager

groups:
  # ---------------------------------------------------------------------------
  # Infrastructure Health Alerts
  # ---------------------------------------------------------------------------
  - name: infrastructure-health
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service {{"{{"}} $labels.instance {{"}}"}} is down"
          description: "{{"{{"}} $labels.job {{"}}"}} service on {{"{{"}} $labels.instance {{"}}"}} has been down for more than 2 minutes."

      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{"{{"}} $labels.instance {{"}}"}}"
          description: "CPU usage is above 80% for more than 5 minutes on {{"{{"}} $labels.instance {{"}}"}}"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{"{{"}} $labels.instance {{"}}"}}"
          description: "Memory usage is above 85% for more than 5 minutes on {{"{{"}} $labels.instance {{"}}"}}"

      - alert: DiskSpaceLow
        expr: (1 - (node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"})) * 100 > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk space low on {{"{{"}} $labels.instance {{"}}"}}"
          description: "Disk usage is above 90% on {{"{{"}} $labels.instance {{"}}"}} ({{"{{"}} $labels.mountpoint {{"}}"}})."

  # ---------------------------------------------------------------------------
  # Nomad Cluster Health
  # ---------------------------------------------------------------------------
  - name: nomad-health
    interval: 30s
    rules:
      - alert: NomadScrapeDown
        expr: min by () (up{job="nomad"}) == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus cannot scrape any Nomad server"
          description: "All Nomad scrape targets are down or unauthorized."

      - alert: NomadJobFailed
        expr: (max without(instance, __address__) (nomad_nomad_job_summary_failed{namespace!="__internal"} + nomad_nomad_job_summary_lost{namespace!="__internal"})) > 0 and on (job_id, namespace) max by (job_id, namespace) (nomad_nomad_job_status_running + nomad_nomad_job_status_pending) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Nomad job has failed allocations: {{"{{"}} $labels.job_id {{"}}"}}"
          description: "Job {{"{{"}} $labels.job_id {{"}}"}} in namespace {{"{{"}} $labels.namespace {{"}}"}} has failed or lost allocations."

      - alert: NomadLeaderElection
        expr: increase(nomad_nomad_leader_leadership_lost_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Nomad leader election occurred"
          description: "Nomad cluster experienced a leader election in the last 5 minutes."

  # ---------------------------------------------------------------------------
  # Site Availability (HTTPS-only)
  # ---------------------------------------------------------------------------
  - name: site-uptime
    interval: 30s
    rules:
      - alert: SiteDown
        expr: probe_success{job="site_https"} == 0 and on (instance) (probe_http_status_code{job="site_https"} != 401 and probe_http_status_code{job="site_https"} != 403)
        for: 2m
        labels:
          severity: critical
          team: web
        annotations:
          summary: "Site is down: {{"{{"}} $labels.instance {{"}}"}}"
          description: "Site {{"{{"}} $labels.instance {{"}}"}} has been unreachable for more than 2 minutes (non-auth failure)."

      - alert: SiteTLSCertExpiring
        expr: (probe_ssl_earliest_cert_expiry{job="site_https"} - time()) < 21*24*60*60
        for: 5m
        labels:
          severity: warning
          team: web
        annotations:
          summary: "TLS certificate expiring soon: {{"{{"}} $labels.instance {{"}}"}}"
          description: "TLS certificate for {{"{{"}} $labels.instance {{"}}"}} expires within 21 days."

      - alert: SiteSlowResponse
        expr: probe_duration_seconds{job="site_https"} > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow response time: {{"{{"}} $labels.instance {{"}}"}}"
          description: "Site {{"{{"}} $labels.instance {{"}}"}} response time is above 5 seconds."

      - alert: AuthentikSlowResponse
        expr: probe_duration_seconds{job="site_https", instance=~".*auth.munchbox.cc.*"} > 2
        for: 2m
        labels:
          severity: critical
          auto_restart: "true"
          nomad_job: "authentik"
        annotations:
          summary: "Authentik is responding slowly"
          description: "Authentik response time is above 2 seconds (current: {{"{{"}} $value | printf \"%.2f\" {{"}}"}}s). Auto-restart triggered."

  # ---------------------------------------------------------------------------
  # Consul Health
  # ---------------------------------------------------------------------------
  - name: consul-health
    interval: 30s
    rules:
      - alert: ConsulPeersFailed
        expr: consul_raft_peers < 3
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Consul cluster has lost peers"
          description: "Consul cluster has fewer than 3 peers. Current: {{"{{"}} $value {{"}}"}}"

      - alert: ConsulLeaderElection
        expr: increase(consul_raft_leader_leadership_lost_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Consul leader election occurred"
          description: "Consul cluster experienced a leader election."

  # ---------------------------------------------------------------------------
  # PostgreSQL Health
  # ---------------------------------------------------------------------------
  - name: postgresql-health
    interval: 30s
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL exporter cannot connect to the database."

      - alert: PostgresHighConnections
        expr: pg_stat_activity_count / pg_settings_max_connections * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connection usage high"
          description: "PostgreSQL is using {{"{{"}} $value | printf \"%.1f\" {{"}}"}}% of max connections."

      - alert: PostgresConnectionsExhausted
        expr: pg_stat_activity_count / pg_settings_max_connections * 100 > 95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL connections nearly exhausted"
          description: "PostgreSQL is using {{"{{"}} $value | printf \"%.1f\" {{"}}"}}% of max connections. New connections may fail."

      - alert: PostgresDeadlocks
        expr: increase(pg_stat_database_deadlocks[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL deadlocks detected"
          description: "{{"{{"}} $value {{"}}"}} deadlocks occurred in the last 5 minutes on database {{"{{"}} $labels.datname {{"}}"}}."

      - alert: PostgresReplicationLag
        expr: pg_replication_lag_seconds > 30
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL replication lag is high"
          description: "Replication lag is {{"{{"}} $value | printf \"%.1f\" {{"}}"}} seconds."

      - alert: PostgresReplicationLagCritical
        expr: pg_replication_lag_seconds > 120
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL replication lag is critical"
          description: "Replication lag is {{"{{"}} $value | printf \"%.1f\" {{"}}"}} seconds. Data loss risk if primary fails."

      - alert: PostgresLongRunningTransaction
        expr: pg_stat_activity_max_tx_duration > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Long-running PostgreSQL transaction"
          description: "A transaction has been running for {{"{{"}} $value | printf \"%.0f\" {{"}}"}} seconds."

      - alert: PostgresHighRollbackRate
        expr: rate(pg_stat_database_xact_rollback[5m]) / (rate(pg_stat_database_xact_commit[5m]) + rate(pg_stat_database_xact_rollback[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High PostgreSQL rollback rate"
          description: "{{"{{"}} $value | printf \"%.1f\" {{"}}"}}% of transactions are being rolled back on {{"{{"}} $labels.datname {{"}}"}}."

  # ---------------------------------------------------------------------------
  # Redis Health
  # ---------------------------------------------------------------------------
  - name: redis-health
    interval: 30s
    rules:
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis exporter cannot connect to the server."

      - alert: RedisHighMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage high"
          description: "Redis is using {{"{{"}} $value | printf \"%.1f\" {{"}}"}}% of max memory."

      - alert: RedisMemoryNearLimit
        expr: redis_memory_used_bytes / redis_memory_max_bytes * 100 > 95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Redis memory nearly exhausted"
          description: "Redis is using {{"{{"}} $value | printf \"%.1f\" {{"}}"}}% of max memory. Evictions imminent."

      - alert: RedisHighEvictionRate
        expr: rate(redis_evicted_keys_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis high eviction rate"
          description: "Redis is evicting {{"{{"}} $value | printf \"%.0f\" {{"}}"}} keys/second."

      - alert: RedisRejectedConnections
        expr: increase(redis_rejected_connections_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Redis rejecting connections"
          description: "Redis rejected {{"{{"}} $value | printf \"%.0f\" {{"}}"}} connections in the last 5 minutes."

      - alert: RedisHighClientConnections
        expr: redis_connected_clients / redis_config_maxclients * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis client connections high"
          description: "Redis is using {{"{{"}} $value | printf \"%.1f\" {{"}}"}}% of max client connections."

      - alert: RedisHighFragmentation
        # Only alert on fragmentation when Redis is using significant memory (>100MB)
        # Low memory usage naturally causes high fragmentation ratios due to overhead
        expr: redis_mem_fragmentation_ratio > 1.5 and redis_memory_used_bytes > 100000000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory fragmentation high"
          description: "Redis memory fragmentation ratio is {{"{{"}} $value | printf \"%.2f\" {{"}}"}}."

  # ---------------------------------------------------------------------------
  # Vault Health
  # ---------------------------------------------------------------------------
  - name: vault-health
    interval: 30s
    rules:
      - alert: VaultSealed
        expr: vault_core_unsealed == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Vault is sealed"
          description: "Vault is sealed and cannot serve requests. Manual unseal required."

      - alert: VaultDown
        expr: up{job="vault"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Vault is unreachable"
          description: "Cannot scrape Vault metrics. Vault may be down."

      - alert: VaultNotActive
        expr: vault_core_active == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Vault is not active"
          description: "Vault instance is not the active node. Check cluster health."

      - alert: VaultHighRequestLatency
        expr: histogram_quantile(0.99, rate(vault_core_handle_request_count[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Vault request latency high"
          description: "99th percentile request latency is above 1 second."

      - alert: VaultLeaseExplosion
        expr: vault_expire_num_leases > 10000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Vault has many active leases"
          description: "Vault has {{"{{"}} $value {{"}}"}} active leases. Consider reviewing lease TTLs."

      - alert: VaultTokenCreationSpike
        expr: rate(vault_token_creation[5m]) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Vault token creation rate"
          description: "{{"{{"}} $value | printf \"%.0f\" {{"}}"}} tokens/second being created. Possible credential leaking."

  # ---------------------------------------------------------------------------
  # Nomad Container Lifecycle
  # ---------------------------------------------------------------------------
  - name: nomad-container-health
    interval: 30s
    rules:
      - alert: NomadAllocationPending
        expr: max without(instance, __address__) (nomad_nomad_job_summary_queued{namespace!="__internal"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Nomad allocations pending: {{"{{"}} $labels.job_id {{"}}"}}"
          description: "Job {{"{{"}} $labels.job_id {{"}}"}} has {{"{{"}} $value {{"}}"}} queued allocations for more than 5 minutes. Check resource availability."

      - alert: NomadJobRestartLoop
        expr: increase(nomad_client_allocs_restart[10m]) > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Nomad job in restart loop"
          description: "A Nomad allocation has restarted {{"{{"}} $value | printf \"%.0f\" {{"}}"}} times in 10 minutes on {{"{{"}} $labels.instance {{"}}"}}."

      - alert: NomadClientHighMemory
        expr: nomad_client_allocated_memory / nomad_client_host_memory_total * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Nomad client memory allocation high"
          description: "Nomad client {{"{{"}} $labels.instance {{"}}"}} has {{"{{"}} $value | printf \"%.1f\" {{"}}"}}% of memory allocated."

      - alert: NomadClientHighCPU
        expr: nomad_client_allocated_cpu / nomad_client_host_cpu_core_multiplied * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Nomad client CPU allocation high"
          description: "Nomad client {{"{{"}} $labels.instance {{"}}"}} has {{"{{"}} $value | printf \"%.1f\" {{"}}"}}% of CPU allocated."

      - alert: NomadNodeNotReady
        expr: nomad_client_node_status{status!="ready"} == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Nomad node not ready"
          description: "Nomad client node is in {{"{{"}} $labels.status {{"}}"}} state."

  # ---------------------------------------------------------------------------
  # Traefik/Ingress Health
  # ---------------------------------------------------------------------------
  - name: traefik-health
    interval: 30s
    rules:
      - alert: TraefikDown
        expr: up{job="traefik"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Traefik is down"
          description: "Traefik ingress controller is not responding to metrics scrapes."

      - alert: TraefikHighErrorRate
        expr: sum(rate(traefik_service_requests_total{code=~"5.."}[5m])) / sum(rate(traefik_service_requests_total[5m])) * 100 > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Traefik high 5xx error rate"
          description: "{{"{{"}} $value | printf \"%.1f\" {{"}}"}}% of requests are returning 5xx errors."

      - alert: TraefikHighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(traefik_service_request_duration_seconds_bucket{exported_service!~"(nextcloud|deluge|jellyfin)@.*"}[5m])) by (le, exported_service)) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Traefik high request latency"
          description: "95th percentile latency for service {{"{{"}} $labels.exported_service {{"}}"}} is above 5 seconds."

      - alert: TraefikBackendDown
        expr: traefik_service_server_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Traefik backend server down"
          description: "Backend server for service {{"{{"}} $labels.service {{"}}"}} is not responding."

      - alert: TraefikTLSCertExpiring
        expr: (traefik_tls_certs_not_after - time()) < 7*24*60*60
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Traefik TLS certificate expiring soon"
          description: "TLS certificate for {{"{{"}} $labels.cn {{"}}"}} expires in less than 7 days."

      - alert: TraefikConfigReloadFailed
        expr: traefik_config_last_reload_success == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Traefik config reload failed"
          description: "Traefik failed to reload its configuration."

  # ---------------------------------------------------------------------------
  # Cloudflare Tunnel Health
  # ---------------------------------------------------------------------------
  - name: cloudflared-health
    interval: 30s
    rules:
      - alert: CloudflaredDown
        expr: up{job="cloudflared-tunnel"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Cloudflared tunnel is down"
          description: "Cloudflared tunnel metrics are not being scraped."

      - alert: CloudflaredNoHAConnections
        expr: cloudflared_tunnel_ha_connections < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Cloudflared has no HA connections"
          description: "Cloudflared tunnel has {{"{{"}} $value {{"}}"}} HA connections. Tunnel may be disconnected."

      - alert: CloudflaredLowHAConnections
        expr: cloudflared_tunnel_ha_connections < 4
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Cloudflared HA connections degraded"
          description: "Cloudflared has only {{"{{"}} $value {{"}}"}} HA connections (expected 4)."

      - alert: CloudflaredHighErrorRate
        expr: rate(cloudflared_tunnel_request_errors[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Cloudflared high request error rate"
          description: "Cloudflared is seeing {{"{{"}} $value | printf \"%.1f\" {{"}}"}} errors/second."

      - alert: CloudflaredHighLatency
        expr: histogram_quantile(0.95, rate(cloudflared_proxy_connect_latency_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Cloudflared proxy latency high"
          description: "95th percentile proxy connect latency is above 2 seconds."

  # ---------------------------------------------------------------------------
  # Disk I/O and Network Saturation
  # ---------------------------------------------------------------------------
  - name: disk-network-health
    interval: 30s
    rules:
      - alert: HighDiskIOUtilization
        expr: rate(node_disk_io_time_seconds_total[5m]) * 100 > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High disk I/O utilization on {{"{{"}} $labels.instance {{"}}"}}"
          description: "Disk {{"{{"}} $labels.device {{"}}"}} is {{"{{"}} $value | printf \"%.0f\" {{"}}"}}% utilized."

      - alert: DiskIOSaturation
        expr: rate(node_disk_io_time_seconds_total[5m]) * 100 > 95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk I/O saturated on {{"{{"}} $labels.instance {{"}}"}}"
          description: "Disk {{"{{"}} $labels.device {{"}}"}} is {{"{{"}} $value | printf \"%.0f\" {{"}}"}}% utilized. Performance degradation likely."

      - alert: HighDiskReadLatency
        expr: rate(node_disk_read_time_seconds_total[5m]) / rate(node_disk_reads_completed_total[5m]) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High disk read latency on {{"{{"}} $labels.instance {{"}}"}}"
          description: "Disk {{"{{"}} $labels.device {{"}}"}} average read latency is {{"{{"}} $value | printf \"%.0f\" {{"}}"}}ms."

      - alert: HighDiskWriteLatency
        expr: |
          rate(node_disk_write_time_seconds_total{device!~"mmcblk.*"}[5m]) / rate(node_disk_writes_completed_total{device!~"mmcblk.*"}[5m]) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High disk write latency on {{"{{"}} $labels.instance {{"}}"}}"
          description: "Disk {{"{{"}} $labels.device {{"}}"}} average write latency is {{"{{"}} $value | printf \"%.0f\" {{"}}"}}ms."

      - alert: NetworkReceiveErrors
        expr: rate(node_network_receive_errs_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Network receive errors on {{"{{"}} $labels.instance {{"}}"}}"
          description: "Interface {{"{{"}} $labels.device {{"}}"}} is seeing {{"{{"}} $value | printf \"%.0f\" {{"}}"}} receive errors/second."

      - alert: NetworkTransmitErrors
        expr: rate(node_network_transmit_errs_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Network transmit errors on {{"{{"}} $labels.instance {{"}}"}}"
          description: "Interface {{"{{"}} $labels.device {{"}}"}} is seeing {{"{{"}} $value | printf \"%.0f\" {{"}}"}} transmit errors/second."

      - alert: NetworkHighBandwidth
        expr: (rate(node_network_receive_bytes_total{device!~"lo|docker.*|veth.*|br-.*"}[5m]) + rate(node_network_transmit_bytes_total{device!~"lo|docker.*|veth.*|br-.*"}[5m])) / 1024 / 1024 > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High network bandwidth on {{"{{"}} $labels.instance {{"}}"}}"
          description: "Interface {{"{{"}} $labels.device {{"}}"}} is using {{"{{"}} $value | printf \"%.0f\" {{"}}"}} MB/s."

      - alert: NetworkInterfaceDown
        expr: node_network_carrier{device!~"lo|docker.*|veth.*|br-.*|cni.*|nomad|wlan.*|flannel.*"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Network interface down on {{"{{"}} $labels.instance {{"}}"}}"
          description: "Interface {{"{{"}} $labels.device {{"}}"}} has no carrier signal."

  # ---------------------------------------------------------------------------
  # Backup Job Monitoring
  # ---------------------------------------------------------------------------
  - name: backup-health
    interval: 60s
    rules:
      - alert: BackupWorkerDown
        expr: max(nomad_nomad_job_summary_running{exported_job="temporal-backup-worker"}) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Temporal backup worker is down"
          description: "Temporal backup worker job has no running allocations."

      - alert: BackupJobFailed
        # Alert if backup trigger has failed allocations
        expr: max(nomad_nomad_job_summary_failed{exported_job="temporal-backup-trigger"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Backup job has failures"
          description: "Temporal backup trigger job has {{"{{"}} $value {{"}}"}} failed allocations."

  # ---------------------------------------------------------------------------
  # Temporal Workflow Health
  # ---------------------------------------------------------------------------
  - name: temporal-health
    interval: 30s
    rules:
      - alert: TemporalServerDown
        expr: max(nomad_nomad_job_summary_running{exported_job="temporal-server"}) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Temporal server is down"
          description: "Temporal workflow server has no running allocations."

      - alert: TemporalUIDown
        expr: max(nomad_nomad_job_summary_running{exported_job="temporal-ui"}) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Temporal UI is down"
          description: "Temporal UI has no running allocations."

  # ---------------------------------------------------------------------------
  # Nextcloud Health
  # ---------------------------------------------------------------------------
  - name: nextcloud-health
    interval: 60s
    rules:
      - alert: NextcloudDown
        expr: nextcloud_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Nextcloud is down"
          description: "Nextcloud instance is not responding to health checks."

      - alert: NextcloudScrapeErrors
        expr: increase(nextcloud_scrape_errors_total[5m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Nextcloud scrape errors"
          description: "Nextcloud exporter is experiencing scrape errors."

      - alert: NextcloudStorageLow
        expr: nextcloud_free_space_bytes < 10737418240
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Nextcloud storage low"
          description: "Nextcloud has less than 10GB free storage space."

      - alert: NextcloudStorageCritical
        expr: nextcloud_free_space_bytes < 1073741824
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Nextcloud storage critical"
          description: "Nextcloud has less than 1GB free storage space."

  # ---------------------------------------------------------------------------
  # Alertmanager Self-Monitoring
  # ---------------------------------------------------------------------------
  - name: alertmanager-health
    interval: 30s
    rules:
      - alert: AlertmanagerDown
        expr: up{job="alertmanager"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager is down"
          description: "Alertmanager is not responding. Alert notifications will not be delivered."

      - alert: AlertmanagerNotificationsFailing
        expr: rate(alertmanager_notifications_failed_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Alertmanager notifications failing"
          description: "Alertmanager is failing to send notifications via {{"{{"}} $labels.integration {{"}}"}}."

      - alert: AlertmanagerClusterFailed
        expr: alertmanager_cluster_members < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager cluster failed"
          description: "Alertmanager cluster has no members - alerting is broken."

      - alert: PrometheusAlertmanagerJobMissing
        expr: absent(up{job="alertmanager"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager target missing"
          description: "Prometheus cannot find Alertmanager scrape target. Alerting system may be down."

  # ---------------------------------------------------------------------------
  # NFS Mount Health
  # ---------------------------------------------------------------------------
  - name: nfs-health
    interval: 60s
    rules:
      - alert: NFSMountStale
        expr: |
          node_filesystem_device_error{fstype="nfs4"} == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "NFS mount error on {{"{{"}} $labels.instance {{"}}"}}"
          description: "NFS mount {{"{{"}} $labels.mountpoint {{"}}"}} has device errors - mount may be stale."

      - alert: NFSMountMissing
        expr: |
          count(node_filesystem_avail_bytes{fstype="nfs4",mountpoint="/mnt/gdrive-secondary"}) < 4
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "NFS mount missing on some nodes"
          description: "Expected 4 nodes with NFS mount, found {{"{{"}} $value {{"}}"}}."

      - alert: NFSHighRetransmissions
        expr: rate(node_nfs_rpc_retransmissions_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High NFS retransmissions on {{"{{"}} $labels.instance {{"}}"}}"
          description: "NFS client on {{"{{"}} $labels.instance {{"}}"}} has {{"{{"}} $value | printf \"%.1f\" {{"}}"}} retransmissions/sec."

      - alert: NFSStorageLow
        expr: |
          (node_filesystem_avail_bytes{fstype="nfs4"} / node_filesystem_size_bytes{fstype="nfs4"}) * 100 < 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "NFS storage low on {{"{{"}} $labels.mountpoint {{"}}"}}"
          description: "NFS mount {{"{{"}} $labels.mountpoint {{"}}"}} has less than 10% free space."

  # ---------------------------------------------------------------------------
  # Vault Cert Manager - Certificate Lifecycle Alerts
  # ---------------------------------------------------------------------------
  - name: vault-cert-manager-health
    interval: 30s
    rules:
      - alert: VaultCertManagerDown
        expr: up{job="vault-cert-manager"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Vault Cert Manager down on {{"{{"}} $labels.instance {{"}}"}}"
          description: "Vault Cert Manager on {{"{{"}} $labels.instance {{"}}"}} is not responding. Certificate renewals will not occur."

      - alert: ManagedCertExpiringSoon
        expr: (managed_cert_not_after_timestamp_seconds - time()) < 7*24*60*60
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Managed certificate expiring soon: {{"{{"}} $labels.name {{"}}"}}"
          description: "Certificate {{"{{"}} $labels.name {{"}}"}} on {{"{{"}} $labels.instance {{"}}"}} expires in less than 7 days."

      - alert: ManagedCertExpired
        expr: managed_cert_not_after_timestamp_seconds < time()
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Managed certificate expired: {{"{{"}} $labels.name {{"}}"}}"
          description: "Certificate {{"{{"}} $labels.name {{"}}"}} on {{"{{"}} $labels.instance {{"}}"}} has expired. Services using this certificate will fail TLS validation."

      - alert: ManagedCertRenewalsFailing
        expr: increase(managed_cert_renewals_total{status="failure"}[1h]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Certificate renewal failures: {{"{{"}} $labels.name {{"}}"}}"
          description: "Certificate {{"{{"}} $labels.name {{"}}"}} on {{"{{"}} $labels.instance {{"}}"}} has had renewal failures in the last hour. Check Vault connectivity and PKI role permissions."

  # ---------------------------------------------------------------------------
  # Hardware Temperature Monitoring
  # ---------------------------------------------------------------------------
  - name: hardware-temperature
    interval: 30s
    rules:
      # Thermal zone alerts (Raspberry Pi, ARM devices)
      - alert: HighCPUTemperature
        expr: node_thermal_zone_temp > 70
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU temperature on {{"{{"}} $labels.instance {{"}}"}}"
          description: "Thermal zone {{"{{"}} $labels.zone {{"}}"}} is at {{"{{"}} $value | printf \"%.1f\" {{"}}"}}°C on {{"{{"}} $labels.instance {{"}}"}}."

      - alert: CriticalCPUTemperature
        expr: node_thermal_zone_temp > 80
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical CPU temperature on {{"{{"}} $labels.instance {{"}}"}}"
          description: "Thermal zone {{"{{"}} $labels.zone {{"}}"}} is at {{"{{"}} $value | printf \"%.1f\" {{"}}"}}°C on {{"{{"}} $labels.instance {{"}}"}}. CPU throttling likely occurring."

      # Hwmon alerts (x86 CPUs, Proxmox hosts)
      - alert: HighHwmonTemperature
        expr: node_hwmon_temp_celsius > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High hardware temperature on {{"{{"}} $labels.instance {{"}}"}}"
          description: "Sensor {{"{{"}} $labels.sensor {{"}}"}} ({{"{{"}} $labels.chip {{"}}"}}) is at {{"{{"}} $value | printf \"%.1f\" {{"}}"}}°C on {{"{{"}} $labels.instance {{"}}"}}."

      - alert: CriticalHwmonTemperature
        expr: node_hwmon_temp_celsius > 95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical hardware temperature on {{"{{"}} $labels.instance {{"}}"}}"
          description: "Sensor {{"{{"}} $labels.sensor {{"}}"}} ({{"{{"}} $labels.chip {{"}}"}}) is at {{"{{"}} $value | printf \"%.1f\" {{"}}"}}°C on {{"{{"}} $labels.instance {{"}}"}}. Hardware damage risk."

      # GPU temperature (for rubirosa with RTX A1000)
      - alert: HighGPUTemperature
        expr: node_hwmon_temp_celsius{chip=~".*nvidia.*"} > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High GPU temperature on {{"{{"}} $labels.instance {{"}}"}}"
          description: "GPU is at {{"{{"}} $value | printf \"%.1f\" {{"}}"}}°C on {{"{{"}} $labels.instance {{"}}"}}."

      - alert: CriticalGPUTemperature
        expr: node_hwmon_temp_celsius{chip=~".*nvidia.*"} > 90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical GPU temperature on {{"{{"}} $labels.instance {{"}}"}}"
          description: "GPU is at {{"{{"}} $value | printf \"%.1f\" {{"}}"}}°C on {{"{{"}} $labels.instance {{"}}"}}. GPU throttling or shutdown imminent."

      # Proxmox VE hypervisor temperature alerts
      - alert: ProxmoxHighTemperature
        expr: pve_cpu_temperature_celsius > 75
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU temperature on Proxmox host {{"{{"}} $labels.instance {{"}}"}}"
          description: "Proxmox host {{"{{"}} $labels.instance {{"}}"}} CPU is at {{"{{"}} $value | printf \"%.1f\" {{"}}"}}°C."

      - alert: ProxmoxCriticalTemperature
        expr: pve_cpu_temperature_celsius > 90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical CPU temperature on Proxmox host {{"{{"}} $labels.instance {{"}}"}}"
          description: "Proxmox host {{"{{"}} $labels.instance {{"}}"}} CPU is at {{"{{"}} $value | printf \"%.1f\" {{"}}"}}°C. Hardware damage risk."

      - alert: ProxmoxHostDown
        expr: pve_up{id=~"node/.*"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Proxmox host {{"{{"}} $labels.instance {{"}}"}} is down"
          description: "Cannot connect to Proxmox API on {{"{{"}} $labels.instance {{"}}"}}."

  # ---------------------------------------------------------------------------
  # S3 Orchestrator Health
  # ---------------------------------------------------------------------------
  - name: s3-orchestrator-health
    interval: 30s
    rules:
      - alert: S3OrchestratorDown
        expr: up{job="s3-orchestrator"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "S3 Orchestrator is down"
          description: "S3 Orchestrator is not responding to metrics scrapes."

      - alert: S3OrchestratorHighErrorRate
        expr: sum(rate(s3proxy_requests_total{status_code=~"5.."}[5m])) / sum(rate(s3proxy_requests_total[5m])) * 100 > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "S3 Orchestrator high error rate"
          description: "{{"{{"}} $value | printf \"%.1f\" {{"}}"}}% of S3 Orchestrator requests are returning 5xx errors."

      - alert: S3OrchestratorBackendFailures
        expr: rate(s3proxy_backend_requests_total{status="error"}[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "S3 Orchestrator backend failures"
          description: "Backend {{"{{"}} $labels.backend {{"}}"}} is seeing {{"{{"}} $value | printf \"%.1f\" {{"}}"}} failed {{"{{"}} $labels.operation {{"}}"}} operations/sec."

      - alert: S3OrchestratorQuotaHigh
        expr: s3proxy_quota_bytes_used / s3proxy_quota_bytes_limit * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "S3 Orchestrator quota nearly full"
          description: "Backend {{"{{"}} $labels.backend {{"}}"}} is at {{"{{"}} $value | printf \"%.1f\" {{"}}"}}% quota usage."

      - alert: S3OrchestratorQuotaCritical
        expr: s3proxy_quota_bytes_used / s3proxy_quota_bytes_limit * 100 > 98
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "S3 Orchestrator quota critical"
          description: "Backend {{"{{"}} $labels.backend {{"}}"}} is at {{"{{"}} $value | printf \"%.1f\" {{"}}"}}% quota usage. Uploads will fail when full."

      - alert: S3OrchestratorHighLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(s3proxy_request_duration_seconds_bucket[5m]))) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "S3 Orchestrator high request latency"
          description: "95th percentile request latency is {{"{{"}} $value | printf \"%.1f\" {{"}}"}} seconds."
