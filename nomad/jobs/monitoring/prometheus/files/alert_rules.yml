# Prometheus Alert Rules
# Sourced from Consul KV prefix `prometheus/alerts/`. One key per group;
# managed by infrastructure/terragrunt/global/prometheus-alerts/. Edit a
# YAML file under _env_helpers/prometheus-alerts/groups/, `terragrunt
# apply`, consul-template re-renders this file + SIGHUPs prometheus in
# place (no nomad redeploy).

groups:
{{- range tree "prometheus/alerts" }}
{{ .Value -}}
{{ end }}
