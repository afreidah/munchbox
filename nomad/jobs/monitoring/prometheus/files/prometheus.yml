# Prometheus Configuration
# This configuration defines scrape targets and alert routing

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'munchbox'
    datacenter: 'pi-dc'

# Alert rules file
rule_files:
  - /etc/prometheus/config/alert_rules.yml

# Alerting configuration - send alerts to Alertmanager via Consul service discovery
alerting:
  alertmanagers:
    - scheme: http
      consul_sd_configs:
        - server: 'localhost:8500'
          services: ['alertmanager']
      relabel_configs:
        # Use the service address from Consul
        - source_labels: [__meta_consul_service_address]
          target_label: __address__
          replacement: '${1}:9093'
        # If service address is empty, use node address
        - source_labels: [__meta_consul_service_address]
          regex: ''
          target_label: __address__
          replacement: '${__meta_consul_address}:9093'

# Scrape configuration - what to monitor
scrape_configs:
  # -----------------------------------------------------------------------
  # Self-monitoring - Prometheus scrapes its own metrics
  # -----------------------------------------------------------------------
  - job_name: "prometheus"
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels:
          service: "prometheus"

  # -----------------------------------------------------------------------
  # Nomad servers - Dynamic discovery via Consul
  # -----------------------------------------------------------------------
  - job_name: "nomad"
    metrics_path: "/v1/metrics"
    scheme: "https"
    tls_config:
      insecure_skip_verify: true
    params:
      format: ['prometheus']
    consul_sd_configs:
      - server: "192.168.68.61:8500"
        scheme: "http"
        services: ["nomad"]
        datacenter: "munchbox"
    relabel_configs:
      - source_labels: ["__meta_consul_address"]
        target_label: "__address__"
        replacement: "$1:4646"
      - source_labels: ["__meta_consul_node"]
        target_label: "instance"
      - source_labels: ["__meta_consul_dc"]
        target_label: "consul_dc"
      - target_label: "cluster"
        replacement: "nomad"
      - target_label: "role"
        replacement: "server"

  # -----------------------------------------------------------------------
  # Nomad clients - Dynamic discovery via Consul
  # -----------------------------------------------------------------------
  - job_name: "nomad-client"
    metrics_path: "/v1/metrics"
    scheme: "https"
    tls_config:
      insecure_skip_verify: true
    params:
      format: ['prometheus']
    consul_sd_configs:
      - server: "192.168.68.61:8500"
        scheme: "http"
        services: ["nomad-client"]
        datacenter: "munchbox"
    relabel_configs:
      - source_labels: ["__meta_consul_address"]
        target_label: "__address__"
        replacement: "$1:4646"
      - source_labels: ["__meta_consul_node"]
        target_label: "instance"
      - source_labels: ["__meta_consul_dc"]
        target_label: "consul_dc"
      - target_label: "cluster"
        replacement: "nomad"
      - target_label: "role"
        replacement: "client"

  # -----------------------------------------------------------------------
  # Vault metrics - Dynamic discovery via Consul
  # -----------------------------------------------------------------------
  - job_name: "vault"
    metrics_path: "/v1/sys/metrics"
    params:
      format: ["prometheus"]
    scheme: "https"
    tls_config:
      insecure_skip_verify: true
    bearer_token_file: "/secrets/vault_token"
    consul_sd_configs:
      - server: "192.168.68.61:8500"
        scheme: "http"
        services: ["vault"]
        datacenter: "munchbox"
    relabel_configs:
      - source_labels: ["__meta_consul_address"]
        target_label: "__address__"
        replacement: "$1:8200"
      - source_labels: ["__meta_consul_node"]
        target_label: "instance"
      - source_labels: ["__meta_consul_dc"]
        target_label: "consul_dc"
      - target_label: "cluster"
        replacement: "vault"

  # -----------------------------------------------------------------------
  # Node Exporter - Dynamic discovery via Consul
  # -----------------------------------------------------------------------
  - job_name: "node-exporter"
    scrape_interval: 15s
    metrics_path: "/metrics"
    consul_sd_configs:
      - server: "192.168.68.61:8500"
        scheme: "http"
        services: ["node-exporter"]
        datacenter: "munchbox"
    relabel_configs:
      # First, set address from node address (fallback)
      - source_labels: ["__meta_consul_address", "__meta_consul_service_port"]
        separator: ":"
        target_label: "__address__"
      # Override with service address if it exists (non-empty)
      - source_labels: ["__meta_consul_service_address", "__meta_consul_service_port"]
        separator: ":"
        regex: "([^:]+):(.*)"
        replacement: "$1:$2"
        target_label: "__address__"
      - source_labels: ["__meta_consul_node"]
        target_label: "instance"
      - source_labels: ["__meta_consul_dc"]
        target_label: "consul_dc"

  # -----------------------------------------------------------------------
  # Cloudflared Tunnel metrics - Consul service discovery
  # -----------------------------------------------------------------------
  - job_name: "cloudflared-tunnel"
    scheme: "http"
    metrics_path: "/metrics"
    consul_sd_configs:
      - server: "192.168.68.61:8500"
        scheme: "http"
        services: ["cloudflared-tunnel"]
        datacenter: "munchbox"
    relabel_configs:
      - source_labels: ["__meta_consul_service_address"]
        regex: "(.+)"
        target_label: "__address__"
        replacement: "$1:2000"
      - source_labels: ["__meta_consul_service_address"]
        regex: ""
        target_label: "__address__"
        replacement: "${__meta_consul_address}:2000"
      - source_labels: ["__meta_consul_service"]
        target_label: "service"
      - source_labels: ["__meta_consul_node"]
        target_label: "instance"

  # -----------------------------------------------------------------------
  # Consul cluster metrics
  # -----------------------------------------------------------------------
  - job_name: "consul"
    metrics_path: "/v1/agent/metrics"
    params:
      format: ["prometheus"]
    scheme: "http"
    authorization:
      credentials_file: "/secrets/consul_token"
    consul_sd_configs:
      - server: "192.168.68.61:8500"
        scheme: "http"
        services: ["consul"]
        datacenter: "munchbox"
    relabel_configs:
      - source_labels: ["__meta_consul_address"]
        target_label: "__address__"
        replacement: "$1:8500"
      - source_labels: ["__meta_consul_node"]
        target_label: "instance"
      - source_labels: ["__meta_consul_dc"]
        target_label: "consul_dc"
      - target_label: "cluster"
        replacement: "consul"

  # -----------------------------------------------------------------------
  # Traefik metrics - Consul service discovery
  # -----------------------------------------------------------------------
  - job_name: "traefik"
    scheme: "http"
    consul_sd_configs:
      - server: "192.168.68.61:8500"
        scheme: "http"
        services: ["traefik"]
        datacenter: "munchbox"
    relabel_configs:
      - source_labels: ["__meta_consul_service_address"]
        regex: "(.+)"
        target_label: "__address__"
        replacement: "$1:8081"
      - source_labels: ["__meta_consul_service"]
        target_label: "service"
      - source_labels: ["__meta_consul_node"]
        target_label: "instance"

  # -----------------------------------------------------------------------
  # Blackbox Exporter - Consul service discovery
  # -----------------------------------------------------------------------
  - job_name: "blackbox"
    metrics_path: "/metrics"
    consul_sd_configs:
      - server: "192.168.68.61:8500"
        scheme: "http"
        services: ["blackbox-exporter"]
        datacenter: "munchbox"
    relabel_configs:
      - source_labels: ["__meta_consul_service"]
        target_label: "job"
      - source_labels: ["__meta_consul_node"]
        target_label: "instance"

  # -----------------------------------------------------------------------
  # Site monitoring via Blackbox Exporter
  # -----------------------------------------------------------------------
  - job_name: "site_https"
    metrics_path: "/probe"
    params:
      module: ["https_2xx"]
    static_configs:
      - targets:
          - "https://resume.alexfreidah.com/"
    relabel_configs:
      - source_labels: ["__address__"]
        target_label: "__param_target"
      - source_labels: ["__param_target"]
        target_label: "instance"
      - target_label: "__address__"
        replacement: "blackbox-exporter.service.consul:9115"
