# Prometheus Configuration
# This configuration defines scrape targets and alert routing

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'munchbox'
    datacenter: 'pi-dc'

# Alert rules file
rule_files:
  - /etc/prometheus/config/alert_rules.yml

# Alerting configuration - send alerts to Alertmanager
alerting:
  alertmanagers:
    - scheme: http
      static_configs:
        - targets: ["localhost:9093"]

# Scrape configuration - what to monitor
scrape_configs:
  # -----------------------------------------------------------------------
  # Self-monitoring - Prometheus scrapes its own metrics
  # -----------------------------------------------------------------------
  - job_name: "prometheus"
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels:
          service: "prometheus"

  # -----------------------------------------------------------------------
  # Nomad cluster metrics - HTTPS endpoints
  # -----------------------------------------------------------------------
  - job_name: "nomad"
    metrics_path: "/v1/metrics"
    params:
      format: ["prometheus"]
    scheme: "https"
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets:
          - "192.168.68.61:4646"  # stabler
          - "192.168.68.60:4646"  # goren
          - "192.168.68.69:4646"  # nomad-server-03
        labels:
          cluster: "nomad"
          role: "server"

  # -----------------------------------------------------------------------
  # Vault metrics - requires bearer token
  # -----------------------------------------------------------------------
  - job_name: "vault"
    metrics_path: "/v1/sys/metrics"
    params:
      format: ["prometheus"]
    scheme: "https"
    bearer_token_file: "/secrets/vault_token"
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ["192.168.68.63:8200"]  # mccoy
        labels:
          cluster: "vault"
          service: "vault"

  # -----------------------------------------------------------------------
  # Node Exporter - Dynamic discovery via Consul
  # -----------------------------------------------------------------------
  - job_name: "node-exporter"
    scrape_interval: 15s
    metrics_path: "/metrics"
    consul_sd_configs:
      - server: "192.168.68.61:8500"
        scheme: "http"
        services: ["prometheus-node-exporter"]
        datacenter: "munchbox"
    relabel_configs:
      - source_labels: ["__meta_consul_node"]
        target_label: "instance"
      - source_labels: ["__meta_consul_dc"]
        target_label: "consul_dc"

  # -----------------------------------------------------------------------
  # Consul cluster metrics
  # -----------------------------------------------------------------------
  - job_name: "consul"
    metrics_path: "/v1/agent/metrics"
    params:
      format: ["prometheus"]
    scheme: "http"
    authorization:
      credentials_file: "/secrets/consul_token"
    consul_sd_configs:
      - server: "192.168.68.61:8500"
        scheme: "http"
        services: ["consul"]
        datacenter: "munchbox"
    relabel_configs:
      - source_labels: ["__meta_consul_address"]
        target_label: "__address__"
        replacement: "$1:8500"
      - source_labels: ["__meta_consul_node"]
        target_label: "instance"
      - source_labels: ["__meta_consul_dc"]
        target_label: "consul_dc"
      - target_label: "cluster"
        replacement: "consul"

  # -----------------------------------------------------------------------
  # Traefik metrics - Consul service discovery
  # -----------------------------------------------------------------------
  - job_name: "traefik"
    scheme: "http"
    consul_sd_configs:
      - server: "192.168.68.61:8500"
        scheme: "http"
        services: ["traefik"]
        datacenter: "munchbox"
    relabel_configs:
      - source_labels: ["__meta_consul_service_address"]
        regex: "(.+)"
        target_label: "__address__"
        replacement: "$1:8081"
      - source_labels: ["__meta_consul_service"]
        target_label: "service"
      - source_labels: ["__meta_consul_node"]
        target_label: "instance"

  # -----------------------------------------------------------------------
  # Blackbox Exporter - Consul service discovery
  # -----------------------------------------------------------------------
  - job_name: "blackbox"
    metrics_path: "/metrics"
    consul_sd_configs:
      - server: "192.168.68.61:8500"
        scheme: "http"
        services: ["blackbox-exporter"]
        datacenter: "munchbox"
    relabel_configs:
      - source_labels: ["__meta_consul_service"]
        target_label: "job"
      - source_labels: ["__meta_consul_node"]
        target_label: "instance"

  # -----------------------------------------------------------------------
  # Site monitoring via Blackbox Exporter
  # -----------------------------------------------------------------------
  - job_name: "site_https"
    metrics_path: "/probe"
    params:
      module: ["https_2xx"]
    static_configs:
      - targets:
          - "https://resume.alexfreidah.com/"
    relabel_configs:
      - source_labels: ["__address__"]
        target_label: "__param_target"
      - source_labels: ["__param_target"]
        target_label: "instance"
      - target_label: "__address__"
        replacement: "blackbox-exporter.service.consul:9115"
