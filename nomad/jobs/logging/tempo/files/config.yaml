# Tempo Configuration
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  grpc_listen_port: 9196  # Avoid conflict with promtail on 9095
  log_level: info

# Distributor receives traces from clients
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    zipkin:
      endpoint: 0.0.0.0:9411
    jaeger:
      protocols:
        thrift_http:
          endpoint: 0.0.0.0:14268
        grpc:
          endpoint: 0.0.0.0:14250

# Ingester writes traces to storage
ingester:
  max_block_duration: 5m

# Compactor manages trace data lifecycle
compactor:
  compaction:
    block_retention: 72h  # 3 day retention

# Storage configuration (local filesystem)
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Metrics generator for RED metrics from traces
metrics_generator:
  registry:
    external_labels:
      source: tempo
    collection_interval: 15s
  processor:
    local_blocks:
      max_live_traces: 100000
      flush_check_period: 10s
      complete_block_timeout: 30s
    service_graphs:
      dimensions: [http.method, http.status_code]
      enable_client_server_prefix: true
      peer_attributes: [db.name, net.peer.name]
    span_metrics:
      dimensions: [http.method, http.status_code, http.route]
      enable_target_info: true
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus.service.consul:9090/api/v1/write
        send_exemplars: true

# Query configuration
querier:
  max_concurrent_queries: 10

# Overrides for multi-tenant limits
overrides:
  defaults:
    metrics_generator:
      processors: [local-blocks, service-graphs, span-metrics]
