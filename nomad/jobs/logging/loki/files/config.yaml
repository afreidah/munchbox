# Loki Configuration
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# Query limits
query_scheduler:
  max_outstanding_requests_per_tenant: 2048

querier:
  max_concurrent: 4

# Schema configuration (TSDB)
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Ingestion tuning
ingester:
  chunk_idle_period: 3m
  max_chunk_age: 1h

# Storage configuration
storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
  filesystem:
    directory: /loki/chunks

# Compactor (for retention)
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

# Limits - 5 day retention
limits_config:
  volume_enabled: true
  retention_period: 120h
  max_query_lookback: 120h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  per_stream_rate_limit: 5MB
  per_stream_rate_limit_burst: 15MB
  max_streams_per_user: 10000

# Cleanup (legacy table manager for some scans)
table_manager:
  retention_deletes_enabled: true
  retention_period: 120h

# Ruler configuration for log-based alerting
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://alertmanager.service.consul:9093
  ring:
    kvstore:
      store: inmemory
  enable_api: true
  enable_alertmanager_v2: true

# Telemetry
analytics:
  reporting_enabled: false

# Tracing disabled - Loki 3.6.x has OTEL SDK schema version conflict bug
# Re-enable when fixed upstream (https://github.com/grafana/loki/issues/14269)
tracing:
  enabled: false
