# ============================================================================
# Docker Build & Security Workflow (Two-Stage)
# ============================================================================
# Stage A (PRs):
#   - checkov -> trivy -> build -> trivy-image
#
# Stage B (merge to main i.e., push to main):
#   - checkov -> trivy -> build -> trivy-build -> push
#
# Runs entirely inside your prebuilt tooling image from docker-mirror.service.consul
# and talks to the host Docker daemon via /var/run/docker.sock.
# ============================================================================

name: Docker Security

on:
  # Only run on pushes to main (prevents duplicates with PR runs)
  push:
    branches: [ main ]
    paths:
      - 'docker/**'
      - '.github/workflows/docker-ci.yml'

  # Run on PRs targeting main (edits to docker/** or the workflow file)
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    branches: [ main ]
    paths:
      - 'docker/**'
      - '.github/workflows/docker-ci.yml'

  workflow_dispatch:

# Cancel in-progress runs when a new run is triggered on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Stage A: PR checks (scan + build + image scan)
  # --------------------------------------------------------------------------
  pr-and-branch-checks:
    name: PR — Checkov • Trivy • Build • Trivy-Image
    runs-on: self-hosted
    timeout-minutes: 45
    if: github.event_name == 'pull_request'

    container:
      image: docker-mirror.service.consul/ops-build-image
      # Registry auth (commented out for now; enable when credentials exist)
      # credentials:
      #   username: ${{ secrets.DOCKER_MIRROR_USERNAME }}
      #   password: ${{ secrets.DOCKER_MIRROR_PASSWORD }}
      options: --privileged -v /var/run/docker.sock:/var/run/docker.sock

    defaults:
      run:
        working-directory: docker

    env:
      DOCKER_BUILDKIT: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print tool versions
        run: |
          docker --version || true
          checkov --version || true
          trivy --version || true
          make --version || true

      - name: Run Checkov on Dockerfiles
        run: make checkov
        continue-on-error: true

      - name: Run Trivy config scan on Dockerfiles
        run: make trivy
        continue-on-error: true

      - name: Build Docker images
        run: make build

      - name: Scan built Docker images with Trivy (fail on CRITICAL)
        run: make trivy-image
        continue-on-error: false

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-scan-results-${{ github.run_id }}-stageA
          path: |
            docker/**/*checkov*.txt
            docker/**/*checkov*.json
            docker/**/*trivy*.txt
            docker/**/*trivy*.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Clean up Docker resources
        if: always()
        run: docker system prune -f --volumes || true

  # --------------------------------------------------------------------------
  # Stage B: Main branch release (scan + build + trivy-build + push)
  # --------------------------------------------------------------------------
  release-main:
    name: Main — Checkov • Trivy • Build • Trivy-Build • Push
    runs-on: self-hosted
    timeout-minutes: 60
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    container:
      image: docker-mirror.service.consul/ops-build-image
      # Registry auth for tooling image (commented out for now)
      # credentials:
      #   username: ${{ secrets.DOCKER_MIRROR_USERNAME }}
      #   password: ${{ secrets.DOCKER_MIRROR_PASSWORD }}
      options: --privileged -v /var/run/docker.sock:/var/run/docker.sock

    defaults:
      run:
        working-directory: docker

    env:
      DOCKER_BUILDKIT: "1"
      IMAGE_TAG: ${{ github.sha }}
      # DOCKER_REGISTRY: registry.internal.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print tool versions
        run: |
          docker --version || true
          checkov --version || true
          trivy --version || true
          make --version || true

      - name: Run Checkov on Dockerfiles
        run: make checkov
        continue-on-error: true

      - name: Run Trivy config scan on Dockerfiles
        run: make trivy
        continue-on-error: true

      - name: Build Docker images
        run: make build

      - name: Run Trivy build-time scan
        run: make trivy-build

      # Docker login for publish registry (commented out for now)
      # - name: Docker login (publish registry)
      #   if: env.DOCKER_REGISTRY != ''
      #   run: |
      #     echo "${{ secrets.PUBLISH_REGISTRY_PASSWORD }}" | \
      #       docker login "${{ env.DOCKER_REGISTRY }}" \
      #         --username "${{ secrets.PUBLISH_REGISTRY_USERNAME }}" \
      #         --password-stdin

      - name: Push Docker images
        run: make push

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-scan-results-${{ github.run_id }}-stageB
          path: |
            docker/**/*checkov*.txt
            docker/**/*checkov*.json
            docker/**/*trivy*.txt
            docker/**/*trivy*.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Clean up Docker resources
        if: always()
        run: docker system prune -f --volumes || true

