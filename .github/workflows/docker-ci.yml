# ============================================================================
# Docker Build & Security Workflow (Two-Stage, multi-arch-safe)
# ============================================================================
# PR / non-main pushes:
#   checkov -> trivy -> build -> trivy-image
# Main (merge/push to main):
#   checkov -> trivy -> build -> trivy-image -> tag -> push
#
# Uses multi-arch image: docker-mirror.service.consul:5000/ops-build-image:latest
# The host runner’s Docker will pull the correct platform image automatically.
# ============================================================================

name: Docker Security

on:
  push:
    branches:
      - '**'
    paths:
      - 'docker/**'
      - '.github/workflows/docker-ci.yml'
  pull_request:
    paths:
      - 'docker/**'
      - '.github/workflows/docker-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Stage A: PR / Non-main push
  # --------------------------------------------------------------------------
  pr-and-branch-checks:
    name: PR/Branch — Checkov • Trivy • Build • Trivy-Image
    runs-on: self-hosted
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
    timeout-minutes: 45

    container:
      image: docker-mirror.service.consul:5000/ops-build-image:latest
      # credentials (uncomment when you add creds):
      # credentials:
      #   username: ${{ secrets.DOCKER_MIRROR_USERNAME }}
      #   password: ${{ secrets.DOCKER_MIRROR_PASSWORD }}
      options: --privileged -v /var/run/docker.sock:/var/run/docker.sock

    defaults:
      run:
        working-directory: docker

    env:
      DOCKER_BUILDKIT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tool versions
        run: |
          docker --version || true
          checkov --version || true
          trivy --version || true
          make --version || true

      - name: Checkov (Dockerfiles)
        run: make checkov
        continue-on-error: true

      - name: Trivy config (Dockerfiles)
        run: make trivy
        continue-on-error: true

      - name: Build images
        run: make build

      - name: Trivy image scan (fail on CRITICAL)
        run: make trivy-image

      #- name: Upload scan results
      #  if: always()
      #  uses: actions/upload-artifact@v4
      #  with:
      #    name: docker-scan-results-${{ github.run_id }}-stageA
      #    path: |
      #      docker/**/*checkov*.txt
      #      docker/**/*checkov*.json
      #      docker/**/*trivy*.txt
      #      docker/**/*trivy*.json
      #    retention-days: 30
      #    if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: docker system prune -f --volumes || true

  # --------------------------------------------------------------------------
  # Stage B: Main branch
  # --------------------------------------------------------------------------
  release-main:
    name: Main — Checkov • Trivy • Build • Trivy-Image • Tag • Push
    runs-on: self-hosted
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 60

    container:
      image: docker-mirror.service.consul:5000/ops-build-image:latest
      # credentials:
      #   username: ${{ secrets.DOCKER_MIRROR_USERNAME }}
      #   password: ${{ secrets.DOCKER_MIRROR_PASSWORD }}
      options: --privileged -v /var/run/docker.sock:/var/run/docker.sock

    defaults:
      run:
        working-directory: docker

    env:
      DOCKER_BUILDKIT: "1"
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tool versions
        run: |
          docker --version || true
          checkov --version || true
          trivy --version || true
          make --version || true

      - name: Checkov (Dockerfiles)
        run: make checkov
        continue-on-error: true

      - name: Trivy config (Dockerfiles)
        run: make trivy
        continue-on-error: true

      - name: Build images
        run: make build

      - name: Trivy image scan (fail on CRITICAL)
        run: make trivy-image

      - name: Tag images
        run: make tag TAG=${{ env.IMAGE_TAG }}

      # Optional: login to publish registry
      # - name: Docker login (publish)
      #   run: |
      #     echo "${{ secrets.PUBLISH_REGISTRY_PASSWORD }}" | \
      #       docker login "docker-mirror.service.consul:5000" \
      #         --username "${{ secrets.PUBLISH_REGISTRY_USERNAME }}" \
      #         --password-stdin

      - name: Push images
        run: make push TAG=${{ env.IMAGE_TAG }}

      #- name: Upload scan results
      #  if: always()
      #  uses: actions/upload-artifact@v4
      #  with:
      #    name: docker-scan-results-${{ github.run_id }}-stageB
      #    path: |
      #      docker/**/*checkov*.txt
      #      docker/**/*checkov*.json
      #      docker/**/*trivy*.txt
      #      docker/**/*trivy*.json
      #    retention-days: 30
      #    if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: docker system prune -f --volumes || true

