name: Docker Security

on:
  push:
    branches: [ main ]
    paths:
      - 'docker/**'
      - '.github/workflows/docker-ci.yml'
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths:
      - 'docker/**'
      - '.github/workflows/docker-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-checks:
    name: PR — Checkov • Trivy • Build • Trivy-Image
    runs-on: self-hosted
    timeout-minutes: 45
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: docker
    env:
      DOCKER_BUILDKIT: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Try mirror (with and without library/), else fall back to local image
      - name: Resolve ops-build-image
        id: img
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            "docker-mirror.service.consul:5000/ops-build-image:latest"
            "docker-mirror.service.consul:5000/library/ops-build-image:latest"
            "ops-build-image:latest"  # preloaded locally
          )
          picked=""
          for img in "${candidates[@]}"; do
            if docker image inspect "$img" >/dev/null 2>&1; then
              picked="$img"; break
            fi
            if docker pull "$img" >/dev/null 2>&1; then
              picked="$img"; break
            fi
          done
          if [[ -z "$picked" ]]; then
            echo "ERROR: Could not pull ops-build-image from mirror (tried ${candidates[*]}), and not found locally." >&2
            echo "Hint: tag & push it: docker tag ops-build-image:latest docker-mirror.service.consul:5000/ops-build-image:latest && docker push docker-mirror.service.consul:5000/ops-build-image:latest" >&2
            exit 1
          fi
          echo "image=$picked" >> "$GITHUB_OUTPUT"

      - name: Print tool versions
        run: |
          docker run --rm "${{ steps.img.outputs.image }}" bash -lc 'docker --version || true; checkov --version || true; trivy --version || true; make --version || true'

      - name: Run Checkov on Dockerfiles
        run: |
          docker run --rm --privileged \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" -w /work \
            "${{ steps.img.outputs.image }}" \
            bash -lc 'make checkov'
        continue-on-error: true

      - name: Run Trivy config scan on Dockerfiles
        run: |
          docker run --rm --privileged \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" -w /work \
            "${{ steps.img.outputs.image }}" \
            bash -lc 'make trivy'
        continue-on-error: true

      - name: Build Docker images
        run: |
          docker run --rm --privileged \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" -w /work \
            "${{ steps.img.outputs.image }}" \
            bash -lc 'make build'

      - name: Scan built Docker images with Trivy
        run: |
          docker run --rm --privileged \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" -w /work \
            "${{ steps.img.outputs.image }}" \
            bash -lc 'make trivy-image'

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-scan-results-${{ github.run_id }}-stageA
          path: |
            docker/**/*checkov*.txt
            docker/**/*checkov*.json
            docker/**/*trivy*.txt
            docker/**/*trivy*.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Clean up Docker resources
        if: always()
        run: docker system prune -f --volumes || true

  release-main:
    name: Main — Checkov • Trivy • Build • Trivy-Build • Push
    runs-on: self-hosted
    timeout-minutes: 60
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: docker
    env:
      DOCKER_BUILDKIT: "1"
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve ops-build-image
        id: img
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            "docker-mirror.service.consul:5000/ops-build-image:latest"
            "docker-mirror.service.consul:5000/library/ops-build-image:latest"
            "ops-build-image:latest"
          )
          picked=""
          for img in "${candidates[@]}"; do
            if docker image inspect "$img" >/dev/null 2>&1; then
              picked="$img"; break
            fi
            if docker pull "$img" >/dev/null 2>&1; then
              picked="$img"; break
            fi
          done
          if [[ -z "$picked" ]]; then
            echo "ERROR: Could not pull ops-build-image. Push it to the mirror or preload locally." >&2
            exit 1
          fi
          echo "image=$picked" >> "$GITHUB_OUTPUT"

      - name: Print tool versions
        run: |
          docker run --rm "${{ steps.img.outputs.image }}" bash -lc 'docker --version || true; checkov --version || true; trivy --version || true; make --version || true'

      - name: Run Checkov on Dockerfiles
        run: |
          docker run --rm --privileged -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" -w /work "${{ steps.img.outputs.image }}" bash -lc 'make checkov'
        continue-on-error: true

      - name: Run Trivy config scan on Dockerfiles
        run: |
          docker run --rm --privileged -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" -w /work "${{ steps.img.outputs.image }}" bash -lc 'make trivy'
        continue-on-error: true

      - name: Build Docker images
        run: |
          docker run --rm --privileged -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" -w /work "${{ steps.img.outputs.image }}" bash -lc 'make build'

      - name: Run Trivy build-time scan
        run: |
          docker run --rm --privileged -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" -w /work "${{ steps.img.outputs.image }}" bash -lc 'make trivy-build'

      - name: Push Docker images
        run: |
          docker run --rm --privileged -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" -w /work "${{ steps.img.outputs.image }}" bash -lc 'make push'

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-scan-results-${{ github.run_id }}-stageB
          path: |
            docker/**/*checkov*.txt
            docker/**/*checkov*.json
            docker/**/*trivy*.txt
            docker/**/*trivy*.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Clean up Docker resources
        if: always()
        run: docker system prune -f --volumes || true

