# ============================================================================
# Docker Build & Security Workflow (Two-Tier, Private Mirror)
# ============================================================================
# Purpose:
#   - Simple, explicit CI split:
#       * PRs:       checkov -> trivy -> build(:latest) -> trivy-image
#       * Merge(main): same as PR, then tag(:$GITHUB_SHA) -> push(:$GITHUB_SHA)
#
# Container/tooling:
#   - Runs inside your prebuilt tooling image:
#       docker-mirror.service.consul:5000/ops-build-image:latest
#   - Talks to host Docker via /var/run/docker.sock.
#
# Registry notes:
#   - Your mirror is HTTP on :5000. Ensure each runner host’s Docker daemon trusts it:
#       /etc/docker/daemon.json -> { "insecure-registries": ["docker-mirror.service.consul:5000"] }
#       sudo systemctl restart docker
#   - Image must exist in the mirror with the exact name/tag referenced above.
#
# Dupes:
#   - push triggers only on main; pull_request targets main. This avoids duplicate runs.
# ============================================================================

name: Docker Security

on:
  # Validate PRs that target main (no image push)
  pull_request:
    branches: [ main ]
    paths:
      - 'docker/**'
      - '.github/workflows/docker-ci.yml'

  # Release path: after merge to main (does tagging + push)
  push:
    branches: [ main ]
    paths:
      - 'docker/**'
      - '.github/workflows/docker-ci.yml'

  # Manual trigger if needed
  workflow_dispatch:

# Cancel in-progress runs when a new run is triggered on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # PR path: checkov • trivy • build(:latest) • trivy-image
  # --------------------------------------------------------------------------
  pr-checks:
    name: PR — Checkov • Trivy • Build • Trivy-Image
    runs-on: self-hosted
    if: github.event_name == 'pull_request'
    timeout-minutes: 45

    # Run steps inside your tooling image from the private mirror
    container:
      image: docker-mirror.service.consul:5000/ops-build-image:latest
      # --------------------------------------------------------------------
      # If your mirror requires auth, uncomment and set these secrets:
      # credentials:
      #   username: ${{ secrets.DOCKER_MIRROR_USERNAME }}
      #   password: ${{ secrets.DOCKER_MIRROR_PASSWORD }}
      # --------------------------------------------------------------------
      options: --privileged -v /var/run/docker.sock:/var/run/docker.sock

    # All shell steps execute from the docker/ directory
    defaults:
      run:
        working-directory: docker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Single target runs the whole PR pipeline (no push)
      - name: Run PR pipeline
        run: make pull_request

  # --------------------------------------------------------------------------
  # Merge path (main): PR steps + tag(:$GITHUB_SHA) + push(:$GITHUB_SHA)
  # --------------------------------------------------------------------------
  release-main:
    name: Merge — Checkov • Trivy • Build • Trivy-Image • Tag • Push
    runs-on: self-hosted
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 60

    container:
      image: docker-mirror.service.consul:5000/ops-build-image:latest
      # --------------------------------------------------------------------
      # If your mirror requires auth, uncomment and set these secrets:
      # credentials:
      #   username: ${{ secrets.DOCKER_MIRROR_USERNAME }}
      #   password: ${{ secrets.DOCKER_MIRROR_PASSWORD }}
      # --------------------------------------------------------------------
      options: --privileged -v /var/run/docker.sock:/var/run/docker.sock

    defaults:
      run:
        working-directory: docker

    # Pass the release tag (commit SHA) to Makefile's TAG variable
    env:
      TAG: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Single target runs PR pipeline + tag + push
      - name: Run merge pipeline
        run: make merge

      # Optional: upload scan artifacts if your Makefile writes them under docker/**
      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-scan-results-${{ github.run_id }}
          path: |
            docker/**/*checkov*.txt
            docker/**/*checkov*.json
            docker/**/*trivy*.txt
            docker/**/*trivy*.json
          retention-days: 30
          if-no-files-found: ignore
