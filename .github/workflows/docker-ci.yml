# ═══════════════════════════════════════════════════════════════════════════
# Waypoint Docker Build Pipeline
# ═══════════════════════════════════════════════════════════════════════════
# Purpose:
#   Automated CI/CD pipeline for building and pushing Docker images using
#   Waypoint. Runs on self-hosted runners to access private container registry.
#
# Features:
#   • Multi-app Docker image builds via Waypoint
#   • Automatic builds on PR and main branch push
#   • Manual workflow dispatch for individual app builds
#   • Self-hosted runner execution for private registry access
#   • Registry connectivity validation
#   • Waypoint server health checks
#   • PR status comments
#   • Comprehensive logging and error handling
#
# Requirements:
#   • Self-hosted runner with Docker and Waypoint CLI installed
#   • Runner labeled with 'nomad' tag
#   • Waypoint server running in Nomad cluster
#   • Private Docker registry accessible from runner
#   • GitHub secrets configured: WAYPOINT_SERVER_ADDR, WAYPOINT_SERVER_TOKEN
#
# Triggers:
#   • Pull requests with changes to docker/ directory
#   • Pushes to main branch with changes to docker/ directory
#   • Manual workflow dispatch with optional app selection
#   • Workflow file changes (for debugging)
#
# ═══════════════════════════════════════════════════════════════════════════

name: Waypoint Docker Build

# ─────────────────────────────────────────────────────────────────────────
# TRIGGERS
# ─────────────────────────────────────────────────────────────────────────
# Define when this workflow should execute

on:
  # Trigger on pull requests that modify docker/ directory
  pull_request:
    paths:
      - 'docker/**'
      - '.github/workflows/waypoint-docker-build.yml'
    # Optional: exclude certain paths
    # paths-ignore:
    #   - 'docker/README.md'
    #   - 'docker/.gitkeep'

  # Trigger on pushes to main with docker/ changes
  push:
    branches:
      - main
    paths:
      - 'docker/**'
      - '.github/workflows/waypoint-docker-build.yml'

  # Allow manual trigger via GitHub UI
  # Go to Actions → Waypoint Docker Build → Run workflow
  workflow_dispatch:
    inputs:
      # Optional: build specific app instead of all
      app:
        description: 'Specific app to build (leave blank for all apps)'
        required: false
        default: ''
        type: string

      # Optional: enable debug logging
      debug:
        description: 'Enable debug logging'
        required: false
        default: false
        type: boolean

# ─────────────────────────────────────────────────────────────────────────
# ENVIRONMENT VARIABLES
# ─────────────────────────────────────────────────────────────────────────
# Global variables available to all jobs and steps
# These configure Waypoint CLI to connect to your server

env:
  # Waypoint server address (hostname:port)
  # Resolved via Consul DNS from within Nomad cluster
  WAYPOINT_SERVER_ADDR: ${{ secrets.WAYPOINT_SERVER_ADDR }}

  # Authentication token for Waypoint server
  # Generate via: waypoint user token -auth-method=github
  WAYPOINT_SERVER_TOKEN: ${{ secrets.WAYPOINT_SERVER_TOKEN }}

  # Enable TLS for secure communication with server
  WAYPOINT_SERVER_TLS: '1'

  # Skip TLS verification (set to '0' if using valid certificates)
  # In homelab: acceptable; in production: use valid certs and set to '0'
  WAYPOINT_SERVER_TLS_SKIP_VERIFY: '1'

  # Optional: enable Waypoint debug output
  # WAYPOINT_LOG_LEVEL: debug

# ─────────────────────────────────────────────────────────────────────────
# JOBS
# ─────────────────────────────────────────────────────────────────────────

jobs:
  # ═════════════════════════════════════════════════════════════════════
  # Job: waypoint-build
  # Purpose: Build and push Docker images via Waypoint to private registry
  # ═════════════════════════════════════════════════════════════════════
  waypoint-build:
    name: Build and Push Docker Images
    
    # RUNNER CONFIGURATION
    # Must run on self-hosted runner to access private registry
    # - self-hosted: indicates self-hosted runner
    # - nomad: custom label matching your runner registration
    # The runner must have Docker, Waypoint CLI, and netcat installed
    runs-on: [self-hosted, nomad]
    
    # Timeout prevents jobs from running indefinitely
    # Adjust based on your image sizes and build times
    # (typical: 15-30 mins for multi-arch builds)
    timeout-minutes: 30

    # Optional: run job only if certain conditions are met
    # if: github.repository_owner == 'your-github-username'

    # ───────────────────────────────────────────────────────────────────
    # STEPS
    # ───────────────────────────────────────────────────────────────────

    steps:
      # ╔═══════════════════════════════════════════════════════════════╗
      # ║ Step 1: Checkout Repository
      # ╠═══════════════════════════════════════════════════════════════╣
      # Clone the repository to the runner so we have access to:
      #   - docker/waypoint.hcl (Waypoint config)
      #   - Dockerfile(s)
      #   - Any build scripts
      # ╚═══════════════════════════════════════════════════════════════╝
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch full history for version detection (optional)
          fetch-depth: 0

      # ╔═══════════════════════════════════════════════════════════════╗
      # ║ Step 2: Set up Waypoint & Verify Server Connectivity
      # ╠═══════════════════════════════════════════════════════════════╣
      # Check that:
      #   1. Waypoint CLI is installed and in PATH
      #   2. Waypoint server is reachable
      #   3. Authentication token is valid
      #
      # Fails early if server is unreachable, preventing wasted time
      # ╚═══════════════════════════════════════════════════════════════╝
      - name: Set up Waypoint
        run: |
          set -e
          
          echo "════════════════════════════════════════════════════════"
          echo "  Waypoint Initialization"
          echo "════════════════════════════════════════════════════════"
          
          # Check Waypoint version
          echo "📦 Checking Waypoint installation..."
          waypoint version
          
          echo ""
          echo "🔌 Testing Waypoint server connectivity..."
          echo "   Server: ${WAYPOINT_SERVER_ADDR}"
          
          # Test connection to server
          # If this fails, all subsequent steps will fail anyway
          if waypoint server config-get &>/dev/null; then
            echo "   ✅ Connected to Waypoint server successfully"
          else
            echo "   ❌ Failed to connect to Waypoint server"
            echo "   Troubleshooting:"
            echo "   - Check WAYPOINT_SERVER_ADDR is correct"
            echo "   - Check WAYPOINT_SERVER_TOKEN is valid"
            echo "   - Check runner can reach server (DNS/network)"
            echo "   - Check server TLS/firewall settings"
            exit 1
          fi

      # ╔═══════════════════════════════════════════════════════════════╗
      # ║ Step 3: Verify Private Registry Accessibility
      # ╠═══════════════════════════════════════════════════════════════╣
      # Ensure Docker registry is reachable from the runner before
      # attempting builds. This prevents failures mid-build.
      #
      # Uses netcat (nc) to test TCP connectivity to registry.
      # Your registry should be at: docker-mirror.service.consul:5000
      # ╚═══════════════════════════════════════════════════════════════╝
      - name: Verify Registry Accessibility
        run: |
          set -e
          
          echo ""
          echo "════════════════════════════════════════════════════════"
          echo "  Registry Connectivity Check"
          echo "════════════════════════════════════════════════════════"
          
          # Registry connection details
          REGISTRY_HOST="docker-mirror.service.consul"
          REGISTRY_PORT="5000"
          REGISTRY_TIMEOUT="5"
          
          echo "🔍 Testing registry accessibility..."
          echo "   Host: ${REGISTRY_HOST}"
          echo "   Port: ${REGISTRY_PORT}"
          echo "   Timeout: ${REGISTRY_TIMEOUT}s"
          
          # Use netcat to verify TCP connectivity
          # -z: just check if port is open (don't send data)
          # -v: verbose output
          # -w: timeout in seconds
          if timeout "${REGISTRY_TIMEOUT}" nc -zv \
            "${REGISTRY_HOST}" "${REGISTRY_PORT}" 2>&1; then
            echo "   ✅ Registry is accessible"
          else
            echo "   ❌ Failed to reach registry"
            echo "   Troubleshooting:"
            echo "   - Verify registry service is running: nomad service"
            echo "   - Check Consul DNS resolution: nslookup ${REGISTRY_HOST}"
            echo "   - Verify firewall rules allow port ${REGISTRY_PORT}"
            echo "   - Check Docker daemon on registry host"
            exit 1
          fi

      # ╔═══════════════════════════════════════════════════════════════╗
      # ║ Step 4: Build All Images (if no specific app requested)
      # ╠═══════════════════════════════════════════════════════════════╣
      # Runs Waypoint build for all applications defined in
      # docker/waypoint.hcl. This builds and pushes to private registry.
      #
      # Condition: only runs if workflow_dispatch didn't specify an app
      # ╚═══════════════════════════════════════════════════════════════╝
      - name: Build All Images
        if: ${{ github.event.inputs.app == '' }}
        working-directory: docker
        run: |
          set -e
          
          echo ""
          echo "════════════════════════════════════════════════════════"
          echo "  Building All Applications"
          echo "════════════════════════════════════════════════════════"
          
          # Run Waypoint build
          # This will:
          #   1. Read docker/waypoint.hcl
          #   2. Run 'docker build' for each app
          #   3. Push images to docker-mirror.service.consul:5000
          #   4. Create deployment records in Waypoint
          echo "🔨 Starting Waypoint build for all applications..."
          echo ""
          
          waypoint build || {
            echo ""
            echo "❌ Build failed"
            echo "Debug: Checking status..."
            waypoint status || true
            exit 1
          }
          
          echo ""
          echo "✅ All images built successfully"

      # ╔═══════════════════════════════════════════════════════════════╗
      # ║ Step 5: Build Specific App (if requested)
      # ╠═══════════════════════════════════════════════════════════════╣
      # Runs Waypoint build for a single application.
      # Useful for manual testing or rebuilding specific images.
      #
      # Condition: only runs if workflow_dispatch specified an app name
      # ╚═══════════════════════════════════════════════════════════════╝
      - name: Build Specific App
        if: ${{ github.event.inputs.app != '' }}
        working-directory: docker
        run: |
          set -e
          
          APP="${{ github.event.inputs.app }}"
          
          echo ""
          echo "════════════════════════════════════════════════════════"
          echo "  Building Specific Application"
          echo "════════════════════════════════════════════════════════"
          echo "App: ${APP}"
          
          echo "🔨 Starting Waypoint build for ${APP}..."
          echo ""
          
          # Build specific app with -app flag
          waypoint build -app "${APP}" || {
            echo ""
            echo "❌ Build failed for ${APP}"
            echo "Debug: Checking status..."
            waypoint status -app "${APP}" || true
            exit 1
          }
          
          echo ""
          echo "✅ ${APP} built successfully"

      # ╔═══════════════════════════════════════════════════════════════╗
      # ║ Step 6: Retrieve Build Artifacts & Status
      # ╠═══════════════════════════════════════════════════════════════╣
      # After successful build, display:
      #   - Deployment status
      #   - Recent deployment records
      #   - Image locations in registry
      #
      # This provides audit trail and quick reference for built images
      # ╚═══════════════════════════════════════════════════════════════╝
      - name: Get Build Artifacts
        if: success()
        working-directory: docker
        run: |
          echo ""
          echo "════════════════════════════════════════════════════════"
          echo "  Build Summary"
          echo "════════════════════════════════════════════════════════"
          
          echo ""
          echo "📋 Deployment Status:"
          waypoint status
          
          echo ""
          echo "📜 Recent Deployments:"
          waypoint deployment list -limit 5

      # ╔═══════════════════════════════════════════════════════════════╗
      # ║ Step 7: Error Notification
      # ╠═══════════════════════════════════════════════════════════════╣
      # If any previous step failed, provide clear error message and exit
      # This is mostly for logging; the actual failure comes from 'set -e'
      # ╚═══════════════════════════════════════════════════════════════╝
      - name: Notify on Failure
        if: failure()
        run: |
          echo ""
          echo "════════════════════════════════════════════════════════"
          echo "  Build Failed"
          echo "════════════════════════════════════════════════════════"
          echo "❌ Waypoint build failed"
          echo ""
          echo "Possible causes:"
          echo "  1. Docker build failed (check Dockerfile)"
          echo "  2. Registry not accessible"
          echo "  3. Waypoint server unreachable"
          echo "  4. Insufficient disk space on runner"
          echo "  5. Docker/BuildKit configuration issues"
          echo ""
          echo "Review the logs above for specific error messages."
          exit 1

      # ╔═══════════════════════════════════════════════════════════════╗
      # ║ Step 8: Comment on Pull Request
      # ╠═══════════════════════════════════════════════════════════════╣
      # If this was triggered by a PR and build succeeded, post a
      # comment on the PR indicating successful build.
      #
      # This provides quick feedback without leaving GitHub Actions tab
      # Condition: only runs for PR events that succeeded
      # ╚═══════════════════════════════════════════════════════════════╝
      - name: Comment on PR
        if: github.event_name == 'pull_request' && success()
        uses: actions/github-script@v7
        with:
          # GitHub token is automatically provided by Actions
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const buildUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';
            const comment = '## ✅ Waypoint Docker Build Successful\n\n' +
              '**Build Details:**\n' +
              '- Run: [#${{ github.run_id }}](' + buildUrl + ')\n' +
              '- Commit: `${{ github.sha }}`\n' +
              '- Branch: `${{ github.ref_name }}`\n\n' +
              '**Images pushed to:**\n' +
              '`docker-mirror.service.consul:5000`\n\n' +
              '**Built apps:**\n' +
              '- `ops-build-image`\n' +
              '- `deluge-vpn`\n' +
              '- `ops-waypoint-image`\n\n' +
              'All images are ready for deployment.';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

# ═══════════════════════════════════════════════════════════════════════════
# CONFIGURATION & SETUP INSTRUCTIONS
# ═══════════════════════════════════════════════════════════════════════════

# 1. CREATE GITHUB SECRETS
#    Repository Settings → Secrets and Variables → Actions → New Repository Secret
#
#    WAYPOINT_SERVER_ADDR:
#      Value: mccoy:9701
#      Description: Hostname and port of Waypoint server
#
#    WAYPOINT_SERVER_TOKEN:
#      Value: <your-waypoint-token>
#      Description: Authentication token for Waypoint server
#      To generate:
#        $ export WAYPOINT_SERVER_ADDR=mccoy:9701
#        $ export WAYPOINT_SERVER_TOKEN=<existing-token>
#        $ waypoint user token -auth-method=github

# 2. CONFIGURE SELF-HOSTED RUNNER
#    Your runner must be labeled with 'nomad' tag:
#    
#    Location: ~/actions-runner/.runner
#    Edit: .runner file
#    Or: Re-register runner with correct label
#    
#    Verify:
#      $ curl -s http://localhost:3222/api/runners | jq '.[] | .labels'

# 3. INSTALL PREREQUISITES ON RUNNER
#    $ sudo apt-get install -y waypoint docker.io netcat-openbsd
#    $ sudo usermod -aG docker $USER
#    $ docker login docker-mirror.service.consul:5000

# 4. VERIFY WAYPOINT.HCL
#    Ensure docker/waypoint.hcl defines all apps:
#    - app "ops-build-image" {}
#    - app "deluge-vpn" {}
#    - app "ops-waypoint-image" {}

# 5. COPY THIS FILE TO YOUR REPO
#    $ cp waypoint-docker-build-documented.yml \
#         .github/workflows/waypoint-docker-build.yml

# 6. TEST THE WORKFLOW
#    Option A: Push changes to docker/ directory
#    Option B: Manual trigger → Actions → Waypoint Docker Build → Run workflow
#    Option C: Create PR with docker/ changes

# ═══════════════════════════════════════════════════════════════════════════
# TROUBLESHOOTING
# ═══════════════════════════════════════════════════════════════════════════

# Build fails with "Cannot connect to Waypoint server"
#   → Verify WAYPOINT_SERVER_ADDR is correct (check nomad service)
#   → Verify WAYPOINT_SERVER_TOKEN hasn't expired
#   → Check runner can reach server: ping mccoy, nc -zv mccoy 9701

# Build fails with "Cannot reach registry"
#   → Verify registry service is running: nomad service list
#   → Test from runner: nc -zv docker-mirror.service.consul 5000
#   → Check Consul DNS resolution: nslookup docker-mirror.service.consul

# Build times out (>30 mins)
#   → Increase timeout-minutes if images are large
#   → Consider multi-arch builds taking longer
#   → Check runner CPU/disk not constrained

# Docker build fails inside waypoint
#   → Ensure Docker daemon is running on runner
#   → Check Docker has sufficient disk space: docker system df
#   → Verify Dockerfile is valid: docker build docker/

# ═══════════════════════════════════════════════════════════════════════════
