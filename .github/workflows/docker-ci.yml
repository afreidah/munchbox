# -----------------------------------------------------------------------------------
# Docker Build & Security Workflow (Two-Stage, multi-arch-safe)
# -----------------------------------------------------------------------------------
# PR / non-main pushes:
#   checkov -> trivy -> build -> trivy-image
# Main (merge/push to main):
#   checkov -> trivy -> build -> trivy-image -> tag -> push
#
# Uses multi-arch image: docker-mirror.service.consul:5000/ops-build-image:latest
# The host runner’s Docker will pull the correct platform image automatically.
# -----------------------------------------------------------------------------------

name: Docker Security

on:
  push:
    branches:
      - '**'
    paths:
      - 'docker/**'
      - '.github/workflows/docker-ci.yml'
  pull_request:
    paths:
      - 'docker/**'
      - '.github/workflows/docker-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # --------------------------------------------------------------------------
  # Stage A: PR / Non-main push
  # --------------------------------------------------------------------------

  pr-and-branch-checks:
    name: PR/Branch — Checkov • Trivy • Build • Trivy-Image
    runs-on: self-hosted
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
    timeout-minutes: 45

    container:
      image: docker-mirror.service.consul:5000/ops-build-image:latest
      options: --privileged -v /var/run/docker.sock:/var/run/docker.sock

    defaults:
      run:
        working-directory: docker

    env:
      DOCKER_BUILDKIT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed Docker images
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          CHANGED_DIRS="$(git diff --name-only "$base" "$head" \
            | grep -E '^docker/[^/]+/Dockerfile$' || true \
            | xargs -r -n1 dirname \
            | sed 's#^docker/##' \
            | sort -u)"
          if [[ -z "$CHANGED_DIRS" ]]; then
            echo "images=" >> "$GITHUB_OUTPUT"
            echo "No changed Dockerfiles."
          else
            SPACE_LIST="$(echo "$CHANGED_DIRS" | paste -sd' ' -)"
            echo "images=$SPACE_LIST" >> "$GITHUB_OUTPUT"
            echo "Changed images: $SPACE_LIST"
          fi

      - name: Tool versions
        run: |
          docker --version || true
          checkov --version || true
          trivy --version || true
          make --version || true

      - name: Checkov (Dockerfiles)
        if: steps.changed.outputs.images != ''
        run: make checkov IMAGES="${{ steps.changed.outputs.images }}"
        continue-on-error: true

      - name: Trivy config (Dockerfiles)
        if: steps.changed.outputs.images != ''
        run: make trivy IMAGES="${{ steps.changed.outputs.images }}"
        continue-on-error: true

      - name: Build images
        if: steps.changed.outputs.images != ''
        run: make build IMAGES="${{ steps.changed.outputs.images }}"

      - name: Trivy image scan (fail on CRITICAL)
        if: steps.changed.outputs.images != ''
        run: make trivy-image IMAGES="${{ steps.changed.outputs.images }}"

      - name: Skip (no changed Dockerfiles)
        if: steps.changed.outputs.images == ''
        run: echo "No docker/*/Dockerfile changed. Skipping."

      - name: Cleanup
        if: always()
        run: docker system prune -f --volumes || true

  release-main:
    name: Main — Checkov • Trivy • Build • Trivy-Image • Tag • Push
    runs-on: self-hosted
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 60

    container:
      image: docker-mirror.service.consul:5000/ops-build-image:latest
      options: --privileged -v /var/run/docker.sock:/var/run/docker.sock

    defaults:
      run:
        working-directory: docker

    env:
      DOCKER_BUILDKIT: "1"
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed Docker images
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.before }}"
          head="${{ github.sha }}"
          CHANGED_DIRS="$(git diff --name-only "$base" "$head" \
            | grep -E '^docker/[^/]+/Dockerfile$' || true \
            | xargs -r -n1 dirname \
            | sed 's#^docker/##' \
            | sort -u)"
          if [[ -z "$CHANGED_DIRS" ]]; then
            echo "images=" >> "$GITHUB_OUTPUT"
            echo "No changed Dockerfiles."
          else
            SPACE_LIST="$(echo "$CHANGED_DIRS" | paste -sd' ' -)"
            echo "images=$SPACE_LIST" >> "$GITHUB_OUTPUT"
            echo "Changed images: $SPACE_LIST"
          fi

      - name: Tool versions
        run: |
          docker --version || true
          checkov --version || true
          trivy --version || true
          make --version || true

      - name: Checkov (Dockerfiles)
        if: steps.changed.outputs.images != ''
        run: make checkov IMAGES="${{ steps.changed.outputs.images }}"
        continue-on-error: true

      - name: Trivy config (Dockerfiles)
        if: steps.changed.outputs.images != ''
        run: make trivy IMAGES="${{ steps.changed.outputs.images }}"
        continue-on-error: true

      - name: Build images
        if: steps.changed.outputs.images != ''
        run: make build IMAGES="${{ steps.changed.outputs.images }}"

      - name: Trivy image scan (fail on CRITICAL)
        if: steps.changed.outputs.images != ''
        run: make trivy-image IMAGES="${{ steps.changed.outputs.images }}"

      - name: Tag images
        if: steps.changed.outputs.images != ''
        run: make tag TAG=${{ env.IMAGE_TAG }} IMAGES="${{ steps.changed.outputs.images }}"

      # - name: Docker login (publish)
      #   run: |
      #     echo "${{ secrets.PUBLISH_REGISTRY_PASSWORD }}" | \
      #       docker login "docker-mirror.service.consul:5000" \
      #         --username "${{ secrets.PUBLISH_REGISTRY_USERNAME }}" \
      #         --password-stdin

      - name: Push images
        if: steps.changed.outputs.images != ''
        run: make push TAG=${{ env.IMAGE_TAG }} IMAGES="${{ steps.changed.outputs.images }}"

      - name: Skip (no changed Dockerfiles)
        if: steps.changed.outputs.images == ''
        run: echo "No docker/*/Dockerfile changed. Skipping."

      - name: Cleanup
        if: always()
        run: docker system prune -f --volumes || true
