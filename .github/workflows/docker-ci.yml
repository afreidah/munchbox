# ============================================================================
# Docker Build & Security Workflow (Two-Stage, No Duplicates, Private Mirror)
# ============================================================================
# Stage A (PRs targeting main):
#   - checkov -> trivy -> build -> trivy-image
#
# Stage B (merge to main i.e., push to main):
#   - checkov -> trivy -> build -> trivy-build -> push
#
# Container Source:
#   - Uses your private mirror at docker-mirror.service.consul:5000
#   - IMPORTANT: The *host* Docker daemon on runner nodes must trust the mirror:
#       /etc/docker/daemon.json -> { "insecure-registries": ["docker-mirror.service.consul:5000"] }
#     Then restart Docker on those hosts.
#
# Duplication Avoidance:
#   - push: only on main
#   - pull_request: only PRs targeting main
# ============================================================================

name: Docker Security

on:
  # Only on pushes to main (release path)
  push:
    branches: [ main ]
    paths:
      - 'docker/**'
      - '.github/workflows/docker-ci.yml'

  # PR validation (no duplicate runs alongside push on branches)
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths:
      - 'docker/**'
      - '.github/workflows/docker-ci.yml'

  # Manual trigger if needed
  workflow_dispatch:

# Cancel in-progress runs when a new run is triggered on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Stage A: PR checks (scan + build + image scan)
  # --------------------------------------------------------------------------
  pr-checks:
    name: PR — Checkov • Trivy • Build • Trivy-Image
    runs-on: self-hosted
    timeout-minutes: 45
    if: github.event_name == 'pull_request'

    # Run all steps inside your prebuilt tooling image from the mirror
    container:
      image: docker-mirror.service.consul:5000/ops-build-image:latest
      # --------------------------------------------------------------------
      # Registry auth (commented for now; enable if mirror requires auth)
      # credentials:
      #   username: ${{ secrets.DOCKER_MIRROR_USERNAME }}
      #   password: ${{ secrets.DOCKER_MIRROR_PASSWORD }}
      # --------------------------------------------------------------------
      options: --privileged -v /var/run/docker.sock:/var/run/docker.sock

    # Default working directory for run steps
    defaults:
      run:
        working-directory: docker

    env:
      DOCKER_BUILDKIT: "1"

    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Traceability: show tool versions packaged in the ops-build-image
      - name: Print tool versions
        run: |
          docker --version || true
          checkov --version || true
          trivy --version || true
          make --version || true

      # Static/config security scans (non-blocking)
      - name: Run Checkov on Dockerfiles
        run: make checkov
        continue-on-error: true

      - name: Run Trivy config scan on Dockerfiles
        run: make trivy
        continue-on-error: true

      # Build images
      - name: Build Docker images
        run: make build

      # Image vulnerability scan (blocking on CRITICAL)
      - name: Scan built Docker images with Trivy
        run: make trivy-image
        continue-on-error: false

      # Upload reports as artifacts
      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-scan-results-${{ github.run_id }}-stageA
          path: |
            docker/**/*checkov*.txt
            docker/**/*checkov*.json
            docker/**/*trivy*.txt
            docker/**/*trivy*.json
          retention-days: 30
          if-no-files-found: ignore

      # Cleanup to conserve disk on the runner
      - name: Clean up Docker resources
        if: always()
        run: docker system prune -f --volumes || true

  # --------------------------------------------------------------------------
  # Stage B: Main branch release (scan + build + trivy-build + push)
  # --------------------------------------------------------------------------
  release-main:
    name: Main — Checkov • Trivy • Build • Trivy-Build • Push
    runs-on: self-hosted
    timeout-minutes: 60
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    container:
      image: docker-mirror.service.consul:5000/ops-build-image:latest
      # --------------------------------------------------------------------
      # Registry auth for tooling image (commented out for now)
      # credentials:
      #   username: ${{ secrets.DOCKER_MIRROR_USERNAME }}
      #   password: ${{ secrets.DOCKER_MIRROR_PASSWORD }}
      # --------------------------------------------------------------------
      options: --privileged -v /var/run/docker.sock:/var/run/docker.sock

    defaults:
      run:
        working-directory: docker

    env:
      DOCKER_BUILDKIT: "1"
      # Optional: deterministic tag for release builds
      IMAGE_TAG: ${{ github.sha }}
      # Optional: target registry for your Makefile push
      # DOCKER_REGISTRY: registry.internal.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print tool versions
        run: |
          docker --version || true
          checkov --version || true
          trivy --version || true
          make --version || true

      - name: Run Checkov on Dockerfiles
        run: make checkov
        continue-on-error: true

      - name: Run Trivy config scan on Dockerfiles
        run: make trivy
        continue-on-error: true

      - name: Build Docker images
        run: make build

      # Build-time scan / SBOM or additional validation (per your Makefile)
      - name: Run Trivy build-time scan
        run: make trivy-build

      # Docker login for publish registry (commented out for now)
      # - name: Docker login (publish registry)
      #   if: env.DOCKER_REGISTRY != ''
      #   run: |
      #     echo "${{ secrets.PUBLISH_REGISTRY_PASSWORD }}" | \
      #       docker login "${{ env.DOCKER_REGISTRY }}" \
      #         --username "${{ secrets.PUBLISH_REGISTRY_USERNAME }}" \
      #         --password-stdin

      - name: Push Docker images
        run: make push

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-scan-results-${{ github.run_id }}-stageB
          path: |
            docker/**/*checkov*.txt
            docker/**/*checkov*.json
            docker/**/*trivy*.txt
            docker/**/*trivy*.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Clean up Docker resources
        if: always()
        run: docker system prune -f --volumes || true

