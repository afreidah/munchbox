# -------------------------------------------------------------------------------
# munchbox CI
#
# Path-aware, per-component pipeline for the polyglot monorepo. `changes` detects
# which areas a PR touches; each area job runs only when relevant and scans its
# own SonarCloud project (monorepo model). Coverage-producing unit tests run the
# FULL suite for their area so a partial PR never zeroes that project's coverage.
#
# Incremental: cinc only for now. terragrunt / nomad jobs land in follow-ups
# (terragrunt needs self-hosted runners for Vault + the Consul state backend).
#
# Author: Alex Freidah / Project: Munchbox
# -------------------------------------------------------------------------------

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # ---------------------------------------------------------------------------
  # Detect which component areas changed
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      cinc: ${{ steps.filter.outputs.cinc }}
      docker: ${{ steps.filter.outputs.docker }}
      modules: ${{ steps.filter.outputs.modules }}
      nomad: ${{ steps.filter.outputs.nomad }}
      terragrunt: ${{ steps.filter.outputs.terragrunt }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cinc:
              - 'infrastructure/cinc/**'
            docker:
              - 'docker/**'
            modules:
              - 'infrastructure/terragrunt/modules/**'
            nomad:
              - 'nomad/**'
              # A change to this workflow re-runs the (self-hosted) nomad job, so
              # CI-config edits like this one exercise the runner autoscaler.
              - '.github/workflows/ci.yml'
            terragrunt:
              - 'infrastructure/terragrunt/**'
              - '!infrastructure/terragrunt/modules/**'

  # ---------------------------------------------------------------------------
  # Cinc: cookstyle + full chefspec suite + merged coverage -> Sonar
  # ---------------------------------------------------------------------------
  cinc:
    needs: changes
    if: ${{ needs.changes.outputs.cinc == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar needs full history for new-code/blame

      - name: Install Cinc Workstation
        run: |
          curl -fsSL https://omnitruck.cinc.sh/install.sh | sudo bash -s -- -P cinc-workstation
          # _common.mk hardcodes /usr/local/bin/{chef,cookstyle,kitchen}; cinc ships `cinc`.
          for b in cinc cookstyle kitchen; do
            p=$(command -v "$b" || true); [ -n "$p" ] && sudo ln -sf "$p" "/usr/local/bin/$b"
          done
          sudo ln -sf "$(command -v cinc)" /usr/local/bin/chef
          chef --version

      - name: Install coverage gems into the workstation ruby
        run: |
          # install as the runner (no sudo) so they land in the user gemset that
          # `cinc exec` reads -- sudo installs into root's gemset, invisible here
          cinc exec gem install simplecov simplecov_json_formatter --no-document
          cinc exec ruby -e "require 'simplecov'; require 'simplecov_json_formatter'; puts 'coverage gems OK'"

      - name: make verify (cookstyle + chefspec, full suite, coverage on)
        working-directory: infrastructure/cinc
        env:
          COVERAGE: '1'
        run: |
          set -uo pipefail
          fail=0
          for cb in cookbooks/*/; do
            [ -f "${cb}Makefile" ] || continue
            name=${cb#cookbooks/}; name=${name%/}
            echo "::group::verify ${name}"
            ( cd "$cb"; make verify ) || { echo "::error title=cinc::${name} failed verify"; fail=1; }
            echo "::endgroup::"
          done
          echo "merged coverage: $(ls -la coverage/coverage.json 2>/dev/null || echo MISSING)"
          [ "$fail" -eq 0 ] || { echo "::error::one or more cookbooks failed make verify (see annotations)"; exit 1; }

      - name: SonarQube scan (afreidah_munchbox_cinc)
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: infrastructure/cinc

  # ---------------------------------------------------------------------------
  # Docker: hadolint the Dockerfiles (offline lint; ubuntu-latest). Starts at
  # error-threshold so the first run reports warnings without blocking; ratchet
  # to 'warning' + a .hadolint.yaml once the noise is triaged. Image CVE scanning
  # (trivy image, needs a build) is a follow-up.
  # ---------------------------------------------------------------------------
  docker:
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install hadolint
        run: |
          sudo curl -fsSLo /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint
          hadolint --version

      - name: hadolint Dockerfiles
        run: |
          set -uo pipefail
          fail=0
          while IFS= read -r df; do
            echo "::group::hadolint $df"
            hadolint --failure-threshold error "$df" \
              || { echo "::error title=hadolint::$df has error-level findings"; fail=1; }
            echo "::endgroup::"
          done < <(find docker -name Dockerfile ! -path '*/deprecated/*')
          [ "$fail" -eq 0 ] || { echo "::error::one or more Dockerfiles failed hadolint"; exit 1; }

  # ---------------------------------------------------------------------------
  # Single required status check (skipped area jobs don't block merges)
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Terraform modules: full-verify changed modules + coverage ratchet -> Sonar
  # (backend-free, mock_provider -> no cluster access needed; ubuntu-latest)
  # ---------------------------------------------------------------------------
  terraform-modules:
    needs: changes
    if: ${{ needs.changes.outputs.modules == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar new-code + module change-detection diff

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.4"
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@v4

      - name: verify changed modules (fmt/validate/tflint/terraform test)
        working-directory: infrastructure/terragrunt/modules
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tfplugins
          # proxmox-cluster ships a provider "proxmox" block; the telmate provider
          # validates an endpoint even under mock_provider, and reads it from env.
          # Give it a dummy -- mock_provider intercepts all real API calls.
          PM_API_URL: https://proxmox.invalid:8006/api2/json
        run: |
          set -uo pipefail
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          changed=$(git -C "$GITHUB_WORKSPACE" diff --name-only "$base" HEAD -- 'infrastructure/terragrunt/modules/*' \
            | sed -nE 's#^infrastructure/terragrunt/modules/([^/]+)/.*#\1#p' | sort -u)
          # fallback (e.g. _common.mk / scripts changed): verify everything
          [ -n "$changed" ] || changed=$(ls -d */ | sed 's#/##')
          fail=0
          for m in $changed; do
            [ -f "$m/Makefile" ] || continue
            echo "::group::verify $m"
            ( cd "$m" && make verify ) || { echo "::error title=tf-module::$m failed verify"; fail=1; }
            echo "::endgroup::"
          done
          [ "$fail" -eq 0 ] || { echo "::error::one or more modules failed verify (see annotations)"; exit 1; }

      # NOTE: trivy/checkov are NOT run here. Generic modules have no real inputs
      # and none of the leaf-level ignores (root.hcl generates .checkov.yaml into
      # each terragrunt leaf at plan time), so scanning them in isolation is all
      # false positives. Security scanning lives in the terragrunt (leaves) CI.
      - name: tf-coverage ratchet (resource/output, no regression)
        run: ruby infrastructure/terragrunt/scripts/tf-coverage.rb --check

      - name: SonarQube scan (afreidah_munchbox_modules)
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: infrastructure/terragrunt/modules

  # ---------------------------------------------------------------------------
  # Nomad jobs: fmt + pack render (offline) + server-side `nomad job validate`.
  # Runs on a self-hosted runner dispatched on demand by the runnerscaler
  # autoscaler -- nomad + nomad-pack are baked into the ci-runner image, so there
  # is no install step. The runner carries a scoped NOMAD_TOKEN (submit-job) so
  # validate hits the live server; because that token is in the runner env, this
  # job is fork-gated (fork PRs skip it rather than get the token).
  # ---------------------------------------------------------------------------
  nomad:
    needs: changes
    if: ${{ needs.changes.outputs.nomad == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the munchbox-service pack (nomad/packs/registry submodule)
        run: git submodule update --init nomad/packs/registry

      - name: nomad fmt -check
        working-directory: nomad
        run: |
          if ! nomad fmt -check -recursive .; then
            echo "::error::nomad files need formatting -- run 'nomad fmt -recursive .'"; exit 1
          fi

      - name: nomad-pack render (munchbox-service jobs)
        working-directory: nomad
        run: |
          set -uo pipefail
          fail=0
          while IFS= read -r vf; do
            jd=$(dirname "$vf")
            echo "::group::render $vf"
            out=$(nomad-pack render --var-file="$vf" --var="job_dir=$(pwd)/$jd" \
              "./packs/registry/munchbox-service" 2>&1) \
              || { echo "::error title=nomad-pack::$vf failed render"; echo "$out" | tail -15; fail=1; }
            echo "::endgroup::"
          done < <(find jobs -name '*.hcl' ! -name '*.nomad.hcl' ! -path '*/deprecated/*')
          [ "$fail" -eq 0 ] || { echo "::error::one or more service jobs failed pack render"; exit 1; }

      - name: nomad job validate (server-side)
        working-directory: nomad
        # NOMAD_ADDR / NOMAD_TOKEN / NOMAD_CACERT come from the ci-runner job env.
        run: |
          set -uo pipefail
          fail=0
          while IFS= read -r jf; do
            echo "::group::validate $jf"
            # Validate bare; jobs that declare shared vars need -var-file (like
            # `make validate`), but passing it to jobs that don't declare them
            # errors, so only retry with it on an "Unset variable" failure.
            if out=$(nomad job validate "$jf" 2>&1); then
              ok=1
            elif printf '%s' "$out" | grep -q 'Unset variable' \
                 && out=$(nomad job validate -var-file=shared.vars.hcl "$jf" 2>&1); then
              ok=1
            else
              ok=0
            fi
            if [ "$ok" -eq 1 ]; then
              printf '%s\n' "$out" | tail -3
            else
              echo "::error title=nomad validate::$jf failed validation"
              printf '%s\n' "$out" | tail -20
              fail=1
            fi
            echo "::endgroup::"
          done < <(find jobs -name '*.nomad.hcl' ! -path '*/deprecated/*')
          [ "$fail" -eq 0 ] || { echo "::error::one or more jobs failed nomad validate"; exit 1; }

  # ---------------------------------------------------------------------------
  # Terragrunt leaves: HCL formatting gate on the self-hosted runner (terraform +
  # terragrunt are baked into the ci-runner image, so no install step). Like the
  # nomad job, the runner carries NOMAD_TOKEN in its env, so this job is
  # fork-gated. terragrunt validate (config-level, backend disabled -- no cluster
  # secrets) is the next check to add here; a full plan is intentionally NOT
  # wired (it would need the whole provider secret set on a PR-code runner).
  # ---------------------------------------------------------------------------
  terragrunt:
    needs: changes
    if: ${{ needs.changes.outputs.terragrunt == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: terragrunt hcl format --check
        working-directory: infrastructure/terragrunt
        run: |
          if ! terragrunt hcl format --check --diff; then
            echo "::error::terragrunt HCL needs formatting -- run 'terragrunt hcl format'"; exit 1
          fi

      - name: terragrunt validate (changed leaves; config-level, backend disabled)
        working-directory: infrastructure/terragrunt
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tfplugins
        run: |
          set -uo pipefail
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          changed=$(git -C "$GITHUB_WORKSPACE" diff --name-only "$base" HEAD \
            -- infrastructure/terragrunt | grep -v '/modules/' || true)
          # Resolve changed files -> leaves to validate:
          #   root.hcl        -> every leaf (all include it)
          #   _env_helpers/X  -> leaves whose config references X (grep)
          #   a leaf's file   -> that leaf (nearest ancestor with terragrunt.hcl)
          all_leaves() { find . -name terragrunt.hcl ! -path './modules/*' -exec dirname {} \;; }
          leaves=""
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            rel="${f#infrastructure/terragrunt/}"
            case "$rel" in
              root.hcl) leaves=$(all_leaves); break ;;
              _env_helpers/*)
                h=$(basename "$rel")
                leaves="$leaves"$'\n'$(grep -rl "$h" --include='terragrunt.hcl' . | xargs -r -n1 dirname) ;;
              *)
                d="./$(dirname "$rel")"
                while [ "$d" != "." ] && [ "$d" != "./" ] && [ ! -f "$d/terragrunt.hcl" ]; do d=$(dirname "$d"); done
                [ -f "$d/terragrunt.hcl" ] && leaves="$leaves"$'\n'"$d" ;;
            esac
          done <<< "$changed"
          leaves=$(printf '%s\n' "$leaves" | sed '/^$/d' | sort -u)
          [ -n "$leaves" ] || { echo "no terragrunt leaves affected"; exit 0; }
          echo "validating leaves:"; echo "$leaves"
          fail=0
          while IFS= read -r leaf; do
            [ -n "$leaf" ] || continue
            echo "::group::validate $leaf"
            ( cd "$leaf" && terragrunt init -backend=false -input=false >/dev/null 2>&1 \
              && terragrunt validate ) \
              || { echo "::error title=terragrunt validate::$leaf failed"; fail=1; }
            echo "::endgroup::"
          done <<< "$leaves"
          [ "$fail" -eq 0 ] || { echo "::error::one or more leaves failed terragrunt validate"; exit 1; }

  ci-ok:
    needs: [changes, cinc, docker, terraform-modules, nomad, terragrunt]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Gate on area-job results (skipped is OK, failed is not)
        run: |
          for r in "${{ needs.cinc.result }}" "${{ needs.docker.result }}" "${{ needs.terraform-modules.result }}" "${{ needs.nomad.result }}" "${{ needs.terragrunt.result }}"; do
            case "$r" in
              failure|cancelled) echo "a required job did not pass: $r"; exit 1 ;;
            esac
          done
          echo "ok"
