# ============================================================================
# CDKTF Continuous Integration Workflow
# ============================================================================
# Purpose:
#   Validates, tests, and builds the CDKTF infrastructure code that manages
#   Nomad jobs, Consul/Vault policies, and related infrastructure.
#
# Triggers:
#   - Push to any branch when cdktf/ directory changes
#   - Pull requests that modify cdktf/ directory
#   - Manual workflow dispatch (for testing)
#
# Jobs:
#   1. lint-and-validate: Structure validation, Go linting, Nomad job validation
#   2. security-scan: Semgrep and Trivy security analysis
#   3. test: Go unit tests
#   4. build: Full build and Terraform synthesis
#
# Make Targets Used:
#   - build-tools: Compile validate-structure and nomad-query utilities
#   - check-structure: Validate directory organization
#   - lint-go: Run Go linter
#   - fmt: Format Go and HCL files
#   - validate: Validate all Nomad job files
#   - lint: Lint HCL files
#   - semgrep: Security scanning
#   - trivy: Configuration scanning
#   - test: Run Go tests
#   - build-all: Build all binaries
#   - synth: Generate Terraform JSON from CDKTF
#
# Requirements:
#   - Go (version from go.mod)
#   - Nomad CLI (for job validation)
#   - Semgrep (for security scanning)
#   - Trivy (for config scanning)
#
# Runner Environment:
#   - Uses Debian 12 container to match production cluster environment
#   - GitHub Actions doesn't provide native Debian runners, so we use
#     a Debian container on ubuntu-latest runner
# ============================================================================

name: CDKTF CI

on:
  push:
    paths:
      - 'cdktf/**'                          # Any changes in the cdktf directory
      - '.github/workflows/cdktf-ci.yml'    # Changes to this workflow itself
  pull_request:
    paths:
      - 'cdktf/**'
      - '.github/workflows/cdktf-ci.yml'
  workflow_dispatch:                        # Allow manual triggering from GitHub UI

# Cancel in-progress runs when a new run is triggered on the same ref
# This prevents duplicate runs when pushing to a PR branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Job: Lint & Validate
  # --------------------------------------------------------------------------
  # Validates the structure, format, and syntax of all CDKTF code and Nomad
  # job definitions. Ensures code follows standards before running tests.
  # --------------------------------------------------------------------------
  lint-and-validate:
    name: Lint & Validate
    runs-on: ubuntu-latest
    container:
      image: debian:12
    defaults:
      run:
        working-directory: cdktf

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Install basic dependencies needed for the workflow
      # Debian containers don't come with git, curl, etc.
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y curl wget gnupg lsb-release git ca-certificates build-essential

      # Setup Go using the version specified in go.mod
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'cdktf/go.mod'
          cache-dependency-path: 'cdktf/go.sum'  # Cache Go modules for faster builds

      # Install HashiCorp Nomad CLI for job validation
      # Required by 'make validate' to run 'nomad job validate'
      - name: Install Nomad CLI
        run: |
          wget -O- https://apt.releases.hashicorp.com/gpg | gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | tee /etc/apt/sources.list.d/hashicorp.list
          apt-get update && apt-get install -y nomad

      # Build utility tools (validate-structure, nomad-query)
      # These are custom Go tools used for validation
      - name: Build tools
        run: make build-tools

      # Validate that the directory structure matches expected layout
      # Uses the validate-structure tool built in previous step
      - name: Check directory structure
        run: make check-structure

      # Run Go linter to check code quality and catch common issues
      - name: Lint Go code
        run: make lint-go

      # Check that all code is properly formatted
      # Fails if 'make fmt' would change any files
      - name: Format check
        run: |
          make fmt
          if [ -n "$(git status --porcelain)" ]; then
            echo "❌ Files are not formatted. Please run 'make fmt'"
            git diff
            exit 1
          fi

      # Validate all Nomad job HCL files
      # Runs 'nomad job validate' on each job definition
      - name: Validate Nomad jobs
        run: make validate

      # Lint HCL files for style and best practices
      - name: Lint HCL files
        run: make lint

  # --------------------------------------------------------------------------
  # Job: Security Scanning
  # --------------------------------------------------------------------------
  # Runs static analysis security tools to identify potential vulnerabilities
  # and misconfigurations in code and infrastructure definitions.
  # --------------------------------------------------------------------------
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    container:
      image: debian:12
    defaults:
      run:
        working-directory: cdktf

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y curl wget git ca-certificates build-essential

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'cdktf/go.mod'

      # Run Semgrep for static analysis security scanning
      # continue-on-error: Security findings are informational initially
      - name: Run Semgrep security scan
        run: make semgrep
        continue-on-error: true

      # Run Trivy for infrastructure configuration scanning
      # Checks for misconfigurations in Terraform/Nomad configs
      - name: Run Trivy config scan
        run: make trivy
        continue-on-error: true

  # --------------------------------------------------------------------------
  # Job: Go Tests
  # --------------------------------------------------------------------------
  # Runs the Go test suite to verify application logic and utilities.
  # --------------------------------------------------------------------------
  test:
    name: Go Tests
    runs-on: ubuntu-latest
    container:
      image: debian:12
    defaults:
      run:
        working-directory: cdktf

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y curl wget git ca-certificates build-essential

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'cdktf/go.mod'
          cache-dependency-path: 'cdktf/go.sum'

      # Run all Go tests in the cdktf directory
      - name: Run Go tests
        run: make test

  # --------------------------------------------------------------------------
  # Job: Build
  # --------------------------------------------------------------------------
  # Builds all binaries and synthesizes Terraform configuration from CDKTF.
  # Only runs if linting and tests pass. Saves build artifacts for potential
  # use in deployment workflows.
  # --------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: debian:12
    needs: [lint-and-validate, test]  # Only run if validation and tests pass
    defaults:
      run:
        working-directory: cdktf

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y curl wget gnupg lsb-release git ca-certificates build-essential

      # Install Node.js (required for CDKTF CLI)
      - name: Install Node.js
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs

      # Install CDKTF CLI
      - name: Install CDKTF CLI
        run: npm install -g cdktf-cli@latest

      # Install Terraform CLI (required for CDKTF synth)
      - name: Install Terraform CLI
        run: |
          wget -O- https://apt.releases.hashicorp.com/gpg | gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | tee /etc/apt/sources.list.d/hashicorp.list
          apt-get update && apt-get install -y terraform

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'cdktf/go.mod'
          cache-dependency-path: 'cdktf/go.sum'

      # Build all binaries (nomad-app, validate-structure, nomad-query)
      - name: Build all binaries
        run: make build-all

      # Note: Synth step commented out for initial testing
      # Requires live cluster access (NOMAD_ADDR, CONSUL_HTTP_ADDR, VAULT_ADDR)
      # Run 'make synth' locally before deploying
      # - name: Synthesize Terraform plan
      #   run: make synth

      # Save compiled binaries as artifacts
      # Can be downloaded from the GitHub Actions UI or used in other workflows
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cdktf-binaries
          path: cdktf/bin/
          retention-days: 7  # Keep artifacts for 7 days
