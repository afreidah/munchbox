# ============================================================================
# CDKTF Continuous Integration Workflow
# ============================================================================
# Purpose:
#   Validates, tests, and builds the CDKTF infrastructure code that manages
#   Nomad jobs, Consul/Vault policies, and related infrastructure.
#
# Triggers:
#   - Push to main when cdktf/ directory changes
#   - Pull requests that modify cdktf/ directory
#   - Manual workflow dispatch (for testing)
#
# Jobs:
#   1. build-tooling: Build ops-build-image with all required tools
#   2. lint-and-validate: Structure validation, Go linting, Nomad job validation
#   3. security-scan: Semgrep and Trivy security analysis
#   4. test: Go unit tests
#   5. build: Full build and Terraform synthesis
#
# Make Targets Used (from cdktf/Makefile):
#   - build-tools: Compile validate-structure and nomad-query utilities
#   - check-structure: Validate directory organization
#   - lint-go: Run Go linter
#   - fmt: Format Go and HCL files
#   - validate: Validate all Nomad job files
#   - lint: Lint HCL files
#   - semgrep: Security scanning
#   - trivy: Configuration scanning
#   - test: Run Go tests
#   - build-all: Build all binaries
#
# Requirements:
#   - ops-build-image contains: Go, Node.js, CDKTF CLI, Terraform, Nomad,
#     Semgrep, Trivy, and all other required tools
#
# Runner Environment:
#   - Uses self-hosted runner with Docker support
# ============================================================================

name: CDKTF CI

on:
  push:
    branches:
      - main
    paths:
      - 'cdktf/**'
      - 'docker/ops-build-image/**'
      - '.github/workflows/cdktf-ci.yml'
  pull_request:
    paths:
      - 'cdktf/**'
      - 'docker/ops-build-image/**'
      - '.github/workflows/cdktf-ci.yml'
  workflow_dispatch:

# Cancel in-progress runs when a new run is triggered on the same ref
# This prevents duplicate runs when pushing to a PR branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Job: Build Tooling Image
  # --------------------------------------------------------------------------
  # Builds the ops-build-image that contains all required tools:
  # Go, Node.js, CDKTF CLI, Terraform, Nomad CLI, Trivy, Semgrep, etc.
  # --------------------------------------------------------------------------
  build-tooling:
    name: Build Tooling Image
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install make
        run: apt-get update && apt-get install -y make

      - name: Verify Docker installation
        run: docker --version

      - name: Build ops-build-image
        working-directory: docker
        run: make build

  # --------------------------------------------------------------------------
  # Job: Lint & Validate
  # --------------------------------------------------------------------------
  # Validates the structure, format, and syntax of all CDKTF code and Nomad
  # job definitions using the ops-build-image container.
  # --------------------------------------------------------------------------
  lint-and-validate:
    name: Lint & Validate
    runs-on: self-hosted
    needs: [build-tooling]
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Build utility tools inside container
      - name: Build tools
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/cdktf \
            docker-mirror.service.consul/ops-build-image:latest \
            make build-tools

      # Validate directory structure
      - name: Check directory structure
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/cdktf \
            docker-mirror.service.consul/ops-build-image:latest \
            make check-structure

      # Run Go linter
      - name: Lint Go code
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/cdktf \
            docker-mirror.service.consul/ops-build-image:latest \
            make lint-go

      # Check code formatting
      - name: Format check
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/cdktf \
            docker-mirror.service.consul/ops-build-image:latest \
            bash -c "make fmt && git status --porcelain"

      # Validate all Nomad job files
      - name: Validate Nomad jobs
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/cdktf \
            docker-mirror.service.consul/ops-build-image:latest \
            make validate

      # Lint HCL files
      - name: Lint HCL files
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/cdktf \
            docker-mirror.service.consul/ops-build-image:latest \
            make lint

  # --------------------------------------------------------------------------
  # Job: Security Scanning
  # --------------------------------------------------------------------------
  # Runs static analysis security tools using the ops-build-image container.
  # --------------------------------------------------------------------------
  security-scan:
    name: Security Scanning
    runs-on: self-hosted
    needs: [build-tooling]
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Run Semgrep security scan
      - name: Run Semgrep security scan
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/cdktf \
            docker-mirror.service.consul/ops-build-image:latest \
            make semgrep
        continue-on-error: true

      # Run Trivy configuration scan
      - name: Run Trivy configuration scan
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/cdktf \
            docker-mirror.service.consul/ops-build-image:latest \
            make trivy
        continue-on-error: true

  # --------------------------------------------------------------------------
  # Job: Go Tests
  # --------------------------------------------------------------------------
  # Runs the Go test suite using the ops-build-image container.
  # --------------------------------------------------------------------------
  test:
    name: Go Tests
    runs-on: self-hosted
    needs: [build-tooling]
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Run all Go tests
      - name: Run Go tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/cdktf \
            docker-mirror.service.consul/ops-build-image:latest \
            make test

  # --------------------------------------------------------------------------
  # Job: Build
  # --------------------------------------------------------------------------
  # Builds all binaries using the ops-build-image container.
  # Only runs if linting and tests pass.
  # --------------------------------------------------------------------------
  build:
    name: Build
    runs-on: self-hosted
    needs: [lint-and-validate, test]
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Build all binaries
      - name: Build all binaries
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/cdktf \
            docker-mirror.service.consul/ops-build-image:latest \
            make build-all

      # Note: Synth step commented out
      # Requires live cluster access (NOMAD_ADDR, CONSUL_HTTP_ADDR, VAULT_ADDR)
      # Run 'make synth' locally before deploying
      # - name: Synthesize Terraform plan
      #   run: |
      #     docker run --rm \
      #       -v ${{ github.workspace }}:/workspace \
      #       -w /workspace/cdktf \
      #       -e NOMAD_ADDR=${{ secrets.NOMAD_ADDR }} \
      #       -e CONSUL_HTTP_ADDR=${{ secrets.CONSUL_HTTP_ADDR }} \
      #       -e VAULT_ADDR=${{ secrets.VAULT_ADDR }} \
      #       docker-mirror.service.consul/ops-build-image:latest \
      #       make synth

      # Save compiled binaries as artifacts
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cdktf-binaries
          path: cdktf/bin/
          retention-days: 7

      # Clean up Docker resources
      - name: Clean up Docker resources
        if: always()
        run: docker system prune -f --volumes || true
