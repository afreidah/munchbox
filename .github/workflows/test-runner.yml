name: Test Self-Hosted Runner

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  test-runner:
    name: Test Nomad Runner
    runs-on: [self-hosted, nomad, linux]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Show runner info
        run: |
          echo "=== Runner Information ==="
          echo "Hostname: $(hostname)"
          echo "User: $(whoami)"
          echo "OS: $(uname -a)"
          echo "CPU cores: $(nproc)"
          echo "Memory: $(free -h)"
          echo "Disk: $(df -h /)"
      
      - name: Test Docker availability
        run: |
          echo "=== Docker Info ==="
          docker --version
          docker ps
      
      - name: Simple build test
        run: |
          echo "=== Build Test ==="
          cat > Dockerfile <<EOF
          FROM alpine:latest
          RUN echo "Hello from self-hosted runner!"
          EOF
          docker build -t test-build .
          docker run --rm test-build
          docker rmi test-build
      
      - name: Success
        run: echo "Self-hosted runner is working!"
