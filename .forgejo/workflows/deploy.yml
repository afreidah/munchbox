# -------------------------------------------------------------------------------
# munchbox post-merge deploy
#
# Runs inside the cluster on an on-demand forgejo-ci-runner, which is dispatched
# by the ci-runner-scaler Temporal workflow when this job goes queued.
#
# The branch filter is required: gitgogit mirrors every branch with no filter, so
# an unfiltered workflow would run off feature branches too.
#
# The presence of this directory is load-bearing. Forgejo resolves workflows from
# the first of .forgejo/workflows, .gitea/workflows, .github/workflows that
# exists and stops there, so this file is what keeps it from re-running the
# GitHub pipeline that gitgogit mirrors in.
#
# Author: Alex Freidah / Project: Munchbox
# -------------------------------------------------------------------------------

name: Deploy

on:
  push:
    branches: [main]

env:
  NOMAD_ADDR: https://192.168.68.61:4646
  NOMAD_TLS_SERVER_NAME: server.global.nomad
  # The runner shares the host network stack, so the node's own Consul agent
  # answers plain HTTP on loopback and needs no CA.
  CONSUL_HTTP_ADDR: http://127.0.0.1:8500

jobs:
  # ---------------------------------------------------------------------------
  # Deploy the Nomad jobs this push changed.
  #
  # Scope comes from diffing against the last commit this workflow deployed,
  # recorded in Consul KV by the job below. A push event's own base SHA is not
  # usable here: the mirror is force-pushed and pruned, and one mirror interval
  # can deliver several commits as a single push.
  # ---------------------------------------------------------------------------
  nomad:
    name: Deploy changed Nomad jobs
    runs-on: ops
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the recorded base SHA is resolvable, and submodules
          # because pack jobs render from nomad/packs/registry.
          fetch-depth: 0
          submodules: true

      - name: Resolve the deploy range
        id: range
        env:
          CONSUL_HTTP_TOKEN: ${{ secrets.CONSUL_HTTP_TOKEN }}
        run: |
          set -euo pipefail

          base=$(consul kv get deploy/munchbox/last-sha 2>/dev/null || true)

          # No recorded base, or one this tree does not contain (the mirror is
          # force-pushed, so a recorded commit can vanish): deploy nothing and
          # let the record step below re-establish the baseline. Deploying
          # everything instead would redeploy the whole cluster.
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "no usable base (got '${base:-<unset>}'); skipping deploys this run"
            echo "jobs=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Job names come from the spec filenames, which is what `make run
          # JOB=` resolves. The directory is not the job name: gh-token-renewer/
          # holds github-token-renewer, and infrastructure/temporal/ and
          # infrastructure/registry/ hold three and two specs each.
          #
          # A changed .hcl deploys that job alone. Anything else under the
          # directory -- a files/ template, a script -- deploys every spec in
          # the nearest ancestor directory holding one, because a shared
          # template cannot be attributed to a single job.
          #
          # awk excludes deprecated/ rather than grep: grep exits 1 when it
          # matches nothing, so under pipefail a push touching no Nomad job --
          # the ordinary case -- would fail this step. awk exits 0 on empty
          # input.
          jobs=$(git diff --name-only "$base" "${{ github.sha }}" -- nomad/jobs/ \
            | awk -F/ 'NF>=4 && $3 != "deprecated"' \
            | while IFS= read -r path; do
                case "$path" in
                  *.hcl)
                    name=$(basename "$path" .hcl)
                    echo "${name%.nomad}"
                    ;;
                  *)
                    dir=$(dirname "$path")
                    while [ "$dir" != "nomad/jobs" ] && [ "$dir" != "." ]; do
                      specs=$(find "$dir" -maxdepth 1 -name '*.hcl')
                      if [ -n "$specs" ]; then
                        for spec in $specs; do
                          name=$(basename "$spec" .hcl)
                          echo "${name%.nomad}"
                        done
                        break
                      fi
                      dir=$(dirname "$dir")
                    done
                    ;;
                esac
              done \
            | sort -u \
            | tr '\n' ' ')

          echo "base: $base"
          echo "changed jobs: ${jobs:-<none>}"
          echo "jobs=${jobs}" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: ${{ steps.range.outputs.jobs != '' }}
        env:
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
          # pki_int signs the Nomad server cert, and the runner mounts its chain
          # into every job container. It cannot be fetched from Vault instead:
          # Vault serves the chain over a connection secured by that same CA, so
          # a client that does not already trust it is refused before it can
          # download it.
          NOMAD_CACERT: /etc/ssl/certs/munchbox-ca.pem
        run: |
          set -euo pipefail

          # Jobs that must never deploy from here: the first two would tear down
          # the run that is deploying them, and the rest move the cluster out
          # from under it -- patroni rolls the Postgres primary, traefik and
          # keepalived carry the ingress VIP. Those stay manual.
          never="forgejo forgejo-ci-runner patroni traefik keepalived"

          rc=0
          for job in ${{ steps.range.outputs.jobs }}; do
            if echo " $never " | grep -q " $job "; then
              echo "::warning title=skipped::$job changed but is deploy-by-hand only"
              continue
            fi
            echo "=== $job ==="
            ( cd nomad && make run JOB="$job" ) || { echo "::error title=deploy::$job failed"; rc=1; }
          done
          exit $rc

  # ---------------------------------------------------------------------------
  # Build and push the container images this push changed.
  #
  # Covers both trees that hold one: docker/ for the CI and database images, and
  # src/ for the applications that have not outgrown this repo. A directory
  # qualifies by having a push target, which is also what excludes
  # src/vault-cert-manager -- it is a submodule and builds no image.
  #
  # Each image owns its own build: the Makefile declares the platforms and tags,
  # and this runs `make push` exactly as it would be run by hand, so CI never
  # decides the build strategy.
  #
  # binfmt is installed first because the clients carry no qemu handlers, so
  # buildx would otherwise report only amd64 and the multi-arch push would fail.
  # ---------------------------------------------------------------------------
  images:
    name: Build and push changed images
    runs-on: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the build range
        id: range
        env:
          CONSUL_HTTP_ADDR: http://127.0.0.1:8500
          CONSUL_HTTP_TOKEN: ${{ secrets.CONSUL_HTTP_TOKEN }}
        run: |
          set -euo pipefail

          base=$(consul kv get deploy/munchbox/last-sha 2>/dev/null || true)
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "no usable base (got '${base:-<unset>}'); skipping builds this run"
            echo "images=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          dirs=$(git diff --name-only "$base" "${{ github.sha }}" -- docker/ src/ \
            | awk -F/ 'NF>=3 {print $1"/"$2}' \
            | sort -u)

          # `make -n` rather than grepping for the target: docker/ images take
          # push from the shared _common.mk, so it is not in their own Makefile.
          images=""
          for d in $dirs; do
            make -C "$d" -n push >/dev/null 2>&1 && images="$images $d"
          done
          images=$(echo "$images" | sed 's/^ *//')

          echo "base: $base"
          echo "changed dirs: ${dirs:-<none>}"
          echo "buildable: ${images:-<none>}"
          echo "images=${images}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: ${{ steps.range.outputs.images != '' }}
        run: |
          set -euo pipefail

          docker run --privileged --rm tonistiigi/binfmt --install all

          rc=0
          for dir in ${{ steps.range.outputs.images }}; do
            echo "=== $dir ==="
            make -C "$dir" push || { echo "::error title=build::$dir failed"; rc=1; }
          done
          exit $rc

  # ---------------------------------------------------------------------------
  # Upload the cinc cookbooks, roles and nodes this push changed.
  #
  # Runs on the cinc label, whose image is the only one carrying knife. That
  # image has neither the consul nor the vault CLI, so both lookups go over
  # HTTP: consul answers plain HTTP on loopback, and vault is reached with the
  # intermediate CA the runner mounts into every job container.
  #
  # The client key and the server's certificate are fetched at run time rather
  # than held as Forgejo action secrets, so rotating either is a Vault write
  # and nothing here changes.
  #
  # Uploads carry whatever version metadata.rb declares. Requiring a bump is a
  # review-time gate on the GitHub side, not something this enforces.
  # ---------------------------------------------------------------------------
  cinc:
    name: Upload changed cinc cookbooks, roles and nodes
    runs-on: cinc
    env:
      CINC_LICENSE: accept
      CHEF_LICENSE: accept
      CINC_CI_DIR: /tmp/cinc-ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the upload range
        id: range
        env:
          CONSUL_HTTP_ADDR: http://127.0.0.1:8500
          CONSUL_HTTP_TOKEN: ${{ secrets.CONSUL_HTTP_TOKEN }}
        run: |
          set -euo pipefail

          base=$(curl -sS -H "X-Consul-Token: ${CONSUL_HTTP_TOKEN}" \
            "${CONSUL_HTTP_ADDR}/v1/kv/deploy/munchbox/last-sha?raw" || true)

          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "no usable base (got '${base:-<unset>}'); skipping uploads this run"
            { echo "cookbooks="; echo "roles="; echo "nodes="; echo "any="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --diff-filter=d drops deletions: knife has no delete-from-file form,
          # and uploading a path that no longer exists just fails the run.
          #
          # awk rather than grep for the extension filters: grep exits 1 when it
          # matches nothing, so under pipefail a push touching no cinc file --
          # the ordinary case -- would fail this step.
          changed() {
            git diff --name-only --diff-filter=d "$base" "${{ github.sha }}" -- "$@"
          }

          # A cookbook is named by its directory, so NF>=5 keeps loose files
          # directly under cookbooks/ (simplecov_bootstrap.rb) out of the list.
          # Roles are ruby, nodes are json; filtering on the wrong extension
          # uploads nothing and says nothing.
          cookbooks=$(changed infrastructure/cinc/cookbooks/ \
            | awk -F/ 'NF>=5 {print $4}' | sort -u | tr '\n' ' ')
          roles=$(changed infrastructure/cinc/roles/ | awk '/\.rb$/' | sort -u | tr '\n' ' ')
          nodes=$(changed infrastructure/cinc/nodes/ | awk '/\.json$/' | sort -u | tr '\n' ' ')

          echo "base: $base"
          echo "cookbooks: ${cookbooks:-<none>}"
          echo "roles: ${roles:-<none>}"
          echo "nodes: ${nodes:-<none>}"

          {
            echo "cookbooks=${cookbooks}"
            echo "roles=${roles}"
            echo "nodes=${nodes}"
            echo "any=${cookbooks}${roles}${nodes}"
          } >> "$GITHUB_OUTPUT"

      - name: Configure knife
        if: ${{ steps.range.outputs.any != '' }}
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "${CINC_CI_DIR}/trusted_certs"

          # --fail so an auth or policy error is a failed step rather than a
          # jq parse of an error document; -e so a null field fails too.
          vault_field() {
            curl -sS --fail --cacert /etc/ssl/certs/munchbox-ca.pem \
              -H "X-Vault-Token: ${VAULT_TOKEN}" \
              "${VAULT_ADDR}/v1/secret/data/$1" | jq -er ".data.data.$2"
          }

          vault_field cinc-server/ci/forgejo private_key > "${CINC_CI_DIR}/forgejo-ci.pem"
          # cinc-server presents its own self-signed certificate, which the
          # mounted intermediate CA does not chain to; knife trusts it from here.
          vault_field cinc-server/trusted-cert cert > "${CINC_CI_DIR}/trusted_certs/cinc-server_munchbox_cc.crt"

          cat > "${CINC_CI_DIR}/knife.rb" <<EOF
          chef_server_url   'https://cinc-server.munchbox.cc/organizations/munchbox'
          node_name         'forgejo-ci'
          client_key        '${CINC_CI_DIR}/forgejo-ci.pem'
          trusted_certs_dir '${CINC_CI_DIR}/trusted_certs'
          cookbook_path     '${GITHUB_WORKSPACE}/infrastructure/cinc/cookbooks'
          EOF

          knife client list -c "${CINC_CI_DIR}/knife.rb" >/dev/null
          echo "authenticated to cinc-server as forgejo-ci"

      - name: Upload
        if: ${{ steps.range.outputs.any != '' }}
        run: |
          set -euo pipefail

          cfg="${CINC_CI_DIR}/knife.rb"
          rc=0

          for cookbook in ${{ steps.range.outputs.cookbooks }}; do
            echo "=== cookbook $cookbook ==="
            knife cookbook upload "$cookbook" -c "$cfg" \
              || { echo "::error title=cinc::cookbook $cookbook failed"; rc=1; }
          done

          for role in ${{ steps.range.outputs.roles }}; do
            echo "=== role $role ==="
            knife role from file "$role" -c "$cfg" \
              || { echo "::error title=cinc::role $role failed"; rc=1; }
          done

          for node in ${{ steps.range.outputs.nodes }}; do
            echo "=== node $node ==="
            knife node from file "$node" -c "$cfg" \
              || { echo "::error title=cinc::node $node failed"; rc=1; }
          done

          exit $rc

      - name: Drop the fetched credentials
        if: ${{ always() }}
        run: rm -rf "${CINC_CI_DIR}"

  # ---------------------------------------------------------------------------
  # Record which commit is deployed, once the deploy above has succeeded, so the
  # key means the last commit that actually landed and the next run resumes from
  # a truthful baseline.
  # ---------------------------------------------------------------------------
  record:
    name: Record the deployed commit
    needs: [nomad, images, cinc]
    runs-on: ops
    steps:
      - name: Record the deployed commit in Consul KV
        env:
          CONSUL_HTTP_TOKEN: ${{ secrets.CONSUL_HTTP_TOKEN }}
        run: |
          set -euo pipefail

          consul kv put deploy/munchbox/last-sha "${{ github.sha }}"
          consul kv put deploy/munchbox/last-ref "${{ github.ref }}"
          consul kv put deploy/munchbox/last-deployed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Read back, so a silently-accepted write cannot pass as a success.
          got=$(consul kv get deploy/munchbox/last-sha)
          [ "$got" = "${{ github.sha }}" ] || {
            echo "::error::readback mismatch: stored $got, expected ${{ github.sha }}"
            exit 1
          }
          echo "recorded ${got}"
