# -------------------------------------------------------------------------------
# munchbox terragrunt plan / apply
#
# Separate from the post-merge deploy because applying infrastructure is gated on
# a human reading the plan first. A push plans and stops there; applying is a
# manual workflow_dispatch, which Forgejo surfaces as a Run workflow button.
# Forgejo has no approval gates, so two runs is how that gate is expressed.
#
# Both modes resolve the same unit set from deploy/munchbox/terragrunt-last-sha,
# so an apply runs exactly what its plan showed. That key advances only after a
# successful apply, so merging several times and applying once misses nothing.
#
# Author: Alex Freidah / Project: Munchbox
# -------------------------------------------------------------------------------

name: Terragrunt

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type apply to run terragrunt apply against the planned units"
        required: true
        type: string

env:
  CONSUL_HTTP_ADDR: http://127.0.0.1:8500
  # terragrunt defaults to tofu, and only `run` honours root.hcl's
  # terraform_binary. A discovery command left on the default re-resolves
  # providers against the OpenTofu registry and rewrites every lock file it
  # touches.
  TG_TF_PATH: terraform
  TG_NON_INTERACTIVE: "true"
  # Every unit unpacks its own provider binaries with the cache off, so all 55
  # starting at once starves plugin startup and terraform gives up waiting on
  # the handshake.
  TG_PARALLELISM: "12"

jobs:
  terragrunt:
    name: Plan on push, apply on dispatch
    runs-on: ops
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- a dispatch with anything other than `apply` stops here, so the
      #     button cannot be hit by accident ---
      - name: Require an explicit confirmation to apply
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.confirm != 'apply' }}
        run: |
          echo "::error::confirm must be exactly 'apply'"
          exit 1

      - name: Resolve the unit set
        id: units
        env:
          CONSUL_HTTP_TOKEN: ${{ secrets.CONSUL_HTTP_TOKEN }}
        run: |
          set -euo pipefail

          base=$(consul kv get deploy/munchbox/terragrunt-last-sha 2>/dev/null || true)

          # No recorded base, or one this tree no longer contains (the mirror is
          # force-pushed, so a recorded commit can vanish): seed the key and do
          # nothing. Planning every unit instead would init 75 of them against
          # every provider, and applying them is not what an empty baseline means.
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "no usable base (got '${base:-<unset>}'); seeding baseline, nothing to do"
            consul kv put deploy/munchbox/terragrunt-last-sha "${{ github.sha }}" >/dev/null
            { echo "units="; echo "skipped="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cd infrastructure/terragrunt

          # terragrunt's own selection: the units a git range affects plus the
          # units downstream of them, in dependency order. Choosing changed
          # directories by hand would miss the downstream half -- a changed
          # generator whose consumer never re-applies writes nothing to Vault.
          # list reports repo-relative paths, find reports them relative to the
          # terragrunt root. Normalize here so the two agree: a mismatch makes
          # the dependency lookup below silently find nothing.
          affected=$(terragrunt list --filter="[${base}...${{ github.sha }}]" --dag 2>/dev/null \
            | awk 'NF { sub(/^infrastructure\/terragrunt\//, "", $1); print $1 }' || true)

          # A dependency block is resolved by running `terraform output` inside
          # the dependency's directory, which only answers once that unit has
          # been initialized. The selection above adds the units downstream of a
          # change and never the upstream ones they read from, so a small set
          # leaves those uninitialized and every dependent dies on "Required
          # plugins are not installed". It went unnoticed while the recorded
          # baseline was stale, because a run covering every unit initializes
          # them all as a side effect. Walk the graph and pull the closure in.
          deps_file=$(mktemp)
          terragrunt find --dependencies --format=json \
            | jq -r '.[] | select(.dependencies) | .path as $p | .dependencies[] | "\($p) \(.)"' > "$deps_file"

          affected=$(printf '%s\n' "$affected" | awk '
            NR==FNR { dep[$1] = dep[$1] " " $2; next }
            NF      { queue[++n] = $1 }
            END {
              for (i = 1; i <= n; i++) {
                u = queue[i]
                if (u in seen) continue
                seen[u] = 1
                c = split(dep[u], d, " ")
                for (j = 1; j <= c; j++) if (d[j] != "" && !(d[j] in seen)) queue[++n] = d[j]
              }
              for (u in seen) print u
            }
          ' "$deps_file" - | sort)

          # Units that would break the run applying them: the first rewrites the
          # VAULT_TOKEN this job is holding, the next three own its own policies
          # and ACL tokens, and the last two can destroy machines. The rest
          # follow the same rule: minting a secret needs write on paths this
          # token only reads, and cluster-wide Nomad config needs operator
          # write, which is the whole point of the scoped token.
          deny='cluster/secrets/forgejo|cluster/vault-config|cluster/consul-acls|cluster/nomad-acls|cluster/nomad-config|cluster/vault-secrets|cluster/secrets/oauth2-proxy|proxmox/vms/|oci/vms/'

          # grep exits 1 on no match, which under pipefail would fail the step on
          # the ordinary case of a push touching no terragrunt unit.
          units=$(printf '%s\n' "$affected" | awk 'NF' | grep -Ev "$deny" | tr '\n' ' ' || true)
          skipped=$(printf '%s\n' "$affected" | awk 'NF' | grep -E "$deny" | tr '\n' ' ' || true)

          echo "base:    $base"
          echo "units:   ${units:-<none>}"
          echo "by hand: ${skipped:-<none>}"

          { echo "units=${units}"; echo "skipped=${skipped}"; } >> "$GITHUB_OUTPUT"

      - name: Report units left for a human
        if: ${{ steps.units.outputs.skipped != '' }}
        run: |
          for unit in ${{ steps.units.outputs.skipped }}; do
            echo "::warning title=apply by hand::$unit changed but is denylisted"
          done

      - name: Plan or apply
        if: ${{ steps.units.outputs.units != '' }}
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          CONSUL_HTTP_TOKEN: ${{ secrets.CONSUL_HTTP_TOKEN }}
          # Set before sourcing, because the env file reads every credential out
          # of Vault while it runs -- a CA it cannot open empties all of them.
          # This is the chain the runner job mounts into each container.
          VAULT_CACERT: /etc/ssl/certs/munchbox-ca.pem
        run: |
          set -euo pipefail

          # Provider credentials come from the committed env file, which reads
          # every one of them out of Vault with the token above.
          source ./munchbox-env.sh

          # The env file describes a workstation: mTLS to Consul and Nomad with
          # client certs under ~/.munchbox. The runner has neither and needs
          # neither -- Consul answers plain HTTP on loopback because the runner
          # shares the host network stack, and Nomad verifies with the mounted
          # CA alone, exactly as the deploy workflow does.
          unset CONSUL_CACERT CONSUL_CLIENT_CERT CONSUL_CLIENT_KEY
          unset NOMAD_CLIENT_CERT NOMAD_CLIENT_KEY
          export CONSUL_HTTP_ADDR=http://127.0.0.1:8500
          export NOMAD_CACERT=/etc/ssl/certs/munchbox-ca.pem
          export NOMAD_TOKEN='${{ secrets.NOMAD_TOKEN }}'

          # A cross-platform lock file carries zh: for every platform but h1:
          # only for the machine that generated it. The cache serves a
          # pre-extracted package, which terraform can verify against h1: alone,
          # so every install fails on a runner of a different architecture.
          export TG_PROVIDER_CACHE=0

          # The job container's writable layer is capped well below what 55
          # units of provider installs need, and both the unpacked modules and
          # the checkout live in it, so a run dies part-way with ENOSPC while
          # the host still has tens of gigabytes free. The runner mounts the
          # shared disk for exactly this; point the cache at it.
          #
          # Set here rather than in the job's env: munchbox-env.sh exports this
          # variable itself, and it is sourced above, so anything set earlier is
          # overwritten before terragrunt ever sees it.
          export TG_DOWNLOAD_DIR=/ci-cache/terragrunt/download
          export TERRAGRUNT_DOWNLOAD="$TG_DOWNLOAD_DIR"
          mkdir -p "$TG_DOWNLOAD_DIR"

          cd infrastructure/terragrunt

          filter=""
          for unit in ${{ steps.units.outputs.units }}; do
            filter="${filter} --filter=${unit}"
          done

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            terragrunt run --all apply ${filter}
          else
            terragrunt run --all plan ${filter}
            echo "::notice title=plan only::run this workflow manually with confirm=apply to apply it"
          fi

      # --- only an apply advances the baseline, so a plan-only push leaves the
      #     next run showing the same units ---
      - name: Record the applied commit
        if: ${{ github.event_name == 'workflow_dispatch' && steps.units.outputs.units != '' }}
        env:
          CONSUL_HTTP_TOKEN: ${{ secrets.CONSUL_HTTP_TOKEN }}
        run: |
          set -euo pipefail

          consul kv put deploy/munchbox/terragrunt-last-sha "${{ github.sha }}"

          # Read back, so a silently-accepted write cannot pass as a success.
          got=$(consul kv get deploy/munchbox/terragrunt-last-sha)
          [ "$got" = "${{ github.sha }}" ] || {
            echo "::error::readback mismatch: stored $got, expected ${{ github.sha }}"
            exit 1
          }
          echo "recorded ${got}"
