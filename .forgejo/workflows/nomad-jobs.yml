# -------------------------------------------------------------------------------
# Nomad Jobs Pipeline
#
# Project: Munchbox / Author: Alex Freidah
#
# Validates and plans Nomad job changes on PRs. Deploys on merge to main.
# -------------------------------------------------------------------------------

name: Nomad Jobs

on:
  push:
    paths:
      - 'nomad/jobs/**'
      - 'nomad/packs/**'
  pull_request:
    paths:
      - 'nomad/jobs/**'
      - 'nomad/packs/**'
  workflow_dispatch:

jobs:
  detect-and-validate:
    runs-on: docker
    container:
      image: registry.munchbox.cc/ops-build-image:v3
    outputs:
      changed_jobs: ${{ steps.detect.outputs.jobs }}
      jobs_matrix: ${{ steps.detect.outputs.jobs_matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Detect changed jobs
        id: detect
        run: |
          echo "Detecting changed jobs..."
          git fetch origin main --depth=1 || true

          # Get all .hcl files changed (exclude files/ subdirs and deleted files)
          # On merge to main, origin/main..HEAD is empty, so compare against previous commit
          DIFF_TARGET="origin/main..HEAD"
          if [ -z "$(git diff --name-only $DIFF_TARGET -- nomad/jobs/ 2>/dev/null)" ]; then
            echo "No changes vs origin/main, comparing against previous commit..."
            DIFF_TARGET="HEAD~1"
          fi

          CHANGED=$(git diff --name-only --diff-filter=d $DIFF_TARGET -- nomad/jobs/ 2>/dev/null \
            | grep '\.hcl$' \
            | grep -v '/files/' \
            | xargs -I{} basename {} .hcl \
            | sed 's/\.nomad$//' \
            | sort -u \
            | tr '\n' ' ')

          if [ -n "$CHANGED" ]; then
            echo "Changed jobs: $CHANGED"
            # Output as space-separated for backward compat
            echo "jobs=$CHANGED" >> $GITHUB_OUTPUT
            # Output as JSON array for matrix strategy
            JSON_ARRAY=$(echo "$CHANGED" | xargs -n1 | jq -R . | jq -s -c .)
            echo "jobs_matrix=$JSON_ARRAY" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No job changes detected"
            echo "jobs=" >> $GITHUB_OUTPUT
            echo "jobs_matrix=[]" >> $GITHUB_OUTPUT
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate jobs
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          cd nomad
          for job in ${{ steps.detect.outputs.jobs }}; do
            echo "=== Validating $job ==="
            make validate JOB="$job" || exit 1
          done

  plan-jobs:
    runs-on: docker
    needs: detect-and-validate
    if: needs.detect-and-validate.outputs.has_changes == 'true'
    strategy:
      matrix:
        job: ${{ fromJson(needs.detect-and-validate.outputs.jobs_matrix) }}
      fail-fast: false
    container:
      image: registry.munchbox.cc/ops-build-image:v3
    env:
      NOMAD_ADDR: https://192.168.68.61:4646
      NOMAD_SKIP_VERIFY: "true"
      NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
    outputs:
      plan_result: ${{ steps.plan.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Plan ${{ matrix.job }}
        id: plan
        run: |
          cd nomad
          echo "Planning ${{ matrix.job }}..."
          PLAN_OUTPUT=$(make plan JOB="${{ matrix.job }}" 2>&1) || true

          # Check if plan has real changes (not just pack.path metadata)
          HAS_REAL_CHANGES="false"
          if echo "$PLAN_OUTPUT" | grep -qE "(create|destroy|in-place update|create/destroy)"; then
            REAL_CHANGES=$(echo "$PLAN_OUTPUT" | grep -E "^\+/-|^\+|^-" | grep -v "pack.path" || true)
            if [ -n "$REAL_CHANGES" ]; then
              HAS_REAL_CHANGES="true"
            fi
          fi

          # Output results
          echo "job=${{ matrix.job }}" >> $GITHUB_OUTPUT
          echo "has_changes=$HAS_REAL_CHANGES" >> $GITHUB_OUTPUT

          # Save plan to artifact
          mkdir -p /tmp/plans
          if [ "$HAS_REAL_CHANGES" = "true" ]; then
            echo "$PLAN_OUTPUT" > "/tmp/plans/${{ matrix.job }}.txt"
          fi

      - name: Upload plan artifact
        if: steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: plan-${{ matrix.job }}
          path: /tmp/plans/${{ matrix.job }}.txt
          retention-days: 1

  comment-plan:
    runs-on: docker
    needs: [detect-and-validate, plan-jobs]
    if: always() && github.event_name == 'pull_request' && needs.detect-and-validate.outputs.has_changes == 'true'
    container:
      image: registry.munchbox.cc/ops-build-image:v3
    steps:
      - name: Download all plan artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: plan-*
          path: /tmp/plans
          merge-multiple: true
        continue-on-error: true

      - name: Build and post PR comment
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PLAN_FILE="/tmp/plan_output.md"

          # Check if any plans were downloaded
          if [ -d "/tmp/plans" ] && [ "$(ls -A /tmp/plans 2>/dev/null)" ]; then
            echo "## Nomad Job Plan" > "$PLAN_FILE"
            echo "" >> "$PLAN_FILE"
            echo "The following jobs have changes to be applied:" >> "$PLAN_FILE"
            echo "" >> "$PLAN_FILE"

            for plan in /tmp/plans/*.txt; do
              [ -f "$plan" ] || continue
              JOB_NAME=$(basename "$plan" .txt)
              echo "<details>" >> "$PLAN_FILE"
              echo "<summary><b>${JOB_NAME}</b></summary>" >> "$PLAN_FILE"
              echo "" >> "$PLAN_FILE"
              echo '```' >> "$PLAN_FILE"
              cat "$plan" >> "$PLAN_FILE"
              echo '```' >> "$PLAN_FILE"
              echo "" >> "$PLAN_FILE"
              echo "</details>" >> "$PLAN_FILE"
              echo "" >> "$PLAN_FILE"
            done

            echo "---" >> "$PLAN_FILE"
            echo "*Plan generated by CI. Review changes before merging.*" >> "$PLAN_FILE"

            # Post comment
            jq -n --rawfile body "$PLAN_FILE" '{body: $body}' > /tmp/comment.json
            curl -s -X POST \
              -H "Authorization: token ${FORGEJO_TOKEN}" \
              -H "Content-Type: application/json" \
              -d @/tmp/comment.json \
              "${{ github.api_url }}/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments"
          else
            echo "No jobs with real changes to comment on."
          fi

  deploy-jobs:
    runs-on: docker
    needs: [detect-and-validate, plan-jobs, comment-plan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.detect-and-validate.outputs.has_changes == 'true'
    strategy:
      matrix:
        job: ${{ fromJson(needs.detect-and-validate.outputs.jobs_matrix) }}
      fail-fast: false
      max-parallel: 4
    container:
      image: registry.munchbox.cc/ops-build-image:v3
    env:
      NOMAD_ADDR: https://192.168.68.61:4646
      NOMAD_SKIP_VERIFY: "true"
      NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Deploy ${{ matrix.job }}
        run: |
          cd nomad
          echo "Deploying ${{ matrix.job }}..."
          make run JOB="${{ matrix.job }}"
