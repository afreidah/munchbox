# -------------------------------------------------------------------------------
# Nomad Jobs Pipeline
#
# Project: Munchbox / Author: Alex Freidah
#
# Validates and plans Nomad job changes on PRs. Deploys on merge to main.
# -------------------------------------------------------------------------------

name: Nomad Jobs

on:
  push:
    paths:
      - 'nomad/jobs/**'
      - 'nomad/packs/**'
  pull_request:
    paths:
      - 'nomad/jobs/**'
      - 'nomad/packs/**'
  workflow_dispatch:

jobs:
  detect-and-validate:
    runs-on: docker
    container:
      image: registry.munchbox.cc/ops-build-image:v3
    outputs:
      changed_jobs: ${{ steps.detect.outputs.jobs }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Detect changed jobs
        id: detect
        run: |
          echo "Detecting changed jobs..."
          git fetch origin main --depth=1 || true

          # Get all .hcl files changed in this branch vs main (exclude files/ subdirs)
          CHANGED=$(git diff --name-only origin/main...HEAD -- nomad/jobs/ 2>/dev/null \
            | grep '\.hcl$' \
            | grep -v '/files/' \
            | xargs -I{} basename {} .hcl \
            | sed 's/\.nomad$//' \
            | sort -u \
            | tr '\n' ' ')

          if [ -n "$CHANGED" ]; then
            echo "Changed jobs: $CHANGED"
            echo "jobs=$CHANGED" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No job changes detected"
            echo "jobs=" >> $GITHUB_OUTPUT
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate jobs
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          cd nomad
          for job in ${{ steps.detect.outputs.jobs }}; do
            echo "=== Validating $job ==="
            make validate JOB="$job" || exit 1
          done

  plan-jobs:
    runs-on: docker
    needs: detect-and-validate
    if: needs.detect-and-validate.outputs.has_changes == 'true'
    container:
      image: registry.munchbox.cc/ops-build-image:v3
    env:
      NOMAD_ADDR: https://192.168.68.61:4646
      NOMAD_SKIP_VERIFY: "true"
      NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Plan jobs
        id: plan
        run: |
          cd nomad
          PLAN_FILE="/tmp/plan_output.md"
          echo "## Nomad Job Plan" > "$PLAN_FILE"
          echo "" >> "$PLAN_FILE"

          for job in ${{ needs.detect-and-validate.outputs.changed_jobs }}; do
            echo "Planning $job..."
            echo "<details>" >> "$PLAN_FILE"
            echo "<summary><b>${job}</b></summary>" >> "$PLAN_FILE"
            echo "" >> "$PLAN_FILE"
            echo '```' >> "$PLAN_FILE"
            make plan JOB="$job" 2>&1 >> "$PLAN_FILE" || true
            echo '```' >> "$PLAN_FILE"
            echo "" >> "$PLAN_FILE"
            echo "</details>" >> "$PLAN_FILE"
            echo "" >> "$PLAN_FILE"
          done

          echo "---" >> "$PLAN_FILE"
          echo "*Plan generated by CI. Review changes before merging.*" >> "$PLAN_FILE"

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -n --rawfile body /tmp/plan_output.md '{body: $body}' > /tmp/comment.json
          curl -s -X POST \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            -H "Content-Type: application/json" \
            -d @/tmp/comment.json \
            "${{ github.api_url }}/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments"

  deploy-jobs:
    runs-on: docker
    needs: [detect-and-validate, plan-jobs]
    # TEMPORARILY DISABLED - uncomment to re-enable auto-deploy
    if: false && github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.detect-and-validate.outputs.has_changes == 'true'
    container:
      image: registry.munchbox.cc/ops-build-image:v3
    env:
      NOMAD_ADDR: https://192.168.68.61:4646
      NOMAD_SKIP_VERIFY: "true"
      NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Deploy jobs
        run: |
          cd nomad
          for job in ${{ needs.detect-and-validate.outputs.changed_jobs }}; do
            echo "=== Deploying $job ==="
            make run JOB="$job" || exit 1
          done
