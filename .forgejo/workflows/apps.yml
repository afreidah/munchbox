# -------------------------------------------------------------------------------
# Source Applications Pipeline
#
# Project: Munchbox / Author: Alex Freidah
#
# Dynamically detects and builds apps in src/. Apps are identified by having a
# Makefile. Supports Docker images (push target), Debian packages (build-deb
# target), and Go tests (test target). Only builds apps with actual changes.
# -------------------------------------------------------------------------------

name: Source Applications

on:
  push:
    paths:
      - 'src/**'
  pull_request:
    paths:
      - 'src/**'
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------------------
  # Detect apps and changes
  # -------------------------------------------------------------------------

  detect:
    runs-on: docker
    container:
      image: registry.munchbox.cc/ops-build-image:v3
      options: --dns 192.168.68.64 --dns 192.168.68.62
    outputs:
      apps_to_test: ${{ steps.detect.outputs.apps_to_test }}
      apps_to_push: ${{ steps.detect.outputs.apps_to_push }}
      apps_to_deb: ${{ steps.detect.outputs.apps_to_deb }}
      has_tests: ${{ steps.detect.outputs.has_tests }}
      has_pushes: ${{ steps.detect.outputs.has_pushes }}
      has_debs: ${{ steps.detect.outputs.has_debs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed apps
        id: detect
        run: |
          # For merge commits, compare against first parent (previous main)
          # For regular commits, HEAD^1 is just the previous commit
          CHANGED=$(git diff --name-only HEAD^1 HEAD -- src/ 2>/dev/null || true)

          # Fallback: compare against origin/main for PRs or if above fails
          if [ -z "$CHANGED" ]; then
            echo "HEAD^1 diff empty, comparing against origin/main..."
            git fetch origin main --depth=1 || true
            CHANGED=$(git diff --name-only origin/main...HEAD -- src/ 2>/dev/null || true)
          fi

          echo "Changed files:"
          echo "$CHANGED"
          echo ""

          # Find all app directories with Makefiles
          # Use simple space-separated lists, convert to JSON at the end
          TEST_APPS=""
          PUSH_APPS=""
          DEB_APPS=""

          echo "Checking for jq..."
          which jq && jq --version || echo "WARNING: jq not found!"

          echo ""
          echo "Looking for Makefiles in src/..."
          find src -name "Makefile" -type f

          for makefile in $(find src -name "Makefile" -type f); do
            APP_DIR=$(dirname "$makefile")
            echo "Checking app: $APP_DIR"

            # Check if this app has changes
            if ! echo "$CHANGED" | grep -qE "^${APP_DIR}(/|$)"; then
              echo "  No changes"
              continue
            fi

            echo "  Has changes!"

            # Check for targets
            if grep -q "^push:" "$makefile"; then
              PUSH_APPS="$PUSH_APPS $APP_DIR"
              echo "    - push target"
            fi

            if grep -q "^build-deb:" "$makefile"; then
              DEB_APPS="$DEB_APPS $APP_DIR"
              echo "    - build-deb target"
            fi

            if grep -q "^test:" "$makefile"; then
              TEST_APPS="$TEST_APPS $APP_DIR"
              echo "    - test target"
            fi
          done

          # Convert space-separated lists to JSON arrays
          to_json_array() {
            local items="$1"
            if [ -z "$items" ]; then
              echo "[]"
            else
              echo "$items" | xargs -n1 | jq -R . | jq -s -c .
            fi
          }

          APPS_TO_TEST=$(to_json_array "$TEST_APPS")
          APPS_TO_PUSH=$(to_json_array "$PUSH_APPS")
          APPS_TO_DEB=$(to_json_array "$DEB_APPS")

          echo ""
          echo "Final results:"
          echo "  TEST_APPS: '$TEST_APPS'"
          echo "  APPS_TO_TEST: $APPS_TO_TEST"
          echo "  PUSH_APPS: '$PUSH_APPS'"
          echo "  APPS_TO_PUSH: $APPS_TO_PUSH"
          echo "  DEB_APPS: '$DEB_APPS'"
          echo "  APPS_TO_DEB: $APPS_TO_DEB"

          # Set outputs
          echo "apps_to_test=$APPS_TO_TEST" >> $GITHUB_OUTPUT
          echo "apps_to_push=$APPS_TO_PUSH" >> $GITHUB_OUTPUT
          echo "apps_to_deb=$APPS_TO_DEB" >> $GITHUB_OUTPUT

          # Set boolean flags - check for non-empty JSON arrays
          if [ "$APPS_TO_TEST" != "[]" ] && [ -n "$APPS_TO_TEST" ]; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
          fi

          if [ "$APPS_TO_PUSH" != "[]" ] && [ -n "$APPS_TO_PUSH" ]; then
            echo "has_pushes=true" >> $GITHUB_OUTPUT
          else
            echo "has_pushes=false" >> $GITHUB_OUTPUT
          fi

          if [ "$APPS_TO_DEB" != "[]" ] && [ -n "$APPS_TO_DEB" ]; then
            echo "has_debs=true" >> $GITHUB_OUTPUT
          else
            echo "has_debs=false" >> $GITHUB_OUTPUT
          fi

  # -------------------------------------------------------------------------
  # Run tests (matrix)
  # -------------------------------------------------------------------------

  test:
    runs-on: docker
    container:
      image: registry.munchbox.cc/ops-build-image:v3
      options: --dns 192.168.68.64 --dns 192.168.68.62
    needs: detect
    if: needs.detect.outputs.has_tests == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run tests
        env:
          APPS_TO_TEST: ${{ needs.detect.outputs.apps_to_test }}
        run: |
          echo "Apps to test: $APPS_TO_TEST"
          # Parse JSON array and run tests for each app
          echo "$APPS_TO_TEST" | jq -r '.[]' | while read -r app; do
            echo "=== Testing: $app ==="
            cd "$app"
            make test
            cd -
          done

  # -------------------------------------------------------------------------
  # Push Docker images
  # -------------------------------------------------------------------------

  push:
    runs-on: docker
    needs: [detect, test]
    if: |
      always() &&
      needs.detect.outputs.has_pushes == 'true' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Push apps
        env:
          APPS_TO_PUSH: ${{ needs.detect.outputs.apps_to_push }}
        run: |
          echo "Apps to push: $APPS_TO_PUSH"
          echo "$APPS_TO_PUSH" | jq -r '.[]' | while read -r app; do
            echo "=== Pushing: $app ==="
            cd "$app"
            make push
            cd - > /dev/null
          done

  # -------------------------------------------------------------------------
  # Build and publish Debian packages
  # -------------------------------------------------------------------------

  build-deb:
    runs-on: docker
    needs: [detect, test]
    if: |
      always() &&
      needs.detect.outputs.has_debs == 'true' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    env:
      APTLY_PASS: ${{ secrets.APTLY_PASS }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build and publish Debian packages
        env:
          APPS_TO_DEB: ${{ needs.detect.outputs.apps_to_deb }}
        run: |
          echo "Apps to build debs: $APPS_TO_DEB"
          echo "$APPS_TO_DEB" | jq -r '.[]' | while read -r app; do
            echo "=== Building debs for: $app ==="
            cd "$app"
            make build-deb
            make build-deb-arm64
            make publish-deb
            cd - > /dev/null
          done
