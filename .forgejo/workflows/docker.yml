# -------------------------------------------------------------------------------
# Docker Images Pipeline
#
# Project: Munchbox / Author: Alex Freidah
#
# Builds and tests Docker images on PRs. Pushes to registry on merge to main.
# Uses git diff-tree for change detection to handle merge commits correctly.
# -------------------------------------------------------------------------------

name: Docker Images

on:
  push:
    paths:
      - 'docker/**'
  pull_request:
    paths:
      - 'docker/**'
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Detect changed images
  # ---------------------------------------------------------------------------

  detect:
    runs-on: docker
    outputs:
      ops_build_image: ${{ steps.detect.outputs.ops_build_image }}
      patroni: ${{ steps.detect.outputs.patroni }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes
        id: detect
        run: |
          # Use diff-tree which works correctly for both regular and merge commits
          CHANGED=$(git diff-tree --no-commit-id --name-only -r HEAD 2>/dev/null || true)
          echo "Changed files:"
          echo "$CHANGED"
          echo ""

          if echo "$CHANGED" | grep -q "^docker/ops-build-image"; then
            echo "ops_build_image=true" >> $GITHUB_OUTPUT
            echo "ops-build-image: changed"
          else
            echo "ops_build_image=false" >> $GITHUB_OUTPUT
            echo "ops-build-image: no changes"
          fi

          if echo "$CHANGED" | grep -q "^docker/patroni"; then
            echo "patroni=true" >> $GITHUB_OUTPUT
            echo "patroni: changed"
          else
            echo "patroni=false" >> $GITHUB_OUTPUT
            echo "patroni: no changes"
          fi

  # ---------------------------------------------------------------------------
  # ops-build-image
  # ---------------------------------------------------------------------------

  build-ops-build-image:
    runs-on: docker
    needs: detect
    if: needs.detect.outputs.ops_build_image == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Build ops-build-image
        run: |
          cd docker/ops-build-image
          make build-multiarch

  push-ops-build-image:
    runs-on: docker
    needs: [detect, build-ops-build-image]
    if: |
      always() &&
      (needs.build-ops-build-image.result == 'success') &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Push ops-build-image
        run: |
          cd docker/ops-build-image
          make push

  # ---------------------------------------------------------------------------
  # patroni (PostgreSQL 18 + Patroni HA)
  # ---------------------------------------------------------------------------

  build-patroni:
    runs-on: docker
    needs: detect
    if: needs.detect.outputs.patroni == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Build patroni
        run: |
          cd docker/patroni
          make build-multiarch

  push-patroni:
    runs-on: docker
    needs: [detect, build-patroni]
    if: |
      always() &&
      (needs.build-patroni.result == 'success') &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Push patroni
        run: |
          cd docker/patroni
          make push
