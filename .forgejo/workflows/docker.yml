# -------------------------------------------------------------------------------
# Docker Images Pipeline
#
# Project: Munchbox / Author: Alex Freidah
#
# Builds and tests Docker images on PRs. Pushes to registry on merge to main.
# Uses git diff-tree for change detection to handle merge commits correctly.
# -------------------------------------------------------------------------------

name: Docker Images

on:
  push:
    paths:
      - 'docker/**'
  pull_request:
    paths:
      - 'docker/**'
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Pull latest ops-build-image (via mounted docker socket)
  # ---------------------------------------------------------------------------

  refresh-runner-image:
    runs-on: docker
    steps:
      - name: Pull latest ops-build-image
        run: docker pull registry.munchbox.cc/ops-build-image:latest

  # ---------------------------------------------------------------------------
  # Detect changed images
  # ---------------------------------------------------------------------------

  detect:
    runs-on: ops
    needs: refresh-runner-image
    outputs:
      ops_build_image: ${{ steps.detect.outputs.ops_build_image }}
      patroni: ${{ steps.detect.outputs.patroni }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes
        id: detect
        run: |
          # For merge commits, compare against first parent (previous main)
          # For regular commits, HEAD^1 is just the previous commit
          CHANGED=$(git diff --name-only HEAD^1 HEAD 2>/dev/null || true)
          echo "Changed files:"
          echo "$CHANGED"
          echo ""

          if echo "$CHANGED" | grep -q "^docker/ops-build-image"; then
            echo "ops_build_image=true" >> $GITHUB_OUTPUT
            echo "ops-build-image: changed"
          else
            echo "ops_build_image=false" >> $GITHUB_OUTPUT
            echo "ops-build-image: no changes"
          fi

          if echo "$CHANGED" | grep -q "^docker/patroni"; then
            echo "patroni=true" >> $GITHUB_OUTPUT
            echo "patroni: changed"
          else
            echo "patroni=false" >> $GITHUB_OUTPUT
            echo "patroni: no changes"
          fi

  # ---------------------------------------------------------------------------
  # ops-build-image
  # ---------------------------------------------------------------------------

  build-ops-build-image:
    runs-on: ops
    needs: detect
    if: needs.detect.outputs.ops_build_image == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Build ops-build-image
        run: |
          cd docker/ops-build-image
          make build-multiarch

  push-ops-build-image:
    runs-on: ops
    needs: [detect, build-ops-build-image]
    if: |
      always() &&
      (needs.build-ops-build-image.result == 'success') &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    env:
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
      VAULT_SKIP_VERIFY: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Push ops-build-image
        run: |
          cd docker/ops-build-image
          make push
      - name: Sign image with cosign
        run: |
          cd docker/ops-build-image
          VERSION=$(grep '^VERSION' Makefile | cut -d'=' -f2 | tr -d ' ?')
          IMAGE="registry.munchbox.cc/ops-build-image:${VERSION}"
          echo "Signing ${IMAGE}"
          cosign sign --yes --key hashivault://cosign "${IMAGE}"

  # ---------------------------------------------------------------------------
  # patroni (PostgreSQL 18 + Patroni HA)
  # ---------------------------------------------------------------------------

  build-patroni:
    runs-on: ops
    needs: detect
    if: needs.detect.outputs.patroni == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Build patroni
        run: |
          cd docker/patroni
          make build-multiarch

  push-patroni:
    runs-on: ops
    needs: [detect, build-patroni]
    if: |
      always() &&
      (needs.build-patroni.result == 'success') &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    env:
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
      VAULT_SKIP_VERIFY: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Push patroni
        run: |
          cd docker/patroni
          make push
      - name: Sign image with cosign
        run: |
          # Sign both tags
          cosign sign --yes --key hashivault://cosign registry.munchbox.cc/patroni:latest
          cosign sign --yes --key hashivault://cosign registry.munchbox.cc/patroni:pg18
