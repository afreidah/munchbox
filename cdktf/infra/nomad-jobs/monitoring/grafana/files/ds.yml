# ------------------------------------------------------------------------------
# Grafana Datasources — Provisioned (authoritative)
# ------------------------------------------------------------------------------

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus.service.consul:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s

  - name: Loki
    type: loki
    access: proxy
    url: http://loki.service.consul:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
    version: 1

  # --------------------------------------------------------------------------
  # Extra scrape configs for observability (optional)
  # - Promtail metrics (from localhost:9080)
  # - Loki metrics (from loki.service.consul:3100)
  # These will appear under the Prometheus datasource.
  # --------------------------------------------------------------------------

  - name: Prometheus-Self
    type: prometheus
    access: proxy
    url: http://prometheus.service.consul:9090
    jsonData:
      scrapeInterval: 15s
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

