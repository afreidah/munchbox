#cloud-config
# -------------------------------------------------------------------------------
# Cloud-Init Configuration - Nomad Servers
#
# Project: Munchbox / Author: Alex Freidah
#
# Initial bootstrap for Nomad server VMs. Installs basic packages and prepares
# the system for Ansible configuration.
# -------------------------------------------------------------------------------

hostname: ${hostname}
fqdn: ${hostname}.munchbox.cc
manage_etc_hosts: true

users:
  - name: ansible
    groups: sudo
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    lock_passwd: false

packages:
  - qemu-guest-agent
  - python3
  - python3-pip
  - curl
  - wget
  - vim
  - git
  - htop
  - net-tools
  - dnsutils

package_update: true
package_upgrade: true

runcmd:
  - systemctl enable qemu-guest-agent
  - systemctl start qemu-guest-agent
  - timedatectl set-timezone America/Los_Angeles
  - echo "Cloud-init complete" > /var/log/cloud-init-done

final_message: "Cloud-init complete after $UPTIME seconds"
