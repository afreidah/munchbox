# -----------------------------------------------------------------------
# Munchbox Traefik DNS
#
# Routes *.munchbox.cc to Traefik on goren (single instance), with a
# specific override for wg.munchbox.cc so the WireGuard endpoint
# hostname resolves to the public WAN IP. dnsmasq's address= entries
# match longest-name-wins, so the wg override takes precedence over
# the broader wildcard.
# Managed by Ansible - playbooks/configure-pihole-vips.yml
# -----------------------------------------------------------------------

# Specific override for the WireGuard endpoint hostname. Must equal
# the Cloudflare A record so Oracle nodes (which query home DNS via
# the tunnel) see the same public IP as the external resolver.
address=/wg.munchbox.cc/23.240.245.39

# Wildcard for all other *.munchbox.cc subdomains
address=/.munchbox.cc/192.168.68.60
