# -----------------------------------------------------------------------------
# Unbound • Pi-hole local resolver (Pi-1 tuned)
# Safe for Unbound 1.17.x. Listens only on 127.0.0.1:5335.
# -----------------------------------------------------------------------------

server:
  # --- Listener / access control ------------------------------------------------
  interface: 127.0.0.1
  port: 5335
  access-control: 127.0.0.0/8 allow

  # --- Security / privacy hardening --------------------------------------------
  module-config: "validator iterator"
  hide-identity: yes
  hide-version: yes
  qname-minimisation: yes
  harden-below-nxdomain: yes
  harden-referral-path: yes
  harden-dnssec-stripped: yes

  # Single source of truth for DNSSEC trust anchor
  auto-trust-anchor-file: "/var/lib/unbound/root.key"

  # Rebinding protection
  private-address: 10.0.0.0/8
  private-address: 172.16.0.0/12
  private-address: 192.168.0.0/16
  private-address: 169.254.0.0/16
  private-address: fd00::/8
  private-address: fe80::/10

  # --- Performance (Pi-1) ------------------------------------------------------
  num-threads: 1
  msg-cache-size: 16m
  rrset-cache-size: 32m
  cache-min-ttl: 60
  cache-max-ttl: 86400
  prefetch: yes
  prefetch-key: yes

  # MTU/fragmentation hygiene
  edns-buffer-size: 1232

  # Disable IPv6 if you don't use it
  do-ip6: no

  # --- Serve-stale (1.17-safe) -------------------------------------------------
  serve-expired: yes
  serve-expired-ttl: 86400
  serve-expired-client-timeout: 1800

  # --- Stats for unbound-control -----------------------------------------------
  extended-statistics: yes

  # --- Quiet logging defaults (enable only for debug) --------------------------
  # verbosity: 1
  # log-queries: yes
  # log-replies: yes
  # use-syslog: yes

  # --- Logging setup -----------------------------------------------------------
  logfile: "/var/log/unbound/unbound.log"
  log-time-ascii: yes
  verbosity: 1
