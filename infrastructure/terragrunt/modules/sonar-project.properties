# -------------------------------------------------------------------------------
# SonarCloud Project Configuration -- terraform modules
#
# Author: Alex Freidah
#
# Per-component project for the generic Terraform modules. Scanned by the CI
# terraform-modules job with sonar.projectBaseDir=infrastructure/terragrunt/modules.
#
# NO coverage is reported here: Terraform has no Sonar-ingestible line coverage,
# and our resource/output coverage (scripts/tf-coverage.rb) is a separate CI gate
# + badge. This project's quality gate must have its coverage condition DISABLED;
# Sonar's job here is Terraform IaC issues + security hotspots only.
# -------------------------------------------------------------------------------

sonar.projectKey=afreidah_munchbox_modules
sonar.organization=afreidah
sonar.sourceEncoding=UTF-8

sonar.sources=.

# Generated dirs + test fixtures are not analyzable source.
sonar.exclusions=**/.terraform/**,**/.terraform.lock.hcl,**/tests/fixtures*/**

# -------------------------------------------------------------------------------
# Ignored rules -- generic homelab storage modules. Bucket logging/versioning and
# HTTPS-only policy are intentionally omitted (backup buckets; the real controls
# + ignores live in the terragrunt leaves, where the buckets get real inputs).
# Mirrors the equivalent skips in modules/.checkov.yaml.
# -------------------------------------------------------------------------------
sonar.issue.ignore.multicriteria=storagelog,gcsver,s3https

# terraform:S6258 -- "omitting/disabling logging" on object-storage buckets
sonar.issue.ignore.multicriteria.storagelog.ruleKey=terraform:S6258
sonar.issue.ignore.multicriteria.storagelog.resourceKey=object-storage-*/main.tf

# terraform:S6412 -- "omitting versioning" on the GCS bucket
sonar.issue.ignore.multicriteria.gcsver.ruleKey=terraform:S6412
sonar.issue.ignore.multicriteria.gcsver.resourceKey=object-storage-*/main.tf

# terraform:S6249 -- "no bucket policy enforces HTTPS-only" on the S3-compat bucket
sonar.issue.ignore.multicriteria.s3https.ruleKey=terraform:S6249
sonar.issue.ignore.multicriteria.s3https.resourceKey=object-storage-*/main.tf
