# -----------------------------------------------------------------------
# Pi-hole FTL configuration -- pushed to /etc/pihole/pihole-FTL.conf on the
# armv6 Pi-hole boxes (green/logan) by the remote-files terragrunt module.
#
# MAXDBDAYS caps the long-term query DB at 30 days to keep the SQLite file
# small and its I/O light on the single-core Pi 1s. DBINTERVAL batches DB
# writes every 5s. PRIVACYLEVEL=0 keeps full per-client stats.
# -----------------------------------------------------------------------
MAXDBDAYS=30
DBINTERVAL=5.0
PRIVACYLEVEL=0
