# -----------------------------------------------------------------------------
# AWS NODE CONFIGURATION
# -----------------------------------------------------------------------------
# Node: nomad-client-aws-1
# Provider: AWS (spot instance)
# -----------------------------------------------------------------------------

name: nomad-client-aws-1

# Compute resources
cpu: 2
memory_gb: 4
disk_gb: 20

# WireGuard
wireguard_address: "10.200.0.10"

# Node classification
node_class: cloud
node_pool: ""
node_meta:
  provider: aws
  region: us-east-1

# AWS-specific config
aws_config:
  availability_zones:
    - us-east-1a
  architecture: arm64
  spot_type: persistent
  assign_elastic_ip: false

# Network
create_network: true
vpc_cidr: "10.101.0.0/16"

# Additional tags
tags:
  Environment: production
