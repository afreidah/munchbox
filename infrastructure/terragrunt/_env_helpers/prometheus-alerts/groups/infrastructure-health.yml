# infrastructure-health alert group
# Host-level liveness, CPU, memory, and disk pressure on every scrape target.

- name: infrastructure-health
  interval: 30s
  rules:
    - alert: ServiceDown
      expr: up == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Service {{ $labels.instance }} is down"
        description: "{{ $labels.job }} service on {{ $labels.instance }} has been down for more than 2 minutes."

    - alert: HighCPUUsage
      expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High CPU usage on {{ $labels.instance }}"
        description: "CPU usage is above 80% for more than 5 minutes on {{ $labels.instance }}."

    - alert: HighMemoryUsage
      expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High memory usage on {{ $labels.instance }}"
        description: "Memory usage is above 85% for more than 5 minutes on {{ $labels.instance }}."

    - alert: DiskSpaceLow
      expr: |
        (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|squashfs|overlay|fuse.*"}
              / node_filesystem_size_bytes{fstype!~"tmpfs|squashfs|overlay|fuse.*"})) * 100 > 90
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Disk space low on {{ $labels.instance }}"
        description: "Disk usage is above 90% on {{ $labels.instance }} ({{ $labels.mountpoint }})."
