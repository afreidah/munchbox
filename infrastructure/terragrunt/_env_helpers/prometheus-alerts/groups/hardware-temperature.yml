# hardware-temperature alert group
# CPU / GPU / Proxmox-host temperatures plus Proxmox node liveness.
# Three sensor families: thermal_zone (Pi/ARM), hwmon (x86), pve (Proxmox).

- name: hardware-temperature
  interval: 30s
  rules:
    # --- thermal_zone (Pi 5 / ARM nodes) ---
    - alert: HighCPUTemperature
      expr: node_thermal_zone_temp > 70
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High CPU temperature on {{ $labels.instance }}"
        description: "Thermal zone {{ $labels.zone }} is at {{ $value | printf \"%.1f\" }}°C on {{ $labels.instance }}."

    - alert: CriticalCPUTemperature
      expr: node_thermal_zone_temp > 80
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Critical CPU temperature on {{ $labels.instance }}"
        description: "Thermal zone {{ $labels.zone }} is at {{ $value | printf \"%.1f\" }}°C on {{ $labels.instance }}. CPU throttling likely occurring."

    # --- hwmon (x86 CPUs / Proxmox hosts via node-exporter) ---
    - alert: HighHwmonTemperature
      expr: node_hwmon_temp_celsius > 80
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High hardware temperature on {{ $labels.instance }}"
        description: "Sensor {{ $labels.sensor }} ({{ $labels.chip }}) is at {{ $value | printf \"%.1f\" }}°C on {{ $labels.instance }}."

    - alert: CriticalHwmonTemperature
      expr: node_hwmon_temp_celsius > 95
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Critical hardware temperature on {{ $labels.instance }}"
        description: "Sensor {{ $labels.sensor }} ({{ $labels.chip }}) is at {{ $value | printf \"%.1f\" }}°C on {{ $labels.instance }}. Hardware damage risk."

    # --- GPU (rubirosa NVIDIA RTX A1000) ---
    - alert: HighGPUTemperature
      expr: node_hwmon_temp_celsius{chip=~".*nvidia.*"} > 80
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High GPU temperature on {{ $labels.instance }}"
        description: "GPU is at {{ $value | printf \"%.1f\" }}°C on {{ $labels.instance }}."

    - alert: CriticalGPUTemperature
      expr: node_hwmon_temp_celsius{chip=~".*nvidia.*"} > 90
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Critical GPU temperature on {{ $labels.instance }}"
        description: "GPU is at {{ $value | printf \"%.1f\" }}°C on {{ $labels.instance }}. GPU throttling or shutdown imminent."

    # --- Proxmox hypervisors (via pve-exporter) ---
    - alert: ProxmoxHighTemperature
      expr: pve_cpu_temperature_celsius > 75
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High CPU temperature on Proxmox host {{ $labels.instance }}"
        description: "Proxmox host {{ $labels.instance }} CPU is at {{ $value | printf \"%.1f\" }}°C."

    - alert: ProxmoxCriticalTemperature
      expr: pve_cpu_temperature_celsius > 90
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Critical CPU temperature on Proxmox host {{ $labels.instance }}"
        description: "Proxmox host {{ $labels.instance }} CPU is at {{ $value | printf \"%.1f\" }}°C. Hardware damage risk."

    - alert: ProxmoxHostDown
      expr: pve_up{id=~"node/.*"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Proxmox host {{ $labels.instance }} is down"
        description: "Cannot connect to Proxmox API on {{ $labels.instance }}."
