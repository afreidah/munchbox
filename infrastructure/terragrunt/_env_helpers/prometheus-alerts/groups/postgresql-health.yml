# postgresql-health alert group
# Patroni-managed PostgreSQL: liveness, connection pressure, deadlocks,
# replication lag, long transactions, rollback rate.

- name: postgresql-health
  interval: 30s
  rules:
    - alert: PostgresDown
      expr: pg_up == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "PostgreSQL is down"
        description: "PostgreSQL exporter cannot connect to the database."

    - alert: PostgresHighConnections
      # sum across datname/state, then divide by the global max_connections
      expr: sum by (instance,job,server) (pg_stat_activity_count) / pg_settings_max_connections * 100 > 80
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "PostgreSQL connection usage high"
        description: "PostgreSQL is using {{ $value | printf \"%.1f\" }}% of max connections on {{ $labels.instance }}."

    - alert: PostgresConnectionsExhausted
      expr: sum by (instance,job,server) (pg_stat_activity_count) / pg_settings_max_connections * 100 > 95
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "PostgreSQL connections nearly exhausted"
        description: "PostgreSQL is using {{ $value | printf \"%.1f\" }}% of max connections on {{ $labels.instance }}. New connections may fail."

    - alert: PostgresDeadlocks
      expr: increase(pg_stat_database_deadlocks[5m]) > 0
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: "PostgreSQL deadlocks detected"
        description: "{{ $value | printf \"%.0f\" }} deadlocks occurred in the last 5 minutes on database {{ $labels.datname }}."

    - alert: PostgresReplicationLag
      expr: pg_replication_lag_seconds > 30
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "PostgreSQL replication lag is high"
        description: "Replication lag on {{ $labels.instance }} is {{ $value | printf \"%.1f\" }} seconds."

    - alert: PostgresReplicationLagCritical
      expr: pg_replication_lag_seconds > 120
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "PostgreSQL replication lag is critical"
        description: "Replication lag on {{ $labels.instance }} is {{ $value | printf \"%.1f\" }} seconds. Data loss risk if primary fails."

    - alert: PostgresLongRunningTransaction
      expr: pg_stat_activity_max_tx_duration > 300
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Long-running PostgreSQL transaction"
        description: "A transaction on {{ $labels.datname }} has been running for {{ $value | printf \"%.0f\" }} seconds."

    - alert: PostgresHighRollbackRate
      expr: rate(pg_stat_database_xact_rollback[5m]) / (rate(pg_stat_database_xact_commit[5m]) + rate(pg_stat_database_xact_rollback[5m])) * 100 > 10
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High PostgreSQL rollback rate"
        description: "{{ $value | printf \"%.1f\" }}% of transactions are being rolled back on {{ $labels.datname }}."
