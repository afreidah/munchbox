# consul-health alert group
# Raft quorum + leader election churn on the Consul control plane.
# The `consul` (https) and `consul-http` scrape jobs hit the same agent and
# emit identical series; the job filter dedupes.

- name: consul-health
  interval: 30s
  rules:
    # consul_raft_state_leader / consul_server_isLeader are transition-set in
    # Consul 2.0.x and decay to 0 under the 30s telemetry retention, so they
    # read 0 even on the live leader (sum != 1 fired permanently). Detect the
    # leader via its reconcile loop instead -- only the leader increments it.
    - alert: ConsulNoLeader
      expr: count(rate(consul_leader_reconcile_count{job="consul-http"}[5m]) > 0) != 1
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Consul has no single raft leader"
        description: "{{ $value | printf \"%.0f\" }} Consul servers are running the leader reconcile loop; expected exactly 1 (0 = no leader / quorum lost, >1 = split-brain)."

    - alert: ConsulLeaderElection
      expr: changes(consul_raft_state_leader{job="consul-http"}[5m]) > 0
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: "Consul leader election occurred"
        description: "The Consul raft leader changed in the last 5 minutes."
