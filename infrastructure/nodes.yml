# -------------------------------------------------------------------------------
# Munchbox Infrastructure - Single Source of Truth
#
# Project: Munchbox / Author: Alex Freidah
#
# This file defines all infrastructure components: Proxmox hosts, bare-metal nodes,
# and VMs. Generation scripts read this file to produce:
#   - Ansible inventory (ansible/inventory/hosts.yml)
#   - Terraform variables (terraform/proxmox/vms.auto.tfvars)
#
# To add a new node:
#   1. Add entry to appropriate section below
#   2. Run: make generate
#   3. Run: make tf-apply (for VMs) or skip (for bare-metal)
#   4. Run: make add-vm VM=<name> or make add-bare-metal HOST=<name>
# -------------------------------------------------------------------------------

# -------------------------------------------------------------------------------
# Network Configuration
# -------------------------------------------------------------------------------

network:
  gateway: 192.168.68.1
  subnet: 192.168.68.0/24
  domain: munchbox.cc
  dns_servers:
    - 192.168.68.62  # pihole-1
    - 192.168.68.64  # pihole-2

# -------------------------------------------------------------------------------
# Proxmox Hypervisors
#
# Physical hosts running Proxmox VE that can host VMs.
# -------------------------------------------------------------------------------

proxmox_hosts:
  cabot:
    ip: 192.168.68.59
    ram_gb: 8
    cpu_cores: 4
    storage: local-lvm
    features: []
    notes: "HP EliteDesk 800 G1 DM - has e1000e NIC hang issue, TSO disabled"

  mccoy:
    ip: 192.168.68.63
    ram_gb: 16
    cpu_cores: 4
    storage: local-lvm
    features: []
    notes: "HP EliteDesk"

  fontana:
    ip: 192.168.68.65
    ram_gb: 16
    cpu_cores: 4
    storage: local-lvm
    features: []
    notes: "HP EliteDesk"

  # Future: Lenovo ThinkStation P3 Tiny Gen 2
  # thinkstation:
  #   ip: 192.168.68.XX
  #   ram_gb: 64
  #   cpu_cores: 24  # Intel Core Ultra 9 285
  #   storage: local-lvm
  #   features:
  #     - gpu_passthrough  # RTX A1000 8GB
  #   notes: "Primary compute node for media transcoding"

# -------------------------------------------------------------------------------
# Bare-Metal Nomad Nodes
#
# Physical servers running Nomad/Consul directly (not as VMs).
# These are NOT managed by Terraform - only by Ansible.
# -------------------------------------------------------------------------------

bare_metal:
  stabler:
    ip: 192.168.68.61
    arch: arm64
    roles:
      - nomad_server
      - nomad_client
      - consul_server
      - vault_server
    notes: "Raspberry Pi 5 - primary Vault server"

  goren:
    ip: 192.168.68.60
    arch: arm64
    roles:
      - nomad_server
      - nomad_client
      - consul_server
      - vault_server
    notes: "Raspberry Pi 5 - batch job runner"

# -------------------------------------------------------------------------------
# Virtual Machines
#
# VMs provisioned on Proxmox hosts via Terraform.
# -------------------------------------------------------------------------------

vms:
  nomad-server-03:
    proxmox_host: fontana
    vmid: 172
    ip: 192.168.68.58
    cores: 2
    memory_mb: 2048
    disk_gb: 40
    roles:
      - nomad_server
      - consul_server
      - vault_server
    notes: "Third Nomad/Vault server for quorum"

  nomad-client-01:
    proxmox_host: fontana
    vmid: 180
    ip: 192.168.68.67
    cores: 4
    memory_mb: 13312
    disk_gb: 40
    roles:
      - nomad_client
      - consul_client
    notes: "General workload client"

  nomad-client-02:
    proxmox_host: mccoy
    vmid: 181
    ip: 192.168.68.72
    cores: 4
    memory_mb: 15360
    disk_gb: 40
    roles:
      - nomad_client
      - consul_client
    notes: "General workload client"

  nomad-client-03:
    proxmox_host: cabot
    vmid: 182
    ip: 192.168.68.71
    cores: 4
    memory_mb: 7168
    disk_gb: 40
    roles:
      - nomad_client
      - consul_client
    notes: "General workload client - on cabot (less reliable)"

# -------------------------------------------------------------------------------
# Other Infrastructure (DNS, Storage, etc.)
#
# Non-Nomad infrastructure that may need to be referenced.
# -------------------------------------------------------------------------------

other_hosts:
  pihole-1:
    ip: 192.168.68.62
    notes: "Primary Pi-hole DNS"

  pihole-2:
    ip: 192.168.68.64
    notes: "Secondary Pi-hole DNS"

# -------------------------------------------------------------------------------
# VM Template Configuration
# -------------------------------------------------------------------------------

vm_defaults:
  template_name: debian-base
  disk_storage: local-lvm
  network_bridge: vmbr0
  cpu_type: host
  full_clone: true
  onboot: true
  agent: 1
