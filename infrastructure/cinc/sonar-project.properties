# -------------------------------------------------------------------------------
# SonarCloud Project Configuration -- cinc
#
# Author: Alex Freidah
#
# Per-component project for the Cinc (Ruby/Chef) cookbooks. Scanned by the CI
# `cinc` job with sonar.projectBaseDir=infrastructure/cinc. Coverage is the
# merged SimpleCov (cobertura) report from the full chefspec suite. cookstyle is
# the source of truth for Ruby style, so Sonar rules that fight it or flag
# intentional patterns are ignored below.
# -------------------------------------------------------------------------------

sonar.projectKey=afreidah_munchbox_cinc
sonar.organization=afreidah
sonar.sourceEncoding=UTF-8

sonar.sources=cookbooks,roles
sonar.tests=cookbooks
sonar.test.inclusions=cookbooks/**/spec/**/*.rb,cookbooks/**/test/**/*.rb

# simplecov_bootstrap.rb is coverage infra (it starts SimpleCov, so it can't
# cover itself) -- not application code; keep it out of analysis/coverage.
sonar.exclusions=cookbooks/simplecov_bootstrap.rb

# Merged SimpleCov JSON-formatter report produced by the full chefspec run
# (COVERAGE=1). The Ruby sensor reads this format, NOT cobertura.
sonar.ruby.coverage.reportPaths=coverage/coverage.json

# -------------------------------------------------------------------------------
# Ignored rules (paths relative to this base dir)
# -------------------------------------------------------------------------------

sonar.issue.ignore.multicriteria=cookstyleraise,specglobrequire,lazygemrequire

# rubydre:S7815 ("raise a specific exception class") conflicts with cookstyle
# Style/RedundantException (no explicit RuntimeError); keep bare `raise "msg"`.
sonar.issue.ignore.multicriteria.cookstyleraise.ruleKey=rubydre:S7815
sonar.issue.ignore.multicriteria.cookstyleraise.resourceKey=cookbooks/**/*.rb

# rubydre:S7816 on spec_helper -- the flagged require is a `Dir[...].each` glob
# load that can't be hoisted.
sonar.issue.ignore.multicriteria.specglobrequire.ruleKey=rubydre:S7816
sonar.issue.ignore.multicriteria.specglobrequire.resourceKey=cookbooks/**/spec/spec_helper.rb

# rubydre:S7816 on vault_fetch -- `require 'vault'` is intentionally lazy so the
# third-party gem isn't loaded at cookbook compile time.
sonar.issue.ignore.multicriteria.lazygemrequire.ruleKey=rubydre:S7816
sonar.issue.ignore.multicriteria.lazygemrequire.resourceKey=cookbooks/munchbox_lib/libraries/vault_fetch.rb
