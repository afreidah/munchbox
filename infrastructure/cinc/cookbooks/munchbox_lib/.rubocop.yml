# -------------------------------------------------------------------------------
# Cookstyle (rubocop) config for munchbox_lib.
#
# Inherits cookstyle defaults; overrides below are project-specific only.
# -------------------------------------------------------------------------------

inherit_gem:
  cookstyle: config/cookstyle.yml

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.1
  Exclude:
    - 'Berksfile.lock'
    - 'Gemfile.lock'
    - 'tmp/**/*'
    - 'vendor/**/*'

# --- Long top-of-file box comments are common; let them be ---
Layout/LineLength:
  Max: 120

# --- Specs use long descriptions; don't fight rspec idioms ---
Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
