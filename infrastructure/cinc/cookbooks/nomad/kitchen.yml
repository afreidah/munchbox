---
# -------------------------------------------------------------------------------
# Test-Kitchen config for nomad.
#
# Single-node, ACL+TLS+Consul+Vault all OFF -- the kitchen VM has none
# of the surrounding infrastructure. Verifies install + configure
# end-to-end: binary lands, systemd unit comes up, config matches the
# kitchen attributes, the agent's HTTP API serves /v1/agent/self.
#
# Mixed server+client mode (the "single-host dev" shape) so the agent
# has something to bootstrap against.
# -------------------------------------------------------------------------------

driver:
  name: vagrant
  provider: libvirt
  customize:
    memory: 1024
    cpus: 1

provisioner:
  name: chef_zero
  product_name: cinc
  product_version: latest
  install_strategy: once
  multiple_converge: 2
  enforce_idempotency: true
  chef_license: accept
  log_level: warn
  client_rb:
    node_name: kitchen

verifier:
  name: inspec
  format: doc

platforms:
  - name: debian-12
    driver:
      box: generic/debian12

suites:
  - name: nomad
    run_list:
      - recipe[nomad::install]
      - recipe[nomad::configure]
    attributes:
      nomad:
        config:
          node_name: kitchen
          bind_addr: 127.0.0.1
          advertise_ip: 127.0.0.1
          server_enabled: true
          bootstrap_expect: 1
          client_enabled: false
          servers: []
          consul_enabled: false
          vault_enabled: false
          acl_enabled: false
          tls_http: false
          tls_rpc: false

  - name: auto_restart_webhook
    # --- python3 is the script's shebang; ensure it's present so the systemd
    #     unit's ExecStart resolves. The webhook daemon WILL crash-loop because
    #     there's no nomad agent on :4646 in this suite, but on-disk state +
    #     systemd unit installation + consul-service json are all verifiable.
    lifecycle:
      pre_converge:
        - remote: sudo apt-get update -q && sudo apt-get install -y -q python3
    run_list:
      - recipe[nomad::auto_restart_webhook]
    attributes:
      nomad:
        auto_restart_webhook:
          # --- attribute default is false (fleet-wide opt-out); this suite
          #     exercises the :configure path, so flip it on here.
          enabled: true
          # --- bypass vault_fetch; consul user owns the consul-service template
          #     so we also need to disable that path OR install consul first.
          nomad_token: kitchen-fake-nomad-token
          consul_user: root
          consul_group: root
    verifier:
      inspec_tests:
        - test/integration/auto_restart_webhook

  - name: auto_restart_webhook_removed
    # --- :remove on a node that never had the receiver. Proves the teardown is
    #     a clean no-op, which is what every node in the fleet converges once
    #     the default flips to false. No nomad_token is set: :remove must not
    #     require one.
    run_list:
      - recipe[nomad::auto_restart_webhook]
    attributes:
      nomad:
        auto_restart_webhook:
          enabled: false
    verifier:
      inspec_tests:
        - test/integration/auto_restart_webhook_removed
