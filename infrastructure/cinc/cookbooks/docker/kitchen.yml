---
# -------------------------------------------------------------------------------
# Test-Kitchen config for docker.
#
# Single-node debian-12 VM. Verifies install + daemon.json configure
# end-to-end: GPG key + apt repo land, docker.service comes up, the
# nomad system user is in the docker group, and the templated
# daemon.json round-trips through inspec.
# -------------------------------------------------------------------------------

driver:
  name: vagrant
  provider: libvirt
  customize:
    memory: 2048
    cpus: 2

provisioner:
  name: chef_zero
  product_name: cinc
  product_version: latest
  install_strategy: once
  multiple_converge: 2
  enforce_idempotency: true
  chef_license: accept
  log_level: warn
  client_rb:
    node_name: kitchen

verifier:
  name: inspec
  format: doc

platforms:
  - name: debian-12
    driver:
      box: generic/debian12

suites:
  - name: docker
    # --- nomad user has to exist before docker::install tries to add it to the docker group. ---
    run_list:
      - recipe[munchbox_base::apt_repo]
      - recipe[docker::install]
      - recipe[docker::configure]
    verifier:
      inspec_tests:
        - test/integration/default
    attributes:
      docker:
        install:
          # --- No nomad user in the kitchen VM; skip the group add so the suite stays self-contained. ---
          add_user_to_group: ~
          dependent_service: ~
        daemon:
          dns:
            - 1.1.1.1
