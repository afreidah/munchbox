---
# -------------------------------------------------------------------------------
# Test-Kitchen config for munchbox_base.
#
# Real VMs via Vagrant because we exercise systemd units (timesyncd, journald,
# sshd) -- docker containers won't cut it. Targets debian-12 to match the
# cookbook's supports list.
# -------------------------------------------------------------------------------

driver:
  name: vagrant
  provider: libvirt
  customize:
    memory: 1024
    cpus: 1

provisioner:
  name: chef_zero
  product_name: cinc
  product_version: latest
  install_strategy: once
  multiple_converge: 2
  enforce_idempotency: true
  chef_license: accept
  log_level: warn

verifier:
  name: inspec
  format: doc

platforms:
  - name: debian-12
    driver:
      box: generic/debian12

suites:
  - name: default
    run_list:
      # --- resolv_conf first: subsequent converges (pass 2 idempotency) start with
      #     whatever /etc/resolv.conf the previous converge left behind, so we need
      #     the recipe to normalize DNS before any network-dependent resource runs.
      - recipe[munchbox_base::resolv_conf]
      - recipe[munchbox_base::apt_repo]
      - recipe[munchbox_base::packages]
      - recipe[munchbox_base::timesync]
      - recipe[munchbox_base::journald]
      - recipe[munchbox_base::sshd]
      - recipe[munchbox_base::rsyslog_rotation]
      - recipe[munchbox_base::apt_cleanup]
      - recipe[munchbox_base::pki_trust]
      - recipe[munchbox_base::sysctl]
      - recipe[munchbox_base::disable_ipv6_ra]
      - recipe[munchbox_base::etc_hosts]
    verifier:
      inspec_tests:
        - test/integration/default
    attributes:
      munchbox_base:
        apt_repo:
          # Public repo we use for the integration only -- apt.munchbox.cc
          # isn't always reachable from a fresh kitchen VM, and we just need
          # to prove the resource can register a working third-party repo.
          name: nginx
          uri: https://nginx.org/packages/debian
          distribution: bookworm
          components:
            - nginx
          key_url: https://nginx.org/keys/nginx_signing.key
        packages:
          - curl
          - jq
        resolv_conf:
          # Use a real public resolver in kitchen: the recipe overwrites
          # /etc/resolv.conf, and the second converge (idempotency check)
          # needs working DNS to re-validate the apt repo's signing key.
          # A localhost placeholder breaks pass 2 with a getaddrinfo error.
          nameserver: 1.1.1.1
        etc_hosts:
          # static_entries proves the literal-additions path without needing
          # a populated chef-search index inside chef-zero.
          static_entries:
            - ip: 192.168.68.62
              hostname: green
            - ip: 192.168.68.64
              hostname: logan

# -------------------------------------------------------------------------------
# Recipes intentionally NOT in any suite (need live Vault):
#   sshd_ca         - vault_fetch'd SSH CA host signer.
#   vault_pki_trust - vault_fetch'd PKI intermediate CA.
# Both are chefspec'd; verify live via `cinc-client -W` on a managed node.
# -------------------------------------------------------------------------------
