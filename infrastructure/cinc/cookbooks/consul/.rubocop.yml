# -------------------------------------------------------------------------------
# Cookstyle (rubocop) config for consul.
# -------------------------------------------------------------------------------

inherit_from: ../../.rubocop-base.yml

# --- consul_service reloads a running consul to pick up a service definition.
#     The service resource would manage consul's lifecycle; this only ever
#     reloads it, guarded by an only_if on the unit so a greenfield converge
#     (and chefspec) is a clean no-op.
Chef/Correctness/ServiceResource:
  Enabled: false
