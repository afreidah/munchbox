---
# -------------------------------------------------------------------------------
# Test-Kitchen config for oracle.
#
#   minio_mount       - In a libvirt guest there's no block volume labeled
#                       `minio-data`, so `blkid -t LABEL=minio-data` returns
#                       empty and the resource warn-and-returns after creating
#                       the mount-point directory. The legacy /dev/sdb fstab
#                       sweep path IS exercised: pre_converge stages a fake
#                       /dev/sdb entry and the recipe is asserted to remove it.
#   watchdog          - NOT under kitchen: needs Vault for the consul ACL
#                       token + the consul daemon to reload on service-file
#                       change. Chefspec covers the resource shape.
# -------------------------------------------------------------------------------

driver:
  name: vagrant
  provider: libvirt
  customize:
    memory: 512
    cpus: 1

provisioner:
  name: chef_zero
  product_name: cinc
  product_version: latest
  install_strategy: once
  multiple_converge: 2
  enforce_idempotency: true
  chef_license: accept
  log_level: warn

verifier:
  name: inspec
  format: doc

platforms:
  - name: debian-12
    driver:
      box: generic/debian12

suites:
  - name: minio_mount
    # --- pre_converge appends a stale `/dev/sdb /mnt/minio-data` fstab line
    #     (without actually mounting anything) so the recipe's `mount ...
    #     action :disable` path runs end-to-end and we can inspec-verify the
    #     line gets removed.
    lifecycle:
      pre_converge:
        - remote: |
            grep -qE '^/dev/sdb\s+/mnt/minio-data\s' /etc/fstab || \
              echo '/dev/sdb /mnt/minio-data ext4 defaults 0 2' | sudo tee -a /etc/fstab
    run_list:
      - recipe[oracle::minio_mount]
    verifier:
      inspec_tests:
        - test/integration/minio_mount
