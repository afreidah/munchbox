---
# -------------------------------------------------------------------------------
# Test-Kitchen config for proxmox_host.
#
# Four suites. Each one converges what its recipe writes to disk; whether
# the underlying hardware then *does* the right thing (mediated GPU, PCI
# passthrough, ZFS pools, etc.) is operator-verified on the actual
# hypervisors and called out in each suite's inspec controls.
#
#   zfs_arc          - modprobe.d drop-in carries the cap. Live sysfs
#                      write is only_if-gated on the sysfs path which
#                      isn't present in a non-ZFS guest -> no-op there.
#   gvt_g            - GRUB_CMDLINE_LINUX_DEFAULT rewritten + vfio/kvmgt
#                      modules in /etc/modules. update-grub runs in the
#                      guest. "GPU is actually mediated" needs real Intel.
#   pci_passthrough  - same GRUB + modules trio, plus
#                      /etc/modprobe.d/vfio.conf with the device IDs.
#                      Doesn't prove the device actually binds at boot.
#   zfswatcher       - go toolchain + git clone + go build -> binary on
#                      disk, conf rendered, systemd unit installed,
#                      consul-service JSON written. Daemon may flap
#                      because no ZFS pools exist in the guest --
#                      asserting on-disk state only.
#
# zfswatcher suite sets proxy_password_hash via attribute so vault_fetch
# is bypassed (no Vault in kitchen).
# -------------------------------------------------------------------------------

driver:
  name: vagrant
  provider: libvirt
  customize:
    memory: 1024
    cpus: 2

provisioner:
  name: chef_zero
  product_name: cinc
  product_version: latest
  install_strategy: once
  multiple_converge: 2
  enforce_idempotency: true
  chef_license: accept
  log_level: warn

verifier:
  name: inspec
  format: doc

platforms:
  - name: debian-12
    driver:
      box: generic/debian12

suites:
  - name: zfs_arc
    run_list:
      - recipe[proxmox_host::zfs_arc]
    attributes:
      proxmox_host:
        zfs_arc:
          max_bytes: 34359738368
    verifier:
      inspec_tests:
        - test/integration/zfs_arc

  - name: gvt_g
    run_list:
      - recipe[proxmox_host::gvt_g]
    attributes:
      proxmox_host:
        gvt_g:
          enabled: true
    verifier:
      inspec_tests:
        - test/integration/gvt_g

  - name: pci_passthrough
    run_list:
      - recipe[proxmox_host::pci_passthrough]
    attributes:
      proxmox_host:
        pci_passthrough:
          enabled: true
          device_ids:
            - 10de:2204
            - 10de:1aef
    verifier:
      inspec_tests:
        - test/integration/pci_passthrough

  - name: zfswatcher
    run_list:
      # --- consul::install creates the consul user/group that the consul
      #     service-registration template wants to own. ---
      - recipe[consul::install]
      - recipe[proxmox_host::zfswatcher]
    attributes:
      proxmox_host:
        zfswatcher:
          enabled: true
          proxy_password_hash: '$apr1$kitchen$hashplaceholderforsuiteonly'
    verifier:
      inspec_tests:
        - test/integration/zfswatcher
