---
# -------------------------------------------------------------------------------
# Register DNS Server Services with Consul (External Registration)
#
# Project: Munchbox / Author: Alex Freidah
#
# Registers DNS server exporters with Consul using external service registration
# via HTTP API. No Consul agent required - perfect for ARMv6 Pi Zero W boards.
# -------------------------------------------------------------------------------

- name: Verify connectivity to DNS servers
  hosts: dns_servers
  gather_facts: true
  tasks:
    - name: Gather facts
      setup:

# -------------------------------------------------------------------------
# External Service Registration
# -------------------------------------------------------------------------

- name: Register DNS server services with Consul
  hosts: dns_servers
  become: true
  vars:
    consul_api_addr: "http://192.168.68.61:8500"
  tasks:
    - name: Create consul-register directory
      file:
        path: /etc/consul-register
        state: directory
        mode: '0755'

    - name: Deploy node-exporter service registration JSON
      copy:
        content: |
          {
            "Node": "{{ inventory_hostname }}",
            "Address": "{{ ansible_default_ipv4.address }}",
            "NodeMeta": {
              "node_type": "raspberry-pi-zero",
              "role": "dns-server",
              "arch": "armv6"
            },
            "Service": {
              "ID": "node-exporter-{{ inventory_hostname }}",
              "Service": "node-exporter",
              "Port": 9100,
              "Tags": ["monitoring", "external", "dns", "{{ inventory_hostname }}"],
              "Meta": {
                "node_type": "raspberry-pi-zero",
                "role": "dns-server",
                "host": "{{ inventory_hostname }}"
              }
            }
          }
        dest: /etc/consul-register/node-exporter.json
        mode: '0644'

    - name: Deploy pihole-exporter service registration JSON
      copy:
        content: |
          {
            "Node": "{{ inventory_hostname }}",
            "Address": "{{ ansible_default_ipv4.address }}",
            "NodeMeta": {
              "node_type": "raspberry-pi-zero",
              "role": "dns-server",
              "arch": "armv6"
            },
            "Service": {
              "ID": "pihole-exporter-{{ inventory_hostname }}",
              "Service": "pihole-exporter",
              "Port": 9617,
              "Tags": ["monitoring", "external", "dns", "pihole", "{{ inventory_hostname }}"],
              "Meta": {
                "node_type": "raspberry-pi-zero",
                "role": "dns-server",
                "host": "{{ inventory_hostname }}"
              }
            }
          }
        dest: /etc/consul-register/pihole-exporter.json
        mode: '0644'

    - name: Deploy pihole-webui service registration JSON
      copy:
        content: |
          {
            "Node": "{{ inventory_hostname }}",
            "Address": "{{ ansible_default_ipv4.address }}",
            "NodeMeta": {
              "node_type": "raspberry-pi-zero",
              "role": "dns-server",
              "arch": "armv6"
            },
            "Service": {
              "ID": "pihole-webui-{{ inventory_hostname }}",
              "Service": "pihole-webui",
              "Port": 80,
              "Tags": [
                "traefik.enable=true",
                "traefik.http.routers.pihole-{{ inventory_hostname }}.rule=Host(`pihole-{{ inventory_hostname }}.munchbox.cc`) && PathPrefix(`/admin`)",
                "traefik.http.routers.pihole-{{ inventory_hostname }}.entrypoints=websecure",
                "traefik.http.routers.pihole-{{ inventory_hostname }}.tls=true",
                "traefik.http.routers.pihole-{{ inventory_hostname }}.middlewares=oauth2-proxy-errors@file,oauth2-proxy@file",
                "traefik.http.routers.pihole-{{ inventory_hostname }}.priority=20",
                "traefik.http.routers.pihole-{{ inventory_hostname }}-redirect.rule=Host(`pihole-{{ inventory_hostname }}.munchbox.cc`)",
                "traefik.http.routers.pihole-{{ inventory_hostname }}-redirect.entrypoints=websecure",
                "traefik.http.routers.pihole-{{ inventory_hostname }}-redirect.tls=true",
                "traefik.http.routers.pihole-{{ inventory_hostname }}-redirect.middlewares=pihole-redirect-admin-{{ inventory_hostname }}@consulcatalog",
                "traefik.http.routers.pihole-{{ inventory_hostname }}-redirect.priority=10",
                "traefik.http.routers.pihole-{{ inventory_hostname }}-http.rule=Host(`pihole-{{ inventory_hostname }}.munchbox.cc`) && PathPrefix(`/admin`)",
                "traefik.http.routers.pihole-{{ inventory_hostname }}-http.entrypoints=web",
                "traefik.http.routers.pihole-{{ inventory_hostname }}-http.middlewares=cf-tunnel-https@file,oauth2-proxy-errors@file,oauth2-proxy@file",
                "traefik.http.middlewares.pihole-redirect-admin-{{ inventory_hostname }}.redirectregex.regex=.*",
                "traefik.http.middlewares.pihole-redirect-admin-{{ inventory_hostname }}.redirectregex.replacement=https://pihole-{{ inventory_hostname }}.munchbox.cc/admin/",
                "traefik.http.middlewares.pihole-redirect-admin-{{ inventory_hostname }}.redirectregex.permanent=false",
                "traefik.http.services.pihole-{{ inventory_hostname }}.loadbalancer.server.port=80",
                "external",
                "dns",
                "pihole",
                "webui",
                "{{ inventory_hostname }}"
              ],
              "Meta": {
                "node_type": "raspberry-pi-zero",
                "role": "dns-server",
                "host": "{{ inventory_hostname }}"
              }
            },
            "Check": {
              "Node": "{{ inventory_hostname }}",
              "CheckID": "pihole-webui-{{ inventory_hostname }}-health",
              "Name": "Pi-hole Web UI Health",
              "Status": "passing",
              "ServiceID": "pihole-webui-{{ inventory_hostname }}",
              "Definition": {
                "HTTP": "http://{{ ansible_default_ipv4.address }}/admin/",
                "Interval": "30s",
                "Timeout": "5s"
              }
            }
          }
        dest: /etc/consul-register/pihole-webui.json
        mode: '0644'

    - name: Install Catppuccin Mocha theme for Pi-hole
      get_url:
        url: "https://themes.munchbox.cc/css/pihole.css"
        dest: /var/www/html/admin/style/custom.css
        mode: '0644'
        owner: www-data
        group: www-data
        validate_certs: false
      ignore_errors: true

    - name: Deploy pihole-lb service registration JSON (for load-balanced access)
      copy:
        content: |
          {
            "Node": "{{ inventory_hostname }}",
            "Address": "{{ ansible_default_ipv4.address }}",
            "NodeMeta": {
              "node_type": "raspberry-pi-zero",
              "role": "dns-server",
              "arch": "armv6"
            },
            "Service": {
              "ID": "pihole-lb-{{ inventory_hostname }}",
              "Service": "pihole-lb",
              "Port": 80,
              "Tags": [
                "traefik.enable=true",
                "traefik.http.routers.pihole.rule=Host(`pihole.munchbox.cc`) && PathPrefix(`/admin`)",
                "traefik.http.routers.pihole.entrypoints=websecure",
                "traefik.http.routers.pihole.tls=true",
                "traefik.http.routers.pihole.middlewares=oauth2-proxy-errors@file,oauth2-proxy@file",
                "traefik.http.routers.pihole.priority=20",
                "traefik.http.routers.pihole-redirect.rule=Host(`pihole.munchbox.cc`)",
                "traefik.http.routers.pihole-redirect.entrypoints=websecure",
                "traefik.http.routers.pihole-redirect.tls=true",
                "traefik.http.routers.pihole-redirect.middlewares=pihole-lb-redirect-admin@consulcatalog",
                "traefik.http.routers.pihole-redirect.priority=10",
                "traefik.http.routers.pihole-http.rule=Host(`pihole.munchbox.cc`) && PathPrefix(`/admin`)",
                "traefik.http.routers.pihole-http.entrypoints=web",
                "traefik.http.routers.pihole-http.middlewares=cf-tunnel-https@file,oauth2-proxy-errors@file,oauth2-proxy@file",
                "traefik.http.middlewares.pihole-lb-redirect-admin.redirectregex.regex=.*",
                "traefik.http.middlewares.pihole-lb-redirect-admin.redirectregex.replacement=https://pihole.munchbox.cc/admin/",
                "traefik.http.middlewares.pihole-lb-redirect-admin.redirectregex.permanent=false",
                "traefik.http.services.pihole-lb.loadbalancer.server.port=80",
                "external",
                "dns",
                "pihole",
                "loadbalanced",
                "{{ inventory_hostname }}"
              ],
              "Meta": {
                "node_type": "raspberry-pi-zero",
                "role": "dns-server",
                "host": "{{ inventory_hostname }}"
              }
            },
            "Check": {
              "Node": "{{ inventory_hostname }}",
              "CheckID": "pihole-lb-{{ inventory_hostname }}-health",
              "Name": "Pi-hole LB Health",
              "Status": "passing",
              "ServiceID": "pihole-lb-{{ inventory_hostname }}",
              "Definition": {
                "HTTP": "http://{{ ansible_default_ipv4.address }}/admin/",
                "Interval": "30s",
                "Timeout": "5s"
              }
            }
          }
        dest: /etc/consul-register/pihole-lb.json
        mode: '0644'

    - name: Create registration script
      copy:
        content: |
          #!/bin/bash
          # -----------------------------------------------------------------------
          # Consul Service Registration Script
          #
          # Project: Munchbox / Author: Alex Freidah
          # -----------------------------------------------------------------------
          
          set -euo pipefail
          
          CONSUL_ADDR="{{ consul_api_addr }}"
          REGISTER_DIR="/etc/consul-register"
          
          register_service() {
              local service_file="$1"
              echo "Registering $(basename "$service_file")..."
              
              curl -s -X PUT \
                  -H "Content-Type: application/json" \
                  -d @"$service_file" \
                  "$CONSUL_ADDR/v1/catalog/register" || {
                  echo "Failed to register $service_file"
                  return 1
              }
          }
          
          # Register all service definitions
          for service_json in "$REGISTER_DIR"/*.json; do
              if [ -f "$service_json" ]; then
                  register_service "$service_json"
              fi
          done
          
          echo "Service registration complete for {{ inventory_hostname }}"
        dest: /usr/local/bin/consul-register.sh
        mode: '0755'

    - name: Create systemd service for registration
      copy:
        content: |
          [Unit]
          Description=Register services with Consul
          After=network-online.target
          Wants=network-online.target
          
          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/consul-register.sh
          RemainAfterExit=yes
          Restart=on-failure
          RestartSec=30
          
          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/consul-register.service
        mode: '0644'

    - name: Create systemd timer for periodic re-registration
      copy:
        content: |
          [Unit]
          Description=Periodic Consul service re-registration
          
          [Timer]
          OnBootSec=1min
          OnUnitActiveSec=5min
          
          [Install]
          WantedBy=timers.target
        dest: /etc/systemd/system/consul-register.timer
        mode: '0644'

    - name: Enable and start registration service
      systemd:
        name: consul-register.service
        enabled: true
        state: started
        daemon_reload: true

    - name: Enable and start registration timer
      systemd:
        name: consul-register.timer
        enabled: true
        state: started
        daemon_reload: true

    - name: Wait for registration to complete
      pause:
        seconds: 5

# -------------------------------------------------------------------------
# Verification
# -------------------------------------------------------------------------

- name: Verify registration from Consul cluster
  hosts: nomad_servers[0]
  become: true
  tasks:
    - name: Query node-exporter services
      command: consul catalog service node-exporter
      register: node_exporters
      changed_when: false
      environment:
        CONSUL_HTTP_ADDR: "https://127.0.0.1:8501"
        CONSUL_CACERT: "/etc/consul.d/tls/ca.crt"
        CONSUL_CLIENT_CERT: "/etc/consul.d/tls/consul.crt"
        CONSUL_CLIENT_KEY: "/etc/consul.d/tls/consul.key"

    - name: Check for DNS servers
      debug:
        msg: |
          {% if 'green' in node_exporters.stdout %}✓ green registered{% else %}✗ green NOT registered{% endif %}
          {% if 'logan' in node_exporters.stdout %}✓ logan registered{% else %}✗ logan NOT registered{% endif %}

    - name: Display completion message
      debug:
        msg:
          - "====================================================================="
          - "DNS servers registered with Consul (external registration)!"
          - "====================================================================="
          - ""
          - "Services registered:"
          - "  - node-exporter (port 9100)"
          - "  - pihole-exporter (port 9617)"
          - ""
          - "No Consul agent required - registration via HTTP API"
          - "Services re-register every 5 minutes via systemd timer"
          - ""
          - "These services will now be automatically discovered by Prometheus"
          - "====================================================================="
