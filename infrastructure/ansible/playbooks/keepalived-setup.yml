# -------------------------------------------------------------------------------
# Keepalived Setup for Traefik HA
#
# Project: Munchbox / Author: Alex Freidah
#
# Installs and configures keepalived on ingress nodes for Traefik HA.
# Uses dual VIPs for active-active load distribution:
#   VIP1: 192.168.68.50 (stabler primary, goren backup)
#   VIP2: 192.168.68.51 (goren primary, stabler backup)
#
# Run:
#   ansible-playbook playbooks/keepalived-setup.yml
# -------------------------------------------------------------------------------

- name: Set up Keepalived for Traefik HA
  hosts: stabler,goren
  become: true
  roles:
    - keepalived

  post_tasks:
    - name: Check keepalived status
      systemd:
        name: keepalived
      register: keepalived_status

    - name: Display keepalived service status
      debug:
        msg: "Keepalived is {{ keepalived_status.status.ActiveState }}"

    - name: Show VIP assignments
      command: ip addr show {{ keepalived_interface }}
      register: ip_output
      changed_when: false

    - name: Display VIP status
      debug:
        msg: |
          ============================================================
          Keepalived configured on {{ inventory_hostname }}

          Network Interface Status:
          {{ ip_output.stdout }}

          Expected VIPs:
          - 192.168.68.50 (stabler primary)
          - 192.168.68.51 (goren primary)

          This node is:
          {% if inventory_hostname == 'stabler' %}
          - PRIMARY for VIP1 (192.168.68.50)
          - BACKUP for VIP2 (192.168.68.51)
          {% else %}
          - BACKUP for VIP1 (192.168.68.50)
          - PRIMARY for VIP2 (192.168.68.51)
          {% endif %}
          ============================================================
