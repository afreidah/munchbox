---
# -------------------------------------------------------------------------------
# GPU Node Setup Playbook
#
# Project: Munchbox / Author: Alex Freidah
#
# Installs NVIDIA drivers and Container Toolkit on GPU-enabled nodes.
# Run after GPU passthrough is configured in Proxmox.
#
# Usage:
#   ansible-playbook playbooks/setup-gpu-node.yml
#   ansible-playbook playbooks/setup-gpu-node.yml -l nomad-client-04
# -------------------------------------------------------------------------------

- name: Setup GPU Nodes with NVIDIA Drivers
  hosts: gpu_nodes
  become: true
  gather_facts: true

  roles:
    - role: nvidia
      vars:
        nvidia_install_container_toolkit: true
        nvidia_docker_default_runtime: false

  post_tasks:
    - name: Verify nvidia-smi works
      command: nvidia-smi
      register: nvidia_smi_check
      changed_when: false
      failed_when: false

    - name: Display GPU status
      debug:
        msg: |
          GPU Setup Complete!
          {{ nvidia_smi_check.stdout | default('nvidia-smi not available - reboot may be required') }}

    - name: Check if reboot is required
      stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Notify if reboot needed
      debug:
        msg: "REBOOT REQUIRED: Run 'reboot' on this node for drivers to take effect"
      when: reboot_required.stat.exists or nvidia_smi_check.rc != 0
