---
# -------------------------------------------------------------------------------
# Vault Setup Playbook
#
# Project: Munchbox / Author: Alex Freidah
#
# Installs and configures Vault in HA mode on Nomad server nodes. Requires
# Consul to be running first for storage backend.
# -------------------------------------------------------------------------------

- name: Verify connectivity to Nomad servers
  hosts: nomad_servers
  gather_facts: false
  tasks:
    - name: Wait for servers to be ready
      wait_for_connection:
        timeout: 300

    - name: Gather facts
      setup:

- name: Verify Consul availability
  hosts: nomad_servers
  become: true
  tasks:
    - name: Check if Consul is running
      systemd:
        name: consul
        state: started
      register: consul_service
      failed_when: false

    - name: Verify Consul is accessible
      wait_for:
        host: 127.0.0.1
        port: 8500
        timeout: 30
      when: consul_service is succeeded

    - name: Fail if Consul is not available
      fail:
        msg: "Consul must be running before installing Vault. Run the Consul setup playbook first."
      when: consul_service is failed

- name: Install and configure Vault
  hosts: nomad_servers
  become: true
  serial: 1
  roles:
    - vault
  tags: [vault]

- name: Verify Vault installation
  hosts: nomad_servers
  become: true
  tasks:
    - name: Check Vault service status
      systemd:
        name: vault
      register: vault_service

    - name: Display Vault service status
      debug:
        msg: "Vault service is {{ vault_service.status.ActiveState }}"

    - name: Wait for Vault to be listening
      wait_for:
        host: "{{ ansible_default_ipv4.address }}"
        port: 8200
        timeout: 60

    - name: Check Vault status
      command: vault status
      register: vault_status
      failed_when: false
      changed_when: false
      environment:
        VAULT_ADDR: "https://{{ ansible_default_ipv4.address }}:8200"
        VAULT_SKIP_VERIFY: "true"
  tags: [verify]
