# playbooks/install-cni-plugins.yml
---
- name: Install CNI plugins for Consul Connect
  hosts: nomad_servers:nomad_clients
  become: true
  vars:
    cni_version: "1.4.0"
    cni_arch: "arm64"
  tasks:
    - name: Create CNI bin directory
      file:
        path: /opt/cni/bin
        state: directory
        mode: '0755'

    - name: Download CNI plugins
      get_url:
        url: "https://github.com/containernetworking/plugins/releases/download/v{{ cni_version }}/cni-plugins-linux-{{ cni_arch }}-v{{ cni_version }}.tgz"
        dest: /tmp/cni-plugins.tgz
        mode: '0644'

    - name: Extract CNI plugins
      unarchive:
        src: /tmp/cni-plugins.tgz
        dest: /opt/cni/bin
        remote_src: yes

    - name: Clean up tarball
      file:
        path: /tmp/cni-plugins.tgz
        state: absent

    - name: Verify CNI plugins installed
      command: ls /opt/cni/bin
      register: cni_plugins
      changed_when: false

    - name: Show installed plugins
      debug:
        var: cni_plugins.stdout_lines
