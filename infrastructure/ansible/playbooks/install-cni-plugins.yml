# playbooks/install-cni-plugins.yml
---
- name: Install CNI plugins for Consul Connect
  hosts: nomad_servers:nomad_clients
  become: true
  vars:
    cni_version: "1.4.0"
  tasks:
    - name: Detect architecture
      set_fact:
        cni_arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"

    - name: Show detected architecture
      debug:
        msg: "Installing CNI plugins for {{ cni_arch }} on {{ inventory_hostname }}"

    - name: Create CNI bin directory
      file:
        path: /opt/cni/bin
        state: directory
        mode: '0755'

    - name: Download CNI plugins
      get_url:
        url: "https://github.com/containernetworking/plugins/releases/download/v{{ cni_version }}/cni-plugins-linux-{{ cni_arch }}-v{{ cni_version }}.tgz"
        dest: /tmp/cni-plugins.tgz
        mode: '0644'

    - name: Remove old ARM binaries if present
      shell: rm -rf /opt/cni/bin/*
      when: cni_arch == "amd64"

    - name: Extract CNI plugins
      unarchive:
        src: /tmp/cni-plugins.tgz
        dest: /opt/cni/bin
        remote_src: yes

    - name: Clean up tarball
      file:
        path: /tmp/cni-plugins.tgz
        state: absent

    - name: Verify CNI plugins installed
      command: file /opt/cni/bin/bridge
      register: cni_verify
      changed_when: false

    - name: Show installed plugin architecture
      debug:
        var: cni_verify.stdout
