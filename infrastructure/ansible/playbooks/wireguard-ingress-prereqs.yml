# -------------------------------------------------------------------------------
# WireGuard Ingress Prerequisites
#
# Project: Munchbox / Author: Alex Freidah
#
# Prepares ingress nodes for the wireguard-server Nomad job. Loads the
# wireguard kernel module (so the container can manage wg0 in the host
# netns) and installs wireguard-tools on the host so operators can
# inspect the interface with `wg show` without exec-ing into the
# container. Run once per ingress node before deploying the
# wireguard-server job.
#
# Usage: ansible-playbook -i inventory/hosts.yml playbooks/wireguard-ingress-prereqs.yml
# -------------------------------------------------------------------------------
---
- name: Prepare ingress nodes for the wireguard-server Nomad job
  hosts: ingress
  become: true
  gather_facts: false

  tasks:
    - name: Persist wireguard module load across reboots
      ansible.builtin.copy:
        dest: /etc/modules-load.d/wireguard.conf
        content: "wireguard\n"
        owner: root
        group: root
        mode: "0644"

    - name: Load wireguard module immediately
      community.general.modprobe:
        name: wireguard
        state: present
        persistent: present

    - name: Install wireguard-tools on the host for operator inspection
      ansible.builtin.apt:
        name: wireguard-tools
        state: present
        update_cache: true
        cache_valid_time: 3600

    # The vmac sysctls (arp_ignore=1, arp_announce=2, rp_filter=0) tripped
    # ARP propagation across the Deco mesh between wired and wifi clients.
    # Removed; the keepalived WG VIP no longer uses use_vmac. The file
    # below is asserted absent so a previous run is also cleaned up.
    - name: Remove keepalived vmac sysctl overrides if present
      ansible.builtin.file:
        path: /etc/sysctl.d/99-keepalived-vmac.conf
        state: absent
      register: vmac_sysctl_removed

    - name: Reload sysctl after vmac override removal
      ansible.builtin.command: sysctl --system
      when: vmac_sysctl_removed.changed
      changed_when: vmac_sysctl_removed.changed
