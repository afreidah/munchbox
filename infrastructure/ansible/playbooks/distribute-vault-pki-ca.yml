# -------------------------------------------------------------------------------
# Distribute Vault PKI CA - Certificate Authority Distribution
#
# Project: Munchbox / Author: Alex Freidah
#
# Fetches the Vault PKI intermediate CA certificate and distributes it to all
# cluster nodes. Required for services to trust certificates issued by Vault.
# -------------------------------------------------------------------------------
---
- name: Fetch Vault PKI Intermediate CA
  hosts: stabler
  gather_facts: false
  tasks:
    - name: Fetch Vault intermediate CA using vault CLI
      ansible.builtin.shell: |
        VAULT_ADDR=https://127.0.0.1:8200 VAULT_SKIP_VERIFY=true vault read -format=json pki_int/cert/ca | jq -r '.data.certificate'
      register: vault_ca_result

    - name: Save CA locally
      ansible.builtin.copy:
        content: "{{ vault_ca_result.stdout }}"
        dest: /tmp/vault-intermediate-ca.pem
        mode: '0644'
      delegate_to: localhost

- name: Distribute Vault PKI Intermediate CA to Nomad nodes
  hosts: nomad_servers:nomad_clients
  become: true
  tasks:
    - name: Ensure /opt/nomad/tls directory exists
      ansible.builtin.file:
        path: /opt/nomad/tls
        state: directory
        mode: '0755'

    - name: Copy Vault intermediate CA to all nodes
      ansible.builtin.copy:
        src: /tmp/vault-intermediate-ca.pem
        dest: /opt/nomad/tls/vault-intermediate-ca.pem
        mode: '0644'
