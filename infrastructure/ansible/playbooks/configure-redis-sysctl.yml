---
# -------------------------------------------------------------------------------
# Configure Redis Memory Overcommit
#
# Project: Munchbox / Author: Alex Freidah
#
# Sets vm.overcommit_memory=1 on all Nomad cluster nodes to prevent Redis
# background save failures under low memory conditions.
# -------------------------------------------------------------------------------

- name: Configure memory overcommit for Redis
  hosts: nomad_cluster
  become: true

  tasks:
    - name: Set vm.overcommit_memory immediately
      ansible.posix.sysctl:
        name: vm.overcommit_memory
        value: '1'
        state: present
        sysctl_set: true
        reload: true

    - name: Verify setting
      ansible.builtin.command: sysctl vm.overcommit_memory
      register: sysctl_check
      changed_when: false

    - name: Display result
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ sysctl_check.stdout }}"
