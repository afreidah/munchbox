---
# -------------------------------------------------------------------------------
# Issue Vault Server TLS Certificates from Vault PKI
#
# Project: Munchbox / Author: Alex Freidah
#
# Replaces self-signed Vault certs with proper certs from Vault PKI.
# Requires VAULT_TOKEN environment variable with PKI issue permissions.
#
# Usage:
#   export VAULT_TOKEN=<your-token>
#   ansible-playbook -i inventory/hosts.yml playbooks/vault-pki-certs.yml
# -------------------------------------------------------------------------------

- name: Create Vault PKI role for Vault servers
  hosts: localhost
  gather_facts: false
  vars:
    vault_addr: "https://192.168.68.61:8200"
  tasks:
    - name: Check VAULT_TOKEN is set
      ansible.builtin.fail:
        msg: "VAULT_TOKEN environment variable must be set"
      when: lookup('env', 'VAULT_TOKEN') == ''

    - name: Create/update vault-server PKI role
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/pki_int/roles/vault-server"
        method: POST
        headers:
          X-Vault-Token: "{{ lookup('env', 'VAULT_TOKEN') }}"
        body_format: json
        body:
          allowed_domains:
            - "munchbox.cc"
            - "munchbox"
            - "vault.service.consul"
            - "stabler"
            - "goren"
            - "debian"
            - "nomad-server-03"
            - "localhost"
          allow_subdomains: true
          allow_bare_domains: true
          allow_glob_domains: true
          allow_any_name: true
          allow_localhost: true
          allow_ip_sans: true
          enforce_hostnames: false
          server_flag: true
          client_flag: true
          max_ttl: "8760h"
          ttl: "8760h"
        validate_certs: false
        status_code: [200, 204]
      register: role_result

    - name: Display role creation result
      ansible.builtin.debug:
        msg: "Vault PKI role 'vault-server' created/updated"

- name: Issue certificates for Vault servers
  hosts: localhost
  gather_facts: false
  vars:
    vault_addr: "https://192.168.68.61:8200"
    vault_servers:
      - name: stabler
        fqdn: stabler.munchbox.cc
        ip: 192.168.68.61
      - name: goren
        fqdn: goren.munchbox.cc
        ip: 192.168.68.60
      - name: nomad-server-03
        fqdn: debian.munchbox.cc
        ip: 192.168.68.69
  tasks:
    - name: Issue certificate for each Vault server
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/pki_int/issue/vault-server"
        method: POST
        headers:
          X-Vault-Token: "{{ lookup('env', 'VAULT_TOKEN') }}"
        body_format: json
        body:
          common_name: "{{ item.fqdn }}"
          alt_names: "{{ item.name }},localhost,vault.service.consul"
          ip_sans: "{{ item.ip }},127.0.0.1"
          ttl: "8760h"
        validate_certs: false
        status_code: [200]
      register: cert_results
      loop: "{{ vault_servers }}"

    - name: Save certificates locally
      ansible.builtin.copy:
        content: "{{ item.json.data.certificate }}"
        dest: "/tmp/vault-cert-{{ item.item.name }}.pem"
        mode: '0644'
      loop: "{{ cert_results.results }}"

    - name: Save private keys locally
      ansible.builtin.copy:
        content: "{{ item.json.data.private_key }}"
        dest: "/tmp/vault-key-{{ item.item.name }}.pem"
        mode: '0644'
      loop: "{{ cert_results.results }}"

    - name: Save CA chain locally
      ansible.builtin.copy:
        content: "{{ cert_results.results[0].json.data.ca_chain | join('\n') }}"
        dest: "/tmp/vault-ca-chain.pem"
        mode: '0644'

    - name: Save issuing CA locally
      ansible.builtin.copy:
        content: "{{ cert_results.results[0].json.data.issuing_ca }}"
        dest: "/tmp/vault-issuing-ca.pem"
        mode: '0644'

- name: Deploy certificates to stabler
  hosts: stabler
  become: true
  gather_facts: false
  tasks:
    - name: Backup existing Vault certs
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ item }}.bak.{{ ansible_date_time.epoch | default(lookup('pipe', 'date +%s')) }}"
        remote_src: true
        mode: '0644'
      loop:
        - /etc/vault.d/tls/vault.crt
        - /etc/vault.d/tls/vault.key
      ignore_errors: true

    - name: Deploy new certificate
      ansible.builtin.copy:
        src: /tmp/vault-cert-stabler.pem
        dest: /etc/vault.d/tls/vault.crt
        owner: vault
        group: vault
        mode: '0644'

    - name: Deploy new private key
      ansible.builtin.copy:
        src: /tmp/vault-key-stabler.pem
        dest: /etc/vault.d/tls/vault.key
        owner: vault
        group: vault
        mode: '0600'

    - name: Deploy CA chain
      ansible.builtin.copy:
        src: /tmp/vault-ca-chain.pem
        dest: /etc/vault.d/tls/ca-chain.pem
        owner: vault
        group: vault
        mode: '0644'

    - name: Restart Vault
      ansible.builtin.systemd:
        name: vault
        state: restarted

    - name: Pause for manual unseal
      ansible.builtin.pause:
        prompt: "Vault on stabler has restarted. Please unseal it now, then press Enter"

    - name: Wait for Vault to be responsive
      ansible.builtin.uri:
        url: "https://192.168.68.61:8200/v1/sys/health"
        method: GET
        validate_certs: false
        status_code: [200, 429, 472, 473, 501, 503]
      register: vault_health
      retries: 30
      delay: 2
      until: vault_health.status in [200, 429, 472, 473, 501, 503]

