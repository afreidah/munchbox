- name: Update Nomad nodes with Vault CA
  hosts: nomad_servers:nomad_clients
  become: true
  tasks:
    - name: Deploy Vault CA chain to Nomad nodes
      ansible.builtin.copy:
        src: /tmp/vault-ca-chain.pem
        dest: /opt/nomad/tls/vault-ca-chain.pem
        mode: '0644'

    - name: Update Nomad config to use CA chain
      ansible.builtin.replace:
        path: /etc/nomad.d/nomad.hcl
        regexp: 'ca_file\s*=\s*"[^"]*vault[^"]*\.pem"'
        replace: 'ca_file = "/opt/nomad/tls/vault-ca-chain.pem"'

    - name: Remove tls_skip_verify if present
      ansible.builtin.lineinfile:
        path: /etc/nomad.d/nomad.hcl
        regexp: '^\s*tls_skip_verify\s*='
        state: absent

- name: Restart Nomad servers
  hosts: nomad_servers
  become: true
  serial: 1
  tasks:
    - name: Restart Nomad
      ansible.builtin.systemd:
        name: nomad
        state: restarted

    - name: Wait for Nomad to be responsive
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:4646/v1/status/leader"
        method: GET
        validate_certs: false
        status_code: [200]
      register: nomad_health
      retries: 30
      delay: 2
      until: nomad_health.status == 200

    - name: Display status
      ansible.builtin.debug:
        msg: "Nomad server on {{ inventory_hostname }} is responding"

- name: Restart Nomad clients
  hosts: nomad_clients:!nomad_servers
  become: true
  tasks:
    - name: Restart Nomad
      ansible.builtin.systemd:
        name: nomad
        state: restarted

- name: Cleanup temporary files
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Remove temporary cert files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/vault-cert-stabler.pem
        - /tmp/vault-cert-goren.pem
        - /tmp/vault-cert-nomad-server-03.pem
        - /tmp/vault-key-stabler.pem
        - /tmp/vault-key-goren.pem
        - /tmp/vault-key-nomad-server-03.pem
        - /tmp/vault-ca-chain.pem
        - /tmp/vault-issuing-ca.pem

- name: Verify Vault cluster health
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Check Vault cluster status
      ansible.builtin.uri:
        url: "https://192.168.68.61:8200/v1/sys/health"
        method: GET
        validate_certs: false
        status_code: [200, 429]
      register: vault_final

    - name: Display final status
      ansible.builtin.debug:
        msg: "Vault cluster is healthy. Vault TLS certificates are now issued from Vault PKI."
