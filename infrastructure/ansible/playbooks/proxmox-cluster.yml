---
# -------------------------------------------------------------------------------
# Proxmox Cluster Setup Playbook
#
# Project: Munchbox / Author: Alex Freidah
#
# Configures existing Proxmox VE cluster (installed from ISO) with Ceph storage
# and cluster formation. Assumes Proxmox VE is already installed on all nodes.
# -------------------------------------------------------------------------------

# -------------------------------------------------------------------------
# Pre-Flight Checks
# -------------------------------------------------------------------------

- name: Verify connectivity to bare metal hosts
  hosts: proxmox_hosts
  gather_facts: false
  tasks:
    - name: Test SSH connectivity
      wait_for_connection:
        timeout: 30
      
    - name: Gather facts
      setup:
    
    - name: Verify Proxmox is installed
      command: pveversion
      register: pve_version
      changed_when: false
      
    - name: Display Proxmox version
      debug:
        msg: "Proxmox VE {{ pve_version.stdout }} detected"

# -------------------------------------------------------------------------
# Proxmox Cluster Formation
# -------------------------------------------------------------------------

- name: Configure Proxmox cluster
  hosts: proxmox_hosts
  become: true
  roles:
    - proxmox-cluster
  tags: [cluster]

# -------------------------------------------------------------------------
# Ceph Storage Setup
# -------------------------------------------------------------------------

- name: Configure Ceph storage cluster
  hosts: proxmox_hosts
  become: true
  roles:
    - ceph-cluster
  tags: [ceph]

# -------------------------------------------------------------------------
# Storage Configuration
# -------------------------------------------------------------------------

- name: Configure shared storage
  hosts: proxmox_hosts
  become: true
  roles:
    - storage
  tags: [storage]
