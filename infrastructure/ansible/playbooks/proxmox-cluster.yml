---
# -------------------------------------------------------------------------------
# Proxmox Cluster Setup Playbook
#
# Project: Munchbox / Author: Alex Freidah
#
# Verifies Proxmox VE cluster connectivity. Assumes Proxmox VE is already
# installed on all nodes.
# -------------------------------------------------------------------------------

# -------------------------------------------------------------------------
# Pre-Flight Checks
# -------------------------------------------------------------------------

- name: Verify connectivity to bare metal hosts
  hosts: proxmox_hosts
  gather_facts: false
  tasks:
    - name: Test SSH connectivity
      wait_for_connection:
        timeout: 30
      
    - name: Gather facts
      setup:
    
    - name: Verify Proxmox is installed
      command: pveversion
      register: pve_version
      changed_when: false
      
    - name: Display Proxmox version
      debug:
        msg: "Proxmox VE {{ pve_version.stdout }} detected"

