---
# -------------------------------------------------------------------------------
# Fix Nomad Consul TLS Configuration
#
# Project: Munchbox / Author: Alex Freidah
#
# Updates Nomad's consul stanza to use TLS (port 8501) instead of HTTP (8500).
# This fixes service deregistration failures when Consul has TLS enabled.
# -------------------------------------------------------------------------------

- name: Fix Nomad Consul TLS on all nodes
  hosts: nomad_servers:nomad_clients
  become: true
  serial: 1

  handlers:
    - name: restart nomad
      systemd:
        name: nomad
        state: restarted

  tasks:
    - name: Check current Consul address in Nomad config
      shell: grep -E '^\s*address\s*=.*850[01]' /etc/nomad.d/nomad.hcl || true
      register: current_config
      changed_when: false

    - name: Display current config
      debug:
        msg: "Current: {{ current_config.stdout | default('not found') }}"

    # Update address from 8500 to 8501
    - name: Update Consul address to TLS port
      replace:
        path: /etc/nomad.d/nomad.hcl
        regexp: '(\s*address\s*=\s*"127\.0\.0\.1:)8500(")'
        replace: '\g<1>8501\g<2>'
      notify: restart nomad

    # Add ssl = true if not present
    - name: Check if ssl setting exists
      shell: grep -E '^\s*ssl\s*=' /etc/nomad.d/nomad.hcl || true
      register: ssl_check
      changed_when: false

    - name: Add ssl = true after address line
      lineinfile:
        path: /etc/nomad.d/nomad.hcl
        insertafter: '^\s*address\s*=\s*"127\.0\.0\.1:8501"'
        line: '  ssl       = true'
        state: present
      when: ssl_check.stdout == ""
      notify: restart nomad

    # Ensure ca_file is set
    - name: Check if ca_file exists
      shell: grep -E '^\s*ca_file\s*=' /etc/nomad.d/nomad.hcl || true
      register: ca_check
      changed_when: false

    - name: Add ca_file after ssl line
      lineinfile:
        path: /etc/nomad.d/nomad.hcl
        insertafter: '^\s*ssl\s*=\s*true'
        line: '  ca_file   = "/etc/consul.d/tls/ca.crt"'
        state: present
      when: ca_check.stdout == ""
      notify: restart nomad

    # Ensure cert_file is set
    - name: Check if cert_file exists
      shell: grep -E '^\s*cert_file\s*=' /etc/nomad.d/nomad.hcl || true
      register: cert_check
      changed_when: false

    - name: Add cert_file after ca_file line
      lineinfile:
        path: /etc/nomad.d/nomad.hcl
        insertafter: '^\s*ca_file\s*='
        line: '  cert_file = "/etc/consul.d/tls/consul.crt"'
        state: present
      when: cert_check.stdout == ""
      notify: restart nomad

    # Ensure key_file is set
    - name: Check if key_file exists
      shell: grep -E '^\s*key_file\s*=' /etc/nomad.d/nomad.hcl || true
      register: key_check
      changed_when: false

    - name: Add key_file after cert_file line
      lineinfile:
        path: /etc/nomad.d/nomad.hcl
        insertafter: '^\s*cert_file\s*='
        line: '  key_file  = "/etc/consul.d/tls/consul.key"'
        state: present
      when: key_check.stdout == ""
      notify: restart nomad

    - name: Flush handlers
      meta: flush_handlers

    - name: Wait for Nomad to be ready
      wait_for:
        host: "{{ ansible_host }}"
        port: 4646
        timeout: 60

    - name: Wait for node stabilization
      pause:
        seconds: 15

- name: Verify Nomad Consul TLS configuration
  hosts: nomad_servers[0]
  become: true
  tasks:
    - name: Check Nomad agent Consul config
      shell: |
        nomad operator api /v1/agent/self 2>/dev/null | jq '.config.Consuls[0] | {Addr, EnableSSL, CAFile}'
      environment:
        NOMAD_ADDR: "https://{{ ansible_host }}:4646"
        NOMAD_CACERT: "/opt/nomad/tls/vault-intermediate-ca.pem"
        NOMAD_TOKEN: "{{ lookup('env', 'NOMAD_TOKEN') }}"
      register: consul_config
      changed_when: false

    - name: Display updated config
      debug:
        msg: "{{ consul_config.stdout }}"
