# -------------------------------------------------------------------------------
# Enable Nomad Prometheus Metrics - Telemetry Configuration
#
# Project: Munchbox / Author: Alex Freidah
#
# Adds telemetry block to Nomad configuration to enable Prometheus metrics
# endpoint. Exposes allocation and node metrics for cluster monitoring.
# -------------------------------------------------------------------------------
---
- name: Enable Prometheus metrics on Nomad servers and clients
  hosts: nomad_servers:nomad_clients:oracle_nodes
  become: true
  tasks:
    - name: Add telemetry block to Nomad configuration
      ansible.builtin.blockinfile:
        path: /etc/nomad.d/nomad.hcl
        marker: "# {mark} ANSIBLE MANAGED BLOCK - Telemetry"
        block: |
          telemetry {
            prometheus_metrics         = true
            disable_hostname           = false
            publish_allocation_metrics = true
            publish_node_metrics       = true
          }
        insertafter: EOF
        create: false

    - name: Restart Nomad service
      ansible.builtin.systemd:
        name: nomad
        state: restarted

    - name: Wait for Nomad to be healthy
      ansible.builtin.wait_for:
        port: 4646
        delay: 5
        timeout: 60

    - name: Verify Prometheus metrics endpoint
      ansible.builtin.uri:
        url: "https://{{ ansible_default_ipv4.address }}:4646/v1/metrics?format=prometheus"
        validate_certs: false
        return_content: false
        status_code: 200
      register: metrics_check
      failed_when: false

    - name: Display metrics endpoint status
      ansible.builtin.debug:
        msg: "Prometheus metrics {{ 'ENABLED' if metrics_check.status == 200 else 'FAILED' }}"
