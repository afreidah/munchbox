# -------------------------------------------------------------------------------
# Add Vault CA to Docker - Trust Private Registry Certificates
#
# Project: Munchbox / Author: Alex Freidah
#
# Installs Vault PKI CA certificate as trusted root on Docker hosts. Enables
# Docker to pull images from the private registry using Vault-issued TLS certs.
# -------------------------------------------------------------------------------
---
- name: Add Vault PKI CA to Docker trusted certificates
  hosts: nomad_servers:nomad_clients
  become: true
  tasks:
    - name: Copy Vault CA certificate from local file
      ansible.builtin.copy:
        src: ~/vault-ca.crt
        dest: /usr/local/share/ca-certificates/vault-pki-ca.crt
        mode: '0644'

    - name: Update CA certificates
      ansible.builtin.command: update-ca-certificates

    - name: Restart Docker
      ansible.builtin.systemd:
        name: docker
        state: restarted
