# -------------------------------------------------------------------------------
# Install DNS Exporters - Prometheus Metrics for Pi-hole Servers
#
# Project: Munchbox / Author: Alex Freidah
#
# Installs node_exporter and pihole_exporter on DNS server nodes for Prometheus
# monitoring. Retrieves Pi-hole admin passwords from Vault for exporter config.
# -------------------------------------------------------------------------------
---
- name: Install Prometheus exporters on DNS servers
  hosts: dns_servers
  become: true
  vars:
    node_exporter_version: "1.10.2"
    pihole_exporter_version: "0.0.7"

  tasks:
    # -------------------------------------------------------------------------
    # Fetch Pi-hole password from Vault using CLI
    # -------------------------------------------------------------------------
    - name: Fetch Pi-hole password from Vault
      shell: vault kv get -field=password secret/pihole/{{ inventory_hostname }}
      environment:
        VAULT_ADDR: "{{ lookup('env', 'VAULT_ADDR') }}"
        VAULT_TOKEN: "{{ lookup('env', 'VAULT_TOKEN') }}"
      register: vault_password
      delegate_to: localhost
      changed_when: false

    - name: Set pihole_password fact
      set_fact:
        pihole_password: "{{ vault_password.stdout }}"

    # -------------------------------------------------------------------------
    # Detect Architecture
    # -------------------------------------------------------------------------
    - name: Detect architecture
      set_fact:
        arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' if ansible_architecture == 'aarch64' else 'armv7' if ansible_architecture == 'armv7l' else 'armv6' }}"

    - name: Show detected architecture
      debug:
        msg: "Installing exporters for {{ arch }} ({{ ansible_architecture }}) on {{ inventory_hostname }}"

    # -------------------------------------------------------------------------
    # Node Exporter (using v1.10.2 for armv6 compatibility)
    # -------------------------------------------------------------------------
    - name: Download node_exporter
      get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ arch }}.tar.gz"
        dest: /tmp/node_exporter.tar.gz
        mode: '0644'

    - name: Extract node_exporter
      unarchive:
        src: /tmp/node_exporter.tar.gz
        dest: /tmp
        remote_src: yes

    - name: Find node_exporter binary
      shell: find /tmp -name "node_exporter" -type f -executable | head -1
      register: node_exporter_path
      changed_when: false

    - name: Install node_exporter binary
      copy:
        src: "{{ node_exporter_path.stdout }}"
        dest: /usr/local/bin/node_exporter
        mode: '0755'
        remote_src: yes

    - name: Create node_exporter systemd service
      copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Node Exporter
          After=network.target

          [Service]
          Type=simple
          User=root
          ExecStart=/usr/local/bin/node_exporter \
            --web.listen-address=:9100 \
            --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|run/.+)($|/)

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start node_exporter
      systemd:
        name: node_exporter
        enabled: yes
        state: restarted
        daemon_reload: yes

    # -------------------------------------------------------------------------
    # Pi-hole Exporter (direct binary download for ARM)
    # -------------------------------------------------------------------------
    - name: Download pihole_exporter binary
      get_url:
        url: "https://github.com/eko/pihole-exporter/releases/download/{{ pihole_exporter_version }}/pihole_exporter-linux-arm"
        dest: /usr/local/bin/pihole_exporter
        mode: '0755'

    - name: Create pihole_exporter systemd service
      copy:
        dest: /etc/systemd/system/pihole_exporter.service
        content: |
          [Unit]
          Description=Pi-hole Exporter
          After=network.target

          [Service]
          Type=simple
          User=root
          Environment="PIHOLE_HOSTNAME=127.0.0.1"
          Environment="PIHOLE_PORT=80"
          Environment="PORT=9617"
          Environment="PIHOLE_PASSWORD={{ pihole_password }}"
          ExecStart=/usr/local/bin/pihole_exporter
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start pihole_exporter
      systemd:
        name: pihole_exporter
        enabled: yes
        state: restarted
        daemon_reload: yes

    # -------------------------------------------------------------------------
    # Cleanup
    # -------------------------------------------------------------------------
    - name: Clean up downloaded files
      shell: rm -rf /tmp/node_exporter*

    # -------------------------------------------------------------------------
    # Verify
    # -------------------------------------------------------------------------
    - name: Wait for services to start
      pause:
        seconds: 3

    - name: Verify node_exporter is running
      uri:
        url: http://127.0.0.1:9100/metrics
        timeout: 5
      register: node_check
      retries: 3
      delay: 2

    - name: Verify pihole_exporter is running
      uri:
        url: http://127.0.0.1:9617/metrics
        timeout: 5
      register: pihole_check
      retries: 3
      delay: 2

    - name: Show verification results
      debug:
        msg:
          - "Node exporter: {{ 'OK' if node_check.status == 200 else 'FAILED' }}"
          - "Pi-hole exporter: {{ 'OK' if pihole_check.status == 200 else 'FAILED' }}"
