# -------------------------------------------------------------------------------
# Cluster Power Off - Shut down all physical nodes
#
# Project: Munchbox / Author: Alex Freidah
#
# Powers off all nodes EXCEPT Oracle cloud nodes.
# Run this AFTER cluster-shutdown.yml to power off the rack.
#
# Usage:
#   ansible-playbook playbooks/cluster-poweroff.yml
#
# To skip confirmation prompt:
#   ansible-playbook playbooks/cluster-poweroff.yml -e confirm=yes
# -------------------------------------------------------------------------------
---
- name: Confirm power off
  hosts: localhost
  gather_facts: false
  vars:
    confirm: no

  tasks:
    - name: Confirmation prompt
      ansible.builtin.pause:
        prompt: |

          ⚠️  WARNING: This will POWER OFF all nodes except Oracle cloud nodes!

          Make sure you have run cluster-shutdown.yml first to stop services gracefully.

          Nodes that will be powered off:
            - All Proxmox hosts (cabot, mccoy, fontana, rubirosa)
            - All VMs (nomad-server-03, nomad-client-01 through 05)
            - All bare-metal nodes (stabler, goren)

          Nodes that will NOT be powered off:
            - oracle-node-1
            - oracle-node-2

          Type 'yes' to continue
      register: user_confirm
      when: confirm != "yes"

    - name: Check confirmation
      ansible.builtin.fail:
        msg: "Power off cancelled by user"
      when:
        - confirm != "yes"
        - user_confirm.user_input != "yes"

- name: Power off VMs first
  hosts: nomad_clients:nomad_servers:!cloud_nodes:!proxmox_hosts
  become: true
  gather_facts: false
  # Don't wait for each - they'll go down

  tasks:
    - name: Display shutdown message
      ansible.builtin.debug:
        msg: "Powering off {{ inventory_hostname }}..."

    - name: Power off node
      ansible.builtin.command: shutdown -h now
      async: 1
      poll: 0
      ignore_errors: true

- name: Wait for VMs to shut down
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Wait for VMs to power off
      ansible.builtin.pause:
        seconds: 30
        prompt: "Waiting 30 seconds for VMs to shut down..."

- name: Power off bare-metal nodes
  hosts: nomad_servers:&nomad_clients:!cloud_nodes
  become: true
  gather_facts: false
  # These are nodes that are both server AND client (stabler, goren)

  tasks:
    - name: Display shutdown message
      ansible.builtin.debug:
        msg: "Powering off bare-metal node {{ inventory_hostname }}..."

    - name: Power off node
      ansible.builtin.command: shutdown -h now
      async: 1
      poll: 0
      ignore_errors: true

- name: Power off Proxmox hosts last
  hosts: proxmox_hosts
  become: true
  gather_facts: false
  serial: 1

  tasks:
    - name: Display shutdown message
      ansible.builtin.debug:
        msg: "Powering off Proxmox host {{ inventory_hostname }}..."

    - name: Power off Proxmox host
      ansible.builtin.command: shutdown -h now
      async: 1
      poll: 0
      ignore_errors: true

- name: Summary
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Power off complete
      ansible.builtin.debug:
        msg: |
          ============================================================
          Power off commands sent!

          All local nodes should be shutting down.
          Oracle cloud nodes (oracle-node-1, oracle-node-2) are still running.

          You can now safely turn off the rack power.

          To start everything back up:
            1. Power on the rack
            2. Wait for nodes to boot
            3. Run: ansible-playbook playbooks/cluster-startup.yml
          ============================================================
