---
# -------------------------------------------------------------------------------
# Enable TLS on Vault
#
# Project: Munchbox / Author: Alex Freidah
#
# Updates Vault configuration to enable TLS and restarts the service.
# Run one server at a time to maintain HA availability.
# Uses in-place edits to preserve existing config (Consul tokens, etc.)
# -------------------------------------------------------------------------------

- name: Enable TLS on Vault servers
  hosts: stabler,goren,nomad-server-03
  become: true
  serial: 1

  tasks:
    - name: Check if Vault TLS cert exists
      ansible.builtin.stat:
        path: /etc/vault.d/tls/vault.crt
      register: vault_cert

    - name: Fail if TLS cert doesn't exist
      ansible.builtin.fail:
        msg: "TLS certificate not found at /etc/vault.d/tls/vault.crt. Generate certs first."
      when: not vault_cert.stat.exists

    - name: Backup current Vault config
      ansible.builtin.copy:
        src: /etc/vault.d/vault.hcl
        dest: /etc/vault.d/vault.hcl.bak
        remote_src: true
        mode: '0640'

    - name: Enable TLS in listener block
      ansible.builtin.replace:
        path: /etc/vault.d/vault.hcl
        regexp: 'tls_disable\s*=\s*true'
        replace: |
          tls_disable     = false
            tls_cert_file   = "/etc/vault.d/tls/vault.crt"
            tls_key_file    = "/etc/vault.d/tls/vault.key"

    - name: Update api_addr to use https
      ansible.builtin.replace:
        path: /etc/vault.d/vault.hcl
        regexp: 'api_addr\s*=\s*"http://'
        replace: 'api_addr     = "https://'

    - name: Restart Vault service
      ansible.builtin.systemd:
        name: vault
        state: restarted

    - name: Pause for manual unseal
      ansible.builtin.pause:
        prompt: "Vault on {{ inventory_hostname }} has restarted. Please unseal it now, then press Enter to continue"

    - name: Wait for Vault to be responsive
      ansible.builtin.uri:
        url: "https://{{ ansible_default_ipv4.address }}:8200/v1/sys/health"
        method: GET
        validate_certs: false
        status_code: [200, 429, 472, 473, 501, 503]
      register: vault_health
      retries: 30
      delay: 2
      until: vault_health.status in [200, 429, 472, 473, 501, 503]

    - name: Display Vault status
      ansible.builtin.debug:
        msg: "Vault on {{ inventory_hostname }} is responding on HTTPS (status: {{ vault_health.status }})"
