---
# -------------------------------------------------------------------------------
# ZFS Watcher Setup
#
# Project: Munchbox / Author: Alex Freidah
#
# Deploys zfswatcher on Proxmox hosts with ZFS pools. Provides a lightweight
# web dashboard for monitoring ZFS pool health, capacity, and errors.
# Exposed via Traefik at zfs.munchbox.cc
# -------------------------------------------------------------------------------

- name: Deploy ZFS Watcher
  hosts: rubirosa
  become: true

  vars:
    zfswatcher_version: "master"
    zfswatcher_repo: "https://github.com/rouben/zfswatcher.git"
    zfswatcher_install_dir: "/opt/zfswatcher"
    zfswatcher_config_dir: "/etc/zfswatcher"
    zfswatcher_web_port: 8800
    zfswatcher_user: "root"
    vault_addr: "{{ lookup('env', 'VAULT_ADDR') }}"
    vault_token: "{{ lookup('env', 'VAULT_TOKEN') }}"

  tasks:
    # -------------------------------------------------------------------------
    # Vault Secrets
    # -------------------------------------------------------------------------
    - name: Fetch proxy credentials from Vault
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/secret/data/zfswatcher"
        method: GET
        headers:
          X-Vault-Token: "{{ vault_token }}"
        validate_certs: false
        return_content: true
      register: vault_zfswatcher
      delegate_to: localhost
      become: false

    - name: Set proxy credential facts
      ansible.builtin.set_fact:
        zfswatcher_proxy_user: "{{ vault_zfswatcher.json.data.data.proxy_user }}"
        zfswatcher_proxy_hash: "{{ vault_zfswatcher.json.data.data.proxy_password_hash }}"

    # -------------------------------------------------------------------------
    # Install Dependencies
    # -------------------------------------------------------------------------
    - name: Install build dependencies
      ansible.builtin.apt:
        name:
          - golang-go
          - git
          - make
        state: present
        update_cache: true

    # -------------------------------------------------------------------------
    # Clone and Build
    # -------------------------------------------------------------------------
    - name: Create install directory
      ansible.builtin.file:
        path: "{{ zfswatcher_install_dir }}"
        state: directory
        mode: '0755'

    - name: Clone zfswatcher repository
      ansible.builtin.git:
        repo: "{{ zfswatcher_repo }}"
        dest: "{{ zfswatcher_install_dir }}/src"
        version: "{{ zfswatcher_version }}"
        force: true

    - name: Create gopkg.in directory for dependencies
      ansible.builtin.file:
        path: "{{ zfswatcher_install_dir }}/src/golibs/src/gopkg.in"
        state: directory
        mode: '0755'

    - name: Clone gcfg.v1 dependency
      ansible.builtin.git:
        repo: "https://github.com/go-gcfg/gcfg.git"
        dest: "{{ zfswatcher_install_dir }}/src/golibs/src/gopkg.in/gcfg.v1"
        version: "v1"
        force: true

    - name: Clone warnings.v0 dependency
      ansible.builtin.git:
        repo: "https://github.com/go-warnings/warnings.git"
        dest: "{{ zfswatcher_install_dir }}/src/golibs/src/gopkg.in/warnings.v0"
        version: "master"
        force: true

    - name: Build zfswatcher binary
      ansible.builtin.shell:
        cmd: |
          cd {{ zfswatcher_install_dir }}/src
          GO111MODULE=off GOPATH=$(pwd)/golibs:$(go env GOPATH) go build -o {{ zfswatcher_install_dir }}/zfswatcher
        creates: "{{ zfswatcher_install_dir }}/zfswatcher"

    # -------------------------------------------------------------------------
    # Configuration
    # -------------------------------------------------------------------------
    - name: Create config directory
      ansible.builtin.file:
        path: "{{ zfswatcher_config_dir }}"
        state: directory
        mode: '0755'

    - name: Deploy zfswatcher configuration
      ansible.builtin.template:
        src: zfswatcher.conf.j2
        dest: "{{ zfswatcher_config_dir }}/zfswatcher.conf"
        mode: '0644'
      notify: Restart zfswatcher

    # -------------------------------------------------------------------------
    # Systemd Service
    # -------------------------------------------------------------------------
    - name: Deploy systemd service
      ansible.builtin.template:
        src: zfswatcher.service.j2
        dest: /etc/systemd/system/zfswatcher.service
        mode: '0644'
      notify:
        - Reload systemd
        - Restart zfswatcher

    - name: Enable and start zfswatcher
      ansible.builtin.systemd:
        name: zfswatcher
        enabled: true
        state: started
        daemon_reload: true

    # -------------------------------------------------------------------------
    # Consul External Service Registration (for Traefik routing)
    # -------------------------------------------------------------------------
    - name: Register zfswatcher in Consul as external service
      ansible.builtin.uri:
        url: "http://192.168.68.61:8500/v1/catalog/register"
        method: PUT
        headers:
          X-Consul-Token: "{{ consul_token }}"
        body_format: json
        body:
          Node: "rubirosa-external"
          Address: "192.168.68.69"
          Service:
            Service: "zfswatcher"
            Address: "192.168.68.69"
            Port: "{{ zfswatcher_web_port | int }}"
            Tags:
              - "traefik.enable=false"
        status_code: [200]
      delegate_to: localhost
      vars:
        consul_token: "{{ lookup('env', 'CONSUL_HTTP_TOKEN') }}"

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart zfswatcher
      ansible.builtin.systemd:
        name: zfswatcher
        state: restarted
