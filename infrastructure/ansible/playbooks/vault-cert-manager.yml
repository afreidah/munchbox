---
# -------------------------------------------------------------------------------
# Deploy Vault Cert Manager
#
# Project: Munchbox / Author: Alex Freidah
#
# Deploys vault-cert-manager to all nodes, configuring certificates based on
# the node's role memberships (consul_client, consul_server, nomad_client, etc.)
#
# Prerequisites:
#   1. Build .deb packages: cd src/vault-cert-manager && make build-deb build-deb-arm64
#   2. Ensure AppRole credentials exist in ~/.munchbox/vault/approle.json
#
# Usage:
#   ansible-playbook playbooks/vault-cert-manager.yml
#   ansible-playbook playbooks/vault-cert-manager.yml --limit nomad-client-01
# -------------------------------------------------------------------------------

- name: Deploy vault-cert-manager
  hosts: consul_clients:consul_servers:nomad_clients:nomad_servers
  become: true
  vars:
    # Package versioning
    _git_version: "{{ lookup('pipe', 'cd ' + playbook_dir + '/../../../src/vault-cert-manager && git describe --tags --always --dirty 2>/dev/null || echo dev') }}"
    vault_cert_manager_version: "{{ _git_version if _git_version is match('^[0-9]') else '0.0.0+' + _git_version }}"
    vault_cert_manager_deb_path: "{{ playbook_dir }}/../../../src/vault-cert-manager/dist/vault-cert-manager_{{ vault_cert_manager_version }}-1_{{ vault_cert_manager_arch }}.deb"
    vault_cert_manager_pki_mount: pki_int
    vault_cert_manager_skip_verify: true

    # -------------------------------------------------------------------------
    # Certificate Templates - one per role type
    # -------------------------------------------------------------------------

    _consul_client_cert:
      name: consul-client
      role: consul-client
      common_name: "client.{{ consul_datacenter }}.consul"
      certificate: /etc/consul.d/tls/consul.crt
      key: /etc/consul.d/tls/consul.key
      ttl: 2160h
      alt_names:
        - localhost
        - "{{ inventory_hostname }}"
        - "{{ ansible_hostname }}"
        - "{{ inventory_hostname }}.munchbox.cc"
        - "client.{{ consul_datacenter }}.consul"
      ip_sans:
        - "{{ static_ip | default(ansible_default_ipv4.address) }}"
        - "127.0.0.1"
      owner: consul
      group: consul
      on_change: "systemctl reload consul"
      health_check:
        tcp: "127.0.0.1:8501"
        timeout: 5s

    _consul_server_cert:
      name: consul-server
      role: consul-server
      common_name: "server.{{ consul_datacenter }}.consul"
      certificate: /etc/consul.d/tls/consul.crt
      key: /etc/consul.d/tls/consul.key
      ttl: 2160h
      alt_names:
        - localhost
        - "{{ inventory_hostname }}"
        - "{{ ansible_hostname }}"
        - "{{ inventory_hostname }}.munchbox.cc"
        - "server.{{ consul_datacenter }}.consul"
      ip_sans:
        - "{{ static_ip | default(ansible_default_ipv4.address) }}"
        - "127.0.0.1"
      owner: consul
      group: consul
      on_change: "systemctl reload consul"
      health_check:
        tcp: "127.0.0.1:8501"
        timeout: 5s

    _nomad_client_cert:
      name: nomad-client
      role: nomad-client
      common_name: "client.{{ nomad_region | default('global') }}.nomad"
      certificate: /etc/nomad.d/tls/nomad.crt
      key: /etc/nomad.d/tls/nomad.key
      ttl: 2160h
      alt_names:
        - localhost
        - "{{ inventory_hostname }}"
        - "{{ ansible_hostname }}"
        - "{{ inventory_hostname }}.munchbox.cc"
        - "client.{{ nomad_region | default('global') }}.nomad"
      ip_sans:
        - "{{ static_ip | default(ansible_default_ipv4.address) }}"
        - "127.0.0.1"
      owner: "{{ nomad_user | default('nomad') }}"
      group: "{{ nomad_group | default('nomad') }}"
      on_change: "systemctl reload nomad"
      health_check:
        tcp: "127.0.0.1:4646"
        timeout: 5s

    _nomad_server_cert:
      name: nomad-server
      role: nomad-server
      common_name: "server.{{ nomad_region | default('global') }}.nomad"
      certificate: /etc/nomad.d/tls/nomad.crt
      key: /etc/nomad.d/tls/nomad.key
      ttl: 2160h
      alt_names:
        - localhost
        - "{{ inventory_hostname }}"
        - "{{ ansible_hostname }}"
        - "{{ inventory_hostname }}.munchbox.cc"
        - "server.{{ nomad_region | default('global') }}.nomad"
      ip_sans:
        - "{{ static_ip | default(ansible_default_ipv4.address) }}"
        - "127.0.0.1"
      owner: "{{ nomad_user | default('nomad') }}"
      group: "{{ nomad_group | default('nomad') }}"
      on_change: "systemctl reload nomad"
      health_check:
        tcp: "127.0.0.1:4646"
        timeout: 5s

    # Combined cert for nodes that are both nomad server AND client (e.g., stabler, goren)
    _nomad_server_client_cert:
      name: nomad-server
      role: nomad-server
      common_name: "server.{{ nomad_region | default('global') }}.nomad"
      certificate: /etc/nomad.d/tls/nomad.crt
      key: /etc/nomad.d/tls/nomad.key
      ttl: 2160h
      alt_names:
        - localhost
        - "{{ inventory_hostname }}"
        - "{{ ansible_hostname }}"
        - "{{ inventory_hostname }}.munchbox.cc"
        - "server.{{ nomad_region | default('global') }}.nomad"
        - "client.{{ nomad_region | default('global') }}.nomad"
      ip_sans:
        - "{{ static_ip | default(ansible_default_ipv4.address) }}"
        - "127.0.0.1"
      owner: "{{ nomad_user | default('nomad') }}"
      group: "{{ nomad_group | default('nomad') }}"
      on_change: "systemctl reload nomad"
      health_check:
        tcp: "127.0.0.1:4646"
        timeout: 5s

    # -------------------------------------------------------------------------
    # Build certificate list based on group membership
    # -------------------------------------------------------------------------

    # Helper booleans
    _is_nomad_server: "{{ (['nomad_servers'] | intersect(group_names) | length > 0) }}"
    _is_nomad_client: "{{ (['nomad_clients'] | intersect(group_names) | length > 0) }}"
    _is_consul_server: "{{ (['consul_servers'] | intersect(group_names) | length > 0) }}"
    _is_consul_client: "{{ (['consul_clients'] | intersect(group_names) | length > 0) }}"

    vault_cert_manager_certificates: >-
      {{
        (_is_consul_server) | ternary([_consul_server_cert], []) +
        (_is_consul_client and not _is_consul_server) | ternary([_consul_client_cert], []) +
        (_is_nomad_server and _is_nomad_client) | ternary([_nomad_server_client_cert], []) +
        (_is_nomad_server and not _is_nomad_client) | ternary([_nomad_server_cert], []) +
        (_is_nomad_client and not _is_nomad_server) | ternary([_nomad_client_cert], [])
      }}

  tasks:
    - name: Show certificates to be managed
      debug:
        msg: "{{ inventory_hostname }} will manage: {{ vault_cert_manager_certificates | map(attribute='name') | list }}"

    - name: Include vault-cert-manager role
      include_role:
        name: vault-cert-manager
