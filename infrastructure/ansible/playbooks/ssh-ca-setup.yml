---
# -------------------------------------------------------------------------------
# SSH CA Setup
#
# Project: Munchbox / Author: Alex Freidah
#
# Deploys Vault SSH CA host certificates and trusted user CA configuration
# to all cluster nodes. This is additive - existing static key SSH access
# continues to work alongside certificate-based authentication.
#
# Usage:
#   ansible-playbook -i inventory/hosts.yml playbooks/ssh-ca-setup.yml
#   ansible-playbook -i inventory/hosts.yml playbooks/ssh-ca-setup.yml --limit nomad-client-01
# -------------------------------------------------------------------------------

- name: Deploy SSH CA configuration
  hosts: nomad_servers:nomad_clients:proxmox_hosts
  become: true
  serial: 3
  roles:
    - ssh-ca
