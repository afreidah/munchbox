# -------------------------------------------------------------------------------
# Setup Block Volume - Format and Mount OCI Block Volumes
#
# Project: Munchbox / Author: Alex Freidah
#
# Formats an attached OCI block volume with ext4 (if not already formatted)
# and mounts it at the specified path with an fstab entry.
#
# Usage:
#   ansible-playbook playbooks/setup-block-volume.yml \
#     -l oracle-arm-1 \
#     -e device=/dev/sdb \
#     -e mount_point=/mnt/minio-data
# -------------------------------------------------------------------------------
---
- name: Format and mount OCI block volume
  hosts: all
  become: true

  tasks:
    - name: Validate required variables
      assert:
        that:
          - device is defined
          - mount_point is defined
        fail_msg: "Required variables: device, mount_point"

    - name: Check if device exists
      stat:
        path: "{{ device }}"
      register: device_stat

    - name: Fail if device not found
      fail:
        msg: "Device {{ device }} not found on {{ inventory_hostname }}"
      when: not device_stat.stat.exists

    - name: Check if device already has a filesystem
      command: blkid -s TYPE -o value {{ device }}
      register: blkid_result
      changed_when: false
      failed_when: false

    - name: Format device with ext4
      filesystem:
        fstype: ext4
        dev: "{{ device }}"
      when: blkid_result.rc != 0

    - name: Create mount point
      file:
        path: "{{ mount_point }}"
        state: directory
        mode: "0755"

    - name: Mount block volume
      mount:
        path: "{{ mount_point }}"
        src: "{{ device }}"
        fstype: ext4
        opts: defaults,_netdev,nofail
        state: mounted
