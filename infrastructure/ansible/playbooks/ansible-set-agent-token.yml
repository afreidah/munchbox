# -------------------------------------------------------------------------------
# Set Consul Agent Token on VM Clients
#
# Project: Munchbox / Author: Alex Freidah
#
# Retrieves the consul-agent token from Vault and configures Consul agents on
# VM-based nodes to use it for registration and service management.
# -------------------------------------------------------------------------------
---
- name: Set Consul agent tokens on VM clients
  hosts: consul_vm_clients,oracle_nodes
  gather_facts: false
  vars:
    vault_addr: "https://192.168.68.61:8200"

  tasks:
    - name: Get Consul agent token from Vault
      delegate_to: localhost
      run_once: true
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/secret/data/consul/agent-token"
        method: GET
        headers:
          X-Vault-Token: "{{ lookup('env', 'VAULT_TOKEN') }}"
        return_content: true
      register: vault_response

    - name: Set token fact
      run_once: true
      ansible.builtin.set_fact:
        consul_agent_token: "{{ vault_response.json.data.data.token }}"

    - name: Set agent token
      ansible.builtin.command:
        cmd: consul acl set-agent-token agent "{{ consul_agent_token }}"
      environment:
        CONSUL_HTTP_TOKEN: "{{ consul_agent_token }}"
      changed_when: true

    - name: Set default token
      ansible.builtin.command:
        cmd: consul acl set-agent-token default "{{ consul_agent_token }}"
      environment:
        CONSUL_HTTP_TOKEN: "{{ consul_agent_token }}"
      changed_when: true

    - name: Verify Consul agent status
      ansible.builtin.command:
        cmd: consul members
      register: consul_members
      changed_when: false

    - name: Show Consul members
      ansible.builtin.debug:
        var: consul_members.stdout_lines
