# -------------------------------------------------------------------------------
# ZfDash Setup - ZFS Dashboard on Rubirosa
#
# Project: Munchbox / Author: Alex Freidah
#
# Installs zfdash web UI on rubirosa for monitoring the ZFS DAS.
# Registers with Consul for Traefik ingress.
#
# Usage:
#   ansible-playbook playbooks/zfdash-setup.yml
# -------------------------------------------------------------------------------
---
- name: Install ZfDash on rubirosa
  hosts: rubirosa
  become: true

  vars:
    zfdash_port: 5001
    zfdash_version: "latest"

  tasks:
    - name: Install dependencies
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
          - python3-venv
          - curl
        state: present
        update_cache: true

    - name: Create zfdash user
      ansible.builtin.user:
        name: zfdash
        system: true
        shell: /usr/sbin/nologin
        home: /opt/zfdash
        create_home: true

    - name: Download zfdash installer
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/ad4mts/zfdash/main/install.sh
        dest: /tmp/zfdash-install.sh
        mode: '0755'

    - name: Run zfdash installer
      ansible.builtin.command: /tmp/zfdash-install.sh
      args:
        creates: /usr/local/bin/zfdash
      environment:
        HOME: /root

    - name: Create zfdash web systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/zfdash-web.service
        mode: '0644'
        content: |
          [Unit]
          Description=ZfDash Web UI
          After=network.target zfs.target
          Wants=zfs.target

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/zfdash --web --port {{ zfdash_port }} --host 0.0.0.0
          Restart=always
          RestartSec=5
          User=root
          Group=root

          [Install]
          WantedBy=multi-user.target
      notify: Restart zfdash

    - name: Enable and start zfdash-web
      ansible.builtin.systemd:
        name: zfdash-web
        state: started
        enabled: true
        daemon_reload: true

    - name: Wait for zfdash to be ready
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ zfdash_port }}"
        method: GET
        status_code: [200, 302]
      register: zfdash_health
      retries: 10
      delay: 3
      until: zfdash_health.status in [200, 302]

    - name: Create Consul service registration
      ansible.builtin.copy:
        dest: /etc/consul.d/zfdash.hcl
        mode: '0644'
        content: |
          service {
            name = "zfdash"
            port = {{ zfdash_port }}
            tags = [
              "traefik.enable=true",
              "traefik.http.routers.zfdash.rule=Host(`zfdash.munchbox.cc`)",
              "traefik.http.routers.zfdash.entrypoints=websecure",
              "traefik.http.routers.zfdash.tls=true",
              "traefik.http.routers.zfdash.tls.certresolver=letsencrypt",
              "traefik.http.routers.zfdash.middlewares=oauth2-proxy@file",
              "traefik.http.routers.zfdash.priority=10",
              "traefik.http.routers.zfdash-http.rule=Host(`zfdash.munchbox.cc`)",
              "traefik.http.routers.zfdash-http.entrypoints=web",
              "traefik.http.routers.zfdash-http.middlewares=cf-tunnel-https@file,oauth2-proxy@file",
              "traefik.http.routers.zfdash-http.priority=10"
            ]
            check {
              http     = "http://127.0.0.1:{{ zfdash_port }}"
              interval = "30s"
              timeout  = "5s"
            }
          }
      notify: Reload Consul

    - name: Display completion message
      ansible.builtin.debug:
        msg: |
          ZfDash installed successfully!

          Local access: http://rubirosa:{{ zfdash_port }}
          External access: https://zfdash.munchbox.cc (after Consul reload)

  handlers:
    - name: Restart zfdash
      ansible.builtin.systemd:
        name: zfdash-web
        state: restarted
        daemon_reload: true

    - name: Reload Consul
      ansible.builtin.systemd:
        name: consul
        state: reloaded
