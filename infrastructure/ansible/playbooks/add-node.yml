# -------------------------------------------------------------------------------
# Add New Node - Single Node Provisioning Playbook
#
# Project: Munchbox / Author: Alex Freidah
#
# Provisions a single new node with all required components for joining the
# Nomad/Consul cluster. Works for both VMs and bare-metal hosts.
#
# Prerequisites:
#   1. Node added to infrastructure/nodes.yml
#   2. Inventory regenerated: make generate
#   3. For VMs: terraform applied: make tf-apply
#   4. Node is reachable via SSH as root
#   5. VAULT_TOKEN environment variable set (for TLS certs and tokens)
#
# Usage:
#   ansible-playbook playbooks/add-node.yml -e target_host=nomad-client-04
#   ansible-playbook playbooks/add-node.yml -e target_host=nomad-client-04 --tags docker
#   ansible-playbook playbooks/add-node.yml -e target_host=nomad-client-04 --skip-tags tls
# -------------------------------------------------------------------------------
---
- name: Provision new node
  hosts: "{{ target_host }}"
  gather_facts: true
  become: true

  vars:
    cni_version: "1.4.0"
    # Vault AppRole credentials for cert issuance
    vault_approle_role_id: "REDACTED_APPROLE_ROLE_ID"
    vault_approle_secret_id: "REDACTED_APPROLE_SECRET_ID"

  pre_tasks:
    - name: Validate target_host is specified
      ansible.builtin.fail:
        msg: "You must specify target_host, e.g.: -e target_host=nomad-client-04"
      when: target_host is not defined

    - name: Wait for node to be reachable
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 300

    - name: Gather facts
      ansible.builtin.setup:

    - name: Display node information
      ansible.builtin.debug:
        msg: |
          Provisioning node: {{ inventory_hostname }}
          IP: {{ ansible_host }}
          Architecture: {{ ansible_architecture }}
          Groups: {{ group_names | join(', ') }}

  tasks:
    # -------------------------------------------------------------------------
    # Base System Setup
    # -------------------------------------------------------------------------
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      tags: [base]

    - name: Install common packages
      ansible.builtin.apt:
        name: "{{ common_packages }}"
        state: present
      tags: [base]

    - name: Set timezone
      community.general.timezone:
        name: "{{ timezone }}"
      tags: [base]

    # -------------------------------------------------------------------------
    # Docker Installation
    # -------------------------------------------------------------------------
    - name: Set Docker architecture
      ansible.builtin.set_fact:
        docker_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
      tags: [docker]

    - name: Install Docker prerequisites
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
      tags: [docker]

    - name: Create keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
      tags: [docker]

    - name: Add Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
      tags: [docker]

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
        state: present
        filename: docker
      tags: [docker]

    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true
      tags: [docker]

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started
      tags: [docker]

    # -------------------------------------------------------------------------
    # CNI Plugins (for bridge networking)
    # -------------------------------------------------------------------------
    - name: Set CNI architecture
      ansible.builtin.set_fact:
        cni_arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"
      tags: [cni]

    - name: Create CNI bin directory
      ansible.builtin.file:
        path: /opt/cni/bin
        state: directory
        mode: '0755'
      tags: [cni]

    - name: Download CNI plugins
      ansible.builtin.get_url:
        url: "https://github.com/containernetworking/plugins/releases/download/v{{ cni_version }}/cni-plugins-linux-{{ cni_arch }}-v{{ cni_version }}.tgz"
        dest: /tmp/cni-plugins.tgz
        mode: '0644'
      tags: [cni]

    - name: Extract CNI plugins
      ansible.builtin.unarchive:
        src: /tmp/cni-plugins.tgz
        dest: /opt/cni/bin
        remote_src: true
      tags: [cni]

    - name: Clean up CNI tarball
      ansible.builtin.file:
        path: /tmp/cni-plugins.tgz
        state: absent
      tags: [cni]

    # -------------------------------------------------------------------------
    # NFS Mounts (skip on NFS server itself)
    # -------------------------------------------------------------------------
    - name: Install nfs-common
      ansible.builtin.apt:
        name: nfs-common
        state: present
      when: inventory_hostname != 'mccoy'
      tags: [nfs]

    - name: Create NFS mount points
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      loop:
        - /mnt/gdrive
        - /mnt/gdrive-secondary
      when: inventory_hostname != 'mccoy'
      tags: [nfs]

    - name: Add NFS mounts to fstab
      ansible.posix.mount:
        path: "{{ item.path }}"
        src: "{{ item.src }}"
        fstype: nfs
        opts: defaults,_netdev
        state: mounted
      loop:
        - { path: /mnt/gdrive, src: "mccoy:/mnt/gdrive" }
        - { path: /mnt/gdrive-secondary, src: "mccoy:/mnt/gdrive-secondary" }
      when: inventory_hostname != 'mccoy'
      tags: [nfs]

    # -------------------------------------------------------------------------
    # Vault CA Distribution (required for TLS)
    # -------------------------------------------------------------------------
    - name: Fetch Vault intermediate CA from existing node
      ansible.builtin.shell: |
        ssh -o StrictHostKeyChecking=no root@stabler 'VAULT_ADDR=https://127.0.0.1:8200 VAULT_SKIP_VERIFY=true vault read -format=json pki_int/cert/ca 2>/dev/null | jq -r ".data.certificate"'
      register: vault_ca_result
      delegate_to: localhost
      become: false
      tags: [tls, vault-ca]

    - name: Create Nomad TLS directory
      ansible.builtin.file:
        path: /opt/nomad/tls
        state: directory
        mode: '0755'
      tags: [tls, vault-ca]

    - name: Write Vault intermediate CA
      ansible.builtin.copy:
        content: "{{ vault_ca_result.stdout }}"
        dest: /opt/nomad/tls/vault-intermediate-ca.pem
        mode: '0644'
      when: vault_ca_result.stdout | length > 0
      tags: [tls, vault-ca]

    # -------------------------------------------------------------------------
    # Vault CA to Docker (for container trust)
    # -------------------------------------------------------------------------
    - name: Copy Vault CA to Docker trusted certs
      ansible.builtin.copy:
        content: "{{ vault_ca_result.stdout }}"
        dest: /usr/local/share/ca-certificates/vault-pki-ca.crt
        mode: '0644'
      when: vault_ca_result.stdout | length > 0
      tags: [tls, docker-ca]

    - name: Update system CA certificates
      ansible.builtin.command: update-ca-certificates
      tags: [tls, docker-ca]

    - name: Restart Docker to pick up new CA
      ansible.builtin.systemd:
        name: docker
        state: restarted
      tags: [tls, docker-ca]

    # -------------------------------------------------------------------------
    # Consul Setup
    # -------------------------------------------------------------------------
    - name: Include Consul role
      ansible.builtin.include_role:
        name: consul
      tags: [consul]

    # -------------------------------------------------------------------------
    # Consul TLS Certificate
    # -------------------------------------------------------------------------
    - name: Determine Consul cert role
      ansible.builtin.set_fact:
        consul_cert_role: "{{ 'consul-server' if 'nomad_servers' in group_names else 'consul-client' }}"
        consul_cert_cn: "{{ 'server' if 'nomad_servers' in group_names else 'client' }}.{{ consul_datacenter }}.consul"
      tags: [tls, consul-tls]

    - name: Generate Consul TLS certificate from Vault
      ansible.builtin.include_role:
        name: vault-cert
      vars:
        vault_cert_role: "{{ consul_cert_role }}"
        vault_cert_common_name: "{{ consul_cert_cn }}"
        vault_cert_alt_names: "localhost,{{ inventory_hostname }},{{ ansible_hostname }},{{ inventory_hostname }}.munchbox.cc,{{ consul_cert_cn }}"
        vault_cert_ip_sans: "{{ ansible_default_ipv4.address }},127.0.0.1"
        vault_cert_dest: "/etc/consul.d/tls"
        vault_cert_name: "consul"
        vault_cert_owner: "consul"
        vault_cert_group: "consul"
        vault_cert_ttl: "8760h"
      tags: [tls, consul-tls]

    - name: Update Consul config for TLS
      ansible.builtin.blockinfile:
        path: /etc/consul.d/consul.hcl
        marker: "# {mark} TLS Configuration"
        block: |

          tls {
            defaults {
              ca_file   = "/etc/consul.d/tls/ca.crt"
              cert_file = "/etc/consul.d/tls/consul.crt"
              key_file  = "/etc/consul.d/tls/consul.key"

              verify_incoming = true
              verify_outgoing = true
            }
            {% if 'nomad_servers' in group_names %}
            internal_rpc {
              verify_server_hostname = true
            }
            {% endif %}
          }
      tags: [tls, consul-tls]

    - name: Update Consul ports for HTTPS
      ansible.builtin.lineinfile:
        path: /etc/consul.d/consul.hcl
        regexp: '^\s*https\s*='
        line: '  https     = 8501'
        insertafter: 'ports {'
      tags: [tls, consul-tls]

    - name: Update Consul environment variables
      ansible.builtin.copy:
        content: |
          export CONSUL_HTTP_ADDR="https://127.0.0.1:8501"
          export CONSUL_CACERT="/etc/consul.d/tls/ca.crt"
          export CONSUL_CLIENT_CERT="/etc/consul.d/tls/consul.crt"
          export CONSUL_CLIENT_KEY="/etc/consul.d/tls/consul.key"
        dest: /etc/profile.d/consul.sh
        mode: '0644'
      tags: [tls, consul-tls]

    - name: Restart Consul with TLS
      ansible.builtin.systemd:
        name: consul
        state: restarted
      tags: [tls, consul-tls]

    - name: Wait for Consul to be ready
      ansible.builtin.wait_for:
        port: 8501
        timeout: 60
      tags: [tls, consul-tls]

    # -------------------------------------------------------------------------
    # Nomad Setup
    # -------------------------------------------------------------------------
    - name: Include Nomad role
      ansible.builtin.include_role:
        name: nomad
      tags: [nomad]

    - name: Add nomad user to docker group
      ansible.builtin.user:
        name: nomad
        groups: docker
        append: true
      tags: [nomad, docker]

    # -------------------------------------------------------------------------
    # Nomad Consul ACL Token
    # -------------------------------------------------------------------------
    - name: Get Nomad server Consul token from Vault
      delegate_to: localhost
      become: false
      ansible.builtin.uri:
        url: "{{ vault_api_addr }}/v1/secret/data/consul/nomad-server-token"
        method: GET
        headers:
          X-Vault-Token: "{{ lookup('env', 'VAULT_TOKEN') }}"
        validate_certs: false
        return_content: true
      register: server_token_response
      run_once: true
      tags: [tls, consul-token]

    - name: Get Nomad client Consul token from Vault
      delegate_to: localhost
      become: false
      ansible.builtin.uri:
        url: "{{ vault_api_addr }}/v1/secret/data/consul/nomad-client-token"
        method: GET
        headers:
          X-Vault-Token: "{{ lookup('env', 'VAULT_TOKEN') }}"
        validate_certs: false
        return_content: true
      register: client_token_response
      run_once: true
      tags: [tls, consul-token]

    - name: Set Consul token based on node type
      ansible.builtin.set_fact:
        consul_token: "{{ server_token_response.json.data.data.token if 'nomad_servers' in group_names else client_token_response.json.data.data.token }}"
      tags: [tls, consul-token]

    - name: Check if Consul token already configured in Nomad
      ansible.builtin.shell: grep -q 'token\s*=' /etc/nomad.d/nomad.hcl
      register: token_exists
      failed_when: false
      changed_when: false
      tags: [tls, consul-token]

    - name: Add Consul token to Nomad config
      ansible.builtin.lineinfile:
        path: /etc/nomad.d/nomad.hcl
        insertafter: '^consul {'
        line: '  token = "{{ consul_token }}"'
        state: present
      when: token_exists.rc != 0
      tags: [tls, consul-token]

    - name: Update existing Consul token in Nomad config
      ansible.builtin.replace:
        path: /etc/nomad.d/nomad.hcl
        regexp: '(\s+)token\s*=\s*"[^"]*"'
        replace: '\1token = "{{ consul_token }}"'
      when: token_exists.rc == 0
      tags: [tls, consul-token]

    # -------------------------------------------------------------------------
    # Nomad Vault HTTPS Configuration
    # -------------------------------------------------------------------------
    - name: Update Nomad Vault address to HTTPS
      ansible.builtin.replace:
        path: /etc/nomad.d/nomad.hcl
        regexp: 'address\s*=\s*"http://([^"]+):8200"'
        replace: 'address = "https://\1:8200"'
      tags: [tls, vault-https]

    - name: Add Vault CA cert config to Nomad
      ansible.builtin.shell: |
        if ! grep -q 'ca_file.*vault-intermediate-ca' /etc/nomad.d/nomad.hcl; then
          sed -i '/vault {/,/^}/ s|address = "https://[^"]*"|&\n  ca_file = "/opt/nomad/tls/vault-intermediate-ca.pem"|' /etc/nomad.d/nomad.hcl
        fi
      args:
        executable: /bin/bash
      tags: [tls, vault-https]

    # -------------------------------------------------------------------------
    # Restart Nomad with all configuration
    # -------------------------------------------------------------------------
    - name: Restart Nomad with full configuration
      ansible.builtin.systemd:
        name: nomad
        state: restarted
      tags: [nomad, tls]

    - name: Wait for Nomad to be responsive
      ansible.builtin.uri:
        url: "https://{{ ansible_default_ipv4.address }}:4646/v1/status/leader"
        method: GET
        validate_certs: false
        status_code: [200]
      register: nomad_health
      retries: 30
      delay: 2
      until: nomad_health.status == 200
      tags: [nomad, verify]

    # -------------------------------------------------------------------------
    # Local Consul DNS (optional)
    # -------------------------------------------------------------------------
    - name: Install dnsmasq for local Consul DNS
      ansible.builtin.apt:
        name: dnsmasq
        state: present
      tags: [dns, never]

    - name: Configure dnsmasq for Consul
      ansible.builtin.copy:
        dest: /etc/dnsmasq.d/10-consul
        content: |
          # Forward .consul queries to local Consul agent
          server=/consul/127.0.0.1#8600
        mode: '0644'
      notify: Restart dnsmasq
      tags: [dns, never]

  handlers:
    - name: Restart dnsmasq
      ansible.builtin.systemd:
        name: dnsmasq
        state: restarted

  post_tasks:
    - name: Verify Consul is running
      ansible.builtin.systemd:
        name: consul
        state: started
      register: consul_status
      tags: [verify]

    - name: Verify Nomad is running
      ansible.builtin.systemd:
        name: nomad
        state: started
      register: nomad_status
      tags: [verify]

    - name: Display completion message
      ansible.builtin.debug:
        msg: |
          Node {{ inventory_hostname }} provisioned successfully!

          Consul: {{ 'running' if consul_status.status.ActiveState == 'active' else 'NOT RUNNING' }}
          Nomad: {{ 'running' if nomad_status.status.ActiveState == 'active' else 'NOT RUNNING' }}

          TLS Configuration:
            - Consul TLS: Enabled (port 8501)
            - Vault CA: /opt/nomad/tls/vault-intermediate-ca.pem
            - Docker CA: /usr/local/share/ca-certificates/vault-pki-ca.crt

          Next steps:
            - Verify node in Consul UI: https://consul.munchbox.cc
            - Verify node in Nomad UI: https://nomad.munchbox.cc
      tags: [verify]
