# -------------------------------------------------------------------------------
# Install Docker on Nomad Clients
#
# Project: Munchbox / Author: Alex Freidah
#
# Installs Docker CE on Nomad client nodes for container workloads.
# Handles both amd64 (VMs) and arm64 (Pi5s) architectures.
# -------------------------------------------------------------------------------
---
- name: Install Docker on Nomad clients
  hosts: nomad_clients:nomad_servers
  gather_facts: true

  tasks:
    - name: Set Docker architecture
      ansible.builtin.set_fact:
        docker_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: true

    - name: Create keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Remove conflicting packages
      ansible.builtin.apt:
        name:
          - docker-buildx
        state: absent
      ignore_errors: true

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Create Docker config directory
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: '0755'

    - name: Configure Docker daemon (cloud nodes use homelab DNS via WireGuard)
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: |
          {
              "dns": {{ dns_servers | to_json }},
              "dns-search": ["."],
              "log-driver": "json-file",
              "log-opts": {
                  "max-file": "3",
                  "max-size": "10m"
              },
              "storage-driver": "overlay2"
          }
        mode: '0644'
      when: inventory_hostname in groups['cloud_nodes']
      notify: Restart Docker

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Add nomad user to docker group
      ansible.builtin.user:
        name: nomad
        groups: docker
        append: true
      notify: Restart Nomad

    - name: Restart Nomad to re-fingerprint drivers
      ansible.builtin.systemd:
        name: nomad
        state: restarted

  handlers:
    - name: Restart Docker
      ansible.builtin.systemd:
        name: docker
        state: restarted

    - name: Restart Nomad
      ansible.builtin.systemd:
        name: nomad
        state: restarted
