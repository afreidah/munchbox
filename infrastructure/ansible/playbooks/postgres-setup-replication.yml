---
# -------------------------------------------------------------------------------
# PostgreSQL Replication Setup
#
# Configures the postgres-shared primary for streaming replication:
# - Creates replication user from Vault credentials
# - Updates pg_hba.conf to allow replication connections
# - Creates replication slot for the replica
# - Reloads PostgreSQL configuration
#
# Prerequisites:
# - postgres-shared must be running on nomad-client-03
# - Vault must have secret/postgres-shared/replication with username/password
#
# Usage:
#   ansible-playbook playbooks/postgres-setup-replication.yml
# -------------------------------------------------------------------------------

- name: Configure PostgreSQL primary for streaming replication
  hosts: nomad-client-03
  gather_facts: false
  vars:
    vault_addr: "https://vault.service.consul:8200"
    replication_network: "192.168.68.0/24"

  tasks:
    - name: Get PostgreSQL root credentials from Vault
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/secret/data/postgres-shared/root"
        method: GET
        headers:
          X-Vault-Token: "{{ lookup('env', 'VAULT_TOKEN') }}"
        validate_certs: true
      register: pg_root_creds
      delegate_to: localhost
      no_log: true

    - name: Get replication credentials from Vault
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/secret/data/postgres-shared/replication"
        method: GET
        headers:
          X-Vault-Token: "{{ lookup('env', 'VAULT_TOKEN') }}"
        validate_certs: true
      register: repl_creds
      delegate_to: localhost
      no_log: true

    - name: Set credential facts
      ansible.builtin.set_fact:
        pg_user: "{{ pg_root_creds.json.data.data.username }}"
        pg_pass: "{{ pg_root_creds.json.data.data.password }}"
        repl_user: "{{ repl_creds.json.data.data.username }}"
        repl_pass: "{{ repl_creds.json.data.data.password }}"
      no_log: true

    - name: "Find postgres-shared container ID"
      ansible.builtin.shell: |
        docker ps --filter "ancestor=postgres:16-alpine" --format "{% raw %}{{.ID}}{% endraw %}" | head -1
      register: container_id
      changed_when: false

    - name: Fail if container not found
      ansible.builtin.fail:
        msg: "postgres container (port 5432) not found on this host"
      when: container_id.stdout == ""

    - name: Check if replication user exists
      ansible.builtin.shell: |
        docker exec {{ container_id.stdout }} psql -U {{ pg_user }} -d postgres -tAc \
          "SELECT 1 FROM pg_roles WHERE rolname = '{{ repl_user }}'"
      environment:
        PGPASSWORD: "{{ pg_pass }}"
      register: user_exists
      changed_when: false
      no_log: true

    - name: Create replication user
      ansible.builtin.shell: |
        docker exec {{ container_id.stdout }} psql -U {{ pg_user }} -d postgres -c \
          "CREATE USER {{ repl_user }} WITH REPLICATION ENCRYPTED PASSWORD '{{ repl_pass }}'"
      environment:
        PGPASSWORD: "{{ pg_pass }}"
      when: user_exists.stdout != "1"
      no_log: true
      register: user_created

    - name: Check if replication slot exists
      ansible.builtin.shell: |
        docker exec {{ container_id.stdout }} psql -U {{ pg_user }} -d postgres -tAc \
          "SELECT 1 FROM pg_replication_slots WHERE slot_name = 'replica_slot'"
      environment:
        PGPASSWORD: "{{ pg_pass }}"
      register: slot_exists
      changed_when: false
      no_log: true

    - name: Create replication slot
      ansible.builtin.shell: |
        docker exec {{ container_id.stdout }} psql -U {{ pg_user }} -d postgres -c \
          "SELECT pg_create_physical_replication_slot('replica_slot', true, false)"
      environment:
        PGPASSWORD: "{{ pg_pass }}"
      when: slot_exists.stdout != "1"
      no_log: true
      register: slot_created

    - name: Get PGDATA path
      ansible.builtin.shell: |
        docker exec {{ container_id.stdout }} psql -U {{ pg_user }} -d postgres -tAc "SHOW data_directory"
      environment:
        PGPASSWORD: "{{ pg_pass }}"
      register: pgdata_result
      changed_when: false
      no_log: true

    - name: Set PGDATA fact
      ansible.builtin.set_fact:
        pgdata: "{{ pgdata_result.stdout | trim }}"

    - name: Check if replication entry exists in pg_hba.conf
      ansible.builtin.shell: |
        docker exec {{ container_id.stdout }} grep -c "^host.*replication.*{{ repl_user }}" {{ pgdata }}/pg_hba.conf || echo "0"
      register: hba_grep
      changed_when: false

    - name: Add replication entry to pg_hba.conf
      ansible.builtin.shell: |
        docker exec {{ container_id.stdout }} sh -c \
          "echo 'host    replication     {{ repl_user }}    {{ replication_network }}    scram-sha-256' >> {{ pgdata }}/pg_hba.conf"
      when: hba_grep.stdout | trim == "0"
      register: hba_updated

    - name: Reload PostgreSQL configuration
      ansible.builtin.shell: |
        docker exec {{ container_id.stdout }} psql -U {{ pg_user }} -d postgres -c "SELECT pg_reload_conf()"
      environment:
        PGPASSWORD: "{{ pg_pass }}"
      when: hba_updated is changed
      no_log: true

    - name: Display replication setup status
      ansible.builtin.debug:
        msg: |
          PostgreSQL replication setup complete:
          - Replication user: {{ repl_user }} {{ '(created)' if user_created is changed else '(already exists)' }}
          - Replication slot: replica_slot {{ '(created)' if slot_created is changed else '(already exists)' }}
          - pg_hba.conf: {{ 'replication entry added' if hba_updated is changed else 'already configured' }}
          - Configuration: {{ 'reloaded' if hba_updated is changed else 'no reload needed' }}

          Next steps:
          1. Deploy postgres-replica: nomad job run nomad/jobs/infrastructure/postgres-replica/postgres-replica.nomad.hcl
          2. Deploy postgres-replica-exporter: make -C nomad run JOB=postgres-replica-exporter
          3. Update Prometheus: make -C nomad run JOB=prometheus
