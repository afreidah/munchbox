# -------------------------------------------------------------------------------
# WireGuard VPN Setup
#
# Project: Munchbox / Author: Alex Freidah
#
# Post-2026-05-17 (issue #70) the WG mesh runs reverse hub-and-spoke:
# Oracle nodes are servers (each listens on its public IP:51820); home
# ingresses (goren, nomad-client-05) are clients, each dialing outbound
# to all 4 Oracle servers. No port-forward on the home router.
#
# Keys live in Vault at secret/data/wireguard-v2/<node>. To bootstrap a
# fresh node, generate a keypair and `vault kv put` it there before
# running this playbook.
#
# Usage:
#   export VAULT_TOKEN=<your-token>
#   ansible-playbook -i inventory/hosts.yml \
#                    -i inventory/bare-metal.ini \
#                    -i inventory/oracle-nodes.yml \
#                    playbooks/wireguard-setup.yml
#
# Limit to a subset:
#   --limit wireguard_server     (oracles only)
#   --limit wireguard_clients    (home ingresses only)
#   --limit oracle-arm-1         (one node)
# -------------------------------------------------------------------------------

- name: Set up WireGuard VPN
  hosts: wireguard_nodes
  become: true
  roles:
    - wireguard

  post_tasks:
    - name: Show WireGuard status
      ansible.builtin.command: wg show
      register: wg_status
      changed_when: false

    - name: Display WireGuard status
      ansible.builtin.debug:
        msg: "{{ wg_status.stdout_lines }}"
