---
# -------------------------------------------------------------------------------
# Enable TLS Across Munchbox Cluster
#
# Project: Munchbox / Author: Alex Freidah
#
# Enables TLS on Consul, Vault, and Nomad in the correct order with rolling
# restarts to maintain HA. Uses Vault PKI to generate all certificates.
# Consul TLS is enabled first since all other services depend on it.
# -------------------------------------------------------------------------------

# -------------------------------------------------------------------------
# PHASE 1: CONSUL SERVER CERTIFICATES
# -------------------------------------------------------------------------

- name: Generate Consul server certificates
  hosts: nomad_servers
  become: true
  serial: 1
  tags: [consul, certs]
  vars:
    vault_api_addr: "http://192.168.68.61:8200"
    vault_approle_role_id: "10078d03-2a15-5611-ad7c-6e6c898b2c87"
    vault_approle_secret_id: "1208573c-ffa3-53c3-b945-b175668abd04"
  tasks:
    # --- Generate certificate from Vault PKI ---
    - name: Generate Consul server certificate
      include_role:
        name: vault-cert
      vars:
        vault_cert_role: "consul-server"
        vault_cert_name: "consul"
        vault_cert_common_name: "server.munchbox.consul"
        vault_cert_alt_names: "localhost,{{ inventory_hostname }},{{ ansible_hostname }},{{ inventory_hostname }}.munchbox.cc,server.munchbox.consul,consul.service.consul"
        vault_cert_ip_sans: "{{ ansible_default_ipv4.address }},127.0.0.1"
        vault_cert_dest: "/etc/consul.d/tls"
        vault_cert_owner: "consul"
        vault_cert_group: "consul"
        vault_cert_ttl: "8760h"

# -------------------------------------------------------------------------
# PHASE 2: CONSUL CLIENT CERTIFICATES
# -------------------------------------------------------------------------

- name: Generate Consul client certificates
  hosts: nomad_clients
  become: true
  tags: [consul, certs]
  vars:
    vault_api_addr: "http://192.168.68.61:8200"
    vault_approle_role_id: "10078d03-2a15-5611-ad7c-6e6c898b2c87"
    vault_approle_secret_id: "1208573c-ffa3-53c3-b945-b175668abd04"
  tasks:
    # --- Generate certificate from Vault PKI ---
    - name: Generate Consul client certificate
      include_role:
        name: vault-cert
      vars:
        vault_cert_role: "consul-client"
        vault_cert_name: "consul"
        vault_cert_common_name: "client.munchbox.consul"
        vault_cert_alt_names: "localhost,{{ inventory_hostname }},{{ ansible_hostname }},{{ inventory_hostname }}.munchbox.cc,client.munchbox.consul"
        vault_cert_ip_sans: "{{ ansible_default_ipv4.address }},127.0.0.1"
        vault_cert_dest: "/etc/consul.d/tls"
        vault_cert_owner: "consul"
        vault_cert_group: "consul"
        vault_cert_ttl: "8760h"

# -------------------------------------------------------------------------
# PHASE 3: ENABLE CONSUL TLS - SERVERS
# -------------------------------------------------------------------------

- name: Enable TLS on Consul servers
  hosts: nomad_servers
  become: true
  serial: 1
  tags: [consul, consul-tls]
  handlers:
    - name: restart consul
      systemd:
        name: consul
        state: restarted
  tasks:
    # --- TLS configuration block ---
    - name: Add TLS configuration to Consul
      blockinfile:
        path: /etc/consul.d/consul.hcl
        marker: "# {mark} TLS Configuration - Managed by Ansible"
        block: |
          
          tls {
            defaults {
              ca_file   = "/etc/consul.d/tls/ca.crt"
              cert_file = "/etc/consul.d/tls/consul.crt"
              key_file  = "/etc/consul.d/tls/consul.key"
              
              verify_incoming = false
              verify_outgoing = true
            }
            
            internal_rpc {
              verify_server_hostname = true
            }
          }
      notify: restart consul

    # --- Enable HTTPS port ---
    - name: Enable HTTPS port
      lineinfile:
        path: /etc/consul.d/consul.hcl
        regexp: '^\s*https\s*='
        line: '  https     = 8501'
        insertafter: 'ports {'
      notify: restart consul

    - name: Flush handlers
      meta: flush_handlers

    # --- Verification ---
    - name: Wait for Consul HTTPS
      wait_for:
        host: 127.0.0.1
        port: 8501
        timeout: 60

    - name: Verify Consul TLS
      command: >
        consul members
        -http-addr=https://127.0.0.1:8501
        -ca-file=/etc/consul.d/tls/ca.crt
        -client-cert=/etc/consul.d/tls/consul.crt
        -client-key=/etc/consul.d/tls/consul.key
      register: consul_tls_check
      changed_when: false

    - name: Display members
      debug:
        var: consul_tls_check.stdout_lines

# -------------------------------------------------------------------------
# PHASE 4: ENABLE CONSUL TLS - CLIENTS
# -------------------------------------------------------------------------

- name: Enable TLS on Consul clients
  hosts: nomad_clients
  become: true
  tags: [consul, consul-tls]
  handlers:
    - name: restart consul
      systemd:
        name: consul
        state: restarted
  tasks:
    # --- TLS configuration block ---
    - name: Add TLS configuration to Consul
      blockinfile:
        path: /etc/consul.d/consul.hcl
        marker: "# {mark} TLS Configuration - Managed by Ansible"
        block: |
          
          tls {
            defaults {
              ca_file   = "/etc/consul.d/tls/ca.crt"
              cert_file = "/etc/consul.d/tls/consul.crt"
              key_file  = "/etc/consul.d/tls/consul.key"
              
              verify_incoming = false
              verify_outgoing = true
            }
          }
      notify: restart consul

    # --- Enable HTTPS port ---
    - name: Enable HTTPS port
      lineinfile:
        path: /etc/consul.d/consul.hcl
        regexp: '^\s*https\s*='
        line: '  https     = 8501'
        insertafter: 'ports {'
      notify: restart consul

    - name: Flush handlers
      meta: flush_handlers

    # --- Verification ---
    - name: Wait for Consul HTTPS
      wait_for:
        host: 127.0.0.1
        port: 8501
        timeout: 60

# -------------------------------------------------------------------------
# PHASE 5: UPDATE CONSUL ENVIRONMENT
# -------------------------------------------------------------------------

- name: Update Consul environment on all nodes
  hosts: nomad_cluster
  become: true
  tags: [consul, consul-tls]
  tasks:
    # --- Environment variables for CLI ---
    - name: Deploy Consul environment file
      copy:
        content: |
          # -----------------------------------------------------------------------
          # Consul CLI Environment
          #
          # Project: Munchbox / Author: Alex Freidah
          # -----------------------------------------------------------------------
          
          export CONSUL_HTTP_ADDR="https://127.0.0.1:8501"
          export CONSUL_CACERT="/etc/consul.d/tls/ca.crt"
          export CONSUL_CLIENT_CERT="/etc/consul.d/tls/consul.crt"
          export CONSUL_CLIENT_KEY="/etc/consul.d/tls/consul.key"
        dest: /etc/profile.d/consul.sh
        mode: '0644'

# -------------------------------------------------------------------------
# PHASE 6: UPDATE VAULT FOR CONSUL TLS
# -------------------------------------------------------------------------

- name: Update Vault storage backend for Consul TLS
  hosts: nomad_servers
  become: true
  serial: 1
  tags: [vault, vault-consul-tls]
  vars:
    vault_consul_token: "3f557c81-f89d-6898-4f26-f3424f1dc10a"
  handlers:
    - name: restart vault
      systemd:
        name: vault
        state: restarted
  tasks:
    # --- Backup current config ---
    - name: Backup Vault config
      copy:
        src: /etc/vault.d/vault.hcl
        dest: "/etc/vault.d/vault.hcl.pre-tls.{{ ansible_date_time.epoch }}"
        remote_src: true

    # --- Copy CA certificate ---
    - name: Copy Consul CA to Vault TLS directory
      copy:
        src: /etc/consul.d/tls/ca.crt
        dest: /etc/vault.d/tls/consul-ca.crt
        remote_src: true
        owner: vault
        group: vault
        mode: '0644'

    # --- Update storage configuration ---
    - name: Add Consul TLS config to Vault storage
      blockinfile:
        path: /etc/vault.d/vault.hcl
        marker: "# {mark} Consul Storage TLS - Managed by Ansible"
        insertafter: 'storage "consul" {'
        block: |
          address     = "127.0.0.1:8501"
          scheme      = "https"
          token       = "{{ vault_consul_token }}"
          tls_ca_file = "/etc/vault.d/tls/consul-ca.crt"
      notify: restart vault

    # --- Remove old HTTP config ---
    - name: Remove old HTTP address
      lineinfile:
        path: /etc/vault.d/vault.hcl
        regexp: '^\s*address\s*=\s*"127.0.0.1:8500"'
        state: absent

    - name: Remove old HTTP scheme
      lineinfile:
        path: /etc/vault.d/vault.hcl
        regexp: '^\s*scheme\s*=\s*"http"'
        state: absent

    - name: Flush handlers
      meta: flush_handlers

    # --- Wait and prompt for unseal ---
    - name: Wait for Vault port
      wait_for:
        host: "{{ ansible_default_ipv4.address }}"
        port: 8200
        timeout: 60

    - name: Prompt for unseal
      pause:
        prompt: |
          
          Vault on {{ inventory_hostname }} restarted and needs unsealing.
          
          Run: ssh root@{{ inventory_hostname }} 'VAULT_ADDR=http://127.0.0.1:8200 vault operator unseal'
          
          Press ENTER when unsealed...

    # --- Verify unsealed ---
    - name: Verify Vault unsealed
      command: vault status -format=json
      environment:
        VAULT_ADDR: "http://127.0.0.1:8200"
      register: vault_status
      until: (vault_status.stdout | from_json).sealed == false
      retries: 30
      delay: 5
      changed_when: false

# -------------------------------------------------------------------------
# PHASE 7: NOMAD SERVER CERTIFICATES
# -------------------------------------------------------------------------

- name: Generate Nomad server certificates
  hosts: nomad_servers
  become: true
  serial: 1
  tags: [nomad, certs]
  vars:
    vault_api_addr: "http://192.168.68.61:8200"
    vault_approle_role_id: "10078d03-2a15-5611-ad7c-6e6c898b2c87"
    vault_approle_secret_id: "1208573c-ffa3-53c3-b945-b175668abd04"
  tasks:
    # --- Create TLS directory ---
    - name: Create Nomad TLS directory
      file:
        path: /etc/nomad.d/tls
        state: directory
        owner: nomad
        group: nomad
        mode: '0750'

    # --- Generate certificate from Vault PKI ---
    - name: Generate Nomad server certificate
      include_role:
        name: vault-cert
      vars:
        vault_cert_role: "nomad-server"
        vault_cert_name: "nomad"
        vault_cert_common_name: "server.global.nomad"
        vault_cert_alt_names: "localhost,{{ inventory_hostname }},{{ ansible_hostname }},{{ inventory_hostname }}.munchbox.cc,server.global.nomad,nomad.service.consul"
        vault_cert_ip_sans: "{{ ansible_default_ipv4.address }},127.0.0.1"
        vault_cert_dest: "/etc/nomad.d/tls"
        vault_cert_owner: "nomad"
        vault_cert_group: "nomad"
        vault_cert_ttl: "8760h"

# -------------------------------------------------------------------------
# PHASE 8: NOMAD CLIENT CERTIFICATES
# -------------------------------------------------------------------------

- name: Generate Nomad client certificates
  hosts: nomad_clients
  become: true
  tags: [nomad, certs]
  vars:
    vault_api_addr: "http://192.168.68.61:8200"
    vault_approle_role_id: "10078d03-2a15-5611-ad7c-6e6c898b2c87"
    vault_approle_secret_id: "1208573c-ffa3-53c3-b945-b175668abd04"
  tasks:
    # --- Create TLS directory ---
    - name: Create Nomad TLS directory
      file:
        path: /etc/nomad.d/tls
        state: directory
        owner: nomad
        group: nomad
        mode: '0750'

    # --- Generate certificate from Vault PKI ---
    - name: Generate Nomad client certificate
      include_role:
        name: vault-cert
      vars:
        vault_cert_role: "nomad-client"
        vault_cert_name: "nomad"
        vault_cert_common_name: "client.global.nomad"
        vault_cert_alt_names: "localhost,{{ inventory_hostname }},{{ ansible_hostname }},{{ inventory_hostname }}.munchbox.cc,client.global.nomad"
        vault_cert_ip_sans: "{{ ansible_default_ipv4.address }},127.0.0.1"
        vault_cert_dest: "/etc/nomad.d/tls"
        vault_cert_owner: "nomad"
        vault_cert_group: "nomad"
        vault_cert_ttl: "8760h"

# -------------------------------------------------------------------------
# PHASE 9: ENABLE NOMAD TLS - SERVERS
# -------------------------------------------------------------------------

- name: Enable TLS on Nomad servers
  hosts: nomad_servers
  become: true
  serial: 1
  tags: [nomad, nomad-tls]
  handlers:
    - name: restart nomad
      systemd:
        name: nomad
        state: restarted
  tasks:
    # --- TLS configuration block ---
    - name: Add TLS configuration to Nomad
      blockinfile:
        path: /etc/nomad.d/nomad.hcl
        marker: "# {mark} TLS Configuration - Managed by Ansible"
        block: |
          
          tls {
            http = true
            rpc  = true
            
            ca_file   = "/etc/nomad.d/tls/ca.crt"
            cert_file = "/etc/nomad.d/tls/nomad.crt"
            key_file  = "/etc/nomad.d/tls/nomad.key"
            
            verify_server_hostname = true
            verify_https_client    = false
          }
      notify: restart nomad

    # --- Consul TLS integration ---
    - name: Add Consul TLS config to Nomad
      blockinfile:
        path: /etc/nomad.d/nomad.hcl
        marker: "# {mark} Consul TLS - Managed by Ansible"
        insertafter: 'consul {'
        block: |
          ssl       = true
          ca_file   = "/etc/consul.d/tls/ca.crt"
          cert_file = "/etc/consul.d/tls/consul.crt"
          key_file  = "/etc/consul.d/tls/consul.key"
          address   = "127.0.0.1:8501"
      notify: restart nomad

    # --- Remove old Consul HTTP config ---
    - name: Remove old Consul HTTP address
      lineinfile:
        path: /etc/nomad.d/nomad.hcl
        regexp: '^\s*address\s*=\s*"127.0.0.1:8500"'
        state: absent

    - name: Flush handlers
      meta: flush_handlers

    # --- Verification ---
    - name: Wait for Nomad HTTPS
      wait_for:
        host: "{{ ansible_default_ipv4.address }}"
        port: 4646
        timeout: 60

    - name: Wait for cluster stabilization
      pause:
        seconds: 15

# -------------------------------------------------------------------------
# PHASE 10: ENABLE NOMAD TLS - CLIENTS
# -------------------------------------------------------------------------

- name: Enable TLS on Nomad clients
  hosts: nomad_clients
  become: true
  tags: [nomad, nomad-tls]
  handlers:
    - name: restart nomad
      systemd:
        name: nomad
        state: restarted
  tasks:
    # --- TLS configuration block ---
    - name: Add TLS configuration to Nomad
      blockinfile:
        path: /etc/nomad.d/nomad.hcl
        marker: "# {mark} TLS Configuration - Managed by Ansible"
        block: |
          
          tls {
            http = true
            rpc  = true
            
            ca_file   = "/etc/nomad.d/tls/ca.crt"
            cert_file = "/etc/nomad.d/tls/nomad.crt"
            key_file  = "/etc/nomad.d/tls/nomad.key"
            
            verify_server_hostname = true
            verify_https_client    = false
          }
      notify: restart nomad

    # --- Consul TLS integration ---
    - name: Add Consul TLS config to Nomad
      blockinfile:
        path: /etc/nomad.d/nomad.hcl
        marker: "# {mark} Consul TLS - Managed by Ansible"
        insertafter: 'consul {'
        block: |
          ssl       = true
          ca_file   = "/etc/consul.d/tls/ca.crt"
          cert_file = "/etc/consul.d/tls/consul.crt"
          key_file  = "/etc/consul.d/tls/consul.key"
          address   = "127.0.0.1:8501"
      notify: restart nomad

    # --- Remove old Consul HTTP config ---
    - name: Remove old Consul HTTP address
      lineinfile:
        path: /etc/nomad.d/nomad.hcl
        regexp: '^\s*address\s*=\s*"127.0.0.1:8500"'
        state: absent

    - name: Flush handlers
      meta: flush_handlers

    # --- Verification ---
    - name: Wait for Nomad HTTPS
      wait_for:
        host: "{{ ansible_default_ipv4.address }}"
        port: 4646
        timeout: 60

# -------------------------------------------------------------------------
# PHASE 11: UPDATE NOMAD ENVIRONMENT
# -------------------------------------------------------------------------

- name: Update Nomad environment on all nodes
  hosts: nomad_cluster
  become: true
  tags: [nomad, nomad-tls]
  tasks:
    # --- Environment variables for CLI ---
    - name: Deploy Nomad environment file
      copy:
        content: |
          # -----------------------------------------------------------------------
          # Nomad CLI Environment
          #
          # Project: Munchbox / Author: Alex Freidah
          # -----------------------------------------------------------------------
          
          export NOMAD_ADDR="https://127.0.0.1:4646"
          export NOMAD_CACERT="/etc/nomad.d/tls/ca.crt"
          export NOMAD_CLIENT_CERT="/etc/nomad.d/tls/nomad.crt"
          export NOMAD_CLIENT_KEY="/etc/nomad.d/tls/nomad.key"
        dest: /etc/profile.d/nomad.sh
        mode: '0644'

# -------------------------------------------------------------------------
# PHASE 12: VERIFICATION
# -------------------------------------------------------------------------

- name: Verify cluster TLS configuration
  hosts: nomad_servers[0]
  become: true
  tags: [verify]
  tasks:
    # --- Consul verification ---
    - name: Verify Consul cluster
      command: consul members
      environment:
        CONSUL_HTTP_ADDR: "https://127.0.0.1:8501"
        CONSUL_CACERT: "/etc/consul.d/tls/ca.crt"
        CONSUL_CLIENT_CERT: "/etc/consul.d/tls/consul.crt"
        CONSUL_CLIENT_KEY: "/etc/consul.d/tls/consul.key"
      register: consul_members
      changed_when: false

    - name: Display Consul members
      debug:
        var: consul_members.stdout_lines

    # --- Vault verification ---
    - name: Verify Vault status
      command: vault status
      environment:
        VAULT_ADDR: "http://127.0.0.1:8200"
      register: vault_status_output
      changed_when: false
      failed_when: false

    - name: Display Vault status
      debug:
        var: vault_status_output.stdout_lines

    # --- Nomad verification ---
    - name: Verify Nomad servers
      command: nomad server members
      environment:
        NOMAD_ADDR: "https://127.0.0.1:4646"
        NOMAD_CACERT: "/etc/nomad.d/tls/ca.crt"
        NOMAD_CLIENT_CERT: "/etc/nomad.d/tls/nomad.crt"
        NOMAD_CLIENT_KEY: "/etc/nomad.d/tls/nomad.key"
      register: nomad_servers
      changed_when: false

    - name: Display Nomad servers
      debug:
        var: nomad_servers.stdout_lines

    - name: Verify Nomad nodes
      command: nomad node status
      environment:
        NOMAD_ADDR: "https://127.0.0.1:4646"
        NOMAD_CACERT: "/etc/nomad.d/tls/ca.crt"
        NOMAD_CLIENT_CERT: "/etc/nomad.d/tls/nomad.crt"
        NOMAD_CLIENT_KEY: "/etc/nomad.d/tls/nomad.key"
      register: nomad_nodes
      changed_when: false

    - name: Display Nomad nodes
      debug:
        var: nomad_nodes.stdout_lines

    # --- Summary ---
    - name: Display completion message
      debug:
        msg:
          - "TLS enabled across Munchbox cluster"
          - ""
          - "Consul: https://127.0.0.1:8501"
          - "Vault:  http://127.0.0.1:8200 (listener TLS not enabled)"
          - "Nomad:  https://127.0.0.1:4646"
          - ""
          - "Update local ~/.bashrc with new HTTPS addresses"
