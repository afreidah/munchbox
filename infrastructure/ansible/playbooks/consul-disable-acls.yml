# -------------------------------------------------------------------------------
# Disable Consul ACLs - Temporary ACL Removal for Troubleshooting
#
# Project: Munchbox / Author: Alex Freidah
#
# Temporarily disables Consul ACL system for troubleshooting. Removes ACL config
# block and restarts Consul. Re-enable with consul-enable-acls.yml when done.
# -------------------------------------------------------------------------------
---
- name: Temporarily disable ACLs on all Consul nodes
  hosts: nomad_cluster
  become: true
  tasks:
    - name: Remove ACL configuration from Consul
      blockinfile:
        path: /etc/consul.d/consul.hcl
        marker: "# {mark} ACL Configuration"
        state: absent
        
    - name: Restart Consul
      systemd:
        name: consul
        state: restarted
        
    - name: Wait for Consul
      wait_for:
        port: 8501
        delay: 2
        timeout: 30
