# -------------------------------------------------------------------------------
# WireGuard Network Routes for Home Network Nodes
#
# Project: Munchbox / Author: Alex Freidah
#
# Adds a static route to the WireGuard network (10.200.0.0/24) via the
# floating VIP managed by keepalived's VI_WIREGUARD instance for all home
# network Consul nodes. Required for bidirectional gossip with Oracle nodes
# and survives ingress-node failover transparently because the route target
# is the VIP rather than a specific node IP.
#
# Usage: ansible-playbook -i inventory/bare-metal.ini playbooks/wireguard-routes.yml
# -------------------------------------------------------------------------------
---
- name: Configure WireGuard network routes
  hosts: consul_servers,consul_clients,proxmox_hosts
  gather_facts: true
  vars:
    wireguard_network: "10.200.0.0/24"
    # Floating VRRP VIP held by whichever ingress node is currently MASTER
    # of the VI_WIREGUARD instance in nomad/jobs/infrastructure/keepalived.
    # Replaces the previous static stabler IP (192.168.68.61) so home->Oracle
    # traffic survives an ingress-node failover without manual intervention.
    wireguard_gateway: "192.168.68.49"

  tasks:
    - name: Skip the WireGuard gateway and any cloud (WG-client) hosts
      # Cloud nodes are themselves WireGuard clients (10.200.0.x); the static
      # route via the home-network gateway is unreachable from inside the
      # tunnel and is unnecessary because their WG interface already covers
      # 10.200.0.0/24 via AllowedIPs.
      ansible.builtin.meta: end_host
      when: ansible_host == wireguard_gateway or 'cloud_nodes' in group_names

    - name: Add route immediately (if not present)
      ansible.builtin.command:
        cmd: ip route add {{ wireguard_network }} via {{ wireguard_gateway }}
      register: route_add
      changed_when: route_add.rc == 0
      failed_when: false

    - name: Check if using netplan
      ansible.builtin.stat:
        path: /etc/netplan
      register: netplan_dir

    - name: Configure persistent route via netplan
      when: netplan_dir.stat.exists
      block:
        - name: Find primary netplan config
          ansible.builtin.find:
            paths: /etc/netplan
            patterns: "*.yaml"
          register: netplan_files

        - name: Read existing netplan config
          ansible.builtin.slurp:
            src: "{{ netplan_files.files[0].path }}"
          register: netplan_content
          when: netplan_files.files | length > 0

        - name: Create wireguard routes netplan config
          ansible.builtin.copy:
            dest: /etc/netplan/99-wireguard-routes.yaml
            mode: "0600"
            content: |
              # WireGuard network route - managed by Ansible
              network:
                version: 2
                ethernets:
                  {{ ansible_default_ipv4.interface }}:
                    routes:
                      - to: {{ wireguard_network }}
                        via: {{ wireguard_gateway }}
          notify: Apply netplan

    # Legacy interfaces.d-based config declared a duplicate `iface ... inet
    # static` stanza, which ifupdown silently drops because the primary
    # /etc/network/interfaces stanza already covers the interface — so the
    # `up ip route add` hook never fired on boot. Remove it on every run.
    - name: Remove broken interfaces.d wireguard-route file (legacy)
      ansible.builtin.file:
        path: /etc/network/interfaces.d/wireguard-route
        state: absent
      when: not netplan_dir.stat.exists

    - name: Configure persistent route via systemd (Debian/non-netplan hosts)
      when: not netplan_dir.stat.exists
      block:
        - name: Create systemd service for WireGuard route
          ansible.builtin.copy:
            dest: /etc/systemd/system/wireguard-route.service
            mode: "0644"
            content: |
              # WireGuard network route - managed by Ansible
              [Unit]
              Description=Add route to WireGuard network
              After=network-online.target
              Wants=network-online.target

              [Service]
              Type=oneshot
              ExecStart=/sbin/ip route add {{ wireguard_network }} via {{ wireguard_gateway }}
              ExecStop=/sbin/ip route del {{ wireguard_network }} via {{ wireguard_gateway }}
              RemainAfterExit=yes

              [Install]
              WantedBy=multi-user.target
          notify: Enable wireguard-route service

  handlers:
    - name: Enable wireguard-route service
      ansible.builtin.systemd:
        name: wireguard-route
        enabled: true
        daemon_reload: true
    - name: Apply netplan
      ansible.builtin.command:
        cmd: netplan apply
      changed_when: true
