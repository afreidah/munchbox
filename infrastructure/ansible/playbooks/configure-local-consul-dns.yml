# -------------------------------------------------------------------------------
# Configure Local DNS Resolution
#
# Project: Munchbox / Author: Alex Freidah
#
# Configures dnsmasq on each node for DNS resolution with the following flow:
#
#   Container/Process → dnsmasq (127.0.0.53)
#                            ↓
#         ┌──────────────────┴──────────────────┐
#         │ .consul queries    │ other queries  │
#         ↓                    ↓                │
#   Consul (8600)        CoreDNS (5354)         │
#                              ↓                │
#                        Pi-holes (round-robin) │
#                              ↓                │
#                   [fallback if CoreDNS down]──┘
#
# CoreDNS runs as a Nomad system job on every node (coredns.nomad.hcl).
# dnsmasq provides fallback to Pi-holes directly if CoreDNS is unavailable.
#
# Usage:
#   ansible-playbook playbooks/configure-local-consul-dns.yml
# -------------------------------------------------------------------------------
---
- name: Configure local Consul DNS resolution via dnsmasq
  hosts: nomad_clients:oracle_nodes
  become: true
  gather_facts: true

  vars:
    dnsmasq_listen_address: "127.0.0.53"
    # Also listen on the host's primary IP for Docker containers
    dnsmasq_host_ip: "{{ ansible_default_ipv4.address }}"
    consul_dns_port: 8600
    # Local CoreDNS (runs as system job on every node)
    coredns_port: 5354
    # Direct Pi-hole access for fallback if CoreDNS is down
    pihole_servers:
      - "192.168.68.62"  # pihole-01 (green)
      - "192.168.68.64"  # pihole-02 (logan)

  tasks:
    - name: Disable avahi-daemon (conflicts with mDNS on port 5353)
      ansible.builtin.systemd:
        name: avahi-daemon
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove old dnsmasq config files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/dnsmasq.d/10-consul.conf
      failed_when: false

    - name: Install dnsmasq
      ansible.builtin.apt:
        name: dnsmasq
        state: present
        update_cache: true

    - name: Stop systemd-resolved if running (conflicts with dnsmasq)
      ansible.builtin.systemd:
        name: systemd-resolved
        state: stopped
        enabled: false
      failed_when: false

    - name: Create dnsmasq configuration
      ansible.builtin.copy:
        dest: /etc/dnsmasq.d/consul.conf
        mode: '0644'
        content: |
          # Consul DNS forwarding configuration
          # Forward .consul queries to local Consul agent
          server=/consul/127.0.0.1#{{ consul_dns_port }}

          # Listen on localhost for host processes
          listen-address={{ dnsmasq_listen_address }}
          # Also listen on host IP so Docker containers can use it
          listen-address={{ dnsmasq_host_ip }}
          bind-interfaces

          # Don't use /etc/resolv.conf for upstream (we manage it below)
          no-resolv

          # Upstream DNS servers (tried in order with strict-order)
          # 1. Local CoreDNS (round-robins to Pi-holes with health checks)
          server=127.0.0.1#{{ coredns_port }}
          # 2-3. Direct Pi-hole fallback if CoreDNS is down
          {% for pihole in pihole_servers %}
          server={{ pihole }}
          {% endfor %}

          # Try servers in order, fail over if unreachable
          strict-order

          # Cache settings
          cache-size=1000

          # Don't forward plain names (without dots)
          domain-needed

          # Never forward reverse lookups for private ranges
          bogus-priv

          # Log queries for debugging (comment out in production)
          # log-queries

          # Set reasonable timeouts
          dns-forward-max=150
      notify: Restart dnsmasq

    - name: Configure NetworkManager to not manage resolv.conf
      ansible.builtin.copy:
        dest: /etc/NetworkManager/conf.d/dns.conf
        mode: '0644'
        content: |
          [main]
          dns=none
      notify: Restart NetworkManager
      when: ansible_facts.services['NetworkManager.service'] is defined

    - name: Create static resolv.conf
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        mode: '0644'
        content: |
          # Managed by Ansible - configure-local-consul-dns.yml
          # Local dnsmasq is the SOLE resolver. dnsmasq itself fails over to
          # direct Pi-holes if CoreDNS is unreachable, so we don't need to list
          # them here. Listing them here would let processes (libc, Go's
          # net.Resolver, etc.) bypass the round-robin and hit Pi-holes directly,
          # causing imbalanced LAN load (green getting ~64% vs logan ~36%).
          #   .consul queries → Consul agent (port 8600)
          #   Other queries → local CoreDNS → Pi-holes (round-robin)
          search munchbox.cc
          nameserver {{ dnsmasq_listen_address }}

    - name: Ensure dnsmasq is enabled and started
      ansible.builtin.systemd:
        name: dnsmasq
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart dnsmasq
      ansible.builtin.systemd:
        name: dnsmasq
        state: restarted

    - name: Restart NetworkManager
      ansible.builtin.systemd:
        name: NetworkManager
        state: restarted

    - name: Restart Docker
      ansible.builtin.systemd:
        name: docker
        state: restarted

- name: Configure Docker to use local dnsmasq
  hosts: nomad_clients:oracle_nodes
  become: true
  gather_facts: true

  vars:
    dnsmasq_host_ip: "{{ ansible_default_ipv4.address }}"

  tasks:
    - name: Ensure /etc/docker directory exists
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: '0755'

    - name: Check if daemon.json exists
      ansible.builtin.stat:
        path: /etc/docker/daemon.json
      register: daemon_json_stat

    - name: Read existing daemon.json
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: daemon_json_content
      when: daemon_json_stat.stat.exists

    - name: Parse existing daemon.json
      ansible.builtin.set_fact:
        docker_config: "{{ daemon_json_content.content | b64decode | from_json }}"
      when: daemon_json_stat.stat.exists and daemon_json_content.content | b64decode | trim != ""

    - name: Initialize docker_config if not exists
      ansible.builtin.set_fact:
        docker_config: {}
      when: not daemon_json_stat.stat.exists or docker_config is not defined

    - name: Update DNS in docker config
      ansible.builtin.set_fact:
        docker_config: "{{ docker_config | combine({'dns': [dnsmasq_host_ip]}) }}"

    - name: Write updated daemon.json
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: "{{ docker_config | to_nice_json }}"
        mode: '0644'
      notify: Restart Docker

  handlers:
    - name: Restart Docker
      ansible.builtin.systemd:
        name: docker
        state: restarted

- name: Verify Consul DNS resolution
  hosts: nomad_clients
  become: true
  gather_facts: false

  tasks:
    - name: Test local Consul DNS resolution
      ansible.builtin.command:
        cmd: dig +short redis-primary.service.consul
      register: dig_result
      changed_when: false
      failed_when: dig_result.rc != 0 or dig_result.stdout == ""

    - name: Display resolution result
      ansible.builtin.debug:
        msg: "Consul DNS working: redis-primary.service.consul -> {{ dig_result.stdout }}"
