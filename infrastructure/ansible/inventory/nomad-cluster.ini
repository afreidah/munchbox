# -------------------------------------------------------------------------------
# Dynamic Inventory - Nomad Cluster
#
# Project: Munchbox / Author: Alex Freidah
#
# Mixed infrastructure: Nomad servers on bare-metal Pi5s (stabler, goren) and
# one VM server on fontana. Clients run as VMs distributed across Proxmox hosts.
# IP addresses assigned via DHCP or static configuration.
# -------------------------------------------------------------------------------

[nomad_servers]
stabler ansible_host=192.168.68.61 ansible_connection=ssh
goren ansible_host=192.168.68.60 ansible_connection=ssh
nomad-server-03 ansible_host=192.168.68.69

[nomad_clients]
nomad-client-01 ansible_host=192.168.68.70
nomad-client-02 ansible_host=192.168.68.72
nomad-client-03 ansible_host=192.168.68.71

[nomad_servers_arm64]
stabler
goren

[nomad_servers_x86_64]
nomad-server-03

[nomad_cluster:children]
nomad_servers
nomad_clients

[nomad_cluster:vars]
ansible_user=root
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_python_interpreter=/usr/bin/python3

[nomad_servers_arm64:vars]
nomad_arch=arm64

[nomad_servers_x86_64:vars]
nomad_arch=amd64
