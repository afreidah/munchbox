# -------------------------------------------------------------------------------
# Static Inventory - Bare Metal Hosts
#
# Project: Munchbox / Author: Alex Freidah
#
# Proxmox cluster nodes and Raspberry Pi5 Nomad servers. Proxmox hosts used for
# VM provisioning and Ceph setup. Pi5s run Nomad/Consul directly on bare metal.
# -------------------------------------------------------------------------------

[proxmox_hosts]
cabot ansible_host=192.168.68.59
mccoy ansible_host=192.168.68.63
fontana ansible_host=192.168.68.65

[proxmox_cluster_master]
fontana ansible_host=192.168.68.65

[pi5_servers]
goren ansible_host=192.168.68.60
stabler ansible_host=192.168.68.61

[dns_servers]
green ansible_host=192.168.68.62
logan ansible_host=192.168.68.64

[proxmox_hosts:vars]
ansible_user=root
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_python_interpreter=/usr/bin/python3

[pi5_servers:vars]
ansible_user=root
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_python_interpreter=/usr/bin/python3
nomad_arch=arm64

[dns_servers:vars]
ansible_user=root
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_python_interpreter=/usr/bin/python3

# -------------------------------------------------------------------------------
# Oracle Cloud Nodes (Free Tier AMD instances)
#
# Connected via WireGuard tunnel. ansible_host is public IP for SSH,
# static_ip is WireGuard IP for Consul/Nomad cluster communication.
# -------------------------------------------------------------------------------

[oracle_nodes]
# AMD micro instances (1GB RAM each)
oracle-node-1 ansible_host=132.226.87.58 static_ip=10.200.0.11 wireguard_client_address=10.200.0.11/24 consul_bind_addr=10.200.0.11 nomad_bind_addr=10.200.0.11
oracle-node-2 ansible_host=158.101.33.133 static_ip=10.200.0.12 wireguard_client_address=10.200.0.12/24 consul_bind_addr=10.200.0.12 nomad_bind_addr=10.200.0.12

[oracle_nodes:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_python_interpreter=/usr/bin/python3
# Same datacenter as home cluster (clients join existing servers)
nomad_datacenter=munchbox
consul_datacenter=munchbox
nomad_client_enabled=true
nomad_server_enabled=false
consul_client_enabled=true
consul_server_enabled=false
# Skip NFS mounts (can't reach home NFS server)
oracle_skip_nfs=true
# Vault API address for cert issuance
vault_api_addr=https://192.168.68.61:8200

# -------------------------------------------------------------------------------
# Nomad/Consul Groups for Oracle Nodes
# -------------------------------------------------------------------------------

[oracle_nomad_clients:children]
oracle_nodes

[oracle_consul_clients:children]
oracle_nodes

# -------------------------------------------------------------------------------
# WireGuard Groups
# -------------------------------------------------------------------------------
# Post-#70 reverse-WG cutover: roles flipped.
#   wireguard_server group → ORACLE nodes (membership defined in
#     oracle-nodes.yml). Each Oracle listens on its public IP.
#   wireguard_clients group → home INGRESS nodes (goren + nomad-client-05).
#     Each dials outbound to all 4 Oracle servers.
[wireguard_server]

[wireguard_clients]
goren
nomad-client-05

[wireguard_nodes:children]
wireguard_server
wireguard_clients
