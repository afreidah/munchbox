# -------------------------------------------------------------------------------
# Static Inventory - Bare Metal Hosts
#
# Project: Munchbox / Author: Alex Freidah
#
# Proxmox cluster nodes and Raspberry Pi5 Nomad servers. Proxmox hosts used for
# VM provisioning and Ceph setup. Pi5s run Nomad/Consul directly on bare metal.
# -------------------------------------------------------------------------------

[proxmox_hosts]
cabot ansible_host=192.168.68.59
mccoy ansible_host=192.168.68.63
fontana ansible_host=192.168.68.65

[proxmox_cluster_master]
fontana ansible_host=192.168.68.65

[pi5_servers]
goren ansible_host=192.168.68.60
stabler ansible_host=192.168.68.61

[dns_servers]
green ansible_host=192.168.68.62
logan ansible_host=192.168.68.64

[proxmox_hosts:vars]
ansible_user=root
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_python_interpreter=/usr/bin/python3

[pi5_servers:vars]
ansible_user=root
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_python_interpreter=/usr/bin/python3
nomad_arch=arm64

[dns_servers:vars]
ansible_user=root
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_python_interpreter=/usr/bin/python3
