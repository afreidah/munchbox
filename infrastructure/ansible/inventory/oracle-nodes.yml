# -----------------------------------------------------------------------------
# Oracle Cloud Nodes Inventory
#
# Project: Munchbox / Author: Alex Freidah
#
# Oracle Free Tier nodes deployed via Terragrunt. Post-2026-05-17 (#70)
# these are the WireGuard SERVERS — each listens on its public IP:51820
# and accepts tunnels from both home ingress nodes (goren + nc05).
#
# Usage: ansible-playbook -i inventory/oracle-nodes.yml playbooks/wireguard-setup.yml
# -----------------------------------------------------------------------------

all:
  children:
    oracle_nodes:
      hosts:
        oracle-node-1:
          ansible_host: 132.226.87.58
          ansible_user: ubuntu
          static_ip: 10.200.0.11
          wireguard_server_address: "10.200.0.11/24"
        oracle-node-2:
          ansible_host: 158.101.33.133
          ansible_user: ubuntu
          static_ip: 10.200.0.12
          wireguard_server_address: "10.200.0.12/24"
        oracle-arm-1:
          ansible_host: 132.226.26.135
          ansible_user: ubuntu
          static_ip: 10.200.0.13
          wireguard_server_address: "10.200.0.13/24"
        oracle-arm-2:
          ansible_host: 137.131.39.64
          ansible_user: ubuntu
          static_ip: 10.200.0.14
          wireguard_server_address: "10.200.0.14/24"

    # Oracle nodes ARE the wireguard servers post-#70 cutover.
    wireguard_server:
      hosts:
        oracle-node-1:
        oracle-node-2:
        oracle-arm-1:
        oracle-arm-2:

    # Combined group for playbook targeting (resolved with bare-metal.ini)
    wireguard_nodes:
      children:
        wireguard_server:
        wireguard_clients:
