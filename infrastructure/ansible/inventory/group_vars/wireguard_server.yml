# -------------------------------------------------------------------------------
# WireGuard Server Group Variables
#
# Project: Munchbox / Author: Alex Freidah
#
# Post-2026-05-17 (issue #70) the WG roles flipped. This group now
# contains the ORACLE nodes — each is its own WG server, listening on
# its public IP. The per-node WG address is set in host_vars.
# -------------------------------------------------------------------------------

wireguard_role: server

# Each oracle's WG address (10.200.0.X) is host-specific:
#   oracle-node-1 → 10.200.0.11/24
#   oracle-node-2 → 10.200.0.12/24
#   oracle-arm-1  → 10.200.0.13/24
#   oracle-arm-2  → 10.200.0.14/24
# Set per host as `wireguard_server_address` in host_vars/<node>.yml.

# Addresses of the two home ingresses on the WG mesh (their wg1 IPs).
# Used to render each oracle's two peer blocks. Kept here so we don't
# duplicate the data across every oracle host_vars file.
wireguard_home_ingress_addresses:
  goren: 10.201.0.2
  nc05:  10.201.0.3
