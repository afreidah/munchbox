# -------------------------------------------------------------------------------
# WireGuard Clients Group Variables
#
# Project: Munchbox / Author: Alex Freidah
#
# Post-2026-05-17 (issue #70) the WG roles flipped. This group now holds
# the HOME INGRESS nodes (goren, nc05). Each dials outbound to all 4
# Oracle servers — no port-forwarding on the home router required.
# -------------------------------------------------------------------------------

wireguard_role: client

# All 4 Oracle peers each home ingress maintains a tunnel to. Each
# oracle's public IP is its own VCN's static address. Public keys are
# fetched from Vault at runtime via the role's task.
wireguard_client_peers:
  - name: oracle-node-1
    endpoint: 132.226.87.58
    wg_address: 10.200.0.11
  - name: oracle-node-2
    endpoint: 158.101.33.133
    wg_address: 10.200.0.12
  - name: oracle-arm-1
    endpoint: 132.226.26.135
    wg_address: 10.200.0.13
  - name: oracle-arm-2
    endpoint: 137.131.39.64
    wg_address: 10.200.0.14

# Per-host: wireguard_client_address (e.g. "10.201.0.2/32")
# Per-host: wireguard_home_subnet_carrier — true on goren, absent on nc05.
#   When true, the rendered config adds the MASQUERADE iptables rule so
#   oracle→home traffic gets translated and return packets find their way
#   back via goren.
