# -------------------------------------------------------------------------------
# Group Variables - Nomad Servers
#
# Project: Munchbox / Author: Alex Freidah
#
# Configuration specific to Nomad server nodes running the control plane.
# -------------------------------------------------------------------------------

# -------------------------------------------------------------------------------
# Nomad Server Configuration
# -------------------------------------------------------------------------------

nomad_server_enabled: true
nomad_client_enabled: false

nomad_server_bootstrap_expect: 3

nomad_server_config:
  enabled: true
  bootstrap_expect: 3
  raft_protocol: 3
  encrypt: "{{ vault_nomad_encrypt_key | default('') }}"

# -------------------------------------------------------------------------------
# Nomad TLS Configuration
# -------------------------------------------------------------------------------

nomad_tls_http: true
nomad_tls_rpc: true

# -------------------------------------------------------------------------------
# Consul Server Configuration
# -------------------------------------------------------------------------------

consul_server_enabled: true
consul_client_enabled: false

consul_server_bootstrap_expect: 3

consul_server_config:
  enabled: true
  bootstrap_expect: 3

# -------------------------------------------------------------------------------
# Vault Configuration
# -------------------------------------------------------------------------------

vault_version: "1.15.4"
vault_cluster_name: "munchbox-vault"

vault_storage_backend: "consul"
vault_consul_address: "127.0.0.1:8501"
vault_consul_scheme: "https"
vault_consul_path: "vault/"
vault_consul_token: "{{ (lookup('file', '~/.munchbox/consul/tokens.json') | from_json).vault_storage }}"
vault_consul_tls_ca_file: "/etc/consul.d/tls/ca-chain.crt"
vault_consul_tls_cert_file: "/etc/consul.d/tls/consul.crt"
vault_consul_tls_key_file: "/etc/consul.d/tls/consul.key"

vault_tls_disable: false
vault_tls_cert_file: "/etc/vault.d/tls/vault-fullchain.crt"
vault_tls_key_file: "/etc/vault.d/tls/vault.key"

vault_listener_address: "0.0.0.0:8200"

vault_ui_enabled: true

vault_telemetry_disable_hostname: false
vault_telemetry_prometheus_retention_time: "30s"

# -------------------------------------------------------------------------------
# Auto-Unseal - OCI KMS
# -------------------------------------------------------------------------------
# Set vault_seal_type to "ocikms" to enable auto-unseal
# Values from: cd infrastructure/terragrunt/oci/kms && terragrunt output

vault_seal_type: "shamir"  # Change to "ocikms" after distributing OCI credentials
vault_ocikms_key_id: "ocid1.key.oc1.phx.efuxgqqxaagsq.abyhqljsv5fshqfnhsaeplahsq3qwkdkdxecu33yb6yquwdhqnrg56irupnq"
vault_ocikms_crypto_endpoint: "https://efuxgqqxaagsq-crypto.kms.us-phoenix-1.oraclecloud.com"
vault_ocikms_management_endpoint: "https://efuxgqqxaagsq-management.kms.us-phoenix-1.oraclecloud.com"
vault_ocikms_auth_type_api_key: true

# -------------------------------------------------------------------------------
# System Resources
# -------------------------------------------------------------------------------

nomad_reserved_cpu: 500
nomad_reserved_memory: 1024

# -------------------------------------------------------------------------------
# Storage
# -------------------------------------------------------------------------------

nomad_data_dir: /var/lib/nomad
consul_data_dir: /opt/consul/data

# -------------------------------------------------------------------------------
# Connect / Service Mesh
# -------------------------------------------------------------------------------

consul_connect_enabled: true
