# -------------------------------------------------------------------------------
# NVIDIA Role - Main Tasks
#
# Project: Munchbox / Author: Alex Freidah
#
# Installs NVIDIA drivers and optionally the Container Toolkit for Docker GPU
# support. Designed for Debian-based systems with PCI passthrough GPUs.
# -------------------------------------------------------------------------------

- name: Check if NVIDIA GPU is present
  command: lspci
  register: lspci_output
  changed_when: false

- name: Fail if no NVIDIA GPU detected
  fail:
    msg: "No NVIDIA GPU detected in this system. GPU passthrough may not be configured."
  when: "'NVIDIA' not in lspci_output.stdout"

- name: Display detected GPU
  debug:
    msg: "{{ lspci_output.stdout_lines | select('search', 'NVIDIA') | list }}"

# ---------------------------------------------------------------------------
# Install Prerequisites
# ---------------------------------------------------------------------------

- name: Install required packages
  apt:
    name:
      - curl
      - gnupg
      - software-properties-common
      - linux-headers-{{ ansible_kernel }}
    state: present
    update_cache: true

# ---------------------------------------------------------------------------
# Add NVIDIA Repository
# ---------------------------------------------------------------------------

- name: Add NVIDIA GPG key
  apt_key:
    url: https://nvidia.github.io/libnvidia-container/gpgkey
    state: present

- name: Get distribution codename
  command: lsb_release -cs
  register: distro_codename
  changed_when: false

- name: Add NVIDIA Container Toolkit repository
  apt_repository:
    repo: "deb https://nvidia.github.io/libnvidia-container/stable/deb/$(ARCH) /"
    filename: nvidia-container-toolkit
    state: present
  when: nvidia_install_container_toolkit

- name: Add contrib and non-free repositories for NVIDIA drivers
  apt_repository:
    repo: "deb http://deb.debian.org/debian {{ distro_codename.stdout }} main contrib non-free non-free-firmware"
    filename: debian-nonfree
    state: present

# ---------------------------------------------------------------------------
# Install NVIDIA Drivers
# ---------------------------------------------------------------------------

- name: Update apt cache
  apt:
    update_cache: true

- name: Install NVIDIA drivers
  apt:
    name:
      - nvidia-driver
      - nvidia-smi
    state: present
  notify: reboot required

# ---------------------------------------------------------------------------
# Install NVIDIA Container Toolkit
# ---------------------------------------------------------------------------

- name: Install NVIDIA Container Toolkit
  apt:
    name:
      - nvidia-container-toolkit
    state: present
  when: nvidia_install_container_toolkit

- name: Configure Docker to use nvidia runtime
  command: nvidia-ctk runtime configure --runtime=docker
  when: nvidia_install_container_toolkit
  notify: restart docker

- name: Set nvidia as default Docker runtime
  lineinfile:
    path: /etc/docker/daemon.json
    regexp: '"default-runtime"'
    line: '    "default-runtime": "nvidia",'
    insertafter: '{'
    create: false
  when:
    - nvidia_install_container_toolkit
    - nvidia_docker_default_runtime
  notify: restart docker

# ---------------------------------------------------------------------------
# Verification
# ---------------------------------------------------------------------------

- name: Check if nvidia-smi works
  command: nvidia-smi
  register: nvidia_smi_output
  changed_when: false
  failed_when: false

- name: Display nvidia-smi output
  debug:
    msg: "{{ nvidia_smi_output.stdout_lines | default(['nvidia-smi not available - reboot may be required']) }}"
