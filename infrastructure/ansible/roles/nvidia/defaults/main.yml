# NVIDIA driver version (use 'latest' for newest available)
nvidia_driver_version: "latest"

# Install NVIDIA Container Toolkit for Docker GPU support
nvidia_install_container_toolkit: true

# Configure Docker to use nvidia runtime as default
nvidia_docker_default_runtime: false
