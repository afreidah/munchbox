---
# -------------------------------------------------------------------------------
# Oracle Watchdog Role - Main Tasks
#
# Project: Munchbox / Author: Alex Freidah
#
# Installs and configures oracle-watchdog monitor mode on Oracle Cloud nodes.
# The monitor maintains a Consul session heartbeat to signal node health.
# -------------------------------------------------------------------------------

# -------------------------------------------------------------------------------
# Vault Token Retrieval
# -------------------------------------------------------------------------------

- name: Get Consul token from Vault
  delegate_to: localhost
  run_once: true
  ansible.builtin.uri:
    url: "{{ oracle_watchdog_vault_addr }}/v1/{{ oracle_watchdog_vault_path }}"
    method: GET
    headers:
      X-Vault-Token: "{{ lookup('env', 'VAULT_TOKEN') }}"
    return_content: true
    validate_certs: true
  register: vault_response

- name: Set Consul token fact
  run_once: true
  ansible.builtin.set_fact:
    oracle_watchdog_consul_token: "{{ vault_response.json.data.data.token }}"

# -------------------------------------------------------------------------------
# Installation
# -------------------------------------------------------------------------------

- name: Setup Munchbox apt repository
  include_role:
    name: munchbox-repo

- name: Install/upgrade oracle-watchdog package
  apt:
    name: oracle-watchdog
    state: latest
    update_cache: true
  notify: Restart oracle-watchdog

# -------------------------------------------------------------------------------
# Systemd Override (set CONSUL_HTTP_ADDR)
# -------------------------------------------------------------------------------

- name: Create systemd override directory
  file:
    path: /etc/systemd/system/oracle-watchdog.service.d
    state: directory
    mode: "0755"

- name: Configure systemd override for Consul connection
  template:
    src: systemd-override.conf.j2
    dest: /etc/systemd/system/oracle-watchdog.service.d/override.conf
    mode: "0600"
  notify:
    - Reload systemd
    - Restart oracle-watchdog

# -------------------------------------------------------------------------------
# Consul Service Registration
# -------------------------------------------------------------------------------

- name: Register oracle-watchdog with Consul
  template:
    src: consul-service.json.j2
    dest: /etc/consul.d/oracle-watchdog.json
    owner: consul
    group: consul
    mode: "0640"
  notify: Reload Consul

# -------------------------------------------------------------------------------
# Systemd Service
# -------------------------------------------------------------------------------

- name: Enable and start oracle-watchdog
  systemd:
    name: oracle-watchdog
    enabled: true
    state: started
    daemon_reload: true
