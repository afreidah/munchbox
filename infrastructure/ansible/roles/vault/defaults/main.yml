---
# -------------------------------------------------------------------------------
# Vault Role - Default Variables
#
# Project: Munchbox / Author: Alex Freidah
#
# Default configuration for Vault installation and setup. Override in group_vars
# or host_vars as needed for environment-specific configuration.
# -------------------------------------------------------------------------------

# -------------------------------------------------------------------------------
# Vault Version
# -------------------------------------------------------------------------------

vault_version: "1.15.4"
vault_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
vault_archive: "vault_{{ vault_version }}_linux_{{ vault_arch }}.zip"
vault_download_url: "https://releases.hashicorp.com/vault/{{ vault_version }}/{{ vault_archive }}"

# -------------------------------------------------------------------------------
# Installation Paths
# -------------------------------------------------------------------------------

vault_bin_path: "/usr/local/bin/vault"
vault_config_dir: "/etc/vault.d"
vault_data_dir: "/opt/vault/data"
vault_tls_dir: "/etc/vault.d/tls"
vault_log_dir: "/var/log/vault"

# -------------------------------------------------------------------------------
# System Configuration
# -------------------------------------------------------------------------------

vault_user: "vault"
vault_group: "vault"

# -------------------------------------------------------------------------------
# Service Configuration
# -------------------------------------------------------------------------------

vault_service_name: "vault"
vault_service_enabled: true
vault_service_state: "started"

# -------------------------------------------------------------------------------
# Consul Storage Backend
# -------------------------------------------------------------------------------

vault_consul_address: "127.0.0.1:8500"
vault_consul_path: "vault/"
vault_consul_scheme: "http"

# -------------------------------------------------------------------------------
# Listener Configuration
# -------------------------------------------------------------------------------

vault_listener_address: "{{ ansible_default_ipv4.address }}:8200"
vault_cluster_address: "{{ ansible_default_ipv4.address }}:8201"

# -------------------------------------------------------------------------------
# Cluster Configuration
# -------------------------------------------------------------------------------

vault_api_addr: "https://{{ ansible_default_ipv4.address }}:8200"
vault_cluster_addr: "https://{{ ansible_default_ipv4.address }}:8201"
vault_cluster_name: "munchbox-vault"

# -------------------------------------------------------------------------------
# TLS Configuration
# -------------------------------------------------------------------------------

vault_tls_disable: false
vault_tls_cert_file: "{{ vault_tls_dir }}/vault.crt"
vault_tls_key_file: "{{ vault_tls_dir }}/vault.key"

# -------------------------------------------------------------------------------
# UI Configuration
# -------------------------------------------------------------------------------

vault_ui_enabled: true

# -------------------------------------------------------------------------------
# Telemetry
# -------------------------------------------------------------------------------

vault_telemetry_disable_hostname: false
vault_telemetry_prometheus_retention_time: "30s"
