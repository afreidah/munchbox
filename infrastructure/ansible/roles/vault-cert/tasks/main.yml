---
# -------------------------------------------------------------------------------
# Vault Certificate Role - Main Tasks
#
# Project: Munchbox / Author: Alex Freidah
#
# Fetches TLS certificates from Vault PKI using AppRole authentication. Requires
# vault_cert_role, vault_cert_common_name, and vault_cert_dest variables.
# -------------------------------------------------------------------------------

# -------------------------------------------------------------------------------
# AppRole Authentication
# -------------------------------------------------------------------------------

- name: Authenticate to Vault using AppRole
  uri:
    url: "{{ vault_api_addr }}/v1/auth/approle/login"
    method: POST
    body_format: json
    body:
      role_id: "{{ vault_approle_role_id }}"
      secret_id: "{{ vault_approle_secret_id }}"
    validate_certs: false
    status_code: 200
  register: vault_login
  # delegate_to: localhost
  # run_once: true

- name: Parse Vault token
  set_fact:
    vault_token: "{{ vault_login.json.auth.client_token }}"
  # run_once: true

# -------------------------------------------------------------------------------
# Certificate Issuance
# -------------------------------------------------------------------------------

- name: Issue certificate from Vault PKI
  uri:
    url: "{{ vault_api_addr }}/v1/pki_int/issue/{{ vault_cert_role }}"
    method: POST
    headers:
      X-Vault-Token: "{{ vault_token }}"
    body_format: json
    body:
      common_name: "{{ vault_cert_common_name }}"
      alt_names: "{{ vault_cert_alt_names | default(omit) }}"
      ip_sans: "{{ vault_cert_ip_sans | default(omit) }}"
      ttl: "{{ vault_cert_ttl | default('720h') }}"
      format: "pem"
    validate_certs: false
    status_code: 200
  register: vault_cert_response
  # delegate_to: localhost

- name: Parse certificate data
  set_fact:
    vault_certificate: "{{ vault_cert_response.json.data.certificate }}"
    vault_private_key: "{{ vault_cert_response.json.data.private_key }}"
    vault_ca_chain: "{{ vault_cert_response.json.data.ca_chain | join('\n') }}"
    vault_issuing_ca: "{{ vault_cert_response.json.data.issuing_ca }}"

# -------------------------------------------------------------------------------
# Certificate Deployment
# -------------------------------------------------------------------------------

- name: Create certificate directory
  file:
    path: "{{ vault_cert_dest }}"
    state: directory
    owner: "{{ vault_cert_owner | default('root') }}"
    group: "{{ vault_cert_group | default('root') }}"
    mode: "0755"

- name: Write certificate
  copy:
    content: "{{ vault_certificate }}"
    dest: "{{ vault_cert_dest }}/{{ vault_cert_name }}.crt"
    owner: "{{ vault_cert_owner | default('root') }}"
    group: "{{ vault_cert_group | default('root') }}"
    mode: "{{ vault_cert_mode | default('0644') }}"

- name: Write private key
  copy:
    content: "{{ vault_private_key }}"
    dest: "{{ vault_cert_dest }}/{{ vault_cert_name }}.key"
    owner: "{{ vault_cert_owner | default('root') }}"
    group: "{{ vault_cert_group | default('root') }}"
    mode: "0600"
  no_log: true

- name: Write CA chain
  copy:
    content: "{{ vault_ca_chain }}"
    dest: "{{ vault_cert_dest }}/ca-chain.crt"
    owner: "{{ vault_cert_owner | default('root') }}"
    group: "{{ vault_cert_group | default('root') }}"
    mode: "{{ vault_cert_mode | default('0644') }}"

- name: Write issuing CA
  copy:
    content: "{{ vault_issuing_ca }}"
    dest: "{{ vault_cert_dest }}/ca.crt"
    owner: "{{ vault_cert_owner | default('root') }}"
    group: "{{ vault_cert_group | default('root') }}"
    mode: "{{ vault_cert_mode | default('0644') }}"
