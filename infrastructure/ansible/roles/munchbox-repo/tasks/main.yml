---
# -------------------------------------------------------------------------------
# Munchbox Repo Role - Main Tasks
#
# Project: Munchbox / Author: Alex Freidah
#
# Configures the Munchbox apt repository for package installation. Adds the GPG
# signing key and apt sources list entry.
# -------------------------------------------------------------------------------

- name: Create apt keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Munchbox GPG key
  get_url:
    url: "{{ munchbox_repo_gpg_url }}"
    dest: /etc/apt/keyrings/munchbox.asc
    mode: "0644"

- name: Add Munchbox apt repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/munchbox.asc] {{ munchbox_repo_url }} {{ munchbox_repo_distribution }} {{ munchbox_repo_component }}"
    state: present
    filename: munchbox
    update_cache: true
