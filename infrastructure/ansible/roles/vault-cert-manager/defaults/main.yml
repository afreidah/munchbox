---
# -------------------------------------------------------------------------------
# Vault Cert Manager Role - Default Variables
#
# Project: Munchbox / Author: Alex Freidah
#
# Default configuration for vault-cert-manager deployment. Override in group_vars
# or host_vars as needed for environment-specific configuration.
# -------------------------------------------------------------------------------

# -------------------------------------------------------------------------------
# Installation
# -------------------------------------------------------------------------------

vault_cert_manager_version: "latest"
vault_cert_manager_config_dir: /etc/vault-cert-manager
vault_cert_manager_user: root
vault_cert_manager_group: root

# Path to .deb package (set in playbook based on architecture)
# vault_cert_manager_deb_path: /path/to/vault-cert-manager_x.x.x_amd64.deb

# -------------------------------------------------------------------------------
# Vault Connection
# -------------------------------------------------------------------------------

vault_cert_manager_vault_addr: "{{ vault_api_addr }}"
vault_cert_manager_pki_mount: pki
vault_cert_manager_skip_verify: false

# -------------------------------------------------------------------------------
# AppRole Authentication
# -------------------------------------------------------------------------------

vault_cert_manager_approle_mount: approle
vault_cert_manager_role_id: "{{ vault_approle_role_id }}"
vault_cert_manager_secret_id: "{{ vault_approle_secret_id }}"

# -------------------------------------------------------------------------------
# Prometheus Metrics
# -------------------------------------------------------------------------------

vault_cert_manager_metrics_port: 9101
vault_cert_manager_metrics_refresh: 30s

# -------------------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------------------

vault_cert_manager_log_level: info
vault_cert_manager_log_format: text

# -------------------------------------------------------------------------------
# Certificate Configurations
# -------------------------------------------------------------------------------
# Override this in playbooks or group_vars to define certificates to manage.
# Example:
#   vault_cert_manager_certificates:
#     - name: consul-client
#       role: consul-client
#       common_name: client.munchbox.consul
#       certificate: /etc/consul.d/tls/consul.crt
#       key: /etc/consul.d/tls/consul.key
#       ttl: 8760h
#       alt_names:
#         - localhost
#         - "{{ inventory_hostname }}"
#       ip_sans:
#         - "{{ ansible_default_ipv4.address }}"
#         - 127.0.0.1
#       owner: consul
#       group: consul
#       on_change: systemctl reload consul

vault_cert_manager_certificates: []
