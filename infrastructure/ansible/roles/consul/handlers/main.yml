---
# -------------------------------------------------------------------------------
# Consul Role - Handlers
#
# Project: Munchbox / Author: Alex Freidah
#
# Service handlers for Consul configuration changes and restarts.
# -------------------------------------------------------------------------------

- name: reload systemd
  systemd:
    daemon_reload: true

- name: restart consul
  systemd:
    name: consul
    state: restarted
  when: consul_service_enabled
