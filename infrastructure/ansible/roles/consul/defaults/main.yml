# -------------------------------------------------------------------------------
# Consul Role - Default Variables
#
# Project: Munchbox / Author: Alex Freidah
#
# Default configuration for Consul installation and setup. Override in group_vars
# or host_vars as needed for environment-specific configuration.
# -------------------------------------------------------------------------------

consul_version: "1.22.2"
consul_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
consul_archive: "consul_{{ consul_version }}_linux_{{ consul_arch }}.zip"
consul_download_url: "https://releases.hashicorp.com/consul/{{ consul_version }}/{{ consul_archive }}"

consul_bin_path: "/usr/local/bin/consul"
consul_config_dir: "/etc/consul.d"
consul_data_dir: "/opt/consul/data"
consul_tls_dir: "/etc/consul.d/tls"
consul_log_dir: "/var/log/consul"

consul_user: "consul"
consul_group: "consul"

consul_service_name: "consul"
consul_service_enabled: true
consul_service_state: "started"

consul_datacenter: "munchbox"
consul_domain: "consul"
consul_bind_addr: "{{ ansible_default_ipv4.address }}"
consul_client_addr: "0.0.0.0"

consul_server_enabled: "{{ 'consul_servers' in group_names or 'nomad_servers' in group_names }}"
consul_bootstrap_expect: "{{ groups.get('consul_servers', groups.get('nomad_servers', [])) | length }}"

# Dynamic retry_join - automatically computed from consul_servers group
# Falls back to nomad_servers if consul_servers doesn't exist
# Uses groups.get() to safely handle inventories without these groups
consul_retry_join: "{{ groups.get('consul_servers', groups.get('nomad_servers', [])) | map('extract', hostvars, 'ansible_host') | list }}"

consul_client_enabled: true

consul_ui_enabled: true

consul_connect_enabled: true

consul_raft_multiplier: 1

consul_ports:
  dns: 8600
  http: 8500
  https: -1
  grpc: 8502
  grpc_tls: 8503
  serf_lan: 8301
  serf_wan: 8302
  server: 8300

consul_tls_enabled: true
consul_tls_ca_file: "{{ consul_tls_dir }}/ca-chain.crt"
consul_tls_cert_file: "{{ consul_tls_dir }}/consul.crt"
consul_tls_key_file: "{{ consul_tls_dir }}/consul.key"
consul_tls_verify_incoming: true
consul_tls_verify_outgoing: true
consul_tls_verify_server_hostname: true
