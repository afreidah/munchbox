---
# -------------------------------------------------------------------------------
# Consul Role - Main Tasks
#
# Project: Munchbox / Author: Alex Freidah
#
# Installs and configures Consul in server or client mode. Supports mixed
# architecture deployments (ARM64 and x86_64).
# -------------------------------------------------------------------------------

# -------------------------------------------------------------------------------
# System Setup
# -------------------------------------------------------------------------------

- name: Create Consul system group
  group:
    name: "{{ consul_group }}"
    system: true
    state: present

- name: Create Consul system user
  user:
    name: "{{ consul_user }}"
    group: "{{ consul_group }}"
    system: true
    shell: /bin/false
    home: "{{ consul_data_dir }}"
    create_home: false
    state: present

# -------------------------------------------------------------------------------
# Directory Structure
# -------------------------------------------------------------------------------

- name: Create Consul directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: "0750"
  loop:
    - "{{ consul_config_dir }}"
    - "{{ consul_data_dir }}"
    - "{{ consul_tls_dir }}"
    - "{{ consul_log_dir }}"

# -------------------------------------------------------------------------------
# Installation
# -------------------------------------------------------------------------------

- name: Check if Consul is installed
  stat:
    path: "{{ consul_bin_path }}"
  register: consul_binary

- name: Get installed Consul version
  command: "{{ consul_bin_path }} version"
  register: consul_installed_version
  changed_when: false
  failed_when: false
  when: consul_binary.stat.exists

- name: Install unzip
  apt:
    name: unzip
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Download Consul
  get_url:
    url: "{{ consul_download_url }}"
    dest: "/tmp/{{ consul_archive }}"
    mode: "0644"
  when: not consul_binary.stat.exists or consul_version not in consul_installed_version.stdout

- name: Unzip Consul binary
  unarchive:
    src: "/tmp/{{ consul_archive }}"
    dest: /usr/local/bin
    remote_src: true
    mode: "0755"
    owner: root
    group: root
  when: not consul_binary.stat.exists or consul_version not in consul_installed_version.stdout
  notify: restart consul

- name: Remove Consul archive
  file:
    path: "/tmp/{{ consul_archive }}"
    state: absent

# -------------------------------------------------------------------------------
# Configuration
# -------------------------------------------------------------------------------

- name: Deploy Consul configuration
  template:
    src: consul.hcl.j2
    dest: "{{ consul_config_dir }}/consul.hcl"
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: "0640"
    backup: yes
  notify: restart consul
  tags: [config, consul_config]

# -------------------------------------------------------------------------------
# Systemd Service
# -------------------------------------------------------------------------------

- name: Deploy Consul systemd service
  template:
    src: consul.service.j2
    dest: /etc/systemd/system/consul.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart consul

- name: Enable and start Consul service
  systemd:
    name: "{{ consul_service_name }}"
    enabled: "{{ consul_service_enabled }}"
    state: "{{ consul_service_state }}"
    daemon_reload: true

# -------------------------------------------------------------------------------
# Environment Setup
# -------------------------------------------------------------------------------

- name: Configure Consul environment variables
  template:
    src: consul.sh.j2
    dest: /etc/profile.d/consul.sh
    mode: "0644"
