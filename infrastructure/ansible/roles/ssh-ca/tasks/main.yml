---
# -------------------------------------------------------------------------------
# SSH CA Role - Main Tasks
#
# Project: Munchbox / Author: Alex Freidah
#
# Configures nodes for Vault SSH Certificate Authority:
#   A) Fetches client CA public key (for TrustedUserCAKeys)
#   B) Signs the host's ed25519 key with Vault SSH CA
#   C) Configures sshd to present host cert and trust client CA
#   D) Creates authorized_principals files
#   E) Deploys break-glass public key to authorized_keys
# -------------------------------------------------------------------------------

# -------------------------------------------------------------------------------
# Authentication
# -------------------------------------------------------------------------------

- name: Check for VAULT_TOKEN in environment
  ansible.builtin.set_fact:
    vault_token: "{{ lookup('env', 'VAULT_TOKEN') }}"
  when: lookup('env', 'VAULT_TOKEN') | length > 0

- name: Authenticate to Vault using AppRole
  ansible.builtin.uri:
    url: "{{ ssh_ca_vault_addr }}/v1/auth/approle/login"
    method: POST
    body_format: json
    body:
      role_id: "{{ vault_approle_role_id }}"
      secret_id: "{{ vault_approle_secret_id }}"
    validate_certs: false
    status_code: 200
  register: vault_login
  delegate_to: localhost
  become: false
  when: vault_token is not defined or vault_token | length == 0

- name: Set token from AppRole login
  ansible.builtin.set_fact:
    vault_token: "{{ vault_login.json.auth.client_token }}"
  when: vault_login is not skipped and vault_login is succeeded

# -------------------------------------------------------------------------------
# A) Fetch Client CA Public Key
# -------------------------------------------------------------------------------

- name: Fetch client CA public key from Vault
  ansible.builtin.uri:
    url: "{{ ssh_ca_vault_addr }}/v1/{{ ssh_ca_client_signer_path }}/config/ca"
    method: GET
    headers:
      X-Vault-Token: "{{ vault_token }}"
    validate_certs: false
    return_content: true
  register: client_ca_response
  delegate_to: localhost
  become: false

- name: Write trusted user CA key
  ansible.builtin.copy:
    content: "{{ client_ca_response.json.data.public_key }}"
    dest: "{{ ssh_ca_trusted_user_ca_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart sshd

- name: Fetch host CA public key from Vault
  ansible.builtin.uri:
    url: "{{ ssh_ca_vault_addr }}/v1/{{ ssh_ca_host_signer_path }}/config/ca"
    method: GET
    headers:
      X-Vault-Token: "{{ vault_token }}"
    validate_certs: false
    return_content: true
  register: host_ca_response
  delegate_to: localhost
  become: false

- name: Ensure /root/.ssh directory exists
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Trust host CA in /root/.ssh/known_hosts
  ansible.builtin.lineinfile:
    path: /root/.ssh/known_hosts
    regexp: "^@cert-authority \\*"
    line: "@cert-authority * {{ host_ca_response.json.data.public_key }}"
    create: true
    owner: root
    group: root
    mode: "0644"

# -------------------------------------------------------------------------------
# B) Sign Host Key with Vault SSH CA
# -------------------------------------------------------------------------------

- name: Read host ed25519 public key
  ansible.builtin.slurp:
    src: "{{ ssh_ca_host_key_path }}.pub"
  register: host_pubkey

- name: Build host certificate principals
  ansible.builtin.set_fact:
    ssh_ca_host_principals: >-
      {{ inventory_hostname }},{{ inventory_hostname }}.munchbox.cc,{{ static_ip | default(ansible_host) }}{{ ',' + wireguard_client_address | regex_replace('/.*', '') if wireguard_client_address is defined else '' }}

- name: Sign host key with Vault SSH CA
  ansible.builtin.uri:
    url: "{{ ssh_ca_vault_addr }}/v1/{{ ssh_ca_host_signer_path }}/sign/{{ ssh_ca_host_role }}"
    method: POST
    headers:
      X-Vault-Token: "{{ vault_token }}"
    body_format: json
    body:
      cert_type: "host"
      public_key: "{{ host_pubkey.content | b64decode }}"
      valid_principals: "{{ ssh_ca_host_principals }}"
      ttl: "{{ ssh_ca_host_cert_ttl }}"
    validate_certs: false
    status_code: 200
  register: host_cert_response
  delegate_to: localhost
  become: false

- name: Write signed host certificate
  ansible.builtin.copy:
    content: "{{ host_cert_response.json.data.signed_key }}"
    dest: "{{ ssh_ca_host_cert_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart sshd

# -------------------------------------------------------------------------------
# C) Configure sshd
# -------------------------------------------------------------------------------

- name: Configure HostCertificate in sshd_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?HostCertificate"
    line: "HostCertificate {{ ssh_ca_host_cert_path }}"
    state: present
  notify: Restart sshd

- name: Configure TrustedUserCAKeys in sshd_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?TrustedUserCAKeys"
    line: "TrustedUserCAKeys {{ ssh_ca_trusted_user_ca_path }}"
    state: present
  notify: Restart sshd

- name: Configure AuthorizedPrincipalsFile in sshd_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?AuthorizedPrincipalsFile"
    line: "AuthorizedPrincipalsFile {{ ssh_ca_principals_dir }}/%u"
    state: present
  notify: Restart sshd

# -------------------------------------------------------------------------------
# D) Authorized Principals
# -------------------------------------------------------------------------------

- name: Create authorized_principals directory
  ansible.builtin.file:
    path: "{{ ssh_ca_principals_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create authorized_principals for root
  ansible.builtin.copy:
    content: "root\n"
    dest: "{{ ssh_ca_principals_dir }}/root"
    owner: root
    group: root
    mode: "0644"

- name: Create authorized_principals for ubuntu (Oracle nodes)
  ansible.builtin.copy:
    content: "ubuntu\n"
    dest: "{{ ssh_ca_principals_dir }}/ubuntu"
    owner: root
    group: root
    mode: "0644"
  when: ansible_user | default('root') == 'ubuntu'

# -------------------------------------------------------------------------------
# E) Root Client Key + Certificate (inter-node SSH)
# -------------------------------------------------------------------------------

- name: Check if root SSH key exists
  ansible.builtin.stat:
    path: /root/.ssh/id_ed25519
  register: root_ssh_key

- name: Generate root SSH key if missing
  ansible.builtin.command:
    cmd: ssh-keygen -t ed25519 -f /root/.ssh/id_ed25519 -N "" -C "root@{{ inventory_hostname }}"
    creates: /root/.ssh/id_ed25519

- name: Read root public key
  ansible.builtin.slurp:
    src: /root/.ssh/id_ed25519.pub
  register: root_pubkey

- name: Sign root key with Vault client CA
  ansible.builtin.uri:
    url: "{{ ssh_ca_vault_addr }}/v1/{{ ssh_ca_client_signer_path }}/sign/{{ ssh_ca_client_role }}"
    method: POST
    headers:
      X-Vault-Token: "{{ vault_token }}"
    body_format: json
    body:
      public_key: "{{ root_pubkey.content | b64decode }}"
      valid_principals: "root,ubuntu"
      ttl: "{{ ssh_ca_client_cert_ttl }}"
    validate_certs: false
    status_code: 200
  register: root_cert_response
  delegate_to: localhost
  become: false

- name: Write signed root client certificate
  ansible.builtin.copy:
    content: "{{ root_cert_response.json.data.signed_key }}"
    dest: /root/.ssh/id_ed25519-cert.pub
    owner: root
    group: root
    mode: "0644"

# -------------------------------------------------------------------------------
# F) Break-Glass Key
# -------------------------------------------------------------------------------

- name: Fetch break-glass public key from Vault
  ansible.builtin.uri:
    url: "{{ ssh_ca_vault_addr }}/v1/secret/data/ssh/break-glass"
    method: GET
    headers:
      X-Vault-Token: "{{ vault_token }}"
    validate_certs: false
    return_content: true
  register: break_glass_response
  delegate_to: localhost
  become: false

- name: Ensure break-glass key is in authorized_keys for root
  ansible.builtin.authorized_key:
    user: root
    key: "{{ break_glass_response.json.data.data.public_key }}"
    comment: "break-glass@munchbox"
    state: present

- name: Ensure break-glass key is in authorized_keys for ubuntu (Oracle nodes)
  ansible.builtin.authorized_key:
    user: ubuntu
    key: "{{ break_glass_response.json.data.data.public_key }}"
    comment: "break-glass@munchbox"
    state: present
  when: ansible_user | default('root') == 'ubuntu'
