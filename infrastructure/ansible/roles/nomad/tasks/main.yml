---
# -------------------------------------------------------------------------------
# Nomad Role - Main Tasks
#
# Project: Munchbox / Author: Alex Freidah
#
# Installs and configures Nomad in server or client mode. Supports mixed
# architecture deployments (ARM64 and x86_64).
# -------------------------------------------------------------------------------

# -------------------------------------------------------------------------------
# System Setup
# -------------------------------------------------------------------------------

- name: Create Nomad system group
  group:
    name: "{{ nomad_group }}"
    system: true
    state: present

- name: Create Nomad system user
  user:
    name: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    system: true
    shell: /bin/false
    home: "{{ nomad_data_dir }}"
    create_home: false
    state: present

# -------------------------------------------------------------------------------
# Directory Structure
# -------------------------------------------------------------------------------

- name: Create Nomad directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    mode: "0750"
  loop:
    - "{{ nomad_config_dir }}"
    - "{{ nomad_data_dir }}"
    - "{{ nomad_log_dir }}"

# -------------------------------------------------------------------------------
# Installation
# -------------------------------------------------------------------------------

- name: Check if Nomad is installed
  stat:
    path: "{{ nomad_bin_path }}"
  register: nomad_binary

- name: Get installed Nomad version
  command: "{{ nomad_bin_path }} version"
  register: nomad_installed_version
  changed_when: false
  failed_when: false
  when: nomad_binary.stat.exists

- name: Install unzip
  apt:
    name: unzip
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Download Nomad
  get_url:
    url: "{{ nomad_download_url }}"
    dest: "/tmp/{{ nomad_archive }}"
    mode: "0644"
  when: not nomad_binary.stat.exists or nomad_version not in nomad_installed_version.stdout

- name: Unzip Nomad binary
  unarchive:
    src: "/tmp/{{ nomad_archive }}"
    dest: /usr/local/bin
    remote_src: true
    mode: "0755"
    owner: root
    group: root
  when: not nomad_binary.stat.exists or nomad_version not in nomad_installed_version.stdout
  notify: restart nomad

- name: Remove Nomad archive
  file:
    path: "/tmp/{{ nomad_archive }}"
    state: absent

# -------------------------------------------------------------------------------
# Configuration
# -------------------------------------------------------------------------------

- name: Deploy Nomad configuration
  template:
    src: nomad.hcl.j2
    dest: "{{ nomad_config_dir }}/nomad.hcl"
    owner: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    mode: "0640"
  notify: restart nomad

# -------------------------------------------------------------------------------
# Systemd Service
# -------------------------------------------------------------------------------

- name: Deploy Nomad systemd service
  template:
    src: nomad.service.j2
    dest: /etc/systemd/system/nomad.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart nomad

- name: Enable and start Nomad service
  systemd:
    name: "{{ nomad_service_name }}"
    enabled: "{{ nomad_service_enabled }}"
    state: "{{ nomad_service_state }}"
    daemon_reload: true
