# -------------------------------------------------------------------------------
# WireGuard Role - Default Variables
#
# Project: Munchbox / Author: Alex Freidah
#
# Topology (post-2026-05-17 reverse refactor — see issue #70):
#   Oracle nodes are WG servers, listening on their public IP:51820. Home
#   ingress nodes (goren, nc05) are WG clients, each independently dialing
#   outbound to all 4 Oracle servers. No port-forwarding on the home router.
#   Active/active across both home ingresses. Each oracle sees two peers
#   (one per home ingress, with distinct keys).
# -------------------------------------------------------------------------------

# WireGuard interface name. We keep wg1 to match the in-place migration
# (the old hub-and-spoke wg0 ran in parallel during cutover).
wireguard_interface: wg1
wireguard_port: 51820

# Tunnel MTU sized to fit inside a 1500-byte residential ISP underlay
# after WG/UDP/IP encapsulation overhead. PMTUD is unreliable end-to-end
# (home-edge ICMP blackholes), so we pin instead of trusting discovery.
wireguard_mtu: 1380

# Role: 'server' (Oracle nodes, listening on public IP) or
# 'client' (home ingress nodes, dialing out to Oracles).
wireguard_role: client

# Enable IP forwarding (needed for client-side traffic from oracles to
# reach home LAN hosts via goren's tunnel)
wireguard_ip_forward: true

# Outbound interface on the home network — used for MASQUERADE on the
# goren peer (the only home ingress that carries the 192.168.68.0/24
# return route for oracle traffic).
wireguard_nat_interface: "eth0"

# Vault path prefix for keys (per-node sub-paths). Each entry under this
# prefix has fields private_key + public_key. See issue #70 for the
# bootstrap procedure.
wireguard_vault_path_prefix: "secret/data/wireguard-v2"

# All nodes participating in the mesh. Used to fetch every peer's public
# key from Vault. Keep in sync with actual cluster membership.
wireguard_mesh_nodes:
  - goren
  - nc05
  - oracle-node-1
  - oracle-node-2
  - oracle-arm-1
  - oracle-arm-2
