# -------------------------------------------------------------------------------
# WireGuard Role - Main Tasks
#
# Project: Munchbox / Author: Alex Freidah
#
# Installs and configures WireGuard for hub-and-spoke VPN topology.
# Server (hub) runs at home, clients (Oracle nodes) connect in.
# -------------------------------------------------------------------------------

- name: Install WireGuard
  apt:
    name:
      - wireguard
      - wireguard-tools
    state: present
    update_cache: true

- name: Enable IP forwarding
  sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    state: present
    reload: true
  when: wireguard_ip_forward

- name: Create WireGuard directory
  file:
    path: /etc/wireguard
    state: directory
    mode: "0700"
    owner: root
    group: root

- name: Check if private key exists
  stat:
    path: /etc/wireguard/private.key
  register: wg_private_key

- name: Generate WireGuard private key
  shell: wg genkey > /etc/wireguard/private.key
  args:
    creates: /etc/wireguard/private.key
  when: not wg_private_key.stat.exists

- name: Set private key permissions
  file:
    path: /etc/wireguard/private.key
    mode: "0600"
    owner: root
    group: root

- name: Generate WireGuard public key
  shell: cat /etc/wireguard/private.key | wg pubkey > /etc/wireguard/public.key
  args:
    creates: /etc/wireguard/public.key

- name: Read private key
  slurp:
    src: /etc/wireguard/private.key
  register: wg_private_key_content

- name: Read public key
  slurp:
    src: /etc/wireguard/public.key
  register: wg_public_key_content

- name: Set key facts
  set_fact:
    wireguard_private_key: "{{ wg_private_key_content.content | b64decode | trim }}"
    wireguard_public_key: "{{ wg_public_key_content.content | b64decode | trim }}"

- name: Display public key (for manual peer configuration)
  debug:
    msg: "WireGuard public key for {{ inventory_hostname }}: {{ wireguard_public_key }}"

- name: Deploy WireGuard server configuration
  template:
    src: wg-server.conf.j2
    dest: "/etc/wireguard/{{ wireguard_interface }}.conf"
    mode: "0600"
    owner: root
    group: root
  when: wireguard_role == 'server'
  notify: Restart WireGuard

- name: Deploy WireGuard client configuration
  template:
    src: wg-client.conf.j2
    dest: "/etc/wireguard/{{ wireguard_interface }}.conf"
    mode: "0600"
    owner: root
    group: root
  when: wireguard_role == 'client'
  notify: Restart WireGuard

- name: Enable and start WireGuard
  systemd:
    name: "wg-quick@{{ wireguard_interface }}"
    enabled: true
    state: started
    daemon_reload: true
