# -------------------------------------------------------------------------------
# WireGuard Role - Main Tasks
#
# Project: Munchbox / Author: Alex Freidah
#
# Provisions WireGuard mesh per the reverse topology: oracle nodes are
# servers, home ingresses are clients dialing outbound to each oracle.
# Keys are sourced from Vault at {{ wireguard_vault_path_prefix }}/<node>.
# Keep wireguard_mesh_nodes (defaults) in sync with cluster membership.
# -------------------------------------------------------------------------------

- name: Install WireGuard
  ansible.builtin.apt:
    name:
      - wireguard
      - wireguard-tools
    state: present
    update_cache: true

- name: Enable IP forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    state: present
    reload: true
  when: wireguard_ip_forward

- name: Create /etc/wireguard
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    mode: "0700"
    owner: root
    group: root

# -------------------------------------------------------------------------------
# Vault key plumbing — fetch every mesh node's pubkey + this node's privkey.
# Done on the controller (delegate_to: localhost) and shared across hosts so
# we don't hammer Vault once per node per fact.
# -------------------------------------------------------------------------------

- name: Fetch WG public keys from Vault for the whole mesh
  ansible.builtin.uri:
    url: "{{ vault_api_addr }}/v1/{{ wireguard_vault_path_prefix }}/{{ item }}"
    headers:
      X-Vault-Token: "{{ lookup('env', 'VAULT_TOKEN') }}"
    validate_certs: false
    status_code: 200
  loop: "{{ wireguard_mesh_nodes }}"
  register: wg_pubkey_responses
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false   # read-only Vault GET, safe in --check
  no_log: true

- name: Assemble pubkey dict
  ansible.builtin.set_fact:
    wireguard_pubkeys: >-
      {{
        dict(
          wg_pubkey_responses.results
          | map(attribute='item')
          | zip(
              wg_pubkey_responses.results
              | map(attribute='json.data.data.public_key')
            )
        )
      }}
  run_once: true

- name: Fetch this node's WG private key from Vault
  ansible.builtin.uri:
    url: "{{ vault_api_addr }}/v1/{{ wireguard_vault_path_prefix }}/{{ inventory_hostname }}"
    headers:
      X-Vault-Token: "{{ lookup('env', 'VAULT_TOKEN') }}"
    validate_certs: false
    status_code: 200
  register: wg_self_response
  delegate_to: localhost
  become: false
  check_mode: false
  no_log: true

- name: Stash private key fact
  ansible.builtin.set_fact:
    wireguard_private_key: "{{ wg_self_response.json.data.data.private_key }}"
  no_log: true

# -------------------------------------------------------------------------------
# Config render — different template per role
# -------------------------------------------------------------------------------

- name: Deploy WireGuard server configuration (oracle nodes)
  ansible.builtin.template:
    src: wg-server.conf.j2
    dest: "/etc/wireguard/{{ wireguard_interface }}.conf"
    mode: "0600"
    owner: root
    group: root
  when: wireguard_role == 'server'
  notify: Restart WireGuard

- name: Deploy WireGuard client configuration (home ingress nodes)
  ansible.builtin.template:
    src: wg-client.conf.j2
    dest: "/etc/wireguard/{{ wireguard_interface }}.conf"
    mode: "0600"
    owner: root
    group: root
  when: wireguard_role == 'client'
  notify: Restart WireGuard

- name: Enable and start WireGuard
  ansible.builtin.systemd:
    name: "wg-quick@{{ wireguard_interface }}"
    enabled: true
    state: started
    daemon_reload: true
