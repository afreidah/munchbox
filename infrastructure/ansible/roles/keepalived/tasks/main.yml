---
# -------------------------------------------------------------------------------
# Keepalived Role - Main Tasks
#
# Project: Munchbox / Author: Alex Freidah
#
# Installs and configures keepalived for Traefik HA with dual VIPs.
# Each ingress node is primary for one VIP and backup for the other.
# -------------------------------------------------------------------------------

# -------------------------------------------------------------------------------
# Installation
# -------------------------------------------------------------------------------

- name: Install keepalived
  apt:
    name: "{{ keepalived_package }}"
    state: present
    update_cache: true

# -------------------------------------------------------------------------------
# Directory Structure
# -------------------------------------------------------------------------------

- name: Ensure keepalived config directory exists
  file:
    path: "{{ keepalived_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# -------------------------------------------------------------------------------
# Health Check Script
# -------------------------------------------------------------------------------

- name: Deploy Traefik health check script
  template:
    src: check_traefik.sh.j2
    dest: "{{ keepalived_check_script }}"
    owner: root
    group: root
    mode: "0755"
  notify: restart keepalived

# -------------------------------------------------------------------------------
# Configuration
# -------------------------------------------------------------------------------

- name: Deploy keepalived configuration
  template:
    src: keepalived.conf.j2
    dest: "{{ keepalived_config_dir }}/keepalived.conf"
    owner: root
    group: root
    mode: "0644"
  notify: restart keepalived

# -------------------------------------------------------------------------------
# Service
# -------------------------------------------------------------------------------

- name: Enable and start keepalived service
  systemd:
    name: "{{ keepalived_service_name }}"
    enabled: "{{ keepalived_service_enabled }}"
    state: "{{ keepalived_service_state }}"
    daemon_reload: true
