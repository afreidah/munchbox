---
# -------------------------------------------------------------------------------
# Keepalived Role - Default Variables
#
# Project: Munchbox / Author: Alex Freidah
#
# Configures keepalived for Traefik HA with dual VIPs.
# -------------------------------------------------------------------------------

# Package
keepalived_package: keepalived

# Directories
keepalived_config_dir: /etc/keepalived

# Service
keepalived_service_name: keepalived
keepalived_service_enabled: true
keepalived_service_state: started

# VRRP Configuration
keepalived_router_id: "{{ inventory_hostname }}"
keepalived_interface: eth0
keepalived_auth_pass_vip1: munchbox50
keepalived_auth_pass_vip2: munchbox51

# VIPs
keepalived_vip1: 192.168.68.80
keepalived_vip2: 192.168.68.81
keepalived_netmask: 32

# Node priorities (stabler primary for VIP1, goren primary for VIP2)
keepalived_vip1_priority: "{{ 101 if inventory_hostname == 'stabler' else 100 }}"
keepalived_vip2_priority: "{{ 101 if inventory_hostname == 'goren' else 100 }}"

# Health check
keepalived_check_script: /etc/keepalived/check_traefik.sh
keepalived_check_interval: 2
keepalived_check_weight: -50
keepalived_check_fall: 3
keepalived_check_rise: 2

# Traefik health endpoint
keepalived_traefik_health_url: "http://127.0.0.1:8081/ping"
