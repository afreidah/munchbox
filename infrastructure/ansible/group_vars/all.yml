# -------------------------------------------------------------------------------
# Global Variables - All Hosts
#
# Project: Munchbox / Author: Alex Freidah
#
# Common settings applied to all hosts in the Munchbox infrastructure.
# -------------------------------------------------------------------------------

# -------------------------------------------------------------------------------
# Network Configuration
# -------------------------------------------------------------------------------

domain: munchbox.cc
dns_servers:
  - 192.168.68.62
  - 192.168.68.64
gateway: 192.168.68.1
network_prefix: 192.168.68.0/24

# -------------------------------------------------------------------------------
# Timezone and Locale
# -------------------------------------------------------------------------------

timezone: America/Los_Angeles
locale: en_US.UTF-8

# -------------------------------------------------------------------------------
# Common Packages
# -------------------------------------------------------------------------------

common_packages:
  - curl
  - wget
  - vim
  - git
  - htop
  - iotop
  - net-tools
  - dnsutils
  - tmux
  - jq
  - unzip
  - rsync
  - sysstat

# -------------------------------------------------------------------------------
# Hashicorp Tool Versions
# -------------------------------------------------------------------------------

nomad_version: 1.11.1
consul_version: 1.22.2
vault_version: 1.15.4

# -------------------------------------------------------------------------------
# Vault Configuration
# -------------------------------------------------------------------------------

# Dynamic Vault address - uses first vault_server from inventory
# Falls back to stabler (192.168.68.61) if vault_servers group doesn't exist
vault_api_addr: "https://{{ (groups['vault_servers'] | default(['stabler'])) | first | extract(hostvars, 'ansible_host') | default('192.168.68.61') }}:8200"

# -------------------------------------------------------------------------------
# Munchbox Infrastructure
# -------------------------------------------------------------------------------

consul_datacenter: munchbox
consul_domain: consul

nomad_datacenter: munchbox
nomad_region: global

# -------------------------------------------------------------------------------
# Vault Initialization
# -------------------------------------------------------------------------------

vault_init_key_shares: 5
vault_init_key_threshold: 3

# -------------------------------------------------------------------------------
# Vault AppRole Credentials
# -------------------------------------------------------------------------------
# Loaded from local file created by vault-init.yml playbook.
# File should be at ~/.munchbox/vault/approle.json with format:
#   {"role_id": "...", "secret_id": "..."}

vault_approle_role_id: "{{ (lookup('file', '~/.munchbox/vault/approle.json') | from_json).role_id }}"
vault_approle_secret_id: "{{ (lookup('file', '~/.munchbox/vault/approle.json') | from_json).secret_id }}"
