# -------------------------------------------------------------------------------
# Nomad Jobs Pipeline
#
# Project: Munchbox / Author: Alex Freidah
#
# Validates and plans Nomad job changes on PRs. Deploys on merge to main.
# -------------------------------------------------------------------------------

when:
  - event: [push, pull_request, manual]
    path:
      include:
        - nomad/jobs/**
        - nomad/packs/**

steps:
  - name: init-submodules
    image: alpine/git:latest
    commands:
      - git submodule update --init --recursive

  - name: detect-changed-jobs
    image: alpine:latest
    commands:
      - apk add --no-cache git
      - |
        echo "Detecting changed jobs..."
        git diff --name-only HEAD~1 HEAD -- nomad/jobs/ | while read file; do
          if [ -n "$file" ]; then
            job=$(basename "$file" .hcl)
            job=${job%.nomad}
            echo "$job" >> /tmp/changed_jobs.txt
          fi
        done
        if [ -f /tmp/changed_jobs.txt ]; then
          sort -u /tmp/changed_jobs.txt > changed_jobs.txt
          echo "Changed jobs:"
          cat changed_jobs.txt
        else
          echo "No job changes detected"
          touch changed_jobs.txt
        fi

  - name: validate-jobs
    image: registry.munchbox.cc/ops-build-image:latest
    commands:
      - |
        cd nomad
        if [ -s ../changed_jobs.txt ]; then
          while read job; do
            echo "=== Validating $job ==="
            make validate JOB="$job" || exit 1
          done < ../changed_jobs.txt
        else
          echo "No jobs to validate"
        fi

  - name: plan-jobs
    image: registry.munchbox.cc/ops-build-image:latest
    when:
      - event: [push, pull_request]
    environment:
      NOMAD_ADDR: https://192.168.68.61:4646
      NOMAD_SKIP_VERIFY: "true"
      NOMAD_TOKEN:
        from_secret: nomad_token
    commands:
      - |
        cd nomad
        if [ -s ../changed_jobs.txt ]; then
          while read job; do
            echo "=== Planning $job ==="
            make plan JOB="$job" || true
          done < ../changed_jobs.txt
        else
          echo "No jobs to plan"
        fi

  - name: deploy-jobs
    image: registry.munchbox.cc/ops-build-image:latest
    when:
      - event: push
        branch: main
    environment:
      NOMAD_ADDR: https://192.168.68.61:4646
      NOMAD_SKIP_VERIFY: "true"
      NOMAD_TOKEN:
        from_secret: nomad_token
    commands:
      - |
        cd nomad
        if [ -s ../changed_jobs.txt ]; then
          while read job; do
            echo "=== Deploying $job ==="
            make run JOB="$job" || exit 1
          done < ../changed_jobs.txt
        else
          echo "No jobs to deploy"
        fi
