when:
  path:
    include:
      - nomad/jobs/**
      - nomad/packs/**

steps:
  - name: detect-changed-jobs
    image: alpine:latest
    commands:
      - apk add --no-cache git
      - |
        echo "Detecting changed jobs..."
        git diff --name-only HEAD~1 HEAD -- nomad/jobs/ | while read file; do
          if [ -n "$file" ]; then
            job=$(basename "$file" .hcl)
            job=${job%.nomad}
            echo "$job" >> /tmp/changed_jobs.txt
          fi
        done
        if [ -f /tmp/changed_jobs.txt ]; then
          sort -u /tmp/changed_jobs.txt > changed_jobs.txt
          echo "Changed jobs:"
          cat changed_jobs.txt
        else
          echo "No job changes detected"
          touch changed_jobs.txt
        fi

  - name: validate-jobs
    image: hashicorp/nomad:latest
    commands:
      - |
        cd nomad
        if [ -s ../changed_jobs.txt ]; then
          while read job; do
            echo "=== Validating $job ==="
            make validate JOB="$job" || exit 1
          done < ../changed_jobs.txt
        else
          echo "No jobs to validate"
        fi

  - name: plan-jobs
    image: hashicorp/nomad:latest
    environment:
      NOMAD_ADDR: https://nomad.service.consul:4646
      NOMAD_SKIP_VERIFY: "true"
    secrets: [nomad_token]
    commands:
      - |
        export NOMAD_TOKEN=$NOMAD_TOKEN
        cd nomad
        if [ -s ../changed_jobs.txt ]; then
          while read job; do
            echo "=== Planning $job ==="
            make plan JOB="$job" || true
          done < ../changed_jobs.txt
        else
          echo "No jobs to plan"
        fi
