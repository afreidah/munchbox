# -------------------------------------------------------------------------------
# Source Applications Pipeline
#
# Project: Munchbox / Author: Alex Freidah
#
# Builds and pushes container images for applications in src/. Each app only
# rebuilds when its source files change. Go apps run tests on PRs, images only
# push on merge to main.
# -------------------------------------------------------------------------------

when:
  - event: [push, pull_request, manual]
    path:
      include:
        - src/**

steps:
  # -------------------------------------------------------------------------
  # Dashboard (Hugo static site)
  # -------------------------------------------------------------------------

  - name: dashboard-push
    image: docker:cli
    when:
      - event: push
        branch: main
        path:
          include:
            - src/dashboard/**
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - apk add --no-cache make
      - cd src/dashboard
      - make push

  # -------------------------------------------------------------------------
  # Trivy Dashboard (Go web app)
  # -------------------------------------------------------------------------

  - name: trivy-dashboard-test
    image: golang:1.25.5-alpine
    when:
      - event: [push, pull_request]
        path:
          include:
            - src/trivy-dashboard/**
    commands:
      - apk add --no-cache make
      - cd src/trivy-dashboard
      - make test

  - name: trivy-dashboard-push
    image: docker:cli
    when:
      - event: push
        branch: main
        path:
          include:
            - src/trivy-dashboard/**
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - trivy-dashboard-test
    commands:
      - apk add --no-cache make
      - cd src/trivy-dashboard
      - make push

  # -------------------------------------------------------------------------
  # Theme Server (static CSS)
  # -------------------------------------------------------------------------

  - name: theme-server-push
    image: docker:cli
    when:
      - event: push
        branch: main
        path:
          include:
            - src/theme-server/**
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - apk add --no-cache make
      - cd src/theme-server
      - make push

  # -------------------------------------------------------------------------
  # Temporal Backup Worker (Go Temporal worker)
  # -------------------------------------------------------------------------

  - name: temporal-backup-worker-test
    image: golang:1.25.5-alpine
    when:
      - event: [push, pull_request]
        path:
          include:
            - src/temporal-jobs/temporal-backup-worker/**
    commands:
      - apk add --no-cache make
      - cd src/temporal-jobs/temporal-backup-worker
      - make test

  - name: temporal-backup-worker-push
    image: docker:cli
    when:
      - event: push
        branch: main
        path:
          include:
            - src/temporal-jobs/temporal-backup-worker/**
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - temporal-backup-worker-test
    commands:
      - apk add --no-cache make
      - cd src/temporal-jobs/temporal-backup-worker
      - make push

  # -------------------------------------------------------------------------
  # S3 Proxy (Go S3 proxy service)
  # -------------------------------------------------------------------------

  - name: s3-proxy-test
    image: golang:1.25.5-alpine
    when:
      - event: [push, pull_request]
        path:
          include:
            - src/s3-proxy/**
    commands:
      - apk add --no-cache make
      - cd src/s3-proxy
      - make test

  - name: s3-proxy-push
    image: docker:cli
    when:
      - event: push
        branch: main
        path:
          include:
            - src/s3-proxy/**
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - s3-proxy-test
    commands:
      - apk add --no-cache make
      - cd src/s3-proxy
      - make push
