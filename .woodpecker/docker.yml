# -------------------------------------------------------------------------------
# Docker Images Pipeline
#
# Project: Munchbox / Author: Alex Freidah
#
# Builds and tests Docker images on PRs. Pushes to registry on merge to main.
# -------------------------------------------------------------------------------

when:
  - event: [push, pull_request]
    path:
      include:
        - docker/**

steps:
  # ---------------------------------------------------------------------------
  # ops-build-image
  # ---------------------------------------------------------------------------

  - name: build-ops-build-image
    image: docker:cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - apk add --no-cache make
      - cd docker/ops-build-image
      - make build-multiarch
    when:
      - event: [push, pull_request]
        path: docker/ops-build-image/**

  - name: push-ops-build-image
    image: docker:cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - apk add --no-cache make
      - cd docker/ops-build-image
      - make push
    when:
      - event: push
        branch: main
        path: docker/ops-build-image/**
