# --------------------------------------------------------------------------------
#  Hashi-UI — Consul Read Token Spec
#
#  Purpose:
#    Provision a local Consul token bound to the hashi-ui-read policy, and
#    publish its SecretID into Consul KV for consumption by jobs/sidecars.
#
#  Notes:
#    - Keep the policy name in `policies:` aligned with the HCL basename above.
#    - Your helper will automatically create the token and run a kv put to
#      `kv_path` with the SecretID, matching your existing pattern.
# --------------------------------------------------------------------------------

name: hashi-ui
description: Hashi-UI Consul read token
local: true
policies: ["hashi-ui-read"]
roles: []
kv_path: monitoring/hashi-ui/consul_token
